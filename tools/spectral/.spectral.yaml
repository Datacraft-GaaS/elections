extends: ["spectral:oas"]

functions:
  - eel-has-content-types
  - eel-has-data-class

rules:
  # Rule 1: Every path must start with /api/v1/
  eel-path-prefix:
    description: "Every path must use /api/v1/ prefix"
    message: "Path '{{value}}' must start with /api/v1/"
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^/api/v1/"

  # Rule 2: Tier-1 public read endpoints must have cosign/Merkle/snapshot headers
  eel-tier1-response-headers:
    description: "Tier-1 endpoints (x-eel-tier: 1) must include X-Eel-Signature, X-Eel-Merkle-Proof, X-Eel-Snapshot-Id headers in 200 response"
    message: "Tier-1 endpoint missing required integrity headers in 200 response"
    severity: error
    given: "$.paths[*][get,head][?(@['x-eel-tier'] == 1)].responses.200.headers"
    then:
      - field: "X-Eel-Signature"
        function: truthy
      - field: "X-Eel-Merkle-Proof"
        function: truthy
      - field: "X-Eel-Snapshot-Id"
        function: truthy

  # Rule 3: Every write endpoint must declare Idempotency-Key request header
  eel-idempotency-key-post:
    description: "POST endpoints must declare required Idempotency-Key header"
    message: "POST endpoint '{{path}}' is missing required Idempotency-Key header parameter"
    severity: error
    given: "$.paths[*].post"
    then:
      field: "parameters"
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              name:
                const: "Idempotency-Key"
              in:
                const: "header"
              required:
                const: true
            required: [name, in, required]

  eel-idempotency-key-put:
    description: "PUT endpoints must declare required Idempotency-Key header"
    message: "PUT endpoint is missing required Idempotency-Key header parameter"
    severity: error
    given: "$.paths[*].put"
    then:
      field: "parameters"
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              name:
                const: "Idempotency-Key"
              in:
                const: "header"
              required:
                const: true
            required: [name, in, required]

  eel-idempotency-key-patch:
    description: "PATCH endpoints must declare required Idempotency-Key header"
    message: "PATCH endpoint is missing required Idempotency-Key header parameter"
    severity: error
    given: "$.paths[*].patch"
    then:
      field: "parameters"
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            properties:
              name:
                const: "Idempotency-Key"
              in:
                const: "header"
              required:
                const: true
            required: [name, in, required]

  # Rule 4: Every error response must use application/problem+json
  eel-error-problem-json:
    description: "Error responses (4xx/5xx) must use application/problem+json media type (RFC 9457)"
    message: "Error response '{{path}}' must declare application/problem+json content type"
    severity: error
    given: "$.paths[*][*].responses[4xx,5xx,400,401,403,404,409,422,429,500,502,503]"
    then:
      field: "content.application/problem+json"
      function: truthy

  eel-problem-type-ref:
    description: "problem+json responses must reference ProblemDetail schema"
    message: "Error response must reference ProblemDetail schema"
    severity: warn
    given: "$.paths[*][*].responses[4xx,5xx,400,401,403,404,409,422,429,500,502,503].content['application/problem+json'].schema"
    then:
      field: "$ref"
      function: truthy

  # Rule 5: Tier 2 and Tier 5 endpoints must offer both application/json and application/cbor
  eel-tier2-content-negotiation:
    description: "Tier-2 endpoints must offer both application/json and application/cbor"
    message: "Tier-2 endpoint missing application/cbor content type alongside application/json"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete][?(@['x-eel-tier'] == 2)].responses[200,201,202]"
    then:
      - field: "content.application/json"
        function: truthy
      - field: "content.application/cbor"
        function: truthy

  eel-tier5-content-negotiation:
    description: "Tier-5 endpoints must offer both application/json and application/cbor"
    message: "Tier-5 endpoint missing application/cbor content type"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete][?(@['x-eel-tier'] == 5)].responses[200,201,202]"
    then:
      - field: "content.application/json"
        function: truthy
      - field: "content.application/cbor"
        function: truthy

  # Rule 6: Every endpoint must declare x-eel-auth
  eel-auth-extension-required:
    description: "Every endpoint must declare x-eel-auth extension"
    message: "Endpoint at '{{path}}' is missing x-eel-auth extension"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete,head,options]"
    then:
      field: "x-eel-auth"
      function: truthy

  eel-auth-extension-values:
    description: "x-eel-auth must be one of: public, JWT, JWT+SpiceDB, SVID-mTLS"
    message: "x-eel-auth '{{value}}' must be one of: public, JWT, JWT+SpiceDB, SVID-mTLS"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete,head,options].x-eel-auth"
    then:
      function: enumeration
      functionOptions:
        values:
          - public
          - JWT
          - JWT+SpiceDB
          - SVID-mTLS

  # Rule 7: Every endpoint must declare x-eel-sla
  eel-sla-extension-required:
    description: "Every endpoint must declare x-eel-sla with p50/p95/p99 values"
    message: "Endpoint is missing x-eel-sla extension"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete,head,options]"
    then:
      field: "x-eel-sla"
      function: truthy

  eel-sla-p50-required:
    description: "x-eel-sla must include p50"
    message: "x-eel-sla missing p50 value"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete,head,options].x-eel-sla"
    then:
      field: "p50"
      function: defined

  eel-sla-p95-required:
    description: "x-eel-sla must include p95"
    message: "x-eel-sla missing p95 value"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete,head,options].x-eel-sla"
    then:
      field: "p95"
      function: defined

  eel-sla-p99-required:
    description: "x-eel-sla must include p99"
    message: "x-eel-sla missing p99 value"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete,head,options].x-eel-sla"
    then:
      field: "p99"
      function: defined

  # Rule 8: Every schema property must have x-eel-data-class
  eel-data-class-on-properties:
    description: "Every schema field must be annotated with x-eel-data-class: A|B|C|D|E"
    message: "Schema property '{{path}}' is missing x-eel-data-class annotation"
    severity: error
    given: "$.components.schemas[*].properties[*]"
    then:
      field: "x-eel-data-class"
      function: truthy

  eel-data-class-values:
    description: "x-eel-data-class must be one of A, B, C, D, E"
    message: "x-eel-data-class '{{value}}' must be A, B, C, D, or E"
    severity: error
    given: "$.components.schemas[*].properties[*].x-eel-data-class"
    then:
      function: enumeration
      functionOptions:
        values: [A, B, C, D, E]

  # Tier extension required
  eel-tier-extension-required:
    description: "Every endpoint must declare x-eel-tier (1-5)"
    message: "Endpoint is missing x-eel-tier extension"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete,head,options]"
    then:
      field: "x-eel-tier"
      function: defined

  eel-tier-extension-values:
    description: "x-eel-tier must be 1, 2, 3, 4, or 5"
    message: "x-eel-tier '{{value}}' must be 1-5"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete,head,options].x-eel-tier"
    then:
      function: enumeration
      functionOptions:
        values: [1, 2, 3, 4, 5]

  # No client-name identifiers
  eel-no-client-identifiers:
    description: "Client-name prefixes are not allowed in identifiers; use the eel prefix"
    message: "Identifier '{{value}}' carries a client-name prefix (use eel prefix instead)"
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        # Character class, so this guard does not itself spell the client's name.
        notMatch: "[iI][eE][bB][cC]"

  # Operation IDs required
  eel-operation-id-required:
    description: "All operations must have operationId"
    message: "Operation at '{{path}}' is missing operationId"
    severity: error
    given: "$.paths[*][get,post,put,patch,delete]"
    then:
      field: "operationId"
      function: truthy

  # Tags required
  eel-tags-required:
    description: "All operations must have at least one tag"
    message: "Operation at '{{path}}' is missing tags"
    severity: warn
    given: "$.paths[*][get,post,put,patch,delete]"
    then:
      field: "tags"
      function: truthy

  # Security schemes required
  eel-security-defined:
    description: "Non-public endpoints must reference a security scheme"
    message: "Endpoint with x-eel-auth != public should declare security"
    severity: warn
    given: "$.paths[*][get,post,put,patch,delete][?(@['x-eel-auth'] != 'public')]"
    then:
      field: "security"
      function: truthy
