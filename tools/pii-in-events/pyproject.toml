[project]
name = "eel-pii-in-events"
version = "0.1.0"
description = "HARD-24: Semgrep rule + linter that fails a PR if Tier-A/B PII lands in an event schema"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "semgrep>=1.60",
]

[project.scripts]
eel-pii-lint = "eel_pii_in_events.lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eel_pii_in_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
strict = true
