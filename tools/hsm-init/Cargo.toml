[package]
name = "hsm-init"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Bootstrap PKCS#11 keys in SoftHSM slots for eel local dev"

[[bin]]
name = "hsm-init"
path = "src/main.rs"

[dependencies]
cryptoki = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
anyhow = { version = "1" }
hex = { version = "0.4" }
