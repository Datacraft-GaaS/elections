[package]
name = "hsm-ceremony"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "CLI for the Commission custodians to manage HSM key ceremonies (WP-2.2)"

[[bin]]
name = "hsm-ceremony"
path = "src/main.rs"

[dependencies]
# gRPC client
tonic   = { workspace = true }
prost   = { workspace = true }
tokio   = { workspace = true }

# CLI
clap    = { version = "4", features = ["derive", "env"] }

# Crypto (Ed25519 custodian signing)
ed25519-dalek = { workspace = true }

# Output
serde         = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
hex           = "0.4"

# HSM signer proto types (shared crate)
hsm-signer    = { path = "../../services/transparency-svc/crates/hsm-signer" }
