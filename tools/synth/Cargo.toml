[package]
name        = "eel-synth"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
description = "Deterministic synthetic data generator for eel election-management system"
rust-version = "1.83"

[[bin]]
name = "eel-synth"
path = "src/main.rs"

[lib]
name = "eel_synth"
path = "src/lib.rs"

[dependencies]
# CLI
clap       = { version = "4",    features = ["derive", "env"] }

# RNG — deterministic ChaCha20
rand       = { version = "0.8" }
rand_chacha = { version = "0.3" }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }
csv        = { version = "1.3" }

# IDs / time
uuid       = { workspace = true }
chrono     = { workspace = true }

# Geo
geo        = { version = "0.28" }
geo-types  = { version = "0.7" }
geojson    = { version = "0.24", features = ["geo-types"] }

# Image rendering (Form 34A)
image      = { version = "0.25", default-features = false, features = ["png"] }
imageproc  = { version = "0.25" }

# Error handling
thiserror  = { workspace = true }
anyhow     = { workspace = true }

# Progress
indicatif  = { version = "0.17" }

# Parallelism
rayon      = { version = "1.10" }

# Hashing
sha2       = { version = "0.10" }
hex        = { version = "0.4" }

[dev-dependencies]
proptest   = { version = "1" }
tempfile   = { version = "3" }
