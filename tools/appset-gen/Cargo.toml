[package]
name        = "eel-appset-gen"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
description = "Generate ArgoCD ApplicationSets, Kustomize overlays, Cilium NetworkPolicies, and Kafka ACLs from service manifests"

[[bin]]
name = "eel-appset-gen"
path = "src/main.rs"

[dependencies]
anyhow      = { workspace = true }
clap        = { version = "4", features = ["derive"] }
glob        = "0.3"
serde       = { version = "1", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = "1"
tera        = "1"

[dev-dependencies]
insta       = { version = "1", features = ["yaml"] }
tempfile    = "3"
