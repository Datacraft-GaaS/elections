apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: eel-edge-mombasa
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/eel-project/eel.git
        revision: HEAD
        directories:
          - path: edge/mombasa
  template:
    metadata:
      name: eel-edge-mombasa
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: eel
        topology.kubernetes.io/region: mombasa
    spec:
      project: default
      source:
        repoURL: https://github.com/eel-project/eel.git
        targetRevision: HEAD
        path: edge/mombasa
      destination:
        server: https://k8s.eel-mombasa.internal:6443
        namespace: eel-edge
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
