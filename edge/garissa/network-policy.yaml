apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-upstream-egress-garissa
  namespace: eel-edge
  annotations:
    eel.local/spiffe-peer: "spiffe://eel.local/ns/eel-mesh/sa/edge-upstream"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - ipBlock:
            cidr: 10.100.0.10/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.101.0.10/32
      ports:
        - protocol: TCP
          port: 443
