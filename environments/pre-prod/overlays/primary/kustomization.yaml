apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      labelSelector: "eel.internal/site=primary"
  # 5x load-test profile label
  - patch: |-
      - op: add
        path: /metadata/labels/load-profile
        value: "5x"
    target:
      kind: Deployment
      labelSelector: "eel.internal/site=primary"
labels:
  - pairs:
      eel.internal/site: primary
      eel.internal/environment: pre-prod
      load-profile: "5x"
    includeSelectors: false
