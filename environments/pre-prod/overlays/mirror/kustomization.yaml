apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      labelSelector: "eel.internal/site=mirror"
  - patch: |-
      - op: add
        path: /metadata/labels/load-profile
        value: "5x"
    target:
      kind: Deployment
      labelSelector: "eel.internal/site=mirror"
labels:
  - pairs:
      eel.internal/site: mirror
      eel.internal/environment: pre-prod
      load-profile: "5x"
    includeSelectors: false
