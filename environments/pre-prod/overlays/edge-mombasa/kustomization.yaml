apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      labelSelector: "eel.internal/site=edge-mombasa"
  - patch: |-
      - op: add
        path: /metadata/labels/load-profile
        value: "5x"
    target:
      kind: Deployment
      labelSelector: "eel.internal/site=edge-mombasa"
labels:
  - pairs:
      eel.internal/site: edge-mombasa
      eel.internal/environment: pre-prod
      load-profile: "5x"
    includeSelectors: false
