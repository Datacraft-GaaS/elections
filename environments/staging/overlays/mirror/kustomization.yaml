apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: "eel.internal/site=mirror"
labels:
  - pairs:
      eel.internal/site: mirror
      eel.internal/environment: staging
    includeSelectors: false
