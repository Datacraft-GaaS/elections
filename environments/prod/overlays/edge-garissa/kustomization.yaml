apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      labelSelector: "eel.internal/site=edge-garissa"
  - patch: |-
      - op: replace
        path: /data/election-day-mode-enabled
        value: "false"
    target:
      kind: ConfigMap
      name: eel-election-day-mode
labels:
  - pairs:
      eel.internal/site: edge-garissa
      eel.internal/environment: prod
    includeSelectors: false
