# Lightweight Docker registry fallback for local dev.
# Used instead of full Harbor to keep resource usage low on a laptop.
# In staging/prod, use platform/harbor/ with the full Harbor Helm chart.
apiVersion: v1
kind: Namespace
metadata:
  name: eel-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: eel-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: eel-registry
spec:
  selector:
    app: registry
  ports:
    - port: 5000
