# pgBackRest configuration for eel T1 clusters
# Clusters: voter-db (T1-primary), consensus-db (T1-consensus), audit-db (T1-audit)
# Two repos:
#   repo1 = MinIO primary-site  (s3-compatible)
#   repo2 = MinIO mirror-site   (s3-compatible, DR)
#
# Apply per cluster by symlinking or including from /etc/pgbackrest/pgbackrest.conf

[global]
repo1-type=s3
repo1-s3-endpoint=minio-primary.eel-prod.svc.cluster.local:9000
repo1-s3-bucket=pgbackrest-primary
repo1-s3-key-type=web-id
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${PGBACKREST_REPO1_CIPHER_PASS}
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=28
repo1-retention-archive=30
repo1-retention-archive-type=days

repo2-type=s3
repo2-s3-endpoint=minio-mirror.eel-prod.svc.cluster.local:9000
repo2-s3-bucket=pgbackrest-mirror
repo2-s3-key-type=web-id
repo2-s3-region=us-east-1
repo2-s3-uri-style=path
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=${PGBACKREST_REPO2_CIPHER_PASS}
repo2-retention-full=4
repo2-retention-full-type=count
repo2-retention-diff=28
repo2-retention-archive=30
repo2-retention-archive-type=days

# WAL streaming: archive_command calls pgBackRest which pushes to both repos
archive-async=y
archive-push-queue-max=4GiB
archive-timeout=120
compress-type=lz4
compress-level=6
process-max=4
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[voter-db]
pg1-host=postgres-t1-voter
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=pgbackrest

[consensus-db]
pg1-host=postgres-t1-consensus
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=pgbackrest

[audit-db]
pg1-host=postgres-t1-audit
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=pgbackrest
