# cert-manager Helm values — production
# Helm chart: jetstack/cert-manager

installCRDs: true
replicaCount: 3

image:
  repository: quay.io/jetstack/cert-manager-controller
  tag: v1.15.0

webhook:
  replicaCount: 3

cainjector:
  replicaCount: 3

# Prometheus metrics
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    namespace: monitoring
    labels:
      eel.internal/managed-by: platform

# Resource limits
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Extra args for step-ca ACME DNS-01
extraArgs:
  - --dns01-recursive-nameservers=8.8.8.8:53,8.8.4.4:53
  - --dns01-recursive-nameservers-only
