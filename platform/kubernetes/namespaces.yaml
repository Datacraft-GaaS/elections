# Kubernetes namespaces — EEL election infrastructure.
# References: ADR 0004 (Platform), ADR 0019 (Edge topology), DPA 2019 Kenya §6
# All namespaces require Pod Security Standards (PSS) baseline or restricted.
# All namespaces must have:
#   - audit.eel.local sidecar or annotation for audit chain
#   - telemetry.eel.local endpoint for OTEL
#   - security.eel.local annotation for Kyverno policy enforcement

---
apiVersion: v1
kind: Namespace
metadata:
  name: eel-system
  labels:
    kubernetes.io/metadata.name: eel-system
    pod-security.kubernetes.io/enforce: baseline
    eel/internal/audit: "true"
    eel/internal/telemetry: "true"
    eel/internal/maturity: m0
  annotations:
    eel.internal/audit-endpoint: "https://audit.eel.local/v1/telemetry"
    eel.internal/otel-endpoint: "https://otel.eel.local:4317"

---
