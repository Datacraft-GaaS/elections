# Default-deny NetworkPolicy across every namespace except system namespaces.
# Applied cluster-wide; individual services open ingress/egress as needed.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: eel-default-deny-all
  labels:
    eel.internal/managed-by: platform
spec:
  description: "Default deny all ingress and egress for all workloads; system namespaces exempted via label"
  endpointSelector:
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: NotIn
        values:
          - kube-system
          - cilium
          - argocd
          - cert-manager
          - monitoring
          - kafka
          - spire
  ingress:
    - fromEndpoints:
        - matchLabels:
            eel.internal/allow-ingress: "true"
  egress:
    # Allow DNS
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Allow egress within same namespace (sidecar, OTel collector)
    - toEndpoints:
        - matchExpressions:
            - key: "k8s:io.kubernetes.pod.namespace"
              operator: In
              values:
                - "{{index .Labels \"k8s:io.kubernetes.pod.namespace\"}}"
---
# Explicit allow for system namespaces (unrestricted intra-namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-in-system-ns
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
