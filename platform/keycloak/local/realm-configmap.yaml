apiVersion: v1
kind: ConfigMap
metadata:
  name: eel-realm-config
  namespace: eel-iam
data:
  eel-realm.json: |
    {
      "realm": "eel",
      "enabled": true,
      "displayName": "EEL Platform",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "roles": {
        "realm": [
          {"name": "STAFF"},
          {"name": "PARTY"},
          {"name": "OBSERVER"},
          {"name": "MEDIA"},
          {"name": "PUBLIC"},
          {"name": "COUNTY"},
          {"name": "IAB"},
          {"name": "CHAIR"},
          {"name": "RO"}
        ]
      },
      "users": [
        {
          "username": "staff-test",
          "email": "staff@eel.local",
          "enabled": true,
          "credentials": [{"type": "password", "value": "eel-dev", "temporary": false}],
          "realmRoles": ["STAFF"]
        },
        {
          "username": "observer-test",
          "email": "observer@eel.local",
          "enabled": true,
          "credentials": [{"type": "password", "value": "eel-dev", "temporary": false}],
          "realmRoles": ["OBSERVER"]
        },
        {
          "username": "ro-test",
          "email": "ro@eel.local",
          "enabled": true,
          "credentials": [{"type": "password", "value": "eel-dev", "temporary": false}],
          "realmRoles": ["RO"]
        },
        {
          "username": "chair-test",
          "email": "chair@eel.local",
          "enabled": true,
          "credentials": [{"type": "password", "value": "eel-dev", "temporary": false}],
          "realmRoles": ["CHAIR"]
        },
        {
          "username": "public-test",
          "email": "public@eel.local",
          "enabled": true,
          "credentials": [{"type": "password", "value": "eel-dev", "temporary": false}],
          "realmRoles": ["PUBLIC"]
        }
      ],
      "clients": [
        {
          "clientId": "eel-portal",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "redirectUris": ["http://localhost:*/*", "http://eel.local/*"],
          "webOrigins": ["+"]
        }
      ]
    }
