apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-consensus
  namespace: eel-data
spec:
  serviceName: postgres-consensus
  replicas: 1
  selector:
    matchLabels:
      app: postgres-consensus
  template:
    metadata:
      labels:
        app: postgres-consensus
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: eel
            - name: POSTGRES_PASSWORD
              value: eel-dev
            - name: POSTGRES_DB
              value: consensus
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, eel, -d, consensus]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
