apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-audit
  namespace: eel-data
spec:
  serviceName: postgres-audit
  replicas: 1
  selector:
    matchLabels:
      app: postgres-audit
  template:
    metadata:
      labels:
        app: postgres-audit
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: eel
            - name: POSTGRES_PASSWORD
              value: eel-dev
            - name: POSTGRES_DB
              value: audit
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, eel, -d, audit]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
