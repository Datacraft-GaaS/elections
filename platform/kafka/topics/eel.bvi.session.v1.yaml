# BVI session lifecycle events - kit session open, close, and handover on polling day
# Source: BVI context, operational
name: eel.bvi.session.v1
partitions: 32
retention_class: operational
replication_factor: 3
min_isr: 2
unclean_leader_election: false
acks: all
signed: true
delivery: at-least-once-idempotent
acl:
  produce:
    - "spiffe://eel.local/service/bvi-svc"
  consume:
    - "spiffe://eel.local/service/ecc-svc"
    - "spiffe://eel.local/service/rts-projections"
    - "spiffe://eel.local/service/audit-sink"
configs:
  compression.type: zstd
  min.insync.replicas: 2
  max.message.bytes: 1048576
retention_notes: "30-day hot retention; session records feed ECC real-time operations view; durable state in bvi-svc Postgres"
