# Ballot serial chain events - tamper-evident hash-chain of ballot serial numbers
# Source: Ballot-serial context, event-source
name: eel.ballot_serial.chain.v1
partitions: 32
retention_class: event-source
replication_factor: 3
min_isr: 2
unclean_leader_election: false
acks: all
signed: true
delivery: exactly-once
acl:
  produce:
    - "spiffe://eel.local/service/rts-svc"
  consume:
    - "spiffe://eel.local/service/rts-projections"
    - "spiffe://eel.local/service/transparency-log"
    - "spiffe://eel.local/service/audit-sink"
    - "spiffe://eel.local/service/ecc-svc"
configs:
  compression.type: zstd
  min.insync.replicas: 2
  max.message.bytes: 1048576
retention_notes: "Infinite hot; MinIO Tiered Storage after 30d per ADR-0015; Elections Act s.32 15-year retention"
