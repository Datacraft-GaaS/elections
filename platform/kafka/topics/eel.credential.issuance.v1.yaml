# Credential issuance events - HSM-signed Verifiable Credential issuance for voters, officers, and kits
# Source: Credential context, event-source; hsm-signer crate within transparency-svc
name: eel.credential.issuance.v1
partitions: 12
retention_class: event-source
replication_factor: 3
min_isr: 2
unclean_leader_election: false
acks: all
signed: true
delivery: exactly-once
acl:
  produce:
    - "spiffe://eel.local/service/transparency-svc"
  consume:
    - "spiffe://eel.local/service/transparency-log"
    - "spiffe://eel.local/service/audit-sink"
    - "spiffe://eel.local/service/portal-svc"
    - "spiffe://eel.local/service/bvr-svc"
configs:
  compression.type: zstd
  min.insync.replicas: 2
  max.message.bytes: 1048576
retention_notes: "Infinite hot; MinIO Tiered Storage after 30d per ADR-0015; W3C VC revocation audit trail; Kenya DPA 2019 accountability principle"
