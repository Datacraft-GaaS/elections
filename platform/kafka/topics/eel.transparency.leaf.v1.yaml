# Transparency log leaf events - Merkle tree leaf appends from the certificate transparency log
# Source: Transparency context, event-source
name: eel.transparency.leaf.v1
partitions: 12
retention_class: event-source
replication_factor: 3
min_isr: 2
unclean_leader_election: false
acks: all
signed: true
delivery: at-least-once-idempotent
acl:
  produce:
    - "spiffe://eel.local/service/transparency-svc"
  consume:
    - "spiffe://eel.local/service/audit-sink"
    - "spiffe://eel.local/service/witness-svc"
    - "spiffe://eel.local/service/gazette-svc"
configs:
  compression.type: zstd
  min.insync.replicas: 2
  max.message.bytes: 1048576
retention_notes: "Infinite hot; MinIO Tiered Storage after 30d per ADR-0015; transparency log leaves are public record"
