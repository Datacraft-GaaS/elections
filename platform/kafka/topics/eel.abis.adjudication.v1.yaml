# ABIS adjudication events - human review case open, progress, and decision for contested matches
# Source: ABIS context, operational
name: eel.abis.adjudication.v1
partitions: 12
retention_class: operational
replication_factor: 3
min_isr: 2
unclean_leader_election: false
acks: all
signed: true
delivery: at-least-once-idempotent
acl:
  produce:
    - "spiffe://eel.local/service/abis-svc"
  consume:
    - "spiffe://eel.local/service/bvr-svc"
    - "spiffe://eel.local/service/ecc-svc"
    - "spiffe://eel.local/service/audit-sink"
configs:
  compression.type: zstd
  min.insync.replicas: 2
  max.message.bytes: 1048576
retention_notes: "30-day hot retention; durable adjudication outcomes stored in abis-svc and bvr-svc Postgres"
