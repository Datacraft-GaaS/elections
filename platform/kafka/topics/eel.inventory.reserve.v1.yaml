# Inventory reserve pool events - reserve ballot and equipment allocation/depletion alerts
# Source: Custody context, operational
name: eel.inventory.reserve.v1
partitions: 12
retention_class: operational
replication_factor: 3
min_isr: 2
unclean_leader_election: false
acks: all
signed: true
delivery: at-least-once-idempotent
acl:
  produce:
    - "spiffe://eel.local/service/inventory-svc"
  consume:
    - "spiffe://eel.local/service/ecc-svc"
    - "spiffe://eel.local/service/iab-svc"
configs:
  compression.type: zstd
  min.insync.replicas: 2
  max.message.bytes: 1048576
retention_notes: "7-day hot retention; operational signalling only; durable state held in inventory-svc database"
