# ABIS match result events - biometric deduplication match outcomes from enclave workers
# Source: ABIS context, operational; no biometric payload in event
name: eel.abis.match.v1
partitions: 32
retention_class: operational
replication_factor: 3
min_isr: 2
unclean_leader_election: false
acks: all
signed: true
delivery: at-least-once-idempotent
acl:
  produce:
    - "spiffe://eel.local/service/abis-svc"
  consume:
    - "spiffe://eel.local/service/bvr-svc"
    - "spiffe://eel.local/service/audit-sink"
configs:
  compression.type: zstd
  min.insync.replicas: 2
  max.message.bytes: 1048576
retention_notes: "30-day hot retention; match outcomes drive adjudication case creation in bvr-svc; biometric data never leaves enclave"
