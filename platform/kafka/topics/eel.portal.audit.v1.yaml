# Topic: eel.portal.audit.v1
name: eel.portal.audit.v1
partitions: 12
replication_factor: 3
config:
  min.insync.replicas: "2"
  unclean.leader.election.enable: "false"
  acks: "all"
  retention.ms: "604800000"
