# Topic: eel.grievance.complaint.v1
name: eel.grievance.complaint.v1
partitions: 12
replication_factor: 3
config:
  min.insync.replicas: "2"
  unclean.leader.election.enable: "false"
  acks: "all"
  retention.ms: "2592000000"
  tiered.storage.enable: "false"
  remote.storage.manager: "eel-minio-tiered-storage"
retention_class: operational
owner: grievance-svc
description: Electoral complaint and grievance lifecycle events. Covers submission through resolution across all channels including USSD, web, and call centre.
event_types:
  - eel.grievance.complaint_submitted.v1
  - eel.grievance.complaint_resolved.v1
partition_key: eel_stream_id
