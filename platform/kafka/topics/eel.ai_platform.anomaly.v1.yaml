owner: ai-platform-svc
description: AI-generated anomaly detection alerts and adjudication decisions. High-volume (32 partitions). Covers turnout spikes, result outliers, network intrusions, and media disinformation.
event_types:
  - eel.ai_platform.anomaly_detected.v1
  - eel.ai_platform.anomaly_adjudicated.v1
partition_key: eel_stream_id
