# Topic: eel.ai_platform.anomaly.v1
name: eel.ai_platform.anomaly.v1
partitions: 32
replication_factor: 3
config:
  min.insync.replicas: "2"
  unclean.leader.election.enable: "false"
  acks: "all"
  retention.ms: "2592000000"
  tiered.storage.enable: "false"
