# BVR audit trail events - all privileged operations on the voter register
# Source: BVR context, event-source for long-term auditability
name: eel.bvr.audit.v1
partitions: 12
retention_class: event-source
replication_factor: 3
min_isr: 2
unclean_leader_election: false
acks: all
signed: true
delivery: exactly-once
acl:
  produce:
    - "spiffe://eel.local/service/bvr-svc"
  consume:
    - "spiffe://eel.local/service/transparency-log"
    - "spiffe://eel.local/service/audit-sink"
configs:
  compression.type: zstd
  min.insync.replicas: 2
  max.message.bytes: 1048576
retention_notes: "Infinite hot; MinIO Tiered Storage after 30d per ADR-0015; Kenya DPA 2019 accountability principle; Elections Act s.32 15-year retention"
