apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: eel-kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  namespace: eel-kafka
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
