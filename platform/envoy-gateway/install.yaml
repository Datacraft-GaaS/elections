# Envoy Gateway install
# Upstream: https://github.com/envoyproxy/gateway/releases
# Apply: kubectl apply -f platform/envoy-gateway/install.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    eel.internal/managed-by: platform
---
# GatewayClass — references Envoy Gateway controller
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eel-envoy
  labels:
    eel.internal/managed-by: platform
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: eel-proxy-config
    namespace: envoy-gateway-system
---
# EnvoyProxy configuration
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eel-proxy-config
  namespace: envoy-gateway-system
  labels:
    eel.internal/managed-by: platform
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 3
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 512Mi
      envoyService:
        type: LoadBalancer
        annotations:
          eel.internal/managed-by: platform
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
          sinks:
            - type: OpenTelemetry
              openTelemetry:
                host: otel-collector.monitoring.svc.cluster.local
                port: 4317
    metrics:
      prometheus: {}
    tracing:
      samplingRate: 10
      provider:
        host: otel-collector.monitoring.svc.cluster.local
        port: 4317
        type: OpenTelemetry
---
# Main Gateway — external HTTPS on 443 + internal on 8443 for mesh
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eel-main
  namespace: envoy-gateway-system
  labels:
    eel.internal/managed-by: platform
spec:
  gatewayClassName: eel-envoy
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eel-tls-cert
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              eel.internal/managed-by: service
    - name: http-redirect
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# HTTP→HTTPS redirect rule
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: eel-main
      sectionName: http-redirect
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Sample HTTPRoute stub — per-service routes added by appset-gen overlays
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-svc-route
  namespace: portal-svc
spec:
  parentRefs:
    - name: eel-main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "portal.eel.go.ke"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: portal-svc-api
          port: 8080
          weight: 100
