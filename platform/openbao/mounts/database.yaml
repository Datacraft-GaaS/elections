# Database secrets engine mount for eel.
# Provides dynamic PostgreSQL credentials per service via short-lived roles.
# Each service has a pre-created PostgreSQL role (e.g. biometric_edge_svc_role)
# that the dynamic user is granted at login and revoked on lease expiry.

mounts:
  - path: database/eel
    type: database
    description: "Dynamic PostgreSQL credentials for eel services"

connections:
  - name: eel-postgres
    plugin_name: postgresql-database-plugin
    allowed_roles: "*"
    # Connection URL pulled from KV at deploy time; placeholder shown here.
    connection_url: "postgresql://{{username}}:{{password}}@db.eel.internal:5432/eel?sslmode=verify-full"
    # Vault-managed rotation credentials stored separately in kv/eel/<env>/database/root
    username: "vault_root"
    password: "CHANGE_ME_VIA_KV"
    max_open_connections: 5
    max_idle_connections: 2
    max_connection_lifetime: 300s

roles:
  - name: biometric-edge-svc-role
    db_name: eel-postgres
    creation_statements:
      - "CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';"
      - "GRANT biometric_edge_svc_role TO \"{{name}}\";"
    revocation_statements:
      - "DROP ROLE IF EXISTS \"{{name}}\";"
    default_ttl: 1h
    max_ttl: 24h

