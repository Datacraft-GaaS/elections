# SLO-as-code manifest (Sloth format) for ecc-svc -- ADR-0022 + Appendix A
# Modules: M15 M16 M23
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-ecc-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-ecc-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: ecc-svc
spec:
  service: ecc-svc
  labels:
    owner: ecc-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.9
      description: "Election command centre and grievance channels availability"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="ecc-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="ecc-svc"}[{{.window}}]))'
      alerting:
        name: EelEccSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: ecc-svc
        annotations:
          summary: "ecc-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/ecc-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
