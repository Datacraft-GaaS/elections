# SLO-as-code manifest (Sloth format) for transparency-svc -- ADR-0022 + Appendix A
# Modules: P05 P06 M14 M22
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-transparency-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-transparency-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: transparency-svc
spec:
  service: transparency-svc
  labels:
    owner: transparency-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.9
      description: "Transparency log and finance disclosure availability"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="transparency-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="transparency-svc"}[{{.window}}]))'
      alerting:
        name: EelTransparencySvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: transparency-svc
        annotations:
          summary: "transparency-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/transparency-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
