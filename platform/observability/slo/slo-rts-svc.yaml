# SLO-as-code manifest (Sloth format) for rts-svc — ADR-0018 + ADR-0022
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-rts-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-rts-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: rts-svc
spec:
  service: rts-svc
  labels:
    owner: rts-team
    eel.internal/tier: T1
  slos:
    - name: write-availability
      objective: 99.95
      description: "RTS write path availability (ADR-0018: 99.95% per election cycle)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="rts-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="rts-svc"}[{{.window}}]))'
      alerting:
        name: EelRtsWriteAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: rts-svc
        annotations:
          summary: "rts-svc write SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/rts-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket

    - name: write-latency-p99
      objective: 99.9
      description: "P99 write latency <= 200ms (ADR-0018 RTS write path SLA)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_request_duration_seconds_bucket{service="rts-svc",le="0.2"}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_request_duration_seconds_count{service="rts-svc"}[{{.window}}]))'
      alerting:
        name: EelRtsLatencyBurn
        labels:
          eel.internal/severity: warning
