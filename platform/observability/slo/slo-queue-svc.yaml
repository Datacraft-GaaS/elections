# SLO-as-code manifest (Sloth format) for queue-svc -- ADR-0022 + Appendix A
# Modules: M19
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-queue-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-queue-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: queue-svc
spec:
  service: queue-svc
  labels:
    owner: queue-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.9
      description: "Queue transparency and disenfranchisement detection availability"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="queue-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="queue-svc"}[{{.window}}]))'
      alerting:
        name: EelQueueSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: queue-svc
        annotations:
          summary: "queue-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/queue-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
