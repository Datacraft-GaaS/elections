# SLO-as-code manifest (Sloth format) for boundary-svc -- ADR-0022 + Appendix A
# Modules: M18
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-boundary-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-boundary-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: boundary-svc
spec:
  service: boundary-svc
  labels:
    owner: boundary-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.5
      description: "Boundary and geofence service availability"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="boundary-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="boundary-svc"}[{{.window}}]))'
      alerting:
        name: EelBoundarySvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: boundary-svc
        annotations:
          summary: "boundary-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/boundary-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
