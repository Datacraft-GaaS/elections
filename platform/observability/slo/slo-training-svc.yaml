# SLO-as-code manifest (Sloth format) for training-svc -- ADR-0022 + Appendix A
# Modules: M37 M38 M42 M43 M60
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-training-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-training-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: training-svc
spec:
  service: training-svc
  labels:
    owner: training-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.5
      description: "Poll worker training and LMS availability"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="training-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="training-svc"}[{{.window}}]))'
      alerting:
        name: EelTrainingSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: training-svc
        annotations:
          summary: "training-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/training-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
