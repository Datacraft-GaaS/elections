# SLO-as-code manifest (Sloth format) for abis-svc -- ADR-0022 + Appendix A
# Modules: M03
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-abis-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-abis-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: abis-svc
spec:
  service: abis-svc
  labels:
    owner: abis-team
    eel.internal/tier: T1
  slos:
    - name: availability
      objective: 99.99
      description: "ABIS biometric matching availability (T1 election-critical, 99.99%)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="abis-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="abis-svc"}[{{.window}}]))'
      alerting:
        name: EelAbisSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: abis-svc
        annotations:
          summary: "abis-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/abis-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
    - name: abismatchlatency
      objective: 99.9
      description: "ABIS 1:N p99 <= 8s @ 10k enrolments/hr"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_request_duration_seconds_bucket{service="abis-svc",le="8.0"}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_request_duration_seconds_count{service="abis-svc"}[{{.window}}]))'
      alerting:
        name: EelAbisMatchLatencyBurn
        labels:
          eel.internal/severity: warning
          eel.internal/service: abis-svc
        annotations:
          summary: "abis-svc latency SLO burn rate elevated"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/abis-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: warning
        ticketAlert:
          labels:
            eel.internal/severity: ticket
