# SLO-as-code manifest (Sloth format) for field-mobile-svc -- ADR-0022 + Appendix A
# Modules: M13 M29 M30 M31 M32 M33 M34
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-field-mobile-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-field-mobile-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: field-mobile-svc
spec:
  service: field-mobile-svc
  labels:
    owner: field-mobile-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.9
      description: "Field mobile services availability (M13 10M concurrent p99 < 500ms)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="field-mobile-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="field-mobile-svc"}[{{.window}}]))'
      alerting:
        name: EelFieldMobileSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: field-mobile-svc
        annotations:
          summary: "field-mobile-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/field-mobile-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
    - name: fieldmobilelatency
      objective: 99.5
      description: "Public verifier p99 < 500ms @ 10M concurrent"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_request_duration_seconds_bucket{service="field-mobile-svc",le="0.5"}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_request_duration_seconds_count{service="field-mobile-svc"}[{{.window}}]))'
      alerting:
        name: EelFieldMobileLatencyBurn
        labels:
          eel.internal/severity: warning
          eel.internal/service: field-mobile-svc
        annotations:
          summary: "field-mobile-svc latency SLO burn rate elevated"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/field-mobile-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: warning
        ticketAlert:
          labels:
            eel.internal/severity: ticket
