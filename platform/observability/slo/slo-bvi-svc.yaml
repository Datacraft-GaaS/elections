# SLO-as-code manifest (Sloth format) for bvi-svc -- ADR-0022 + Appendix A
# Modules: M06 M07
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-bvi-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-bvi-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: bvi-svc
spec:
  service: bvi-svc
  labels:
    owner: bvi-team
    eel.internal/tier: T1
  slos:
    - name: availability
      objective: 99.99
      description: "Biometric voter identification availability (T1, 42M events/day, p95 800ms p99 1.5s @ 18k req/s)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="bvi-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="bvi-svc"}[{{.window}}]))'
      alerting:
        name: EelBviSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: bvi-svc
        annotations:
          summary: "bvi-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/bvi-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
    - name: bvilatency
      objective: 99.9
      description: "BVI p99 <= 1.5s @ 18k req/s"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_request_duration_seconds_bucket{service="bvi-svc",le="1.5"}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_request_duration_seconds_count{service="bvi-svc"}[{{.window}}]))'
      alerting:
        name: EelBviLatencyBurn
        labels:
          eel.internal/severity: warning
          eel.internal/service: bvi-svc
        annotations:
          summary: "bvi-svc latency SLO burn rate elevated"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/bvi-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: warning
        ticketAlert:
          labels:
            eel.internal/severity: ticket
