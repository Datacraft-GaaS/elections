# SLO-as-code manifest (Sloth format) for vprs-svc -- ADR-0022 + Appendix A
# Modules: M04
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-vprs-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-vprs-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: vprs-svc
spec:
  service: vprs-svc
  labels:
    owner: vprs-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.9
      description: "Voter pre-registration system availability"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="vprs-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="vprs-svc"}[{{.window}}]))'
      alerting:
        name: EelVprsSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: vprs-svc
        annotations:
          summary: "vprs-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/vprs-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
