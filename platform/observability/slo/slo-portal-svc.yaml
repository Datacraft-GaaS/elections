# SLO-as-code manifest (Sloth format) for portal-svc -- ADR-0022 + Appendix A
# Modules: M11 M52 M64 M68
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-portal-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-portal-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: portal-svc
spec:
  service: portal-svc
  labels:
    owner: portal-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.9
      description: "Public results portal availability (p95 200ms p99 500ms @ 5M/hr, inclusion proofs <= 30s)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="portal-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="portal-svc"}[{{.window}}]))'
      alerting:
        name: EelPortalSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: portal-svc
        annotations:
          summary: "portal-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/portal-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
    - name: portallatency
      objective: 99.5
      description: "Portal page p99 <= 500ms @ 5M/hr"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_request_duration_seconds_bucket{service="portal-svc",le="0.5"}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_request_duration_seconds_count{service="portal-svc"}[{{.window}}]))'
      alerting:
        name: EelPortalLatencyBurn
        labels:
          eel.internal/severity: warning
          eel.internal/service: portal-svc
        annotations:
          summary: "portal-svc latency SLO burn rate elevated"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/portal-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: warning
        ticketAlert:
          labels:
            eel.internal/severity: ticket
