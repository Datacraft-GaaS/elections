# SLO-as-code manifest (Sloth format) for biometric-edge-svc -- ADR-0022 + Appendix A
# Modules: M01 M05 M24
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-biometric-edge-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-biometric-edge-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: biometric-edge-svc
spec:
  service: biometric-edge-svc
  labels:
    owner: biometric-edge-team
    eel.internal/tier: T1
  slos:
    - name: availability
      objective: 99.99
      description: "Biometric edge kit availability (T1 election-critical, 99.99%; kit boot <= 90s, scan+sign+transmit <= 90s)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="biometric-edge-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="biometric-edge-svc"}[{{.window}}]))'
      alerting:
        name: EelBiometricEdgeSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: biometric-edge-svc
        annotations:
          summary: "biometric-edge-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/biometric-edge-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
    - name: biometricedgetransmitlatency
      objective: 99.5
      description: "Kit scan+sign+transmit p99 <= 90s"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_request_duration_seconds_bucket{service="biometric-edge-svc",le="90.0"}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_request_duration_seconds_count{service="biometric-edge-svc"}[{{.window}}]))'
      alerting:
        name: EelBiometricEdgeTransmitLatencyBurn
        labels:
          eel.internal/severity: warning
          eel.internal/service: biometric-edge-svc
        annotations:
          summary: "biometric-edge-svc latency SLO burn rate elevated"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/biometric-edge-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: warning
        ticketAlert:
          labels:
            eel.internal/severity: ticket
