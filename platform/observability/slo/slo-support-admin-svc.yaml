# SLO-as-code manifest (Sloth format) for support-admin-svc -- ADR-0022 + Appendix A
# Modules: M25 M27 M54 M55 M69
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-support-admin-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-support-admin-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: support-admin-svc
spec:
  service: support-admin-svc
  labels:
    owner: support-admin-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.5
      description: "Support admin and HR/payroll availability (M55 payroll 250k <= 4h, M33 250k/90 min)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="support-admin-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="support-admin-svc"}[{{.window}}]))'
      alerting:
        name: EelSupportAdminSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: support-admin-svc
        annotations:
          summary: "support-admin-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/support-admin-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
