# SLO-as-code manifest (Sloth format) for crms-svc -- ADR-0022 + Appendix A
# Modules: M12 M45 M46 M47 M67
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-crms-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-crms-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: crms-svc
spec:
  service: crms-svc
  labels:
    owner: crms-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.5
      description: "Candidate and party registration management availability"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="crms-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="crms-svc"}[{{.window}}]))'
      alerting:
        name: EelCrmsSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: crms-svc
        annotations:
          summary: "crms-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/crms-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
