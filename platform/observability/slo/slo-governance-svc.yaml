# SLO-as-code manifest (Sloth format) for governance-svc -- ADR-0022 + Appendix A
# Modules: M21 M40 M41 M48 M49 M50 M56 M57 M58 M59 M62 M66
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-governance-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-governance-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: governance-svc
spec:
  service: governance-svc
  labels:
    owner: governance-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.5
      description: "Governance and audit tooling availability (M49/M50 election-critical during election cycle)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="governance-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="governance-svc"}[{{.window}}]))'
      alerting:
        name: EelGovernanceSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: governance-svc
        annotations:
          summary: "governance-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/governance-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
