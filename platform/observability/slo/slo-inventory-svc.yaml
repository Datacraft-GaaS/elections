# SLO-as-code manifest (Sloth format) for inventory-svc -- ADR-0022 + Appendix A
# Modules: M20 M39 M65
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-inventory-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-inventory-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: inventory-svc
spec:
  service: inventory-svc
  labels:
    owner: inventory-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.9
      description: "Kit and ballot inventory management availability"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="inventory-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="inventory-svc"}[{{.window}}]))'
      alerting:
        name: EelInventorySvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: inventory-svc
        annotations:
          summary: "inventory-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/inventory-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
