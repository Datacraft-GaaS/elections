# SLO-as-code manifest (Sloth format) for ai-platform-svc -- ADR-0022 + Appendix A
# Modules: M17 M26 M28 M44 M61
# Recording rules generated by: sloth generate -i platform/observability/slo/slo-ai-platform-svc.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: eel-ai-platform-svc-slo
  namespace: monitoring
  labels:
    eel.internal/managed-by: platform
    eel.internal/service: ai-platform-svc
spec:
  service: ai-platform-svc
  labels:
    owner: ai-platform-team
    eel.internal/tier: T2
  slos:
    - name: availability
      objective: 99.5
      description: "AI platform availability (anomaly detection, model registry, speech integrity)"
      sli:
        events:
          errorQuery: 'sum(rate(eel_http_requests_total{service="ai-platform-svc",status=~"5.."}[{{.window}}]))'
          totalQuery: 'sum(rate(eel_http_requests_total{service="ai-platform-svc"}[{{.window}}]))'
      alerting:
        name: EelAiPlatformSvcAvailabilityBurn
        labels:
          eel.internal/severity: critical
          eel.internal/service: ai-platform-svc
        annotations:
          summary: "ai-platform-svc availability SLO burn rate critical"
          runbook: https://gitea.internal/eel/eel/src/branch/main/docs/runbooks/ai-platform-svc-degradation.md
        pageAlert:
          labels:
            eel.internal/severity: page
        ticketAlert:
          labels:
            eel.internal/severity: ticket
