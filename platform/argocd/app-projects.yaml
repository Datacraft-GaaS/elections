# AppProject definitions — one per service
# Pattern: each service owns its own project with source + destination scoped to that service.
{% for svc in services %}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ svc }}
  namespace: argocd
spec:
  description: "Deployment project for {{ svc }}"
  sourceRepos:
    - https://gitea.internal/eel/eel
    - https://harbor.eel.internal/chartrepo/eel
  destinations:
    - namespace: {{ svc }}
      server: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: deployer
      description: "CI/CD deployer for {{ svc }}"
      policies:
        - p, proj:{{ svc }}:deployer, applications, sync, {{ svc }}/*, allow
        - p, proj:{{ svc }}:deployer, applications, get, {{ svc }}/*, allow
      groups:
        - eel-deployers
---
{% endfor %}

# Concrete projects for the 18 canonical services
