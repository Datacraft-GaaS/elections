apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bvi-latency-p99
  namespace: argocd
  labels:
    eel.internal/service: bvi-svc
    eel.internal/analysis: latency
spec:
  args:
    - name: service-name
  metrics:
    - name: bvi-p99-latency
      interval: 30s
      count: 10
      # p99 must stay below 1s for biometric verification
      successCondition: result[0] < 1.0
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{
                service="{{args.service-name}}",
                namespace="bvi-svc"
              }[2m])) by (le)
            )
