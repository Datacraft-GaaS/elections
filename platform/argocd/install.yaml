# ArgoCD HA install — production
# Apply: kubectl apply -n argocd -f platform/argocd/install.yaml
# Upstream release: https://github.com/argoproj/argo-cd/releases
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    eel.internal/managed-by: platform
---
# Upstream HA manifest is fetched and vendored at build time.
# The overlay below patches it for eel-specific settings.
# Source: https://raw.githubusercontent.com/argoproj/argo-cd/v2.11.0/manifests/ha/install.yaml
# Kustomize base is platform/argocd/base/ (generated during CI).

# ---- Server Deployment patch (3 replicas, SSO, RBAC) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: argocd-server
          args:
            - /usr/local/bin/argocd-server
            - --staticassets
            - /shared/app
            - --insecure
          env:
            - name: ARGOCD_SERVER_INSECURE
              value: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
  namespace: argocd
spec:
  replicas: 3
---
# SSO via Keycloak OIDC
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  url: https://argocd.eel.internal
  oidc.config: |
    name: Keycloak
    issuer: https://auth.eel.internal/realms/eel
    clientID: argocd
    clientSecret: $oidc.keycloak.clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true
  resource.customizations: |
    argoproj.io/Application:
      health.lua: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            hs.message = obj.status.health.message
          end
        end
        return hs
---
# RBAC linked to Keycloak groups
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    g, eel-platform-admins, role:admin
    g, eel-ops, role:admin
    g, eel-developers, role:readonly
    p, role:service-deployer, applications, sync, */*, allow
    g, eel-deployers, role:service-deployer
  scopes: "[groups]"
