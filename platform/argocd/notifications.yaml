# ArgoCD notifications config for Slack + email on sync failure
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token
  service.email: |
    host: mail.eel.internal
    port: 587
    from: argocd@eel.internal
    username: $email-username
    password: $email-password
  template.app-sync-failed: |
    message: |
      Application {{.app.metadata.name}} sync failed.
      Reason: {{.app.status.operationState.message}}
      Revision: {{.app.status.operationState.operation.sync.revision}}
      Site: {{index .app.metadata.labels "eel.internal/site"}}
    slack:
      attachments: |
        [{
          "color": "#E96D76",
          "title": "{{.app.metadata.name}} sync FAILED",
          "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
          "fields": [
            {"title": "Service", "value": "{{index .app.metadata.labels \"eel.internal/service\"}}", "short": true},
            {"title": "Site", "value": "{{index .app.metadata.labels \"eel.internal/site\"}}", "short": true},
            {"title": "Message", "value": "{{.app.status.operationState.message}}"}
          ]
        }]
  template.app-sync-succeeded: |
    slack:
      attachments: |
        [{
          "color": "#18be52",
          "title": "{{.app.metadata.name}} synced OK",
          "fields": [
            {"title": "Site", "value": "{{index .app.metadata.labels \"eel.internal/site\"}}", "short": true}
          ]
        }]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded]
  defaultTriggers: |
    - on-sync-failed
