# SPIRE registration entries for training-svc
# Trust domain: eel.local (dev) / eel.staging (staging) / eel.pre-prod (pre-prod) / eel.prod (prod)
# Applied via the SPIRE k8s controller; {{TRUST_DOMAIN}} and {{NODE_UID}} are
# substituted by the deployment overlay for each environment.
entries:
  - spiffe_id: "spiffe://{{TRUST_DOMAIN}}/service/training-svc"
    parent_id: "spiffe://{{TRUST_DOMAIN}}/spire/agent/k8s_psat/eel-primary/{{NODE_UID}}"
    selectors:
      - type: "k8s:sa"
        value: "training-svc"
      - type: "k8s:ns"
        value: "training-svc"
      - type: "k8s:pod-label"
        value: "app.kubernetes.io/name:training-svc"
    ttl: 3600
    dns_names:
      - "training-svc.svc.cluster.local"
    admin: false
    downstream: false
