# SPIRE registration entries for support-admin-svc
# Trust domain: eel.local (dev) / eel.staging (staging) / eel.pre-prod (pre-prod) / eel.prod (prod)
# Applied via the SPIRE k8s controller; {{TRUST_DOMAIN}} and {{NODE_UID}} are
# substituted by the deployment overlay for each environment.
entries:
  - spiffe_id: "spiffe://{{TRUST_DOMAIN}}/service/support-admin-svc"
    parent_id: "spiffe://{{TRUST_DOMAIN}}/spire/agent/k8s_psat/eel-primary/{{NODE_UID}}"
    selectors:
      - type: "k8s:sa"
        value: "support-admin-svc"
      - type: "k8s:ns"
        value: "support-admin-svc"
      - type: "k8s:pod-label"
        value: "app.kubernetes.io/name:support-admin-svc"
    ttl: 3600
    dns_names:
      - "support-admin-svc.svc.cluster.local"
    admin: false
    downstream: false
