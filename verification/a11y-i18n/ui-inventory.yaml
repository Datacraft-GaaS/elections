# UI surface inventory for eel a11y + i18n sweep (WP-6.6)
# Every surface that presents a user interface is listed here.
# wcag-target: AA (all) | AAA (M68 only)
# locales-required: subset of the 11 production locales relevant to this surface
# framework: astro | liveview | django | flutter | tauri

surfaces:

  # --- Astro (SSG/SSR web) ---

  - name: public-portal
    service: portal-svc
    module: M11
    framework: astro
    dir: services/portal-svc/astro
    url-template: "http://localhost:3000"
    wcag-target: AA
    locales-required: [en-KE, sw-KE, om-ET, so-KE, kam-KE, mer-KE, guz-KE, luo-KE, luy-KE, kln-KE, mas-KE]

