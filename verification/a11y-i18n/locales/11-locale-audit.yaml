# 11-locale-audit.yaml
# Per-locale x per-surface audit: catalogue completeness, font fallback, ICU plurals, RTL.
# RTL note: none of the 11 production locales uses an RTL script.
# The RTL mechanism (CSS dir="rtl", ICU BIDI, logical properties) is exercised via
# the xxa pseudo-locale which injects directionality markers.

meta:
  locales: [en-KE, sw-KE, om-ET, so-KE, kam-KE, mer-KE, guz-KE, luo-KE, luy-KE, kln-KE, mas-KE]
  rtl-applicable: false
  rtl-mechanism: "CSS dir attribute + logical CSS properties; activated by pseudo-locale xxa"
  icu-plural-forms-required: true
  font-stack: "Noto Sans KE, Ubuntu, system-ui, sans-serif"

rows:

  - surface: public-portal
    locale: en-KE
    catalogue-completeness-pct: 100
    font-fallback-available: true
    icu-plurals-present: true
    rtl-applicable: false

