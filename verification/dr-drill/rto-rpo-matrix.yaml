    backup_tool: Velero
    restore_verification_query: "curl -sf https://nakuru.edge.eel.internal/healthz | grep -q ok"

  - name: edge-eldoret
    tier: edge
    rto_minutes: 15
    rpo_minutes: 0
    backup_tool: Velero
    restore_verification_query: "curl -sf https://eldoret.edge.eel.internal/healthz | grep -q ok"
