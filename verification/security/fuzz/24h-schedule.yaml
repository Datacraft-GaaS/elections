# 24-hour fuzz schedule (WP-6.5)
# Targets: all section-7 API boundary crates.
# Run with: bash fuzz/run-corpus.sh
# Each target runs cargo-fuzz with the declared max_iterations.
# coverage_guided: true uses libFuzzer coverage feedback.

schedule_hours: 24

targets:
  - name: envelope
    crate: packages/eel-crypto-rs
    corpus_dir: fuzz/corpus/envelope
    max_iterations: 5000000
    coverage_guided: true

  - name: canonical_json_rfc8785
    crate: packages/eel-crypto-rs
    corpus_dir: fuzz/corpus/canonical_json_rfc8785
    max_iterations: 5000000
    coverage_guided: true

  - name: ed25519_verify
