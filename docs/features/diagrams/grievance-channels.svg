<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<title>Module M23 Grievance Channels</title>
<desc>Multi-channel grievance intake via web, app, kiosk, USSD, SMS, and WhatsApp with whistleblower protection, SLA-based routing, and DCI/ODPP referral.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="20" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">M23 Grievance Channels</text>

<!-- Human personas -->
<text x="10" y="90" font-family="Arial,sans-serif" font-size="14" fill="#333">* Citizen / Complainant</text>
<text x="680" y="90" font-family="Arial,sans-serif" font-size="14" fill="#333">* the Commission Case Manager</text>
<text x="1020" y="90" font-family="Arial,sans-serif" font-size="14" fill="#333">* DCI Officer</text>

<!-- Chan 1: Web Portal -->
<rect x="30" y="130" width="130" height="65" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="95" y="158" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Web Portal</text>

<!-- Chan 2: Mobile App -->
<rect x="30" y="215" width="130" height="65" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="95" y="253" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Mobile App</text>

<!-- Chan 3: Kiosk Terminal -->
<rect x="30" y="300" width="130" height="65" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="95" y="328" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Kiosk</text>
<text x="95" y="348" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">Terminal</text>

<!-- Chan 4: USSD -->
<rect x="30" y="385" width="130" height="65" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="95" y="413" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">USSD</text>
<text x="95" y="433" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">*400#</text>

<!-- Chan 5: SMS -->
<rect x="30" y="470" width="130" height="65" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="95" y="508" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">SMS</text>

<!-- Chan 6: WhatsApp (planned/dashed) -->
<rect x="30" y="555" width="130" height="65" rx="6" fill="none" stroke="#1f77b4" stroke-dasharray="6 3" stroke-width="2"/>
<text x="95" y="593" font-family="Arial,sans-serif" font-size="14" fill="#1f77b4" text-anchor="middle">WhatsApp</text>

<!-- Arrows from all channels to Grievance Intake -->
<line x1="160" y1="163" x2="238" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="160" y1="248" x2="238" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="160" y1="333" x2="238" y2="375" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="160" y1="418" x2="238" y2="385" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="160" y1="503" x2="238" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="160" y1="588" x2="238" y2="415" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Grievance Intake -->
<rect x="240" y="340" width="170" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="325" y="370" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Grievance</text>
<text x="325" y="388" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Intake</text>
<text x="325" y="406" font-family="Arial,sans-serif" font-size="12" fill="#cec" text-anchor="middle">(support-admin-svc)</text>

<!-- Event: case_submitted -->
<text x="240" y="330" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.grievance.case_submitted.v1</text>

<!-- Arrow intake to whistleblower -->
<line x1="410" y1="365" x2="478" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Arrow intake to SLA routing -->
<line x1="410" y1="405" x2="478" y2="425" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Whistleblower Profile -->
<rect x="480" y="260" width="160" height="90" rx="6" fill="#9467bd" stroke="#6e4e8e" stroke-width="2"/>
<text x="560" y="292" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Whistleblower</text>
<text x="560" y="310" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Profile</text>
<text x="560" y="330" font-family="Arial,sans-serif" font-size="13" fill="#dce" text-anchor="middle">(anonymize)</text>

<!-- SLA Routing Engine -->
<rect x="480" y="390" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="560" y="422" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">SLA Routing</text>
<text x="560" y="440" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Engine</text>
<text x="560" y="460" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">(priority)</text>

<!-- Event: sla_breached -->
<text x="480" y="498" font-family="Arial,sans-serif" font-size="12" fill="#d62728">eel.grievance.sla_breached.v1</text>

<!-- Arrows to Case Manager -->
<line x1="640" y1="305" x2="718" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="435" x2="718" y2="375" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Grievance Case Manager -->
<rect x="720" y="310" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="800" y="342" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Grievance</text>
<text x="800" y="360" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Case</text>
<text x="800" y="378" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Manager</text>

<!-- Arrow Case Manager down to DB -->
<line x1="800" y1="400" x2="800" y2="458" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- DB -->
<rect x="720" y="460" width="160" height="70" rx="6" fill="#ff7f0e" stroke="#c46000" stroke-width="2"/>
<text x="800" y="490" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">grievance_cases</text>
<text x="800" y="510" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">DB</text>

<!-- Event: case_referred -->
<text x="900" y="230" font-family="Arial,sans-serif" font-size="12" fill="#d62728">eel.grievance.case_referred.v1</text>

<!-- Fan-out arrows from Case Manager -->
<line x1="880" y1="330" x2="958" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="880" y1="345" x2="958" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="880" y1="360" x2="958" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="880" y1="375" x2="958" y2="525" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Out 1: DCI Referral (dashed) -->
<rect x="960" y="200" width="160" height="70" rx="6" fill="none" stroke="#d62728" stroke-dasharray="6 3" stroke-width="2"/>
<text x="1040" y="228" font-family="Arial,sans-serif" font-size="14" fill="#d62728" text-anchor="middle">DCI</text>
<text x="1040" y="248" font-family="Arial,sans-serif" font-size="14" fill="#d62728" text-anchor="middle">Referral</text>

<!-- Out 2: ODPP Referral (dashed) -->
<rect x="960" y="300" width="160" height="70" rx="6" fill="none" stroke="#d62728" stroke-dasharray="6 3" stroke-width="2"/>
<text x="1040" y="328" font-family="Arial,sans-serif" font-size="14" fill="#d62728" text-anchor="middle">ODPP</text>
<text x="1040" y="348" font-family="Arial,sans-serif" font-size="14" fill="#d62728" text-anchor="middle">Referral</text>

<!-- Out 3: the Commission Hearing Panel -->
<rect x="960" y="400" width="160" height="70" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="1040" y="428" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">the Commission</text>
<text x="1040" y="446" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Hearing</text>
<text x="1040" y="464" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">Panel</text>

<!-- Out 4: Grievance Tracker Portal -->
<rect x="960" y="500" width="160" height="70" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="1040" y="528" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Grievance</text>
<text x="1040" y="546" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Tracker</text>
<text x="1040" y="564" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">Portal</text>

<!-- Legend -->
<rect x="900" y="620" width="285" height="165" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="640" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="648" width="16" height="11" rx="2" fill="#1f77b4"/>
<text x="937" y="658" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="665" width="16" height="11" rx="2" fill="#2ca02c"/>
<text x="937" y="675" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="682" width="16" height="11" rx="2" fill="#ff7f0e"/>
<text x="937" y="692" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="699" width="16" height="11" rx="2" fill="#9467bd"/>
<text x="937" y="709" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="716" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/>
<text x="937" y="726" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="745" font-family="Arial,sans-serif" font-size="12" fill="#333">* Human Persona</text>
<text x="915" y="763" font-family="Arial,sans-serif" font-size="12" fill="#333">Lock = HSM Touchpoint</text>
</svg>
