<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<title>Module M21 RLA Audit Tool</title>
<desc>Risk-Limiting Audit tool with SHANGRLA statistical algorithm, NIST beacon entropy, HSM signing, IAB card authentication, Tauri offline desktop, and T-statistic auto-recount trigger.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="20" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">M21 RLA Audit Tool</text>

<!-- Human personas -->
<text x="30" y="190" font-family="Arial,sans-serif" font-size="14" fill="#333">* IAB Auditor</text>
<text x="980" y="190" font-family="Arial,sans-serif" font-size="14" fill="#333">* Commissioner</text>

<!-- Node 1: Tauri Offline Desktop -->
<rect x="50" y="260" width="160" height="90" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="130" y="292" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Tauri Offline</text>
<text x="130" y="310" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Desktop App</text>
<text x="130" y="330" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">(IAB)</text>

<!-- Node 2: NIST Beacon (dashed = external) -->
<rect x="270" y="260" width="160" height="90" rx="6" fill="none" stroke="#9467bd" stroke-dasharray="6 3" stroke-width="2"/>
<text x="350" y="292" font-family="Arial,sans-serif" font-size="14" fill="#9467bd" text-anchor="middle">NIST Beacon</text>
<text x="350" y="312" font-family="Arial,sans-serif" font-size="14" fill="#9467bd" text-anchor="middle">Entropy Source</text>

<!-- Node 3: HSM Card Auth -->
<rect x="270" y="390" width="160" height="90" rx="6" fill="#9467bd" stroke="#6e4e8e" stroke-width="2"/>
<text x="350" y="422" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">HSM Card</text>
<text x="350" y="442" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Auth [Lock]</text>

<!-- Arrows from Node 1 to Node 2 and Node 3 -->
<line x1="210" y1="290" x2="268" y2="300" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="210" y1="320" x2="268" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Arrows from Node 2 and Node 3 to SHANGRLA -->
<line x1="430" y1="305" x2="488" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="430" y1="435" x2="488" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 4: SHANGRLA Algorithm -->
<rect x="490" y="260" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="570" y="292" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">SHANGRLA</text>
<text x="570" y="310" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Algorithm</text>
<text x="570" y="330" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">(NIST RLA)</text>

<!-- Event: sample_drawn -->
<text x="490" y="248" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.rla.sample_drawn.v1</text>

<!-- Arrow 4 to 5 -->
<line x1="650" y1="305" x2="708" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 5: T-Statistic Computation -->
<rect x="710" y="260" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="790" y="292" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">T-Statistic</text>
<text x="790" y="310" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Computation</text>

<!-- Arrow 5 to 6 -->
<line x1="870" y1="305" x2="928" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 6: Auto-Recount Trigger -->
<rect x="930" y="260" width="160" height="90" rx="6" fill="#d62728" stroke="#a01c1e" stroke-width="2"/>
<text x="1010" y="292" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Auto-Recount</text>
<text x="1010" y="310" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Trigger</text>
<text x="1010" y="330" font-family="Arial,sans-serif" font-size="13" fill="#fcc" text-anchor="middle">(T &lt; threshold)</text>

<!-- Event: recount_triggered -->
<text x="930" y="248" font-family="Arial,sans-serif" font-size="12" fill="#d62728">eel.rla.recount_triggered.v1</text>

<!-- Arrow SHANGRLA down to audit_ballots DB -->
<line x1="570" y1="350" x2="570" y2="428" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 7: audit_ballots DB -->
<rect x="490" y="430" width="160" height="70" rx="6" fill="#ff7f0e" stroke="#c46000" stroke-width="2"/>
<text x="570" y="460" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">audit_ballots</text>
<text x="570" y="480" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">DB (local)</text>

<!-- Arrow T-statistic down to Audit Report -->
<line x1="790" y1="350" x2="790" y2="428" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 8: Audit Report (HSM signed) -->
<rect x="710" y="430" width="160" height="70" rx="6" fill="#9467bd" stroke="#6e4e8e" stroke-width="2"/>
<text x="790" y="460" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Audit Report</text>
<text x="790" y="480" font-family="Arial,sans-serif" font-size="13" fill="#dce" text-anchor="middle">(HSM signed)</text>

<!-- Legend -->
<rect x="900" y="580" width="285" height="185" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="600" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="608" width="16" height="11" rx="2" fill="#1f77b4"/>
<text x="937" y="618" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="625" width="16" height="11" rx="2" fill="#2ca02c"/>
<text x="937" y="635" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="642" width="16" height="11" rx="2" fill="#ff7f0e"/>
<text x="937" y="652" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="659" width="16" height="11" rx="2" fill="#9467bd"/>
<text x="937" y="669" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="676" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/>
<text x="937" y="686" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="705" font-family="Arial,sans-serif" font-size="12" fill="#333">* Human Persona</text>
<text x="915" y="723" font-family="Arial,sans-serif" font-size="12" fill="#333">Lock = HSM Touchpoint</text>
</svg>
