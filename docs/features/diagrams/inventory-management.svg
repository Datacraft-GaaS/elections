<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<title>Module M20 Inventory Management</title>
<desc>Election inventory management with RFID and GPS ingest, event-sourced custody chain, Merkle root every 10 minutes, and AG read-only access for auditing.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="20" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">M20 Inventory Management</text>

<!-- Human personas -->
<text x="30" y="178" font-family="Arial,sans-serif" font-size="14" fill="#333">* Field Officer</text>
<text x="1010" y="510" font-family="Arial,sans-serif" font-size="14" fill="#333">* AG Auditor</text>

<!-- Node 1: RFID Scanner -->
<rect x="50" y="260" width="160" height="90" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="130" y="295" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">RFID</text>
<text x="130" y="313" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Scanner</text>
<text x="130" y="333" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">(field kit)</text>

<!-- Node 2: GPS Tracker -->
<rect x="50" y="390" width="160" height="90" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="130" y="425" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">GPS</text>
<text x="130" y="443" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Tracker</text>
<text x="130" y="463" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">(vehicle)</text>

<!-- Event label: item_scanned -->
<text x="195" y="258" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.inventory.item_scanned.v1</text>

<!-- Arrows from RFID and GPS to Ingest -->
<line x1="210" y1="305" x2="278" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="210" y1="435" x2="278" y2="375" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 3: Ingest Pipeline -->
<rect x="280" y="310" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="360" y="345" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Ingest</text>
<text x="360" y="363" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Pipeline</text>
<text x="360" y="381" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">(inventory-svc)</text>

<!-- Arrow 3 to 4 -->
<line x1="440" y1="355" x2="478" y2="355" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 4: Event-Sourced Custody Chain -->
<rect x="480" y="310" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="560" y="340" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Event-Sourced</text>
<text x="560" y="358" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Custody Chain</text>
<text x="560" y="378" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">(Kafka)</text>

<!-- Event label: custody_transferred -->
<text x="480" y="298" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.inventory.custody_transferred.v1</text>

<!-- Arrow 4 to 5 -->
<line x1="640" y1="355" x2="698" y2="355" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 5: Merkle Root -->
<rect x="700" y="310" width="160" height="90" rx="6" fill="#9467bd" stroke="#6e4e8e" stroke-width="2"/>
<text x="780" y="340" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Merkle Root</text>
<text x="780" y="358" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle">(every 10 min)</text>
<text x="780" y="378" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle">[Lock]</text>

<!-- Event label: merkle_anchored -->
<text x="700" y="298" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.inventory.merkle_anchored.v1</text>

<!-- Arrow 5 to Node 6 -->
<line x1="860" y1="330" x2="918" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Arrow 5 to Node 7 -->
<line x1="860" y1="380" x2="918" y2="415" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 6: inventory_items DB -->
<rect x="920" y="260" width="160" height="90" rx="6" fill="#ff7f0e" stroke="#c46000" stroke-width="2"/>
<text x="1000" y="295" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">inventory_items</text>
<text x="1000" y="315" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">DB</text>

<!-- Node 7: AG Read-Only Access Portal (dashed = external) -->
<rect x="920" y="390" width="160" height="90" rx="6" fill="none" stroke="#2ca02c" stroke-dasharray="6 3" stroke-width="2"/>
<text x="1000" y="420" font-family="Arial,sans-serif" font-size="14" fill="#2ca02c" text-anchor="middle">AG Read-Only</text>
<text x="1000" y="438" font-family="Arial,sans-serif" font-size="14" fill="#2ca02c" text-anchor="middle">Access Portal</text>

<!-- Arrow from custody chain down to event store -->
<line x1="560" y1="400" x2="560" y2="468" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 8: custody_events event store -->
<rect x="480" y="470" width="160" height="70" rx="6" fill="#ff7f0e" stroke="#c46000" stroke-width="2"/>
<text x="560" y="500" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">custody_events</text>
<text x="560" y="520" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">event store</text>

<!-- Legend -->
<rect x="900" y="580" width="285" height="185" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="600" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="608" width="16" height="11" rx="2" fill="#1f77b4"/>
<text x="937" y="618" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="625" width="16" height="11" rx="2" fill="#2ca02c"/>
<text x="937" y="635" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="642" width="16" height="11" rx="2" fill="#ff7f0e"/>
<text x="937" y="652" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="659" width="16" height="11" rx="2" fill="#9467bd"/>
<text x="937" y="669" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="676" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/>
<text x="937" y="686" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="705" font-family="Arial,sans-serif" font-size="12" fill="#333">* Human Persona</text>
<text x="915" y="723" font-family="Arial,sans-serif" font-size="12" fill="#333">Lock = HSM Touchpoint</text>
</svg>
