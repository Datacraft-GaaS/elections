<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">M41 Post-Election Review — Architecture Diagram</title>
  <desc id="desc">Findings, Recommendations, Referrals, long-drip scheduler with silence alerts, and public tracker.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f8f9fa"/>
  <text x="600" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">M41 Post-Election Review</text>
  <text x="600" y="56" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#555">Findings · Recommendations · Referrals · long-drip scheduler + silence alerts · public tracker</text>

  <!-- Personas -->
  <circle cx="100" cy="115" r="18" fill="#9467bd"/>
  <text x="100" y="145" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Review</text>
  <text x="100" y="160" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Officer</text>

  <circle cx="280" cy="115" r="18" fill="#d62728"/>
  <text x="280" y="145" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">DPP / AG</text>
  <text x="280" y="160" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Referral</text>

  <circle cx="450" cy="115" r="18" fill="#1f77b4"/>
  <text x="450" y="145" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Public</text>

  <!-- ReviewFinding entity -->
  <rect x="30" y="190" width="340" height="120" rx="8" fill="#dbeafe" stroke="#1f77b4" stroke-width="2"/>
  <text x="200" y="216" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f77b4">ReviewFinding</text>
  <text x="200" y="236" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">id, category (PROCESS/TECHNOLOGY/LAW)</text>
  <text x="200" y="256" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">description, severity (CRITICAL/MAJOR/MINOR)</text>
  <text x="200" y="276" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">evidence_refs[] (Merkle-provable)</text>
  <text x="200" y="296" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">finding_recorded.v1 emitted</text>
  <text x="200" y="306" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">data class B — T1-consensus</text>
  <line x1="100" y1="133" x2="150" y2="190" stroke="#9467bd" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Recommendation entity -->
  <rect x="410" y="190" width="340" height="120" rx="8" fill="#dcfce7" stroke="#2ca02c" stroke-width="2"/>
  <text x="580" y="216" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ca02c">Recommendation</text>
  <text x="580" y="236" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">id, finding_id, text</text>
  <text x="580" y="256" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">responsible_body: IEBC/DPP/PARLIAMENT</text>
  <text x="580" y="276" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">due_date, status: OPEN/IN_PROGRESS/CLOSED</text>
  <text x="580" y="296" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">recommendation_issued.v1 emitted</text>
  <text x="580" y="306" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">linked to FindingRecord</text>
  <line x1="370" y1="250" x2="410" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Referral entity -->
  <rect x="790" y="190" width="380" height="120" rx="8" fill="#fce7f3" stroke="#d62728" stroke-width="2"/>
  <text x="980" y="216" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d62728">Referral</text>
  <text x="980" y="236" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">id, recommendation_id</text>
  <text x="980" y="256" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">referred_to: DPP / AG / PARLIAMENT</text>
  <text x="980" y="276" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">referral_letter_hash (HSM-signed)</text>
  <text x="980" y="296" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">referral_submitted.v1 emitted</text>
  <text x="980" y="306" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">data class A — T1-audit</text>
  <rect x="1145" y="190" width="22" height="22" rx="3" fill="#9467bd"/>
  <text x="1156" y="206" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white">🔒</text>
  <line x1="280" y1="133" x2="900" y2="190" stroke="#d62728" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="750" y1="250" x2="790" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Long-drip scheduler -->
  <rect x="30" y="380" width="500" height="130" rx="8" fill="#fef9c3" stroke="#ff7f0e" stroke-width="2"/>
  <text x="280" y="406" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff7f0e">Long-Drip Scheduler</text>
  <text x="280" y="426" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">cron-based follow-up job per Recommendation</text>
  <text x="280" y="446" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">T+30d: due_date approaching alert</text>
  <text x="280" y="466" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">T+60d: overdue escalation → responsible_body</text>
  <text x="280" y="486" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">T+180d: SILENCE_ALERT if no update received</text>
  <text x="280" y="500" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">silence_alert.v1 → Commissioner + AG + Parliament</text>
  <line x1="200" y1="310" x2="200" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="310" x2="380" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Silence alert -->
  <rect x="570" y="380" width="280" height="130" rx="8" fill="#fce7f3" stroke="#d62728" stroke-width="2"/>
  <text x="710" y="406" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d62728">Silence Alert</text>
  <text x="710" y="426" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">responsible_body silent &gt; 180d</text>
  <text x="710" y="446" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">silence_alert.v1 emitted</text>
  <text x="710" y="466" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">public tracker updated: OVERDUE</text>
  <text x="710" y="486" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">ECC console + media notification</text>
  <text x="710" y="500" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">human cannot suppress without Commissioner sign</text>
  <line x1="530" y1="445" x2="570" y2="445" stroke="#ff7f0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- External recipients -->
  <rect x="890" y="380" width="280" height="80" rx="8" fill="#fff" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1030" y="406" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f7f7f">DPP / AG / Parliament</text>
  <text x="1030" y="426" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#7f7f7f">referral + silence notifications</text>
  <text x="1030" y="446" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#7f7f7f">email + signed letter API</text>
  <text x="1030" y="456" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">(external notification channel)</text>
  <line x1="980" y1="310" x2="1030" y2="380" stroke="#7f7f7f" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="850" y1="450" x2="890" y2="430" stroke="#d62728" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Public tracker -->
  <rect x="30" y="580" width="1130" height="100" rx="8" fill="#f3f4f6" stroke="#7f7f7f" stroke-width="1.5"/>
  <text x="595" y="606" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Public Recommendation Tracker (Astro)</text>
  <text x="595" y="626" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555">GET /v1/review/recommendations — public · status per recommendation visible</text>
  <text x="595" y="646" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555">GET /v1/review/findings — evidence_refs downloadable (Merkle-provable)</text>
  <text x="595" y="662" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">Kafka: eel.review.finding.v1 · recommendation.v1 · referral.v1 · silence_alert.v1 — signed</text>
  <line x1="200" y1="510" x2="300" y2="580" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="510" x2="710" y2="580" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="133" x2="595" y2="580" stroke="#1f77b4" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="730" width="540" height="50" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <rect x="42" y="740" width="20" height="14" rx="2" fill="#dbeafe" stroke="#1f77b4"/>
  <text x="70" y="752" font-family="Arial,sans-serif" font-size="12" fill="#333">Finding</text>
  <rect x="142" y="740" width="20" height="14" rx="2" fill="#dcfce7" stroke="#2ca02c"/>
  <text x="170" y="752" font-family="Arial,sans-serif" font-size="12" fill="#333">Recommendation</text>
  <rect x="302" y="740" width="20" height="14" rx="2" fill="#fce7f3" stroke="#d62728"/>
  <text x="330" y="752" font-family="Arial,sans-serif" font-size="12" fill="#333">Referral / silence alert</text>
  <rect x="462" y="740" width="14" height="14" rx="2" fill="#9467bd"/>
  <text x="482" y="752" font-family="Arial,sans-serif" font-size="12" fill="white">🔒</text>
  <text x="490" y="752" font-family="Arial,sans-serif" font-size="12" fill="#333">HSM anchor</text>
</svg>
