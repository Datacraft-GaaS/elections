<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<title>Module M16 Election Command Centre</title>
<desc>Election Command Centre - ingests 46k kit telemetry streams, renders LiveView dashboard with under-2s latency, deduplicates and severity-ranks alerts, dispatches S44A actions.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<!-- Background -->
<rect width="1200" height="800" fill="#ffffff"/>
<!-- Title bar -->
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="20" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">M16 Election Command Centre</text>

<!-- Section label -->
<text x="20" y="95" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#1a3a5c">Pipeline: 46k Kit Telemetry to S44A Dispatch</text>

<!-- 46k KIEMS Kit Telemetry (Kafka) -->
<rect x="30" y="260" width="160" height="90" rx="6" fill="#1f77b4" stroke="#155a8a" stroke-width="2"/>
<text x="110" y="288" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">46k KIEMS Kit</text>
<text x="110" y="306" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Telemetry</text>
<text x="110" y="324" font-family="Arial,sans-serif" font-size="12" fill="#ddd" text-anchor="middle">(Kafka)</text>

<!-- Arrow 1 with event -->
<line x1="190" y1="305" x2="265" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="227" y="290" font-family="Arial,sans-serif" font-size="9" fill="#555" text-anchor="middle">eel.ecc.kit_</text>
<text x="227" y="300" font-family="Arial,sans-serif" font-size="9" fill="#555" text-anchor="middle">telemetry.v1</text>

<!-- ecc-svc Stream Processor -->
<rect x="270" y="260" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7020" stroke-width="2"/>
<text x="350" y="295" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">ecc-svc</text>
<text x="350" y="313" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">Stream Processor</text>

<!-- Arrow 2 -->
<line x1="430" y1="305" x2="485" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Alert Dedup + Severity Ranker -->
<rect x="490" y="260" width="160" height="90" rx="6" fill="#9467bd" stroke="#7a4fa0" stroke-width="2"/>
<text x="570" y="290" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Alert Dedup</text>
<text x="570" y="308" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">+ Severity</text>
<text x="570" y="326" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">Ranker</text>

<!-- Arrow 3 with event -->
<line x1="650" y1="305" x2="715" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="682" y="290" font-family="Arial,sans-serif" font-size="9" fill="#555" text-anchor="middle">eel.ecc.alert_</text>
<text x="682" y="300" font-family="Arial,sans-serif" font-size="9" fill="#555" text-anchor="middle">raised.v1</text>

<!-- Phoenix LiveView 46k render <2s -->
<rect x="720" y="260" width="180" height="90" rx="6" fill="#2ca02c" stroke="#1e7020" stroke-width="2"/>
<text x="810" y="290" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Phoenix LiveView</text>
<text x="810" y="308" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">46k render &lt;2s</text>

<!-- Arrow 4 with event -->
<line x1="900" y1="305" x2="965" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="932" y="290" font-family="Arial,sans-serif" font-size="9" fill="#555" text-anchor="middle">eel.ecc.s44a_</text>
<text x="932" y="300" font-family="Arial,sans-serif" font-size="9" fill="#555" text-anchor="middle">dispatched.v1</text>

<!-- S44A Dispatch (legal form) -->
<rect x="970" y="260" width="160" height="90" rx="6" fill="#d62728" stroke="#a01e1e" stroke-width="2"/>
<text x="1050" y="295" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">S44A Dispatch</text>
<text x="1050" y="313" font-family="Arial,sans-serif" font-size="13" fill="#ffdddd" text-anchor="middle">(legal form)</text>

<!-- Telemetry DB (time-series) below stream processor -->
<rect x="270" y="410" width="160" height="70" rx="6" fill="#ff7f0e" stroke="#c05a00" stroke-width="2"/>
<text x="350" y="438" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Telemetry DB</text>
<text x="350" y="456" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle">(time-series)</text>

<!-- Arrow: Stream Processor -> Telemetry DB -->
<line x1="350" y1="350" x2="350" y2="405" stroke="#555" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

<!-- Alert Event Store below alert ranker -->
<rect x="490" y="410" width="160" height="70" rx="6" fill="#ff7f0e" stroke="#c05a00" stroke-width="2"/>
<text x="570" y="438" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Alert</text>
<text x="570" y="456" font-family="Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle">Event Store</text>

<!-- Arrow: Alert Ranker -> Alert Event Store -->
<line x1="570" y1="350" x2="570" y2="405" stroke="#555" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

<!-- Human personas -->
<text x="960" y="430" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">* ECC Controller</text>
<text x="960" y="448" font-family="Arial,sans-serif" font-size="12" fill="#555">views LiveView</text>

<text x="960" y="510" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">* Returning Officer</text>
<text x="960" y="528" font-family="Arial,sans-serif" font-size="12" fill="#555">receives S44A</text>

<line x1="970" y1="440" x2="1050" y2="350" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="970" y1="520" x2="1050" y2="355" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Legend -->
<rect x="900" y="635" width="285" height="155" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="655" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="663" width="16" height="11" rx="2" fill="#1f77b4"/><text x="937" y="673" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="680" width="16" height="11" rx="2" fill="#2ca02c"/><text x="937" y="690" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="697" width="16" height="11" rx="2" fill="#ff7f0e"/><text x="937" y="707" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="714" width="16" height="11" rx="2" fill="#9467bd"/><text x="937" y="724" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="731" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/><text x="937" y="741" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="760" font-family="Arial,sans-serif" font-size="12" fill="#333">* Human Persona</text>
<text x="915" y="778" font-family="Arial,sans-serif" font-size="12" fill="#333">Lock = HSM / Crypto Touchpoint</text>
</svg>
