<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, sans-serif">
  <title>Module M03 ABIS</title>
  <desc>Automated Biometric Identification System - probe biometrics through Bloom filter pruning, HNSW ANN search, exact re-rank, consensus voting, and adjudication.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-match" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ca02c"/>
    </marker>
    <marker id="arrow-nomatch" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d62728"/>
    </marker>
    <marker id="arrow-review" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff7f0e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="white"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#1a3a5c"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="white">M03 ABIS — Automated Biometric Identification System (abis-svc)</text>

  <!-- Service owner label -->
  <text x="600" y="90" font-size="13" text-anchor="middle" fill="#7f7f7f">Owner: abis-svc | ISO 19794-2 fingerprint matching | Ed25519-signed responses</text>

  <!-- 1. Probe Input -->
  <rect x="30" y="260" width="155" height="85" rx="6" fill="#1f77b4" stroke="#1a5f8a" stroke-width="2"/>
  <text x="107" y="288" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Biometric</text>
  <text x="107" y="306" font-size="13" text-anchor="middle" fill="white">Probe</text>
  <text x="107" y="324" font-size="11" text-anchor="middle" fill="#cce5ff">fingerprint / face</text>

  <!-- Arrow 1 to 2 -->
  <line x1="185" y1="302" x2="240" y2="302" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Demographic Bloom Prune -->
  <rect x="240" y="255" width="160" height="95" rx="6" fill="#2ca02c" stroke="#1e7b1e" stroke-width="2"/>
  <text x="320" y="283" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Demographic</text>
  <text x="320" y="301" font-size="13" text-anchor="middle" fill="white">Bloom Filter</text>
  <text x="320" y="319" font-size="13" text-anchor="middle" fill="white">Prune</text>

  <!-- Bloom filter DB feeding step 2 -->
  <rect x="240" y="155" width="160" height="55" rx="6" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <ellipse cx="320" cy="155" rx="80" ry="13" fill="#ff9a3c" stroke="#c55a00" stroke-width="2"/>
  <ellipse cx="320" cy="210" rx="80" ry="13" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <text x="320" y="178" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Bloom Filter</text>
  <text x="320" y="196" font-size="12" text-anchor="middle" fill="white">DB</text>
  <line x1="320" y1="210" x2="320" y2="255" stroke="#ff7f0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow 2 to 3 -->
  <line x1="400" y1="302" x2="455" y2="302" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. HNSW ANN Search -->
  <rect x="455" y="255" width="160" height="95" rx="6" fill="#2ca02c" stroke="#1e7b1e" stroke-width="2"/>
  <text x="535" y="283" font-size="13" text-anchor="middle" fill="white" font-weight="bold">HNSW ANN</text>
  <text x="535" y="301" font-size="13" text-anchor="middle" fill="white">Vector Search</text>

  <!-- Vector index DB feeding step 3 -->
  <rect x="455" y="155" width="160" height="55" rx="6" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <ellipse cx="535" cy="155" rx="80" ry="13" fill="#ff9a3c" stroke="#c55a00" stroke-width="2"/>
  <ellipse cx="535" cy="210" rx="80" ry="13" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <text x="535" y="178" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Vector Index</text>
  <text x="535" y="196" font-size="12" text-anchor="middle" fill="white">DB (HNSW)</text>
  <line x1="535" y1="210" x2="535" y2="255" stroke="#ff7f0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow 3 to 4 -->
  <line x1="615" y1="302" x2="670" y2="302" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Exact Re-rank -->
  <rect x="670" y="255" width="155" height="95" rx="6" fill="#2ca02c" stroke="#1e7b1e" stroke-width="2"/>
  <text x="747" y="283" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Exact Re-rank</text>
  <text x="747" y="301" font-size="13" text-anchor="middle" fill="white">(ISO 19794-2)</text>

  <!-- Arrow 4 to 5 -->
  <line x1="825" y1="302" x2="878" y2="302" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Consensus Voting -->
  <rect x="878" y="255" width="155" height="95" rx="6" fill="#9467bd" stroke="#6a4a9c" stroke-width="2"/>
  <text x="955" y="283" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Consensus</text>
  <text x="955" y="301" font-size="13" text-anchor="middle" fill="white">Voting</text>
  <text x="955" y="319" font-size="12" text-anchor="middle" fill="#e0d0ff">(3-of-5)</text>

  <!-- Match Candidates DB below step 5 -->
  <rect x="858" y="390" width="195" height="55" rx="6" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <ellipse cx="955" cy="390" rx="97" ry="13" fill="#ff9a3c" stroke="#c55a00" stroke-width="2"/>
  <ellipse cx="955" cy="445" rx="97" ry="13" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <text x="955" y="414" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Match Candidate</text>
  <text x="955" y="432" font-size="12" text-anchor="middle" fill="white">DB</text>
  <line x1="955" y1="350" x2="955" y2="390" stroke="#ff7f0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result arrows from Consensus Voting -->
  <!-- MATCH arrow (right/down-right) -->
  <line x1="1033" y1="290" x2="1100" y2="290" stroke="#2ca02c" stroke-width="2" marker-end="url(#arrow-match)"/>
  <text x="1120" y="285" font-size="13" fill="#2ca02c" font-weight="bold">MATCH</text>

  <!-- NO_MATCH arrow (right/down) -->
  <line x1="1033" y1="320" x2="1100" y2="320" stroke="#d62728" stroke-width="2" marker-end="url(#arrow-nomatch)"/>
  <text x="1105" y="315" font-size="13" fill="#d62728" font-weight="bold">NO_MATCH</text>

  <!-- REVIEW arrow down to adjudication -->
  <line x1="955" y1="458" x2="955" y2="510" stroke="#ff7f0e" stroke-width="2" marker-end="url(#arrow-review)"/>
  <text x="990" y="490" font-size="11" fill="#ff7f0e">REVIEW</text>

  <!-- 6. Adjudication Queue (planned, dashed) -->
  <rect x="840" y="510" width="230" height="75" rx="6" fill="none" stroke="#2ca02c" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="955" y="538" font-size="13" text-anchor="middle" fill="#2ca02c" font-weight="bold">Adjudication</text>
  <text x="955" y="556" font-size="13" text-anchor="middle" fill="#2ca02c">Queue</text>
  <text x="955" y="574" font-size="11" text-anchor="middle" fill="#7f7f7f">planned human review</text>

  <!-- Adjudicator persona -->
  <circle cx="1120" cy="535" r="14" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="1120" y1="549" x2="1120" y2="590" stroke="#333" stroke-width="2"/>
  <line x1="1120" y1="560" x2="1098" y2="575" stroke="#333" stroke-width="2"/>
  <line x1="1120" y1="560" x2="1142" y2="575" stroke="#333" stroke-width="2"/>
  <line x1="1120" y1="590" x2="1100" y2="610" stroke="#333" stroke-width="2"/>
  <line x1="1120" y1="590" x2="1140" y2="610" stroke="#333" stroke-width="2"/>
  <text x="1120" y="627" font-size="12" text-anchor="middle" fill="#333">ABIS</text>
  <text x="1120" y="641" font-size="12" text-anchor="middle" fill="#333">Adjudicator</text>
  <line x1="1070" y1="548" x2="1106" y2="548" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,2"/>

  <!-- Legend -->
  <rect x="30" y="600" width="280" height="165" rx="6" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="622" font-size="13" font-weight="bold" fill="#333">Legend</text>
  <rect x="40" y="630" width="18" height="12" rx="2" fill="#1f77b4"/>
  <text x="64" y="641" font-size="12" fill="#333">Kit / Device</text>
  <rect x="40" y="648" width="18" height="12" rx="2" fill="#2ca02c"/>
  <text x="64" y="659" font-size="12" fill="#333">Service / Backend</text>
  <rect x="40" y="666" width="18" height="12" rx="2" fill="#ff7f0e"/>
  <text x="64" y="677" font-size="12" fill="#333">Database / Store</text>
  <rect x="40" y="684" width="18" height="12" rx="2" fill="#9467bd"/>
  <text x="64" y="695" font-size="12" fill="#333">Event / Message</text>
  <rect x="40" y="702" width="18" height="12" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4"/>
  <text x="64" y="713" font-size="12" fill="#333">External / Integration</text>
  <text x="40" y="750" font-size="12" fill="#333">&#x1F464; Human Persona</text>

</svg>
