<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">M31 Mobile Poll Clerk — Architecture Diagram</title>
  <desc id="desc">Poll clerk kit-mirror dashboard, offline reference, incident reporting, kiosk mode, and HSM-signed end-of-day report.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff7f0e"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f8f9fa"/>
  <text x="600" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">M31 Mobile Poll Clerk</text>
  <text x="600" y="56" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#555">Kit-mirror dashboard · offline reference · incidents · kiosk mode · EOD signed report</text>

  <!-- Poll Clerk persona -->
  <circle cx="120" cy="120" r="22" fill="#2ca02c"/>
  <text x="120" y="155" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#333">Poll Clerk</text>

  <!-- Clerk App -->
  <rect x="30" y="185" width="240" height="110" rx="8" fill="#dcfce7" stroke="#2ca02c" stroke-width="2"/>
  <text x="150" y="211" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ca02c">Poll Clerk App</text>
  <text x="150" y="231" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">Flutter — kiosk mode</text>
  <text x="150" y="251" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">station_code + JWT (POLL_CLERK)</text>
  <text x="150" y="271" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">NFC + QR credential tap</text>
  <text x="150" y="287" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">ClerkSession entity</text>
  <line x1="120" y1="142" x2="120" y2="185" stroke="#2ca02c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kit Mirror Dashboard -->
  <rect x="310" y="185" width="280" height="110" rx="8" fill="#dbeafe" stroke="#1f77b4" stroke-width="2"/>
  <text x="450" y="211" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f77b4">Kit-Mirror Dashboard</text>
  <text x="450" y="231" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">live kit state: battery, auth count</text>
  <text x="450" y="251" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">throughput_per_hour, queue depth</text>
  <text x="450" y="271" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">mirrors BVI/BVR kit telemetry (M26)</text>
  <text x="450" y="287" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">Phoenix LiveView SSE stream</text>
  <line x1="270" y1="240" x2="310" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Offline Reference -->
  <rect x="310" y="345" width="280" height="100" rx="8" fill="#dcfce7" stroke="#2ca02c" stroke-width="2"/>
  <text x="450" y="371" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ca02c">Offline Reference</text>
  <text x="450" y="391" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">procedures, legislation excerpts</text>
  <text x="450" y="411" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">station voter list (encrypted)</text>
  <text x="450" y="431" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">ballot layout reference</text>
  <text x="450" y="441" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">SQLCipher — synced pre-election</text>
  <line x1="450" y1="295" x2="450" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Incidents -->
  <rect x="630" y="185" width="280" height="110" rx="8" fill="#fef9c3" stroke="#ff7f0e" stroke-width="2"/>
  <text x="770" y="211" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff7f0e">Incident Reporting</text>
  <text x="770" y="231" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">POST /v1/clerk/incidents</text>
  <text x="770" y="251" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">ClerkIncident: type, description</text>
  <text x="770" y="271" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">photo attachment (signed)</text>
  <text x="770" y="287" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">clerk_incident.v1 emitted</text>
  <line x1="590" y1="240" x2="630" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kiosk mode -->
  <rect x="630" y="345" width="280" height="100" rx="8" fill="#fef9c3" stroke="#ff7f0e" stroke-width="2"/>
  <text x="770" y="371" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff7f0e">Kiosk Mode</text>
  <text x="770" y="391" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">tablet locked to clerk app</text>
  <text x="770" y="411" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">no multitasking — PIN guarded</text>
  <text x="770" y="431" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">supervisor override PIN</text>
  <text x="770" y="441" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">Android DeviceOwner API</text>
  <line x1="770" y1="295" x2="770" y2="345" stroke="#ff7f0e" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- EOD Signed Report -->
  <rect x="310" y="500" width="600" height="110" rx="8" fill="#ede9fe" stroke="#9467bd" stroke-width="2.5"/>
  <text x="610" y="526" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9467bd">End-of-Day Signed Report (EOD)</text>
  <text x="610" y="546" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">ClerkEODReport: station_code, total_authenticated, spoilt_ballots</text>
  <text x="610" y="566" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">incident_count, kit_serial, clerk_id, signed_at</text>
  <text x="610" y="586" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">HSM signature (P06) + Merkle anchor (P05)</text>
  <text x="610" y="606" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">POST /v1/clerk/eod — exactly-once — data class A — T1-audit</text>
  <rect x="885" y="500" width="22" height="22" rx="3" fill="#9467bd"/>
  <text x="896" y="516" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white">🔒</text>
  <line x1="450" y1="445" x2="500" y2="500" stroke="#9467bd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="445" x2="720" y2="500" stroke="#9467bd" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Downstream: RTS -->
  <rect x="310" y="670" width="280" height="70" rx="8" fill="#dbeafe" stroke="#1f77b4" stroke-width="2"/>
  <text x="450" y="696" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f77b4">RTS Back-End (M10)</text>
  <text x="450" y="716" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">EOD aggregated into results</text>
  <text x="450" y="730" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">clerk_eod.v1 consumed</text>
  <line x1="450" y1="610" x2="450" y2="670" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Downstream: ECC console -->
  <rect x="630" y="670" width="280" height="70" rx="8" fill="#ede9fe" stroke="#9467bd" stroke-width="2"/>
  <text x="770" y="696" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9467bd">ECC Console</text>
  <text x="770" y="716" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">incident + EOD monitoring</text>
  <text x="770" y="730" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">ECC_ANALYST role</text>
  <line x1="770" y1="610" x2="770" y2="670" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="950" y="400" width="220" height="160" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="1060" y="420" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  <rect x="962" y="430" width="20" height="14" rx="2" fill="#dcfce7" stroke="#2ca02c"/>
  <text x="990" y="442" font-family="Arial,sans-serif" font-size="12" fill="#333">Clerk app / reference</text>
  <rect x="962" y="450" width="20" height="14" rx="2" fill="#dbeafe" stroke="#1f77b4"/>
  <text x="990" y="462" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit mirror / RTS</text>
  <rect x="962" y="470" width="20" height="14" rx="2" fill="#fef9c3" stroke="#ff7f0e"/>
  <text x="990" y="482" font-family="Arial,sans-serif" font-size="12" fill="#333">Incidents / kiosk</text>
  <rect x="962" y="490" width="20" height="14" rx="2" fill="#ede9fe" stroke="#9467bd"/>
  <text x="990" y="502" font-family="Arial,sans-serif" font-size="12" fill="#333">EOD signed report</text>
  <rect x="962" y="510" width="14" height="14" rx="2" fill="#9467bd"/>
  <text x="982" y="522" font-family="Arial,sans-serif" font-size="12" fill="white">🔒</text>
  <text x="990" y="522" font-family="Arial,sans-serif" font-size="12" fill="#333">HSM / tlog anchor</text>
  <circle cx="972" cy="542" r="7" fill="#2ca02c"/>
  <text x="990" y="546" font-family="Arial,sans-serif" font-size="12" fill="#333">Poll clerk persona</text>
</svg>
