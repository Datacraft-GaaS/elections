<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<title>Module M07 BVV - Biometric Voter Verification</title>
<desc>Voter verification kiosk and web browser interface providing constant-time lookup, daily cap enforcement, and objection form submission.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="800" fill="white"/>

<!-- Title bar -->
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="600" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Module M07 BVV - Biometric Voter Verification</text>

<!-- Human Persona: Citizen (left) -->
<circle cx="65" cy="185" r="14" fill="none" stroke="#333" stroke-width="2"/>
<line x1="65" y1="199" x2="65" y2="230" stroke="#333" stroke-width="2"/>
<line x1="65" y1="210" x2="45" y2="225" stroke="#333" stroke-width="2"/>
<line x1="65" y1="210" x2="85" y2="225" stroke="#333" stroke-width="2"/>
<line x1="65" y1="230" x2="48" y2="250" stroke="#333" stroke-width="2"/>
<line x1="65" y1="230" x2="82" y2="250" stroke="#333" stroke-width="2"/>
<text x="65" y="268" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Citizen</text>

<!-- Arrows from Citizen to Kiosk and Web Browser -->
<line x1="95" y1="215" x2="140" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="95" y1="225" x2="140" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 1: Kiosk Terminal -->
<rect x="150" y="280" width="140" height="70" rx="6" fill="#1f77b4" stroke="#1558a0" stroke-width="2" filter="url(#shadow)"/>
<text x="220" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Kiosk</text>
<text x="220" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Terminal</text>

<!-- Box 2: Web Browser Portal -->
<rect x="150" y="380" width="140" height="70" rx="6" fill="#1f77b4" stroke="#1558a0" stroke-width="2" filter="url(#shadow)"/>
<text x="220" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Web Browser</text>
<text x="220" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Portal</text>

<!-- Arrow from Kiosk to BVV Service -->
<line x1="290" y1="315" x2="350" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Arrow from Web Browser to BVV Service -->
<line x1="290" y1="415" x2="350" y2="370" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 3: BVV Service -->
<rect x="355" y="320" width="160" height="70" rx="6" fill="#2ca02c" stroke="#1e8a1e" stroke-width="2" filter="url(#shadow)"/>
<text x="435" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">BVV Service</text>
<text x="435" y="370" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">bvv-svc</text>

<!-- Arrow from BVV Service to Constant-Time Lookup -->
<line x1="515" y1="355" x2="580" y2="355" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 4: Constant-Time Lookup Engine -->
<rect x="585" y="320" width="160" height="70" rx="6" fill="#2ca02c" stroke="#1e8a1e" stroke-width="2" filter="url(#shadow)"/>
<text x="665" y="348" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Constant-Time</text>
<text x="665" y="368" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Lookup Engine</text>

<!-- Arrow from Lookup Engine to Voter Register DB -->
<line x1="745" y1="345" x2="810" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 5: Voter Register DB (read-only) -->
<rect x="815" y="270" width="150" height="70" rx="6" fill="#ff7f0e" stroke="#c96000" stroke-width="2" filter="url(#shadow)"/>
<text x="890" y="299" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Voter Register</text>
<text x="890" y="319" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">DB (read-only)</text>

<!-- Arrow back from Voter Register to Lookup (voter record) -->
<line x1="815" y1="330" x2="747" y2="365" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="778" y="360" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">voter record</text>

<!-- Arrow down from BVV Service to Daily Cap Enforcement -->
<line x1="435" y1="390" x2="435" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 6: Daily Cap Enforcement -->
<rect x="355" y="435" width="160" height="80" rx="6" fill="#9467bd" stroke="#7a50a8" stroke-width="2" filter="url(#shadow)"/>
<text x="435" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Daily Cap</text>
<text x="435" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Enforcement</text>
<text x="435" y="500" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">(30 req/hr)</text>

<!-- Arrow right from Daily Cap to Objection Form Handler -->
<line x1="515" y1="475" x2="580" y2="475" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 7: Objection Form Handler -->
<rect x="585" y="440" width="150" height="70" rx="6" fill="#2ca02c" stroke="#1e8a1e" stroke-width="2" filter="url(#shadow)"/>
<text x="660" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Objection</text>
<text x="660" y="488" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Form Handler</text>

<!-- Event label on arrow from BVV Service output -->
<text x="555" y="345" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">eel.bvv.verification_requested.v1</text>

<!-- Human Persona: Polling Clerk (right) -->
<circle cx="1020" cy="300" r="14" fill="none" stroke="#333" stroke-width="2"/>
<line x1="1020" y1="314" x2="1020" y2="345" stroke="#333" stroke-width="2"/>
<line x1="1020" y1="325" x2="1000" y2="340" stroke="#333" stroke-width="2"/>
<line x1="1020" y1="325" x2="1040" y2="340" stroke="#333" stroke-width="2"/>
<line x1="1020" y1="345" x2="1003" y2="365" stroke="#333" stroke-width="2"/>
<line x1="1020" y1="345" x2="1037" y2="365" stroke="#333" stroke-width="2"/>
<text x="1020" y="383" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Polling Clerk</text>

<!-- Section label -->
<text x="600" y="620" font-family="Arial, sans-serif" font-size="13" fill="#7f7f7f" text-anchor="middle">Verification request flows left to right; daily cap and objection handling branch below BVV Service</text>

<!-- Legend -->
<rect x="900" y="635" width="285" height="155" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="655" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="663" width="16" height="11" rx="2" fill="#1f77b4"/><text x="937" y="673" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="680" width="16" height="11" rx="2" fill="#2ca02c"/><text x="937" y="690" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="697" width="16" height="11" rx="2" fill="#ff7f0e"/><text x="937" y="707" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="714" width="16" height="11" rx="2" fill="#9467bd"/><text x="937" y="724" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="731" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/><text x="937" y="741" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="762" font-family="Arial,sans-serif" font-size="12" fill="#333">&#9900; Human Persona</text>
<text x="915" y="779" font-family="Arial,sans-serif" font-size="12" fill="#333">&#128274; Crypto / HSM Touchpoint</text>
</svg>
