<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<title>Module M22 Campaign Finance Transparency</title>
<desc>Campaign finance transparency with financial disclosure ingestion, SAR triggers for suspicious activity, evidence packaging to ODPP/DCI, and public heat-map.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="20" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">M22 Campaign Finance Transparency</text>

<!-- Human personas -->
<text x="30" y="140" font-family="Arial,sans-serif" font-size="14" fill="#333">* Finance Officer</text>
<text x="930" y="140" font-family="Arial,sans-serif" font-size="14" fill="#333">* ODPP Prosecutor</text>
<text x="930" y="158" font-family="Arial,sans-serif" font-size="14" fill="#333">* DCI Officer</text>

<!-- Node 1: Candidate Disclosures -->
<rect x="30" y="200" width="160" height="80" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="110" y="232" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Candidate</text>
<text x="110" y="250" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Disclosures</text>
<text x="110" y="268" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">(web form)</text>

<!-- Node 2: Cash Aggregates (dashed = external) -->
<rect x="30" y="310" width="160" height="80" rx="6" fill="none" stroke="#1f77b4" stroke-dasharray="6 3" stroke-width="2"/>
<text x="110" y="342" font-family="Arial,sans-serif" font-size="14" fill="#1f77b4" text-anchor="middle">Cash</text>
<text x="110" y="360" font-family="Arial,sans-serif" font-size="14" fill="#1f77b4" text-anchor="middle">Aggregates</text>
<text x="110" y="378" font-family="Arial,sans-serif" font-size="13" fill="#1f77b4" text-anchor="middle">(KRA data)</text>

<!-- Node 3: Bank Reports (dashed = external) -->
<rect x="30" y="420" width="160" height="80" rx="6" fill="none" stroke="#1f77b4" stroke-dasharray="6 3" stroke-width="2"/>
<text x="110" y="452" font-family="Arial,sans-serif" font-size="14" fill="#1f77b4" text-anchor="middle">Bank</text>
<text x="110" y="470" font-family="Arial,sans-serif" font-size="14" fill="#1f77b4" text-anchor="middle">Reports</text>
<text x="110" y="488" font-family="Arial,sans-serif" font-size="13" fill="#1f77b4" text-anchor="middle">(CBK)</text>

<!-- Arrows from inputs to Finance Ingestion -->
<line x1="190" y1="240" x2="268" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="190" y1="350" x2="268" y2="350" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="190" y1="460" x2="268" y2="375" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Node 4: Finance Ingestion -->
<rect x="270" y="300" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="350" y="332" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Finance</text>
<text x="350" y="350" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Ingestion</text>
<text x="350" y="370" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">(governance-svc)</text>

<!-- Event: disclosure_submitted -->
<text x="270" y="288" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.finance.disclosure_submitted.v1</text>

<!-- Arrow 4 to 5 -->
<line x1="430" y1="345" x2="478" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 5: SAR Trigger Engine -->
<rect x="480" y="300" width="160" height="90" rx="6" fill="#d62728" stroke="#a01c1e" stroke-width="2"/>
<text x="560" y="332" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">SAR</text>
<text x="560" y="350" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Trigger</text>
<text x="560" y="370" font-family="Arial,sans-serif" font-size="14" fill="#fcc" text-anchor="middle">Engine</text>

<!-- Event: sar_triggered -->
<text x="480" y="288" font-family="Arial,sans-serif" font-size="12" fill="#d62728">eel.finance.sar_triggered.v1</text>

<!-- Arrow 5 to 6 -->
<line x1="640" y1="345" x2="698" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 6: Evidence Packager -->
<rect x="700" y="300" width="160" height="90" rx="6" fill="#9467bd" stroke="#6e4e8e" stroke-width="2"/>
<text x="780" y="328" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Evidence</text>
<text x="780" y="346" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Packager</text>
<text x="780" y="366" font-family="Arial,sans-serif" font-size="13" fill="#dce" text-anchor="middle">(HSM sign) [Lock]</text>

<!-- Event: evidence_packaged -->
<text x="700" y="288" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.finance.evidence_packaged.v1</text>

<!-- Arrows from Evidence Packager to outputs -->
<line x1="860" y1="325" x2="928" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="860" y1="345" x2="928" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="860" y1="370" x2="928" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 7: ODPP Referral (dashed = external) -->
<rect x="930" y="200" width="160" height="80" rx="6" fill="none" stroke="#d62728" stroke-dasharray="6 3" stroke-width="2"/>
<text x="1010" y="232" font-family="Arial,sans-serif" font-size="14" fill="#d62728" text-anchor="middle">ODPP</text>
<text x="1010" y="252" font-family="Arial,sans-serif" font-size="14" fill="#d62728" text-anchor="middle">Referral</text>

<!-- Node 8: DCI Referral (dashed = external) -->
<rect x="930" y="310" width="160" height="80" rx="6" fill="none" stroke="#d62728" stroke-dasharray="6 3" stroke-width="2"/>
<text x="1010" y="342" font-family="Arial,sans-serif" font-size="14" fill="#d62728" text-anchor="middle">DCI</text>
<text x="1010" y="362" font-family="Arial,sans-serif" font-size="14" fill="#d62728" text-anchor="middle">Referral</text>

<!-- Node 9: Public Heat-Map -->
<rect x="930" y="420" width="160" height="80" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="1010" y="452" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Public</text>
<text x="1010" y="470" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Heat-Map</text>
<text x="1010" y="488" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">(Astro)</text>

<!-- Arrow ingestion down to DB -->
<line x1="350" y1="390" x2="350" y2="448" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Also SAR down to DB -->
<line x1="560" y1="390" x2="560" y2="448" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Node 10: finance_disclosures DB -->
<rect x="400" y="450" width="200" height="70" rx="6" fill="#ff7f0e" stroke="#c46000" stroke-width="2"/>
<text x="500" y="480" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">finance_disclosures</text>
<text x="500" y="500" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">DB</text>

<!-- Legend -->
<rect x="900" y="580" width="285" height="185" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="600" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="608" width="16" height="11" rx="2" fill="#1f77b4"/>
<text x="937" y="618" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="625" width="16" height="11" rx="2" fill="#2ca02c"/>
<text x="937" y="635" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="642" width="16" height="11" rx="2" fill="#ff7f0e"/>
<text x="937" y="652" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="659" width="16" height="11" rx="2" fill="#9467bd"/>
<text x="937" y="669" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="676" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/>
<text x="937" y="686" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="705" font-family="Arial,sans-serif" font-size="12" fill="#333">* Human Persona</text>
<text x="915" y="723" font-family="Arial,sans-serif" font-size="12" fill="#333">Lock = HSM Touchpoint</text>
</svg>
