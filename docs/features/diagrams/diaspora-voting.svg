<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">M24 Diaspora Voting — Architecture Diagram</title>
  <desc id="desc">Pipeline from embassy stations through diaspora voter roll freeze, Form 34A-D capture, physical pouch custody, and Nairobi HQ aggregation.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-ext" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f7f7f"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="600" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">M24 Diaspora Voting</text>
  <text x="600" y="56" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#555">Embassy stations → DiasporaRoll freeze → Form 34A-D capture → Pouch custody → Nairobi HQ</text>

  <!-- LAYER 1: Human Personas (top) -->
  <!-- Embassy Officer persona -->
  <circle cx="100" cy="110" r="18" fill="#1f77b4" stroke="#1f77b4"/>
  <text x="100" y="114" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="bold">👤</text>
  <text x="100" y="140" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Embassy</text>
  <text x="100" y="155" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Officer</text>

  <!-- Diaspora Voter persona -->
  <circle cx="260" cy="110" r="18" fill="#2ca02c" stroke="#2ca02c"/>
  <text x="260" y="114" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="bold">👤</text>
  <text x="260" y="140" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Diaspora</text>
  <text x="260" y="155" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Voter</text>

  <!-- IEBC Chair persona -->
  <circle cx="1100" cy="110" r="18" fill="#9467bd" stroke="#9467bd"/>
  <text x="1100" y="114" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white" font-weight="bold">👤</text>
  <text x="1100" y="140" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">IEBC</text>
  <text x="1100" y="155" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#333">Chair</text>

  <!-- LAYER 2: Embassy Station (external, dashed) -->
  <rect x="30" y="180" width="180" height="90" rx="8" fill="#fff" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="120" y="205" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Embassy Station</text>
  <text x="120" y="224" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555">BVR/BVI diaspora kit</text>
  <text x="120" y="242" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555">Flutter app (offline-first)</text>
  <text x="120" y="260" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">EmbassyStation entity</text>

  <!-- Kit telemetry arrow down -->
  <line x1="120" y1="270" x2="120" y2="315" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="135" y="296" font-family="Arial,sans-serif" font-size="11" fill="#333">kit_telemetry</text>

  <!-- BVR/BVI Registration box -->
  <rect x="30" y="315" width="180" height="70" rx="8" fill="#dbeafe" stroke="#1f77b4" stroke-width="2"/>
  <text x="120" y="338" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f77b4">BVR / BVI</text>
  <text x="120" y="356" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">Biometric enrolment</text>
  <text x="120" y="373" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">M01/M02 + M05/M06</text>

  <!-- Arrow BVR to ABIS -->
  <line x1="210" y1="350" x2="280" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="342" font-family="Arial,sans-serif" font-size="11" fill="#333">biometric batch</text>

  <!-- ABIS -->
  <rect x="280" y="315" width="140" height="70" rx="8" fill="#dbeafe" stroke="#1f77b4" stroke-width="2"/>
  <text x="350" y="345" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f77b4">ABIS</text>
  <text x="350" y="365" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">M03 biometric store</text>
  <text x="350" y="382" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">deduplication</text>

  <!-- Arrow ABIS to Roll -->
  <line x1="420" y1="350" x2="490" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="342" font-family="Arial,sans-serif" font-size="11" fill="#333">verified IDs</text>

  <!-- DiasporaVoterRoll -->
  <rect x="490" y="300" width="200" height="100" rx="8" fill="#dcfce7" stroke="#2ca02c" stroke-width="2"/>
  <text x="590" y="326" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ca02c">Diaspora Voter Roll</text>
  <text x="590" y="346" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">roll_version, voter_count</text>
  <text x="590" y="364" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">roll_hash, merkle_proof</text>
  <text x="590" y="384" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">DiasporaVoterRoll entity</text>

  <!-- HSM Lock icon on Roll -->
  <rect x="665" y="298" width="22" height="22" rx="3" fill="#9467bd"/>
  <text x="676" y="314" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white">🔒</text>

  <!-- Roll Freeze arrow -->
  <line x1="590" y1="400" x2="590" y2="450" stroke="#2ca02c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="606" y="430" font-family="Arial,sans-serif" font-size="11" fill="#2ca02c">roll_frozen.v1</text>

  <!-- Roll Freeze box -->
  <rect x="490" y="450" width="200" height="60" rx="8" fill="#dcfce7" stroke="#2ca02c" stroke-width="2.5"/>
  <text x="590" y="476" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ca02c">FREEZE Roll</text>
  <text x="590" y="496" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">COMMISSION_CHAIR + HSM sign</text>

  <!-- Form 34AD capture -->
  <rect x="750" y="300" width="200" height="100" rx="8" fill="#fef9c3" stroke="#ff7f0e" stroke-width="2"/>
  <text x="850" y="326" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff7f0e">Form 34A-D</text>
  <text x="850" y="346" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">embassy tallies</text>
  <text x="850" y="364" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">physical_pouch_rfid</text>
  <text x="850" y="384" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">DiasporaForm34AD entity</text>

  <!-- Arrow Kit to Form34AD -->
  <line x1="210" y1="225" x2="750" y2="325" stroke="#ff7f0e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="450" y="255" font-family="Arial,sans-serif" font-size="11" fill="#ff7f0e">gRPC: form34ad_received.v1</text>

  <!-- Pouch custody -->
  <rect x="750" y="450" width="200" height="80" rx="8" fill="#fce7f3" stroke="#d62728" stroke-width="2"/>
  <text x="850" y="476" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d62728">Ballot Pouch</text>
  <text x="850" y="496" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">RFID custody chain</text>
  <text x="850" y="514" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">BallotPouchCustody entity</text>

  <!-- Arrow Form34AD to Pouch -->
  <line x1="850" y1="400" x2="850" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="862" y="430" font-family="Arial,sans-serif" font-size="11" fill="#333">pouch_rfid link</text>

  <!-- Airlines / IATA external -->
  <rect x="990" y="450" width="160" height="60" rx="8" fill="#fff" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1070" y="476" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f7f7f">Airlines / IATA</text>
  <text x="1070" y="494" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">custody manifest (ext)</text>
  <line x1="950" y1="490" x2="990" y2="490" stroke="#7f7f7f" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-ext)"/>

  <!-- Foreign Ministry external -->
  <rect x="990" y="300" width="160" height="60" rx="8" fill="#fff" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1070" y="326" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f7f7f">Foreign Ministry</text>
  <text x="1070" y="344" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">diplomatic clearance (ext)</text>
  <line x1="950" y1="330" x2="990" y2="330" stroke="#7f7f7f" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-ext)"/>

  <!-- Nairobi HQ / RTS -->
  <rect x="490" y="580" width="460" height="90" rx="8" fill="#ede9fe" stroke="#9467bd" stroke-width="2"/>
  <text x="720" y="606" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9467bd">Nairobi HQ — RTS Back-End (M10)</text>
  <text x="720" y="626" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">form34a_captured.v1 → national aggregation pipeline</text>
  <text x="720" y="646" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">Merkle chain anchor (P05) + HSM counter-signature (P06)</text>
  <text x="720" y="660" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">Result declaration + Public Portal (M11)</text>

  <!-- HSM on HQ -->
  <rect x="925" y="578" width="22" height="22" rx="3" fill="#9467bd"/>
  <text x="936" y="594" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white">🔒</text>

  <!-- Arrows to HQ -->
  <line x1="590" y1="510" x2="650" y2="580" stroke="#2ca02c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="548" font-family="Arial,sans-serif" font-size="11" fill="#2ca02c">roll_frozen event</text>

  <line x1="850" y1="400" x2="780" y2="580" stroke="#ff7f0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840" y="510" font-family="Arial,sans-serif" font-size="11" fill="#ff7f0e">form34ad_received.v1</text>

  <line x1="850" y1="530" x2="820" y2="580" stroke="#d62728" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="558" font-family="Arial,sans-serif" font-size="11" fill="#d62728">pouch_custody_event.v1</text>

  <!-- Merkle / tlog -->
  <rect x="30" y="580" width="160" height="70" rx="8" fill="#fce7f3" stroke="#9467bd" stroke-width="2"/>
  <text x="110" y="604" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9467bd">Merkle Chain</text>
  <text x="110" y="622" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">P05 — tlog anchor</text>
  <text x="110" y="640" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">tamper-evidence</text>
  <rect x="175" y="578" width="22" height="22" rx="3" fill="#9467bd"/>
  <text x="186" y="594" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="white">🔒</text>
  <line x1="210" y1="615" x2="490" y2="630" stroke="#9467bd" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Public Portal downstream -->
  <rect x="30" y="690" width="160" height="60" rx="8" fill="#f3f4f6" stroke="#7f7f7f" stroke-width="1.5"/>
  <text x="110" y="716" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Public Portal</text>
  <text x="110" y="734" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#555">M11 — Form 34A-D feed</text>
  <line x1="110" y1="650" x2="110" y2="690" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kafka topic -->
  <rect x="490" y="700" width="460" height="50" rx="8" fill="#f3f4f6" stroke="#7f7f7f" stroke-width="1.5"/>
  <text x="720" y="722" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Kafka Topics: eel.diaspora.voter-roll.v1 / eel.diaspora.form34ad.v1 / eel.diaspora.ballot-pouch.v1</text>
  <text x="720" y="740" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#555">operational retention — signed — at-least-once idempotent</text>
  <line x1="720" y1="670" x2="720" y2="700" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="960" y="640" width="220" height="140" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="1070" y="660" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  <rect x="972" y="670" width="20" height="14" rx="2" fill="#dbeafe" stroke="#1f77b4"/>
  <text x="1000" y="682" font-family="Arial,sans-serif" font-size="12" fill="#333">Internal service</text>
  <rect x="972" y="690" width="20" height="14" rx="2" fill="#fff" stroke="#7f7f7f" stroke-dasharray="4,2"/>
  <text x="1000" y="702" font-family="Arial,sans-serif" font-size="12" fill="#333">External system</text>
  <rect x="972" y="710" width="20" height="14" rx="2" fill="#dcfce7" stroke="#2ca02c"/>
  <text x="1000" y="722" font-family="Arial,sans-serif" font-size="12" fill="#333">Data store / entity</text>
  <rect x="972" y="730" width="14" height="14" rx="2" fill="#9467bd"/>
  <text x="992" y="742" font-family="Arial,sans-serif" font-size="12" fill="white">🔒</text>
  <text x="1000" y="742" font-family="Arial,sans-serif" font-size="12" fill="#333">HSM / tlog crypto</text>
  <circle cx="982" cy="758" r="7" fill="#1f77b4"/>
  <text x="1000" y="762" font-family="Arial,sans-serif" font-size="12" fill="#333">Human persona</text>
</svg>
