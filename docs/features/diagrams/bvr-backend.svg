<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, sans-serif">
  <title>Module M02 BVR Backend</title>
  <desc>Biometric Voter Registration backend - batch ingest from kits, per-row validation, county-partitioned voter store, Merkle snapshots, and gazette publication.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="white"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#1a3a5c"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="white">M02 BVR Backend — Registration Ingest, Validation, and Gazette Publication</text>

  <!-- Commission Officer persona -->
  <circle cx="60" cy="100" r="14" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="114" x2="60" y2="155" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="125" x2="38" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="125" x2="82" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="155" x2="40" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="155" x2="80" y2="175" stroke="#333" stroke-width="2"/>
  <text x="60" y="192" font-size="12" text-anchor="middle" fill="#333">Commission</text>
  <text x="60" y="206" font-size="12" text-anchor="middle" fill="#333">Officer</text>

  <!-- Pipeline label -->
  <text x="620" y="100" font-size="15" text-anchor="middle" fill="#1a3a5c" font-weight="bold">Backend Processing Pipeline</text>

  <!-- 1. Batch Ingest -->
  <rect x="110" y="280" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7b1e" stroke-width="2"/>
  <text x="190" y="308" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Batch Ingest</text>
  <text x="190" y="326" font-size="12" text-anchor="middle" fill="white">POST /bvr/v1/</text>
  <text x="190" y="342" font-size="12" text-anchor="middle" fill="white">enrolments</text>
  <text x="190" y="358" font-size="11" text-anchor="middle" fill="#c8ffc8">gRPC + SVID mTLS</text>

  <!-- event label above arrow -->
  <text x="280" y="268" font-size="10" text-anchor="middle" fill="#9467bd">eel.bvr.enrolment_captured.v1</text>
  <line x1="270" y1="325" x2="330" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Per-row Validate -->
  <rect x="330" y="280" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7b1e" stroke-width="2"/>
  <text x="410" y="308" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Per-row</text>
  <text x="410" y="326" font-size="13" text-anchor="middle" fill="white">Validate</text>
  <text x="410" y="344" font-size="12" text-anchor="middle" fill="white">Schema + Dedup</text>
  <text x="410" y="360" font-size="11" text-anchor="middle" fill="#c8ffc8">Validation</text>

  <!-- Arrow up to ABIS -->
  <line x1="410" y1="280" x2="410" y2="195" stroke="#7f7f7f" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="446" y="235" font-size="10" fill="#7f7f7f">dedup check</text>

  <!-- ABIS (external, dashed) -->
  <rect x="310" y="140" width="200" height="60" rx="6" fill="none" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="410" y="165" font-size="13" text-anchor="middle" fill="#555" font-weight="bold">ABIS (M03)</text>
  <text x="410" y="183" font-size="12" text-anchor="middle" fill="#555">Dedup Check</text>

  <!-- Arrow from ABIS back -->
  <line x1="490" y1="170" x2="530" y2="325" stroke="#7f7f7f" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="528" y="245" font-size="10" fill="#7f7f7f">clear / dup</text>

  <line x1="490" y1="325" x2="550" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. County-partitioned Voters DB -->
  <!-- Cylinder shape using ellipses + rect -->
  <rect x="550" y="290" width="160" height="60" rx="0" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <ellipse cx="630" cy="290" rx="80" ry="16" fill="#ff9a3c" stroke="#c55a00" stroke-width="2"/>
  <ellipse cx="630" cy="350" rx="80" ry="16" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <text x="630" y="316" font-size="13" text-anchor="middle" fill="white" font-weight="bold">voters</text>
  <text x="630" y="334" font-size="12" text-anchor="middle" fill="white">(county-partitioned)</text>

  <!-- MinIO branch downward -->
  <line x1="630" y1="366" x2="630" y2="450" stroke="#ff7f0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="410" font-size="11" fill="#ff7f0e">ID doc scans</text>

  <rect x="540" y="450" width="180" height="55" rx="6" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <text x="630" y="473" font-size="13" text-anchor="middle" fill="white" font-weight="bold">MinIO</text>
  <text x="630" y="491" font-size="12" text-anchor="middle" fill="white">Document Store</text>

  <line x1="710" y1="325" x2="770" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Merkle Snapshot -->
  <rect x="770" y="285" width="150" height="80" rx="6" fill="#9467bd" stroke="#6a4a9c" stroke-width="2"/>
  <text x="845" y="313" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Merkle Root</text>
  <text x="845" y="331" font-size="13" text-anchor="middle" fill="white">Snapshot</text>
  <text x="845" y="352" font-size="10" text-anchor="middle" fill="#e0d0ff">eel.bvr.register_snapshot.v1</text>

  <line x1="920" y1="325" x2="975" y2="325" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. HSM Sign -->
  <rect x="975" y="285" width="150" height="80" rx="6" fill="#9467bd" stroke="#6a4a9c" stroke-width="2"/>
  <text x="1050" y="308" font-size="18" text-anchor="middle" fill="white">🔒</text>
  <text x="1050" y="330" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Commissioner</text>
  <text x="1050" y="348" font-size="13" text-anchor="middle" fill="white">HSM Sign</text>

  <line x1="1050" y1="365" x2="1050" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1090" y="400" font-size="10" fill="#9467bd">eel.bvr.gazette_published.v1</text>

  <!-- 6. Gazette -->
  <rect x="960" y="430" width="180" height="70" rx="6" fill="#2ca02c" stroke="#1e7b1e" stroke-width="2"/>
  <text x="1050" y="460" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Gazette Notice</text>
  <text x="1050" y="480" font-size="13" text-anchor="middle" fill="white">Publication</text>

  <!-- BVR Admin Django (planned, dashed) -->
  <rect x="110" y="480" width="200" height="65" rx="6" fill="none" stroke="#2ca02c" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="210" y="505" font-size="13" text-anchor="middle" fill="#2ca02c" font-weight="bold">BVR Admin</text>
  <text x="210" y="523" font-size="13" text-anchor="middle" fill="#2ca02c">(Django)</text>
  <text x="210" y="539" font-size="11" text-anchor="middle" fill="#7f7f7f">planned</text>

  <!-- Arrow from Officer to Batch Ingest -->
  <line x1="80" y1="155" x2="140" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,2"/>

  <!-- Legend -->
  <rect x="900" y="555" width="280" height="165" rx="6" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text x="910" y="577" font-size="13" font-weight="bold" fill="#333">Legend</text>
  <rect x="910" y="585" width="18" height="12" rx="2" fill="#1f77b4"/>
  <text x="934" y="596" font-size="12" fill="#333">Kit / Device</text>
  <rect x="910" y="603" width="18" height="12" rx="2" fill="#2ca02c"/>
  <text x="934" y="614" font-size="12" fill="#333">Service / Backend</text>
  <rect x="910" y="621" width="18" height="12" rx="2" fill="#ff7f0e"/>
  <text x="934" y="632" font-size="12" fill="#333">Database / Store</text>
  <rect x="910" y="639" width="18" height="12" rx="2" fill="#9467bd"/>
  <text x="934" y="650" font-size="12" fill="#333">Event / Message</text>
  <rect x="910" y="657" width="18" height="12" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4"/>
  <text x="934" y="668" font-size="12" fill="#333">External / Integration</text>
  <text x="910" y="705" font-size="12" fill="#333">&#x1F464; Human Persona</text>

</svg>
