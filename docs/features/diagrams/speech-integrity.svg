<text x="457" y="290" font-family="Arial,sans-serif" font-size="9" fill="#9467bd" text-anchor="middle">eel.speech.</text>
<text x="457" y="300" font-family="Arial,sans-serif" font-size="9" fill="#9467bd" text-anchor="middle">cib_cluster_</text>
<text x="457" y="310" font-family="Arial,sans-serif" font-size="9" fill="#9467bd" text-anchor="middle">detected.v1</text>

