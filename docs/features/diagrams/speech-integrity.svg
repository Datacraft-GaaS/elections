<text x="350" y="308" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Detector</text>
<text x="350" y="326" font-family="Arial,sans-serif" font-size="12" fill="#ddd" text-anchor="middle">(ML)</text>

