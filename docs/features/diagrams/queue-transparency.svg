<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<title>Module M19 Queue Transparency</title>
<desc>Queue transparency dashboard fusing kit throughput, clerk counts, computer vision headcount, and QR tap data into a real-time LiveView map with HSM-signed S.14A snapshots.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="20" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">M19 Queue Transparency</text>

<!-- Human personas -->
<text x="770" y="100" font-family="Arial,sans-serif" font-size="14" fill="#333">* Queue Monitor</text>
<text x="970" y="100" font-family="Arial,sans-serif" font-size="14" fill="#333">* ECC Controller</text>

<!-- Source 1: Kit Throughput -->
<rect x="30" y="150" width="160" height="70" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="110" y="181" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Kit Throughput</text>
<text x="110" y="199" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">(identification/hr)</text>

<!-- Source 2: Polling Clerk Check-in -->
<rect x="30" y="250" width="160" height="70" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="110" y="281" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Polling Clerk</text>
<text x="110" y="299" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">Check-in</text>

<!-- Source 3: CV Headcount (planned/dashed) -->
<rect x="30" y="350" width="160" height="70" rx="6" fill="none" stroke="#9467bd" stroke-dasharray="6 3" stroke-width="2"/>
<text x="110" y="381" font-family="Arial,sans-serif" font-size="14" fill="#9467bd" text-anchor="middle">CV Headcount</text>
<text x="110" y="399" font-family="Arial,sans-serif" font-size="13" fill="#9467bd" text-anchor="middle">(camera)</text>

<!-- Source 4: QR Tap Counter -->
<rect x="30" y="450" width="160" height="70" rx="6" fill="#1f77b4" stroke="#1a5c8a" stroke-width="2"/>
<text x="110" y="481" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">QR Tap</text>
<text x="110" y="499" font-family="Arial,sans-serif" font-size="13" fill="#cde" text-anchor="middle">Counter</text>

<!-- Arrows from sources to fusion engine -->
<line x1="190" y1="185" x2="278" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="190" y1="285" x2="278" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="190" y1="385" x2="278" y2="350" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="190" y1="485" x2="278" y2="365" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Event label on fusion -->
<text x="200" y="138" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.queue.headcount_updated.v1</text>
<line x1="285" y1="143" x2="285" y2="288" stroke="#9467bd" stroke-width="1" stroke-dasharray="3 2"/>

<!-- Fusion Engine -->
<rect x="280" y="290" width="170" height="100" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="365" y="325" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Snapshot</text>
<text x="365" y="343" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Fusion Engine</text>
<text x="365" y="361" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">(queue-svc)</text>

<!-- Arrow fusion to LiveView -->
<line x1="450" y1="330" x2="528" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<!-- Arrow fusion to HSM Sign -->
<line x1="450" y1="360" x2="528" y2="380" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- LiveView -->
<rect x="530" y="200" width="160" height="90" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="610" y="235" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Phoenix LiveView</text>
<text x="610" y="255" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Realtime Map</text>

<!-- HSM Sign -->
<rect x="530" y="340" width="160" height="90" rx="6" fill="#9467bd" stroke="#6e4e8e" stroke-width="2"/>
<text x="610" y="375" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">S.14A HSM Sign</text>
<text x="610" y="395" font-family="Arial,sans-serif" font-size="14" fill="white" text-anchor="middle">[Lock]</text>

<!-- Snapshot DB -->
<rect x="530" y="470" width="160" height="70" rx="6" fill="#ff7f0e" stroke="#c46000" stroke-width="2"/>
<text x="610" y="500" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">queue_snapshots</text>
<text x="610" y="520" font-family="Arial,sans-serif" font-size="13" fill="white" text-anchor="middle">DB</text>

<!-- Arrow HSM to DB -->
<line x1="610" y1="430" x2="610" y2="468" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Event: snapshot signed -->
<text x="490" y="460" font-family="Arial,sans-serif" font-size="12" fill="#9467bd">eel.queue.snapshot_signed.v1</text>

<!-- Arrows to outputs -->
<line x1="690" y1="245" x2="768" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="690" y1="385" x2="768" y2="345" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="690" y1="395" x2="768" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Public Map Portal -->
<rect x="770" y="200" width="160" height="70" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="850" y="231" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Public Map</text>
<text x="850" y="251" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">Portal</text>

<!-- ECC Dashboard -->
<rect x="770" y="300" width="160" height="70" rx="6" fill="none" stroke="#2ca02c" stroke-dasharray="6 3" stroke-width="2"/>
<text x="850" y="331" font-family="Arial,sans-serif" font-size="14" fill="#2ca02c" text-anchor="middle">ECC Dashboard</text>
<text x="850" y="351" font-family="Arial,sans-serif" font-size="13" fill="#2ca02c" text-anchor="middle">(M16)</text>

<!-- Gazette Notice -->
<rect x="770" y="400" width="160" height="70" rx="6" fill="#2ca02c" stroke="#1e7a1e" stroke-width="2"/>
<text x="850" y="431" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Gazette</text>
<text x="850" y="451" font-family="Arial,sans-serif" font-size="13" fill="#cec" text-anchor="middle">Notice</text>

<!-- Legend -->
<rect x="900" y="580" width="285" height="185" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="600" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="608" width="16" height="11" rx="2" fill="#1f77b4"/>
<text x="937" y="618" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="625" width="16" height="11" rx="2" fill="#2ca02c"/>
<text x="937" y="635" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="642" width="16" height="11" rx="2" fill="#ff7f0e"/>
<text x="937" y="652" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="659" width="16" height="11" rx="2" fill="#9467bd"/>
<text x="937" y="669" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="676" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/>
<text x="937" y="686" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="705" font-family="Arial,sans-serif" font-size="12" fill="#333">* Human Persona</text>
<text x="915" y="723" font-family="Arial,sans-serif" font-size="12" fill="#333">Lock = HSM Touchpoint</text>
</svg>
