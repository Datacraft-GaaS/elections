<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, sans-serif">
  <title>Module M01 BVR Device</title>
  <desc>Biometric Voter Registration device pipeline - kit hardware captures biometrics, validates quality, signs via HSM, queues offline, and syncs to bvr-svc backend.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f7f7f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="white"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#1a3a5c"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="white">M01 BVR Device — Biometric Voter Registration Kit Pipeline</text>

  <!-- Personas -->
  <!-- Registration Officer (top-left) -->
  <circle cx="60" cy="100" r="14" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="114" x2="60" y2="155" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="125" x2="38" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="125" x2="82" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="155" x2="40" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="155" x2="80" y2="175" stroke="#333" stroke-width="2"/>
  <text x="60" y="192" font-size="12" text-anchor="middle" fill="#333">Registration</text>
  <text x="60" y="206" font-size="12" text-anchor="middle" fill="#333">Officer</text>

  <!-- Citizen (bottom-left) -->
  <circle cx="60" cy="580" r="14" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="594" x2="60" y2="635" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="605" x2="38" y2="620" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="605" x2="82" y2="620" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="635" x2="40" y2="655" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="635" x2="80" y2="655" stroke="#333" stroke-width="2"/>
  <text x="60" y="672" font-size="12" text-anchor="middle" fill="#333">Citizen /</text>
  <text x="60" y="686" font-size="12" text-anchor="middle" fill="#333">Applicant</text>

  <!-- Row 1: Hardware components (y~200) -->
  <!-- Biometric Scanner -->
  <rect x="130" y="175" width="160" height="60" rx="6" fill="#1f77b4" stroke="#1a5f8a" stroke-width="2"/>
  <text x="210" y="200" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Biometric</text>
  <text x="210" y="218" font-size="14" text-anchor="middle" fill="white">Scanner</text>

  <!-- Camera -->
  <rect x="320" y="175" width="130" height="60" rx="6" fill="#1f77b4" stroke="#1a5f8a" stroke-width="2"/>
  <text x="385" y="200" font-size="14" text-anchor="middle" fill="white" font-weight="bold">Camera</text>
  <text x="385" y="218" font-size="14" text-anchor="middle" fill="white">(face capture)</text>

  <!-- GNSS -->
  <rect x="480" y="175" width="130" height="60" rx="6" fill="#1f77b4" stroke="#1a5f8a" stroke-width="2"/>
  <text x="545" y="200" font-size="14" text-anchor="middle" fill="white" font-weight="bold">GNSS</text>
  <text x="545" y="218" font-size="14" text-anchor="middle" fill="white">(location)</text>

  <!-- ABIS-lite (planned, dashed) -->
  <rect x="640" y="155" width="150" height="60" rx="6" fill="#1f77b4" stroke="#9467bd" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="715" y="178" font-size="13" text-anchor="middle" fill="white" font-weight="bold">ABIS-lite</text>
  <text x="715" y="196" font-size="12" text-anchor="middle" fill="white">(on-device)</text>
  <text x="715" y="210" font-size="11" text-anchor="middle" fill="#ffd700">planned</text>

  <!-- Arrow: Officer to Kit App -->
  <line x1="80" y1="140" x2="130" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,2"/>

  <!-- Arrow: Citizen to Kit App -->
  <line x1="80" y1="620" x2="130" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,2"/>

  <!-- Arrows from hardware to Flutter BVR App -->
  <line x1="210" y1="235" x2="340" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="235" x2="385" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="235" x2="430" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from ABIS-lite to Quality Gates -->
  <line x1="715" y1="215" x2="580" y2="358" stroke="#9467bd" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- Row 2 pipeline boxes (y~340-420) -->

  <!-- Flutter BVR Kit App -->
  <rect x="130" y="340" width="190" height="80" rx="6" fill="#1f77b4" stroke="#1a5f8a" stroke-width="2"/>
  <text x="225" y="368" font-size="13" text-anchor="middle" fill="white" font-weight="bold">kit-sdk-flutter</text>
  <text x="225" y="384" font-size="13" text-anchor="middle" fill="white">BVR Kit App</text>
  <text x="225" y="400" font-size="11" text-anchor="middle" fill="#cce5ff">(offline-first PWA shell)</text>

  <!-- Arrow to Quality Gates -->
  <line x1="320" y1="380" x2="380" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="372" font-size="11" text-anchor="middle" fill="#555">biometrics</text>

  <!-- Quality Gates -->
  <rect x="380" y="340" width="190" height="80" rx="6" fill="#2ca02c" stroke="#1e7b1e" stroke-width="2"/>
  <text x="475" y="368" font-size="13" text-anchor="middle" fill="white" font-weight="bold">NFIQ2 + Face</text>
  <text x="475" y="384" font-size="13" text-anchor="middle" fill="white">Quality Gate</text>
  <text x="475" y="400" font-size="11" text-anchor="middle" fill="#c8ffc8">(min quality score)</text>

  <!-- Arrow to HSM Sign -->
  <line x1="570" y1="380" x2="630" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="372" font-size="11" text-anchor="middle" fill="#555">passed</text>

  <!-- HSM Sign -->
  <rect x="630" y="340" width="175" height="80" rx="6" fill="#9467bd" stroke="#6a4a9c" stroke-width="2"/>
  <text x="717" y="363" font-size="18" text-anchor="middle" fill="white">🔒</text>
  <text x="717" y="384" font-size="13" text-anchor="middle" fill="white" font-weight="bold">HSM Sign</text>
  <text x="717" y="400" font-size="13" text-anchor="middle" fill="white">(Ed25519)</text>

  <!-- Arrow to Offline Queue with event label -->
  <line x1="805" y1="380" x2="860" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="832" y="368" font-size="10" text-anchor="middle" fill="#9467bd">eel.bvr.</text>
  <text x="832" y="379" font-size="10" text-anchor="middle" fill="#9467bd">enrolment_</text>
  <text x="832" y="390" font-size="10" text-anchor="middle" fill="#9467bd">captured.v1</text>

  <!-- Offline Queue (Isar DB) -->
  <rect x="860" y="340" width="175" height="80" rx="6" fill="#ff7f0e" stroke="#c55a00" stroke-width="2"/>
  <text x="947" y="368" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Isar DB Queue</text>
  <text x="947" y="384" font-size="13" text-anchor="middle" fill="white">(offline-first)</text>
  <text x="947" y="400" font-size="11" text-anchor="middle" fill="#ffe0c0">on-device store</text>

  <!-- Arrow down then to bvr-svc -->
  <line x1="947" y1="420" x2="947" y2="470" stroke="#333" stroke-width="1.5"/>
  <line x1="947" y1="470" x2="1060" y2="470" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1003" y="462" font-size="11" text-anchor="middle" fill="#555">sync on connect</text>

  <!-- Kit Attestation daemon (below Kit App) -->
  <rect x="130" y="470" width="190" height="60" rx="6" fill="#1f77b4" stroke="#1a5f8a" stroke-width="2"/>
  <text x="225" y="496" font-size="13" text-anchor="middle" fill="white" font-weight="bold">Kit Attestation</text>
  <text x="225" y="512" font-size="13" text-anchor="middle" fill="white">Daemon</text>

  <!-- Arrow from attestation daemon -->
  <line x1="320" y1="500" x2="1060" y2="530" stroke="#9467bd" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
  <text x="680" y="525" font-size="10" text-anchor="middle" fill="#9467bd">eel.bvr.kit_attested.v1</text>

  <!-- bvr-svc (dashed border = target) -->
  <rect x="1060" y="440" width="120" height="80" rx="6" fill="#2ca02c" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1120" y="468" font-size="13" text-anchor="middle" fill="white" font-weight="bold">bvr-svc</text>
  <text x="1120" y="484" font-size="13" text-anchor="middle" fill="white">(M02)</text>
  <text x="1120" y="500" font-size="11" text-anchor="middle" fill="#c8ffc8">target</text>

  <!-- Legend -->
  <rect x="900" y="600" width="280" height="165" rx="6" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text x="910" y="622" font-size="13" font-weight="bold" fill="#333">Legend</text>
  <rect x="910" y="630" width="18" height="12" rx="2" fill="#1f77b4"/>
  <text x="934" y="641" font-size="12" fill="#333">Kit / Device</text>
  <rect x="910" y="648" width="18" height="12" rx="2" fill="#2ca02c"/>
  <text x="934" y="659" font-size="12" fill="#333">Service / Backend</text>
  <rect x="910" y="666" width="18" height="12" rx="2" fill="#ff7f0e"/>
  <text x="934" y="677" font-size="12" fill="#333">Database / Store</text>
  <rect x="910" y="684" width="18" height="12" rx="2" fill="#9467bd"/>
  <text x="934" y="695" font-size="12" fill="#333">Event / Message</text>
  <rect x="910" y="702" width="18" height="12" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4"/>
  <text x="934" y="713" font-size="12" fill="#333">External / Integration</text>
  <text x="910" y="750" font-size="12" fill="#333">&#x1F464; Human Persona</text>

  <!-- Flow label -->
  <text x="600" y="290" font-size="16" text-anchor="middle" fill="#1a3a5c" font-weight="bold">Device Pipeline Flow</text>
  <line x1="130" y1="300" x2="1060" y2="300" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>

</svg>
