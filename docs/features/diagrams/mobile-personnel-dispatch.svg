<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">M33 Mobile Personnel Dispatch — Architecture Diagram</title>
  <desc id="desc">250k check-ins per 90 minutes via write-behind Kafka and Valkey, GPS plus cell plus Wi-Fi spoof triangulation, 15-minute pings, and payroll trigger.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f8f9fa"/>
  <text x="600" y="36" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">M33 Mobile Personnel Dispatch</text>
  <text x="600" y="56" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#555">250k check-ins / 90 min · write-behind Kafka + Valkey · GPS spoof guard · 15-min pings · payroll trigger</text>

  <!-- Personnel persona -->
  <circle cx="100" cy="115" r="22" fill="#1f77b4"/>
  <text x="100" y="150" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#333">Staff (250k)</text>
  <text x="100" y="165" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555">officers · clerks · security</text>

  <circle cx="300" cy="115" r="22" fill="#9467bd"/>
  <text x="300" y="150" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#333">Dispatch</text>
  <text x="300" y="165" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#555">Supervisor</text>

  <!-- Dispatch App -->
  <rect x="30" y="190" width="240" height="100" rx="8" fill="#dbeafe" stroke="#1f77b4" stroke-width="2"/>
  <text x="150" y="216" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f77b4">Dispatch App</text>
  <text x="150" y="236" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">Flutter — offline-first</text>
  <text x="150" y="256" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">QR check-in at station gate</text>
  <text x="150" y="276" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">15-min heartbeat ping</text>
  <text x="150" y="286" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">PersonnelCheckIn entity</text>
  <line x1="100" y1="137" x2="100" y2="190" stroke="#1f77b4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Check-in API -->
  <rect x="310" y="190" width="300" height="100" rx="8" fill="#dbeafe" stroke="#1f77b4" stroke-width="2"/>
  <text x="460" y="216" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f77b4">Check-In API</text>
  <text x="460" y="236" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">POST /v1/dispatch/checkins</text>
  <text x="460" y="256" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">rate: 250k/90min peak capacity</text>
  <text x="460" y="276" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">Rust axum — async burst buffer</text>
  <text x="460" y="286" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">personnel_checkin.v1 emitted</text>
  <line x1="270" y1="240" x2="310" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Write-behind: Kafka + Valkey -->
  <rect x="310" y="340" width="600" height="110" rx="8" fill="#fef9c3" stroke="#ff7f0e" stroke-width="2.5"/>
  <text x="610" y="366" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff7f0e">Write-Behind Buffer: Kafka + Valkey</text>
  <text x="610" y="386" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">Kafka topic: eel.dispatch.checkin.v1 (250k msg burst)</text>
  <text x="610" y="406" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">Valkey (Redis-compat): real-time presence cache — TTL 30 min</text>
  <text x="610" y="426" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">consumer group: dispatch-writer → PostgreSQL T1-consensus</text>
  <text x="610" y="442" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">Kafka partitions: station_code hash — ordered per station</text>
  <line x1="460" y1="290" x2="460" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- GPS / location spoof guard -->
  <rect x="650" y="190" width="320" height="120" rx="8" fill="#fce7f3" stroke="#d62728" stroke-width="2"/>
  <text x="810" y="216" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d62728">Location Spoof Guard</text>
  <text x="810" y="236" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">GPS + cell-tower ID + Wi-Fi AP hash</text>
  <text x="810" y="256" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">triangulation delta &lt; 200m to station</text>
  <text x="810" y="276" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">mock_location flag detection</text>
  <text x="810" y="296" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">LOCATION_SPOOF_ALERT on violation</text>
  <text x="810" y="306" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">SpoofCheckResult entity</text>
  <line x1="610" y1="240" x2="650" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 15-min heartbeat -->
  <rect x="310" y="500" width="280" height="90" rx="8" fill="#dcfce7" stroke="#2ca02c" stroke-width="2"/>
  <text x="450" y="526" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ca02c">15-Min Heartbeat</text>
  <text x="450" y="546" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">POST /v1/dispatch/heartbeat</text>
  <text x="450" y="566" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">absence &gt; 30 min → MIA alert</text>
  <text x="450" y="582" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">personnel_heartbeat.v1</text>
  <line x1="450" y1="450" x2="450" y2="500" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Payroll trigger -->
  <rect x="630" y="500" width="280" height="90" rx="8" fill="#dcfce7" stroke="#2ca02c" stroke-width="2"/>
  <text x="770" y="526" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ca02c">Payroll Trigger</text>
  <text x="770" y="546" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">EOD attendance report</text>
  <text x="770" y="566" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">shift_hours = checkin + heartbeats</text>
  <text x="770" y="582" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">payroll_trigger.v1 → HR/Payroll (M?)</text>
  <line x1="770" y1="450" x2="770" y2="500" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Supervisor dashboard -->
  <rect x="310" y="640" width="280" height="80" rx="8" fill="#ede9fe" stroke="#9467bd" stroke-width="2"/>
  <text x="450" y="666" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9467bd">Dispatch Dashboard</text>
  <text x="450" y="686" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">Phoenix LiveView — real-time map</text>
  <text x="450" y="706" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">staff presence per station</text>
  <text x="450" y="716" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">DISPATCH_SUPERVISOR role</text>
  <line x1="300" y1="137" x2="400" y2="640" stroke="#9467bd" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="450" y1="590" x2="450" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- External: HR payroll -->
  <rect x="970" y="500" width="190" height="70" rx="8" fill="#fff" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1065" y="526" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f7f7f">HR / Payroll</text>
  <text x="1065" y="546" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#7f7f7f">IPPD / iHRIS (external)</text>
  <text x="1065" y="560" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">webhook: attendance data</text>
  <line x1="910" y1="545" x2="970" y2="545" stroke="#7f7f7f" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Alert box -->
  <rect x="970" y="340" width="190" height="80" rx="8" fill="#fce7f3" stroke="#d62728" stroke-width="2"/>
  <text x="1065" y="366" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#d62728">MIA / Spoof Alert</text>
  <text x="1065" y="386" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">ECC console notification</text>
  <text x="1065" y="406" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#333">supervisor + security</text>
  <text x="1065" y="416" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#7f7f7f">mia_alert.v1</text>
  <line x1="910" y1="260" x2="1030" y2="340" stroke="#d62728" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="590" x2="1020" y2="340" stroke="#d62728" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- Kafka label -->
  <rect x="630" y="640" width="340" height="60" rx="8" fill="#f3f4f6" stroke="#7f7f7f" stroke-width="1.5"/>
  <text x="800" y="666" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Kafka: eel.dispatch.checkin.v1 · heartbeat.v1 · payroll_trigger.v1 · mia_alert.v1</text>
  <text x="800" y="686" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#555">operational — signed — at-least-once</text>
  <line x1="770" y1="590" x2="800" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="640" width="250" height="150" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="155" y="660" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  <rect x="42" y="670" width="20" height="14" rx="2" fill="#dbeafe" stroke="#1f77b4"/>
  <text x="70" y="682" font-family="Arial,sans-serif" font-size="12" fill="#333">Check-in / app</text>
  <rect x="42" y="690" width="20" height="14" rx="2" fill="#fef9c3" stroke="#ff7f0e"/>
  <text x="70" y="702" font-family="Arial,sans-serif" font-size="12" fill="#333">Kafka + Valkey buffer</text>
  <rect x="42" y="710" width="20" height="14" rx="2" fill="#fce7f3" stroke="#d62728"/>
  <text x="70" y="722" font-family="Arial,sans-serif" font-size="12" fill="#333">Spoof guard / alert</text>
  <rect x="42" y="730" width="20" height="14" rx="2" fill="#dcfce7" stroke="#2ca02c"/>
  <text x="70" y="742" font-family="Arial,sans-serif" font-size="12" fill="#333">Heartbeat / payroll</text>
  <rect x="42" y="750" width="20" height="14" rx="2" fill="#fff" stroke="#7f7f7f" stroke-dasharray="4,2"/>
  <text x="70" y="762" font-family="Arial,sans-serif" font-size="12" fill="#333">External: HR / payroll</text>
  <circle cx="52" cy="782" r="7" fill="#1f77b4"/>
  <text x="70" y="786" font-family="Arial,sans-serif" font-size="12" fill="#333">Staff persona (250k)</text>
</svg>
