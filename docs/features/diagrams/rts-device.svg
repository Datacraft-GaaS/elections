<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<title>Module M08 RTS Device</title>
<desc>Results Transmission System device pipeline - kit scans Form 34A, OCR preview, agent signature via HSM, SMS/USSD fallback codec, and offline queue sync.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="800" fill="white"/>

<!-- Title bar -->
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="600" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Module M08 RTS Device</text>

<!-- Human Persona: Presiding Officer (left) -->
<circle cx="55" cy="200" r="14" fill="none" stroke="#333" stroke-width="2"/>
<line x1="55" y1="214" x2="55" y2="245" stroke="#333" stroke-width="2"/>
<line x1="55" y1="225" x2="35" y2="240" stroke="#333" stroke-width="2"/>
<line x1="55" y1="225" x2="75" y2="240" stroke="#333" stroke-width="2"/>
<line x1="55" y1="245" x2="38" y2="265" stroke="#333" stroke-width="2"/>
<line x1="55" y1="245" x2="72" y2="265" stroke="#333" stroke-width="2"/>
<text x="55" y="283" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Presiding</text>
<text x="55" y="298" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Officer</text>
<line x1="85" y1="230" x2="135" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Box 1: KIEMS Kit (RTS mode) -->
<rect x="140" y="300" width="150" height="80" rx="6" fill="#1f77b4" stroke="#1558a0" stroke-width="2" filter="url(#shadow)"/>
<text x="215" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">KIEMS Kit</text>
<text x="215" y="350" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">(RTS mode)</text>

<!-- Arrow Box1 to Box2 -->
<line x1="290" y1="340" x2="355" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 2: Scan Form 34A -->
<rect x="360" y="300" width="150" height="80" rx="6" fill="#1f77b4" stroke="#1558a0" stroke-width="2" filter="url(#shadow)"/>
<text x="435" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Scan Form 34A</text>
<text x="435" y="350" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">(camera)</text>

<!-- Arrow Box2 to Box3 -->
<line x1="510" y1="340" x2="575" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 3: OCR Preview + Agent Review -->
<rect x="580" y="300" width="160" height="80" rx="6" fill="#2ca02c" stroke="#1e8a1e" stroke-width="2" filter="url(#shadow)"/>
<text x="660" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">OCR Preview</text>
<text x="660" y="348" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">+ Agent Review</text>

<!-- Human Persona: Party Agent (below OCR box) -->
<circle cx="660" cy="440" r="14" fill="none" stroke="#333" stroke-width="2"/>
<line x1="660" y1="454" x2="660" y2="485" stroke="#333" stroke-width="2"/>
<line x1="660" y1="465" x2="640" y2="480" stroke="#333" stroke-width="2"/>
<line x1="660" y1="465" x2="680" y2="480" stroke="#333" stroke-width="2"/>
<line x1="660" y1="485" x2="643" y2="505" stroke="#333" stroke-width="2"/>
<line x1="660" y1="485" x2="677" y2="505" stroke="#333" stroke-width="2"/>
<text x="660" y="523" font-family="Arial, sans-serif" font-size="13" fill="#333" text-anchor="middle">Party Agent</text>
<text x="660" y="538" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">reviews OCR preview</text>
<line x1="660" y1="380" x2="660" y2="425" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Arrow Box3 to Box4 -->
<line x1="740" y1="340" x2="800" y2="340" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Box 4: HSM Sign (Ed25519) -->
<rect x="805" y="300" width="160" height="80" rx="6" fill="#9467bd" stroke="#7a50a8" stroke-width="2" filter="url(#shadow)"/>
<text x="885" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">HSM Sign</text>
<text x="885" y="348" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">(Ed25519) &#128274;</text>

<!-- Arrow Box4 to Box5 (dashed, planned fallback) -->
<line x1="965" y1="340" x2="1025" y2="340" stroke="#555" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow)"/>

<!-- Box 5: SMS/USSD Fallback Codec (dashed border = planned) -->
<rect x="1030" y="300" width="155" height="80" rx="6" fill="#2ca02c" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="8 4" filter="url(#shadow)"/>
<text x="1107" y="328" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">SMS/USSD</text>
<text x="1107" y="348" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Fallback Codec</text>
<text x="1107" y="366" font-family="Arial, sans-serif" font-size="11" fill="#d0f0d0" text-anchor="middle">(planned)</text>

<!-- Arrow down from Box4 to Offline Isar Queue -->
<line x1="885" y1="380" x2="885" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Event label on arrow from HSM to queue -->
<text x="960" y="408" font-family="Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">eel.rts.form34a_signed.v1</text>

<!-- Box 6: Offline Isar Queue -->
<rect x="805" y="425" width="160" height="70" rx="6" fill="#ff7f0e" stroke="#c96000" stroke-width="2" filter="url(#shadow)"/>
<text x="885" y="453" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Offline Isar</text>
<text x="885" y="473" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Queue</text>

<!-- Arrow right from Offline Queue to rts-svc label -->
<line x1="965" y1="460" x2="1060" y2="460" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1065" y="435" width="120" height="50" rx="6" fill="#2ca02c" stroke="#1e8a1e" stroke-width="2"/>
<text x="1125" y="456" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">rts-svc</text>
<text x="1125" y="474" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">(M10)</text>

<!-- Label: sync -->
<text x="1010" y="452" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">sync</text>

<!-- Section flow label -->
<text x="500" y="600" font-family="Arial, sans-serif" font-size="13" fill="#7f7f7f" text-anchor="middle">Kit scans form, OCR reviewed, HSM-signed result queued offline then synced to rts-svc</text>

<!-- Legend -->
<rect x="900" y="635" width="285" height="155" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="655" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="663" width="16" height="11" rx="2" fill="#1f77b4"/><text x="937" y="673" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="680" width="16" height="11" rx="2" fill="#2ca02c"/><text x="937" y="690" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="697" width="16" height="11" rx="2" fill="#ff7f0e"/><text x="937" y="707" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="714" width="16" height="11" rx="2" fill="#9467bd"/><text x="937" y="724" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="731" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/><text x="937" y="741" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="762" font-family="Arial,sans-serif" font-size="12" fill="#333">&#9900; Human Persona</text>
<text x="915" y="779" font-family="Arial,sans-serif" font-size="12" fill="#333">&#128274; Crypto / HSM Touchpoint</text>
</svg>
