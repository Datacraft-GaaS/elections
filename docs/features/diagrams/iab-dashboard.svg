<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<title>Module M15 IAB Dashboard</title>
<desc>Independent Audit Board dashboard - Phoenix LiveView with hardware-key auth, tlog witness cosign, and L1-L4 escalation ladder.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
  </marker>
</defs>
<!-- Background -->
<rect width="1200" height="800" fill="#ffffff"/>
<!-- Title bar -->
<rect x="0" y="0" width="1200" height="60" fill="#1a3a5c"/>
<text x="20" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">M15 IAB Dashboard</text>

<!-- Section label -->
<text x="20" y="95" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#1a3a5c">Independent Audit Board: Inputs, Auth, and Escalation</text>

<!-- Left column inputs -->

<!-- tlog Feed -->
<rect x="30" y="150" width="160" height="70" rx="6" fill="#9467bd" stroke="#7a4fa0" stroke-width="2"/>
<text x="110" y="178" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">tlog Feed</text>
<text x="110" y="196" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">(Merkle proofs)</text>

<!-- RTS Results -->
<rect x="30" y="250" width="160" height="70" rx="6" fill="#2ca02c" stroke="#1e7020" stroke-width="2"/>
<text x="110" y="278" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">RTS Results</text>
<text x="110" y="296" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">(M10)</text>

<!-- BVR Snapshots -->
<rect x="30" y="350" width="160" height="70" rx="6" fill="#2ca02c" stroke="#1e7020" stroke-width="2"/>
<text x="110" y="378" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">BVR Snapshots</text>
<text x="110" y="396" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">(M02)</text>

<!-- Reproducibility Bundle -->
<rect x="30" y="450" width="160" height="70" rx="6" fill="#9467bd" stroke="#7a4fa0" stroke-width="2"/>
<text x="110" y="475" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Reproducibility</text>
<text x="110" y="493" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Bundle (M14)</text>

<!-- Arrows from inputs to dashboard -->
<line x1="190" y1="185" x2="275" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="285" x2="275" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="385" x2="275" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="485" x2="275" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Phoenix LiveView IAB Dashboard (center) -->
<rect x="280" y="280" width="180" height="100" rx="6" fill="#2ca02c" stroke="#1e7020" stroke-width="2"/>
<text x="370" y="310" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Phoenix LiveView</text>
<text x="370" y="328" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">IAB Dashboard</text>

<!-- Arrow: Dashboard -> Hardware Key Auth -->
<line x1="460" y1="310" x2="535" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Arrow: Dashboard -> tlog Witness -->
<line x1="460" y1="330" x2="535" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Arrow: Dashboard -> L1-L4 Escalation -->
<line x1="460" y1="360" x2="535" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Hardware Key Auth (FIDO2) -->
<rect x="540" y="200" width="160" height="80" rx="6" fill="#9467bd" stroke="#7a4fa0" stroke-width="2"/>
<text x="620" y="228" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Hardware Key</text>
<text x="620" y="246" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">Auth (FIDO2)</text>
<text x="620" y="264" font-family="Arial,sans-serif" font-size="14" fill="#ffdd88" text-anchor="middle">[Lock]</text>

<!-- tlog Witness Cosign -->
<rect x="540" y="320" width="160" height="80" rx="6" fill="#9467bd" stroke="#7a4fa0" stroke-width="2"/>
<text x="620" y="350" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">tlog Witness</text>
<text x="620" y="368" font-family="Arial,sans-serif" font-size="13" fill="#ddd" text-anchor="middle">Cosign</text>
<text x="620" y="386" font-family="Arial,sans-serif" font-size="14" fill="#ffdd88" text-anchor="middle">[Lock]</text>

<!-- L1-L4 Escalation Ladder -->
<rect x="540" y="440" width="160" height="80" rx="6" fill="#d62728" stroke="#a01e1e" stroke-width="2"/>
<text x="620" y="468" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">L1-L4 Escalation</text>
<text x="620" y="486" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Ladder</text>

<!-- Escalation targets (dashed = external) -->
<line x1="700" y1="470" x2="755" y2="430" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
<line x1="700" y1="490" x2="755" y2="510" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

<!-- the Commission Commission -->
<rect x="760" y="400" width="150" height="60" rx="6" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="2"/>
<text x="835" y="428" font-family="Arial,sans-serif" font-size="14" fill="#7f7f7f" text-anchor="middle">the Commission Commission</text>

<!-- AG Office -->
<rect x="760" y="480" width="150" height="60" rx="6" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="2"/>
<text x="835" y="516" font-family="Arial,sans-serif" font-size="14" fill="#7f7f7f" text-anchor="middle">AG Office</text>

<!-- Human personas -->
<text x="960" y="150" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">* IAB Member</text>
<text x="960" y="168" font-family="Arial,sans-serif" font-size="12" fill="#555">reviews audit trail</text>

<text x="960" y="250" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">* IAB Chairperson</text>
<text x="960" y="268" font-family="Arial,sans-serif" font-size="12" fill="#555">authorizes escalation</text>

<!-- Legend -->
<rect x="900" y="635" width="285" height="155" rx="6" fill="#f9f9f9" stroke="#bbb" stroke-width="1"/>
<text x="915" y="655" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">Legend</text>
<rect x="915" y="663" width="16" height="11" rx="2" fill="#1f77b4"/><text x="937" y="673" font-family="Arial,sans-serif" font-size="12" fill="#333">Kit / Device</text>
<rect x="915" y="680" width="16" height="11" rx="2" fill="#2ca02c"/><text x="937" y="690" font-family="Arial,sans-serif" font-size="12" fill="#333">Service / Backend</text>
<rect x="915" y="697" width="16" height="11" rx="2" fill="#ff7f0e"/><text x="937" y="707" font-family="Arial,sans-serif" font-size="12" fill="#333">Database / Store</text>
<rect x="915" y="714" width="16" height="11" rx="2" fill="#9467bd"/><text x="937" y="724" font-family="Arial,sans-serif" font-size="12" fill="#333">Event / Crypto</text>
<rect x="915" y="731" width="16" height="11" rx="2" fill="none" stroke="#7f7f7f" stroke-dasharray="4 2" stroke-width="1.5"/><text x="937" y="741" font-family="Arial,sans-serif" font-size="12" fill="#333">External / Planned</text>
<text x="915" y="760" font-family="Arial,sans-serif" font-size="12" fill="#333">* Human Persona</text>
<text x="915" y="778" font-family="Arial,sans-serif" font-size="12" fill="#333">Lock = HSM / Crypto Touchpoint</text>
</svg>
