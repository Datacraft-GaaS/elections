# Statement of Applicability (SoA)
# ISO 27001:2022 Clause 6.1.3(d)
# All 93 Annex A controls declared applicable or not applicable with justification.
# implementation_status: implemented | partial | planned | not_applicable

soa_version: "1.0"
date: "[YYYY-MM-DD]"
approved_by: "[DG_NAME], Director-General, the Commission"

controls:
