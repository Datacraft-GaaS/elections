    threat: "Targeted cyberattack (APT, ransomware, SQL injection)"
    vulnerability: "Internet-facing API; complexity of ABIS vendor software"
    likelihood: 2
    impact: 5
    risk_score: 10
    treatment: mitigate
    controls:
      - "TDE + column-level encryption for biometric fields (A.8.24)"
      - "SpiceDB RBAC + purpose-of-processing header (A.5.15)"
      - "ASVS L3 penetration testing (A.8.29)"
      - "PIIRestricted<T> type wrapper prevents accidental logging (A.8.11)"
