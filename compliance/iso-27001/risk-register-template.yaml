# Risk Register Template
# ISO 27001:2022 Clause 6.1.2
# Scale: likelihood and impact 1 (lowest) to 5 (highest); risk_score = likelihood * impact
# treatment: mitigate | accept | transfer | avoid

risk_register_version: "1.0"
date: "[YYYY-MM-DD]"
