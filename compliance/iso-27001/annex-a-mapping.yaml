      - "docs/adr/0007-authn-authz-secrets.md"
    policies:
      - "Keycloak at auth.eel.example manages all human identities; service identities via SPIFFE/SPIRE SVIDs"
    notes: "MFA enforced for all privileged accounts; SVID rotation every 24 hours"

  - control_id: "A.5.17"
