      - "packages/eel-telemetry-rs/"
    policies:
      - "Five-tier data classification: A, B, C, D, E per ADR-0016"
    notes: "Classification enforced via Rust type wrappers PIIRestricted<T>, PIISensitive<T>, PIIPublic<T>"

  - control_id: "A.5.13"
    title: "Labelling of information"
    applicable: true
    implementation_status: implemented
    platform_artefacts:
      - "packages/eel-telemetry-rs/"
      - "packages/event-schemas/"
    policies:
      - "Data class label in event envelope per ADR-0015"
    notes: "Every event envelope carries data-class label; telemetry labels Tier in trace attributes"

  - control_id: "A.5.14"
    title: "Information transfer"
    applicable: true
    implementation_status: implemented
    platform_artefacts:
      - "packages/eel-authn-rs/"
      - "packages/eel-crypto-rs/"
    policies:
      - "All transfers over mTLS; Tier A transfers additionally signed with HSM key"
    notes: "Kit transmissions use HSM-signed payloads over telco VPN; inter-service mTLS enforced by service mesh"

  - control_id: "A.5.15"
    title: "Access control"
    applicable: true
    implementation_status: implemented
    platform_artefacts:
      - "packages/authz-schema/"
      - "docs/adr/0007-authn-authz-secrets.md"
    policies:
      - "Access control policy per ADR-0007: JWT + SpiceDB + purpose-of-processing header"
    notes: "Least-privilege enforced via SpiceDB ZED schema; every reveal() call emits audit event"

  - control_id: "A.5.16"
    title: "Identity management"
    applicable: true
    implementation_status: implemented
    platform_artefacts:
