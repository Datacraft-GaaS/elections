      - id: "7.5.3"
        question: "Are ISMS records protected from unintended modification or loss?"
        rating: null
        evidence: "services/transparency-svc/ Merkle log; git branch protection"

  - clause: "8"
    title: "Operation"
    items:
      - id: "8.1.1"
        question: "Are operational plans and controls documented for all ISMS processes?"
        rating: null
        evidence: "docs/runbooks/; operations/"

      - id: "8.1.2"
        question: "Are outsourced processes within the scope controlled and monitored?"
        rating: null
        evidence: "integrations/; compliance/ipr-handover/"

      - id: "8.2.1"
        question: "Is a risk assessment performed at planned intervals or when significant changes occur?"
        rating: null
        evidence: "risk-register-template.yaml (review_date column)"

      - id: "8.2.2"
        question: "Are risk assessment results documented and retained?"
        rating: null
        evidence: "compliance/iso-27001/risk-register-template.yaml"

      - id: "8.3.1"
        question: "Is a risk treatment plan implemented and results documented?"
        rating: null
        evidence: "risk-register-template.yaml (controls, residual_score columns)"

      - id: "8.3.2"
        question: "Is evidence retained that the risk treatment plan has been carried out?"
        rating: null
        evidence: null

  - clause: "9"
    title: "Performance evaluation"
    items:
      - id: "9.1.1"
        question: "Are ISMS monitoring and measurement processes defined and implemented?"
        rating: null
        evidence: "Grafana dashboards; PrometheusRule SLO alerts"

      - id: "9.1.2"
        question: "Are monitoring results evaluated and retained as evidence?"
        rating: null
        evidence: null

      - id: "9.1.3"
        question: "Are information security metrics reported to management at planned intervals?"
        rating: null
        evidence: "compliance/iso-27001/management-review-agenda.md"

      - id: "9.2.1"
        question: "Are internal audits conducted at planned intervals?"
        rating: null
        evidence: null

      - id: "9.2.2"
        question: "Is the internal audit programme documented and approved?"
        rating: null
        evidence: null

      - id: "9.2.3"
        question: "Do auditors maintain objectivity and impartiality (no self-audit)?"
        rating: null
        evidence: null

      - id: "9.2.4"
        question: "Are audit results reported to relevant management?"
        rating: null
        evidence: null

      - id: "9.2.5"
        question: "Are audit records retained?"
        rating: null
        evidence: null

      - id: "9.3.1"
        question: "Does top management conduct management reviews at planned intervals?"
        rating: null
        evidence: "compliance/iso-27001/management-review-agenda.md"

      - id: "9.3.2"
        question: "Do management reviews include all required inputs (incidents, audit results, objectives, feedback)?"
        rating: null
        evidence: "management-review-agenda.md"

      - id: "9.3.3"
        question: "Are management review outputs (decisions and actions) documented?"
        rating: null
        evidence: null

  - clause: "10"
    title: "Improvement"
    items:
      - id: "10.1.1"
        question: "Is there a process for identifying and managing nonconformities?"
        rating: null
        evidence: null

      - id: "10.1.2"
        question: "When a nonconformity occurs, is it corrected and the cause determined?"
        rating: null
        evidence: null

      - id: "10.1.3"
        question: "Are corrective actions implemented and their effectiveness reviewed?"
        rating: null
        evidence: null

      - id: "10.1.4"
        question: "Are nonconformity and corrective action records retained?"
        rating: null
        evidence: null

      - id: "10.2.1"
        question: "Is there evidence of continual improvement of the ISMS?"
        rating: null
        evidence: null

  - clause: "annex-a-spot-check"
    title: "Annex A controls spot check (sample)"
    items:
      - id: "SC.1"
        question: "Is the information security policy current (reviewed within the last 12 months)?"
        rating: null
        evidence: null

      - id: "SC.2"
        question: "Are privileged access rights reviewed at least every 6 months?"
        rating: null
        evidence: "packages/authz-schema/ git log"

      - id: "SC.3"
        question: "Is MFA enforced for all administrative access to production systems?"
        rating: null
        evidence: "Keycloak configuration; platform/keycloak/"

      - id: "SC.4"
        question: "Are backups tested by restoring them at least annually?"
        rating: null
        evidence: "chaos/ DR scenarios; pgBackRest restore test records"

      - id: "SC.5"
        question: "Are vulnerability scans (SAST/SCA/DAST) run on every pull request?"
        rating: null
        evidence: "CI pipeline configuration"

      - id: "SC.6"
        question: "Is Tier A data absent from all log files (confirmed by log-scanner CI pass)?"
        rating: null
        evidence: "CI log-scanner job results"

      - id: "SC.7"
        question: "Are all kit devices enrolled in MDM?"
        rating: null
        evidence: "operations/mdm/ device inventory"

      - id: "SC.8"
        question: "Is the ODPC breach notification procedure tested via an annual drill?"
        rating: null
        evidence: "compliance/dpa-toolkit/drill-records/"

      - id: "SC.9"
        question: "Are all ASVS L3 requirements for election-critical modules mapped to passing tests?"
        rating: null
        evidence: "tools/asvs-check/ report output"

      - id: "SC.10"
        question: "Is the transparency Merkle log producing signed roots and are they publicly verifiable?"
        rating: null
        evidence: "services/transparency-svc/ operation; public root publication"
