# Internal Audit Checklist
# ISO 27001:2022 Clauses 4 through 10
# Auditor completes rating for each item: yes | partial | no | na
# Evidence column records document/artefact/interview reference

checklist_version: "1.0"
audit_date: "[YYYY-MM-DD]"
auditor: "[AUDITOR_NAME]"
auditee: "the Commission ICT Department"
scope: "eel platform ISMS"

sections:

  - clause: "4"
    title: "Context of the organisation"
    items:
      - id: "4.1.1"
        question: "Has the organisation identified internal and external issues relevant to the ISMS?"
        rating: null
        evidence: null

      - id: "4.1.2"
        question: "Is there a documented analysis of external issues (regulatory, competitive, technological)?"
        rating: null
        evidence: null

      - id: "4.2.1"
        question: "Have interested parties been identified and their requirements documented?"
        rating: null
        evidence: "isms-scope.md section 5"

      - id: "4.2.2"
        question: "Are interested party requirements reviewed at least annually?"
        rating: null
        evidence: null

      - id: "4.3.1"
        question: "Is the ISMS scope documented and approved?"
        rating: null
        evidence: "compliance/iso-27001/isms-scope.md"

      - id: "4.3.2"
        question: "Does the scope include all relevant assets, locations, and activities?"
        rating: null
        evidence: "isms-scope.md sections 3 and 4"

      - id: "4.3.3"
        question: "Are interfaces and dependencies with external parties documented in the scope?"
        rating: null
        evidence: "isms-scope.md section 6"

  - clause: "5"
    title: "Leadership"
    items:
      - id: "5.1.1"
        question: "Is there evidence of management commitment to the ISMS (signed policy, management review minutes)?"
        rating: null
        evidence: null

      - id: "5.1.2"
        question: "Has management ensured that ISMS objectives are established and aligned with organisational strategy?"
        rating: null
        evidence: null

      - id: "5.2.1"
        question: "Is there a documented information security policy approved by top management?"
        rating: null
        evidence: "docs/policies/ (to be authored)"

      - id: "5.2.2"
        question: "Is the information security policy communicated to all relevant personnel?"
        rating: null
        evidence: null

      - id: "5.3.1"
        question: "Are ISMS roles and responsibilities defined and assigned?"
        rating: null
        evidence: "packages/authz-schema/; RACI matrix"

      - id: "5.3.2"
        question: "Is a Data Protection Officer appointed and registered with the ODPC?"
        rating: null
        evidence: null

  - clause: "6"
    title: "Planning"
    items:
      - id: "6.1.1"
        question: "Is there a documented risk assessment process for the ISMS?"
        rating: null
        evidence: "compliance/iso-27001/risk-register-template.yaml"

      - id: "6.1.2"
        question: "Has a risk assessment been conducted covering all in-scope assets?"
        rating: null
        evidence: "risk-register-template.yaml"

      - id: "6.1.3"
        question: "Has the Statement of Applicability been completed and approved?"
        rating: null
        evidence: "compliance/iso-27001/soa.yaml"

      - id: "6.1.4"
        question: "Does the SoA include justification for inclusion and exclusion of all Annex A controls?"
        rating: null
        evidence: "soa.yaml"

      - id: "6.1.5"
        question: "Is a risk treatment plan documented for all unacceptable risks?"
        rating: null
        evidence: "risk-register-template.yaml (treatment column)"

      - id: "6.1.6"
        question: "Have risk owners been assigned and risk acceptance criteria defined?"
        rating: null
        evidence: "risk-register-template.yaml (owner column)"

      - id: "6.2.1"
        question: "Are ISMS objectives established, measurable, and monitored?"
        rating: null
        evidence: null

      - id: "6.2.2"
        question: "Is there a plan for achieving ISMS objectives?"
        rating: null
        evidence: null

      - id: "6.3.1"
        question: "Is there a process for planning and managing changes to the ISMS?"
        rating: null
        evidence: "platform/argocd/ (GitOps); PR review process"

  - clause: "7"
    title: "Support"
    items:
      - id: "7.1.1"
        question: "Has the organisation determined and provided the resources needed for the ISMS?"
        rating: null
        evidence: null

      - id: "7.2.1"
        question: "Is there a process to determine competence requirements for ISMS roles?"
