        evidence: null

      - id: "7.2.2"
        question: "Is there evidence that personnel are competent (training records, certifications)?"
        rating: null
        evidence: "services/training-svc/ M38 LMS records"

      - id: "7.3.1"
        question: "Are all relevant personnel aware of the information security policy and their obligations?"
        rating: null
        evidence: null

      - id: "7.3.2"
        question: "Are all relevant personnel aware of how they contribute to the ISMS?"
        rating: null
        evidence: null

      - id: "7.4.1"
        question: "Is there a documented communication plan for internal and external ISMS communications?"
        rating: null
        evidence: null

      - id: "7.5.1"
        question: "Is there a documented information procedure for creating and updating ISMS documents?"
        rating: null
        evidence: null

      - id: "7.5.2"
