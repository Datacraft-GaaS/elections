[workspace]
resolver = "2"
members = [
  "packages/eel-*-rs",
  "packages/verifier-rs",
  "packages/service-template-rs",
  "services/*/crates/*",
  "services/abis-svc/tools/*",
  "tools/*",
]
exclude = [
  # softhsm, spectral: placeholder-only tools (src/lib.rs contains no implementation);
  # their manifests inherit edition from a workspace root, so standalone cargo check fails
  "tools/softhsm",
  "tools/spectral",
  "services/bvr-svc/crates/bvr-api",
  "services/bvr-svc/crates/bvr-domain",
  "services/bvr-svc/crates/bvr-batch",
  "services/bvr-svc/crates/target",
  "services/rts-svc/crates/rts-integration-tests",
  # abis-fp-vendor-peak, bft-tally, fhe-tally: implemented in HARD-B, included as members
  # telemetry-analytics: has nested [workspace] declaration (TELE-D in-flight)
  "services/ai-platform-svc/crates/telemetry-analytics",
  # support-admin-svc: nested workspace owns these crates
  "services/support-admin-svc/crates/budget",
  "services/support-admin-svc/crates/payroll",
  "services/support-admin-svc/crates/archive",
  "services/support-admin-svc/crates/special-voter",
  "services/support-admin-svc/crates/intent",
]
# Cargo tolerates glob members that match no paths yet.
# New crates under these globs are picked up automatically.

[workspace.package]
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
rust-version = "1.83"
authors     = ["eel contributors"]
repository  = "https://gitea.internal/eel/eel"

# ---------------------------------------------------------------------------
# Shared dependency versions, pin here, reference with { workspace = true }
# ---------------------------------------------------------------------------
[workspace.dependencies]
# HTTP / gRPC
axum            = { version = "0.8",  features = ["macros", "tokio", "multipart"] }
axum-extra      = { version = "0.10", features = ["typed-header"] }
tower           = { version = "0.5",  features = ["full"] }
tower-http      = { version = "0.6",  features = ["full"] }
tonic           = { version = "0.12", features = ["tls", "transport"] }
tonic-build     = { version = "0.12" }

# HTTP client (added by WP-3.10 to fix missing workspace dep from WP-3.8)
reqwest         = { version = "0.12", features = ["json"] }

# Async runtime
tokio           = { version = "1",    features = ["full"] }
tokio-stream    = { version = "0.1",  features = ["sync"] }

# Database
sqlx            = { version = "0.8",  features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# OpenAPI
utoipa          = { version = "4",    features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Serialization
serde           = { version = "1",    features = ["derive"] }
serde_json      = { version = "1" }
serde_cbor      = { version = "0.11" }

# Observability
tracing              = { version = "0.1" }
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry        = { version = "0.27" }
opentelemetry_sdk    = { version = "0.27" }
opentelemetry-otlp   = { version = "0.27", features = ["grpc-tonic"] }

# Validation
garde           = { version = "0.20", features = ["derive", "full"] }

# Messaging
rdkafka         = { version = "0.37", features = ["cmake-build", "ssl"] }

# Cache
fred            = { version = "9",    features = ["i-all"] }

# Search
opensearch      = { version = "2" }

# Crypto / HSM
cryptoki        = { version = "0.7" }
sigstore        = { version = "0.10", features = ["bundle", "rekor"] }
ed25519-dalek   = { version = "2",    features = ["serde", "rand_core"] }
oqs             = { version = "0.11", features = ["ml_kem", "ml_dsa", "dilithium", "kyber"] }

# IDs
uuid            = { version = "1",    features = ["v4", "v7", "serde"] }
blake3          = { version = "1" }
hmac            = { version = "0.12", features = ["std"] }

# Text normalization (BVR NFC name/ID normalization)
unicode-normalization = { version = "0.1" }

# ONNX Runtime (deep-learning fingerprint matcher)
ort             = { version = "2.0.0-rc.13" }

# ZK proof (HARD-2: Groth16 over BLS12-381)
ark-groth16     = { version = "0.4" }
ark-bls12-381   = { version = "0.4" }
ark-ff          = { version = "0.4" }
ark-ec          = { version = "0.4" }
ark-serialize   = { version = "0.4" }
ark-relations   = { version = "0.4" }
ark-r1cs-std    = { version = "0.4" }

# Error handling
thiserror       = { version = "2" }
anyhow          = { version = "1" }

# Time
chrono          = { version = "0.4",  features = ["serde"] }
chrono-tz       = { version = "0.10" }

# Geo / spatial
geo             = { version = "0.28" }
geojson         = { version = "0.24", features = ["geo-types"] }

# Archive
tar             = { version = "0.4" }

# Async utilities
futures         = { version = "0.3" }

# Byte / encoding utilities
bytes           = { version = "1" }
flate2          = { version = "1" }
hex             = { version = "0.4" }
sha2            = { version = "0.10" }
base64          = { version = "0.22" }

# gRPC / Protobuf
prost           = { version = "0.13" }
prost-build     = { version = "0.13" }

# Benchmarking
criterion       = { version = "0.5", features = ["html_reports"] }

# Testing
testcontainers          = { version = "0.23" }
testcontainers-modules  = { version = "0.11", features = ["postgres", "kafka", "redis"] }
rstest                  = { version = "0.23" }
proptest                = { version = "1" }

# Serialization extras (added by WP-4.3)
ciborium        = { version = "0.2" }

# Compression (added by WP-4.3)
zstd            = { version = "0.13" }

# Intra-workspace crates (added by WP-3.10 to fix missing workspace dep from WP-3.8)
kit-attest      = { path = "services/biometric-edge-svc/crates/kit-attest" }

# Biometric edge integration tests inherit this from the root workspace.
edge-api        = { path = "services/biometric-edge-svc/crates/edge-api" }

# Intra-workspace packages (added by WP-4.3 to fix missing workspace deps)
eel-events-rs     = { path = "packages/eel-events-rs" }
eel-hlc-rs        = { path = "packages/eel-hlc-rs" }
eel-resilience-rs = { path = "packages/eel-resilience-rs" }
eel-api-server-rs = { path = "packages/eel-api-server-rs" }
eel-outbox-rs     = { path = "packages/eel-outbox-rs" }

# Test-trace marker (WP-0.5 completeness): no-op #[trace(...)] attribute so the
# trace audit can map tests to requirements without altering behavior.
eel-trace-rs = { path = "packages/eel-trace-rs" }

# BVI backend crates (M06): bvi-api inherits these from the root workspace.
bvi-config  = { path = "services/bvi-svc/crates/bvi-config" }
bvi-turnout = { path = "services/bvi-svc/crates/bvi-turnout" }
bvi-register-anchor = { path = "services/bvi-svc/crates/bvi-register-anchor" }
bvi-anomaly = { path = "services/bvi-svc/crates/bvi-anomaly" }

# CLI tooling
clap            = { version = "4",    features = ["derive", "env"] }
indicatif       = { version = "0.17" }

# Deps added for eel-abis-reports (WP-reports)
tera              = { version = "1" }
csv               = { version = "1" }
printpdf          = { version = "0.7" }
rust_xlsxwriter   = { version = "0.98" }
parquet           = { version = "54", features = ["arrow"] }
arrow-array       = { version = "54" }
arrow-schema      = { version = "54" }
plotters          = { version = "0.3" }
croner            = { version = "2" }
prometheus        = { version = "0.13", features = ["process"] }
tokio-util        = { version = "0.7", features = ["full"] }
tempfile          = { version = "3" }
httpmock          = { version = "0.7" }

# Ad-hoc reports (RPT-D): DOCX + Markdown renderers + SQL AST
docx-rs           = { version = "0.4" }
pulldown-cmark    = { version = "0.12" }
sqlparser         = { version = "0.53", features = ["visitor"] }

# Reports publication + delivery (RPT-B)
lettre            = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }
ssh2              = { version = "0.9" }

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------
[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
opt-level     = 3

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1

# ---------------------------------------------------------------------------
# cargo-hakari workspace-hack configuration
# ---------------------------------------------------------------------------
[workspace.metadata.hakari]
hakari-package = "eel-workspace-hack"
unify-target-host = "replicate-target-on-host"
output-single-feature = true
