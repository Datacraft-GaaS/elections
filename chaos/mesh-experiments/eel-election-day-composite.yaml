# Chaos Mesh v2.7+ Workflow -- composite election-day resilience experiment
# Bundles: site partition + 30% loss + latency + StressChaos on rts-svc
# Apply: kubectl apply -f eel-election-day-composite.yaml
#
# Purpose: Simulate the worst-case election-day conditions simultaneously.
#   RTO goal: rts-svc write path recovers within 30 min of any single fault.
#   RPO goal: <= 5 min data loss at rts-svc after partition heals.
#
# Recovery: kubectl delete -f eel-election-day-composite.yaml
#   Then run: tools/dr-failover/target/release/eel-dr-failover report --drill election-day
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: eel-election-day-composite
  namespace: chaos-testing
  labels:
    eel.io/experiment: election-day-composite
    eel.io/wave: "5.9"
spec:
  entry: entry
  templates:
    - name: entry
      templateType: Serial
      deadline: 30m
      children:
        - stress-rts
        - network-degrade
        - partition-brief

    - name: stress-rts
      templateType: StressChaos
      deadline: 10m
      stressChaos:
        mode: all
        selector:
          namespaces: [eel-prod]
          labelSelectors:
            app: rts-svc
        stressors:
          cpu:
            workers: 4
            load: 80
          memory:
            workers: 2
            size: "256MB"

    - name: network-degrade
      templateType: NetworkChaos
      deadline: 10m
      networkChaos:
        action: netem
        mode: all
        selector:
          namespaces: [eel-prod]
        netem:
          loss: "30"
          latency: "2000ms"
          correlation: "25"

    - name: partition-brief
      templateType: NetworkChaos
      deadline: 5m
      networkChaos:
        action: partition
        mode: all
        selector:
          namespaces: [eel-prod]
          labelSelectors:
            site: primary
        direction: both
        target:
          mode: all
          selector:
            namespaces: [eel-prod]
            labelSelectors:
              site: mirror
