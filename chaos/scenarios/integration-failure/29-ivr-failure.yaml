# Integration failure scenario 29: IVR system down; voter assistance calls reroute to support-admin
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=ivr-29; M3_device_id=N/A (integration).
# Tests: ivr adapter unavailability; system fallback to vprs-svc outbox; no data loss past sync commit.
# Role: validate ivr adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when ivr offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos pod-kill all on app=ivr.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-int-29-ivr
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-29
    eel.io/target: ivr
    eel.io/dependent: vprs-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=ivr-29"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: pod-kill
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: ivr
  gracePeriod: 0
