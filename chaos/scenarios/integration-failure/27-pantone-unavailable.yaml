# Integration failure scenario 27: Pantone color API down; manual color reference used
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=pantone-27; M3_device_id=N/A (integration).
# Tests: pantone adapter unavailability; system fallback to inventory-svc outbox; no data loss past sync commit.
# Role: validate pantone adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when pantone offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos loss all on app=pantone.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-int-27-pantone
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-27
    eel.io/target: pantone
    eel.io/dependent: inventory-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=pantone-27"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: loss
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: pantone
  gracePeriod: 0
