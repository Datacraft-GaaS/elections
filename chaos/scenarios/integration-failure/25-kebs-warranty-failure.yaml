# Integration failure scenario 25: KEBS warranty API down; device certification deferred
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=kebs-warranty-25; M3_device_id=N/A (integration).
# Tests: kebs-warranty adapter unavailability; system fallback to inventory-svc outbox; no data loss past sync commit.
# Role: validate kebs-warranty adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when kebs-warranty offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos loss all on app=kebs-warranty.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-int-25-kebs-warranty
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-25
    eel.io/target: kebs-warranty
    eel.io/dependent: inventory-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=kebs-warranty-25"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: loss
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: kebs-warranty
  gracePeriod: 0
