# Integration failure scenario 12: KBC SFTP file drop unavailable; payroll runs deferred
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=kbc-sftp-12; M3_device_id=N/A (integration).
# Tests: kbc-sftp adapter unavailability; system fallback to support-admin-svc outbox; no data loss past sync commit.
# Role: validate kbc-sftp adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when kbc-sftp offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos pod-kill all on app=kbc-sftp.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-int-12-kbc-sftp
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-12
    eel.io/target: kbc-sftp
    eel.io/dependent: support-admin-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=kbc-sftp-12"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: pod-kill
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: kbc-sftp
  gracePeriod: 0
