# Integration failure scenario 33: Satellite link offline; communications fallback to radio
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=satellite-33; M3_device_id=N/A (integration).
# Tests: satellite adapter unavailability; system fallback to ecc-svc outbox; no data loss past sync commit.
# Role: validate satellite adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when satellite offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos loss all on app=satellite.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-int-33-satellite
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-33
    eel.io/target: satellite
    eel.io/dependent: ecc-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=satellite-33"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: loss
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: satellite
  gracePeriod: 0
