# Integration failure scenario 04: IPFS cluster half-down; Merkle root recomputed from remaining
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=ipfs-04; M3_device_id=N/A (integration).
# Tests: ipfs adapter unavailability; system fallback to transparency-svc outbox; no data loss past sync commit.
# Role: validate ipfs adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when ipfs offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos pod-kill fixed-percent on app=ipfs.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-int-04-ipfs
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-04
    eel.io/target: ipfs
    eel.io/dependent: transparency-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=ipfs-04"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: pod-kill
  mode: fixed-percent
  value: 50
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: ipfs
  gracePeriod: 0
