# Integration failure scenario 02: USSD gateway fully unavailable
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=telco-ussd-02; M3_device_id=N/A (integration).
# Tests: telco-ussd adapter unavailability; system fallback to vprs-svc outbox; no data loss past sync commit.
# Role: validate telco-ussd adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when telco-ussd offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos loss all on app=telco-ussd.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-int-02-telco-ussd
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-02
    eel.io/target: telco-ussd
    eel.io/dependent: vprs-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=telco-ussd-02"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: loss
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: telco-ussd
  gracePeriod: 0
