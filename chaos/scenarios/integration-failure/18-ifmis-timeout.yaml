# Integration failure scenario 18: IFMIS gateway slow; budget reconciliation paused
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=ifmis-18; M3_device_id=N/A (integration).
# Tests: ifmis adapter unavailability; system fallback to support-admin-svc outbox; no data loss past sync commit.
# Role: validate ifmis adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when ifmis offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos delay all on app=ifmis.
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: eel-int-18-ifmis
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-18
    eel.io/target: ifmis
    eel.io/dependent: support-admin-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=ifmis-18"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: delay
  mode: all
  value: 10s
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: ifmis
  gracePeriod: 0
