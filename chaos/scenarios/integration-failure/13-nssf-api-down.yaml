# Integration failure scenario 13: NSSF API offline; pension contributions accumulate in outbox
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=nssf-13; M3_device_id=N/A (integration).
# Tests: nssf adapter unavailability; system fallback to support-admin-svc outbox; no data loss past sync commit.
# Role: validate nssf adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when nssf offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos loss all on app=nssf.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-int-13-nssf
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-13
    eel.io/target: nssf
    eel.io/dependent: support-admin-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=nssf-13"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: loss
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: nssf
  gracePeriod: 0
