# Integration failure scenario 10: IPRS adapter offline; manual voter lookup; audit log of manual entries
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=iprs-10; M3_device_id=N/A (integration).
# Tests: iprs adapter unavailability; system fallback to vprs-svc outbox; no data loss past sync commit.
# Role: validate iprs adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when iprs offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos pod-kill all on app=iprs.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-int-10-iprs
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-10
    eel.io/target: iprs
    eel.io/dependent: vprs-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=iprs-10"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: pod-kill
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: iprs
  gracePeriod: 0
