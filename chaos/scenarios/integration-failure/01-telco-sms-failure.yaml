# Integration failure scenario 01: Telco SMS adapter offline; voter SMS notifications fail
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=telco-sms-01; M3_device_id=N/A (integration).
# Tests: telco-sms adapter unavailability; system fallback to voter-education-cms outbox; no data loss past sync commit.
# Role: validate telco-sms adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when telco-sms offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos pod-kill all on app=telco-sms.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-int-01-telco-sms
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-01
    eel.io/target: telco-sms
    eel.io/dependent: voter-education-cms
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=telco-sms-01"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: pod-kill
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: telco-sms
  gracePeriod: 0
