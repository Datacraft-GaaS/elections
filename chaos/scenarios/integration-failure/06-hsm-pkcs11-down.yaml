# Integration failure scenario 06: HSM (PKCS11) unavailable; signing queues; no unsigned entries committed
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=hsm-pkcs11-06; M3_device_id=N/A (integration).
# Tests: hsm-pkcs11 adapter unavailability; system fallback to transparency-svc outbox; no data loss past sync commit.
# Role: validate hsm-pkcs11 adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when hsm-pkcs11 offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos pod-kill all on app=hsm-pkcs11.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-int-06-hsm-pkcs11
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-06
    eel.io/target: hsm-pkcs11
    eel.io/dependent: transparency-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=hsm-pkcs11-06"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: pod-kill
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: hsm-pkcs11
  gracePeriod: 0
