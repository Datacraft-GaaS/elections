# Integration failure scenario 24: Card manufacturer integration offline; physical card production paused
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=card-manufacturer-24; M3_device_id=N/A (integration).
# Tests: card-manufacturer adapter unavailability; system fallback to inventory-svc outbox; no data loss past sync commit.
# Role: validate card-manufacturer adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when card-manufacturer offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos pod-kill all on app=card-manufacturer.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-int-24-card-manufacturer
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-24
    eel.io/target: card-manufacturer
    eel.io/dependent: inventory-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=card-manufacturer-24"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: pod-kill
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: card-manufacturer
  gracePeriod: 0
