# Integration failure scenario 23: CBK bank API down; reconciliation deferred
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=cbk-23; M3_device_id=N/A (integration).
# Tests: cbk adapter unavailability; system fallback to support-admin-svc outbox; no data loss past sync commit.
# Role: validate cbk adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when cbk offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos abort 100% on app=cbk.
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: eel-int-23-cbk
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-23
    eel.io/target: cbk
    eel.io/dependent: support-admin-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=cbk-23"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: abort
  mode: 100%
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: cbk
  gracePeriod: 0
