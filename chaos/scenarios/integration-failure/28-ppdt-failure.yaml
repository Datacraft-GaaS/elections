# Integration failure scenario 28: PPdt integration offline; dispute resolution paused
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=ppdt-28; M3_device_id=N/A (integration).
# Tests: ppdt adapter unavailability; system fallback to support-admin-svc outbox; no data loss past sync commit.
# Role: validate ppdt adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when ppdt offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos loss all on app=ppdt.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-int-28-ppdt
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-28
    eel.io/target: ppdt
    eel.io/dependent: support-admin-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=ppdt-28"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: loss
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: ppdt
  gracePeriod: 0
