# Integration failure scenario 32: Mpesa standby gateway slow; payments delayed
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=mpesa-standby-32; M3_device_id=N/A (integration).
# Tests: mpesa-standby adapter unavailability; system fallback to support-admin-svc outbox; no data loss past sync commit.
# Role: validate mpesa-standby adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when mpesa-standby offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos delay all on app=mpesa-standby.
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: eel-int-32-mpesa-standby
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-32
    eel.io/target: mpesa-standby
    eel.io/dependent: support-admin-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=mpesa-standby-32"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: delay
  mode: all
  value: 5s
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: mpesa-standby
  gracePeriod: 0
