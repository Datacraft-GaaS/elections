# Integration failure scenario 20: eCourt integration down; election petition service degraded
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=ecourt-20; M3_device_id=N/A (integration).
# Tests: ecourt adapter unavailability; system fallback to governance-svc outbox; no data loss past sync commit.
# Role: validate ecourt adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when ecourt offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos pod-kill all on app=ecourt.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-int-20-ecourt
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-20
    eel.io/target: ecourt
    eel.io/dependent: governance-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=ecourt-20"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: pod-kill
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: ecourt
  gracePeriod: 0
