# Integration failure scenario 30: Airline cargo API down; physical asset transit manual tracking
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=airline-cargo-30; M3_device_id=N/A (integration).
# Tests: airline-cargo adapter unavailability; system fallback to inventory-svc outbox; no data loss past sync commit.
# Role: validate airline-cargo adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when airline-cargo offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos loss all on app=airline-cargo.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-int-30-airline-cargo
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-30
    eel.io/target: airline-cargo
    eel.io/dependent: inventory-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=airline-cargo-30"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: loss
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: airline-cargo
  gracePeriod: 0
