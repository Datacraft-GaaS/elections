# Integration failure scenario 21: NLLB translation service down; static translations served
# M5 audit chain: auditId=UUID7; proofHash=sha256; correlation_key=nllb-21; M3_device_id=N/A (integration).
# Tests: nllb adapter unavailability; system fallback to training-svc outbox; no data loss past sync commit.
# Role: validate nllb adapter graceful degradation.
# Purpose: prove EEL system does not lose signed events when nllb offline.
# Functionality: apply chaos; observe adapter; verify outbox drains on recovery.
# Config: chaos-testing namespace; PodChaos loss all on app=nllb.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-int-21-nllb
  namespace: chaos-testing
  labels:
    eel.io/scenario: integration-failure-21
    eel.io/target: nllb
    eel.io/dependent: training-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=nllb-21"
    eel.io/adrs: "ADR-0009,ADR-0019,ADR-0022"
spec:
  action: loss
  mode: all
  
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: nllb
  gracePeriod: 0
