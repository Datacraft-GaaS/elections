# Chaos Mesh v2.7+ + SPIRE CLI -- SVID revocation scenario
# Apply: kubectl apply -f eel-svid-revocation.yaml  THEN run the revocation step below.
#
# What it tests: A revoked SVID is refused within <= 60 s (EC-IDN-01);
#   affected workload re-attests and obtains a new SVID; no plaintext fallback.
#
# Step 1 -- inject network delay to SPIRE server from rts-svc to surface retry timing:
# Step 2 -- revoke the rts-svc SVID:
#   kubectl -n spire exec deploy/spire-server -- \
#     spire-server entry update -entryID <rts-entry-id> -ttl 1
#   (Force TTL=1s; SPIRE propagates revocation via JWKS endpoint within rotation period.)
#
# Recovery procedure:
#   1. kubectl delete -f eel-svid-revocation.yaml
#   2. Restore entry TTL: spire-server entry update -entryID <id> -ttl 3600
#   3. Confirm rts-svc obtained fresh SVID: spire-agent api fetch x509
#   4. Check that quarantine event was emitted to transparency log.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-svid-revocation-delay
  namespace: chaos-testing
  labels:
    eel.io/scenario: svid-revocation
    eel.io/target: rts-svc
    eel.io/wave: "5.9"
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: rts-svc
  delay:
    latency: "500ms"
    correlation: "0"
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - spire
      labelSelectors:
        app: spire-server
  duration: "3m"
