# Chaos Mesh v2.7+ — Scenario 63: Queue pipeline overflow
# M5 audit chain (ADR-0022/0023): auditId=UUID7; proofHash=sha256; correlation_key=queue-svc-63; M3_device_id embedded.
# Role: test resilience of queue-svc against Queue overflow; Purpose: verify SLO/recovery; Functionality: inject fault; Config: apply/remove via kubectl.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: eel-scenario-63
  namespace: chaos-testing
  labels:
    eel.io/scenario: chaos-scenario-63
    eel.io/target: queue-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=queue-svc-63"
    eel.io/adrs: "ADR-0004,ADR-0006,ADR-0009,ADR-0010"
spec:
  action: mem
  mode: 90%
  value: ""
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: queue-svc
  gracePeriod: 0
