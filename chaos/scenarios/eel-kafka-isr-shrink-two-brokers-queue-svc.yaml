# Chaos Mesh v2.7+ — Scenario 40: Kafka ISR shrink to 2 brokers
# M5 audit chain (ADR-0022/0023): auditId=UUID7; proofHash=sha256; correlation_key=queue-svc-40; M3_device_id embedded.
# Role: test resilience of queue-svc against ISR shrink; Purpose: verify SLO/recovery; Functionality: inject fault; Config: apply/remove via kubectl.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-scenario-40
  namespace: chaos-testing
  labels:
    eel.io/scenario: chaos-scenario-40
    eel.io/target: queue-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=queue-svc-40"
    eel.io/adrs: "ADR-0004,ADR-0006,ADR-0009,ADR-0010"
spec:
  action: pod-kill
  mode: fixed-percent
  value: "50"
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: queue-svc
  gracePeriod: 0
