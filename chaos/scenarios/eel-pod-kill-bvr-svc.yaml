# Chaos Mesh v2.7+ PodChaos -- pod-kill for bvr-svc
# Apply: kubectl apply -f eel-pod-kill-bvr-svc.yaml
# Recovery: Kubernetes restarts the pod automatically via the Deployment/StatefulSet controller.
#   Verify: kubectl -n eel-prod get pods -l app=bvr-svc --watch
#   SLO check: assert pod Ready within 60s (T2) or 30s (T1).
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-pod-kill-bvr-svc
  namespace: chaos-testing
  labels:
    eel.io/scenario: pod-kill
    eel.io/target: bvr-svc
    eel.io/wave: "5.9"
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: bvr-svc
  gracePeriod: 0
  # Run once on schedule or trigger manually. Remove scheduler for ad-hoc.
  # scheduler:
  #   cron: "@every 720h"
