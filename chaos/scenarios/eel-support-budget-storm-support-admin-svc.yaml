# Chaos Mesh v2.7+ — Scenario 65: Support admin budget storm
# M5 audit chain (ADR-0022/0023): auditId=UUID7; proofHash=sha256; correlation_key=support-admin-svc-65; M3_device_id embedded.
# Role: test resilience of support-admin-svc against Budget storm; Purpose: verify SLO/recovery; Functionality: inject fault; Config: apply/remove via kubectl.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: eel-scenario-65
  namespace: chaos-testing
  labels:
    eel.io/scenario: chaos-scenario-65
    eel.io/target: support-admin-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=support-admin-svc-65"
    eel.io/adrs: "ADR-0004,ADR-0006,ADR-0009,ADR-0010"
spec:
  action: cpu
  mode: 100%
  value: ""
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: support-admin-svc
  gracePeriod: 0
