# Chaos Mesh v2.7+ NetworkChaos -- site partition primary <-> mirror
# Apply: kubectl apply -f eel-site-partition-primary-mirror.yaml
#
# What it tests: Patroni fences the mirror-side primary; no split-brain; MirrorMaker 2 lag
#   alert fires; RPO <= 5 min measured against last committed WAL LSN.
#
# Recovery procedure:
#   1. kubectl delete -f eel-site-partition-primary-mirror.yaml   (remove partition)
#   2. Verify Patroni state: patronictl list -- one primary, no zombies.
#   3. Confirm MirrorMaker 2 lag < 10 s: kafka-consumer-groups.sh --describe --group mirrormaker2
#   4. Run linearizability check: tools/dr-failover/target/release/eel-dr-failover report
#   5. If split-brain detected: IMMEDIATE escalation -- do NOT heal partition; follow
#      docs/runbooks/dr-failover-rts-svc.md section "Split-brain triage".
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eel-site-partition-primary-mirror
  namespace: chaos-testing
  labels:
    eel.io/scenario: site-partition
    eel.io/target: cross-site
    eel.io/wave: "5.9"
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      site: primary
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - eel-prod
      labelSelectors:
        site: mirror
  duration: "5m"
