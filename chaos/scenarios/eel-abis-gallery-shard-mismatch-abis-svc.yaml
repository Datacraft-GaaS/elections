# Chaos Mesh v2.7+ — Scenario 58: ABIS gallery shard mismatch
# M5 audit chain (ADR-0022/0023): auditId=UUID7; proofHash=sha256; correlation_key=abis-svc-58; M3_device_id embedded.
# Role: test resilience of abis-svc against Shard mismatch; Purpose: verify SLO/recovery; Functionality: inject fault; Config: apply/remove via kubectl.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: eel-scenario-58
  namespace: chaos-testing
  labels:
    eel.io/scenario: chaos-scenario-58
    eel.io/target: abis-svc
    eel.io/wave: "5.9"
    eel.io/audit: "auditId=uuid7;proofHash=sha256;correlation_key=abis-svc-58"
    eel.io/adrs: "ADR-0004,ADR-0006,ADR-0009,ADR-0010"
spec:
  action: pod-kill
  mode: fixed-percent
  value: "33"
  selector:
    namespaces:
      - eel-prod
    labelSelectors:
      app: abis-svc
  gracePeriod: 0
