[workspace]

[package]
name = "eel-adapter-nist-beacon-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "NIST Randomness Beacon client with signature verification and pulse cache"

[lib]
name = "eel_adapter_nist_beacon_rs"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
