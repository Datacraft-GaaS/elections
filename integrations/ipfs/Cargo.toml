[workspace]
members = ["."]
resolver = "2"

[package]
name = "eel-adapter-ipfs"
version = "0.1.0"
edition = "2021"
description = "Kenyan-hosted IPFS pinning adapter for M14/M17 transparency channel"

[[bin]]
name = "eel-adapter-ipfs"
path = "src/main.rs"

[lib]
name = "ipfs"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }
