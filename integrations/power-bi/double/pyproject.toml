[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-adapter-power-bi-double"
version = "0.1.0"
description = "power-bi double (test stand-in)"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115",
	"uvicorn>=0.30",
	"pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/double"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
