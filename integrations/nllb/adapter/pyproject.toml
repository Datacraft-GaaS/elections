[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-adapter-nllb"
version = "0.1.0"
description = "NLLB neural machine translation adapter for M17 and M28 multilingual"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115",
	"uvicorn>=0.30",
	"httpx>=0.27",
	"pydantic>=2.0",
	"uuid6>=2024.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eel_adapter_nllb"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
	"pyright>=1.1",
	"pytest>=8.0",
	"pytest-asyncio>=0.24",
]
