[workspace]

[package]
name = "eel-rfid-cipherlab-ble"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.83"
publish = false
description = "CipherLab RS36 BLE adapter for eel ballot-box cover custody"

[lib]
name = "eel_rfid_cipherlab_ble"
path = "src/lib.rs"

[dependencies]
reqwest         = { version = "0.12", features = ["json"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = { version = "1" }
tokio           = { version = "1", features = ["full"] }
tracing         = { version = "0.1" }
thiserror       = { version = "2" }
eel-resilience-rs = { version = "0.1.0", path = "../../../packages/eel-resilience-rs" }

[dev-dependencies]
tokio           = { version = "1", features = ["full", "test-util"] }
