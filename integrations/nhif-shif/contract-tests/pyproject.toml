[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-adapter-nhif-shif-contract-tests"
version = "0.1.0"
description = "Pact contract tests for eel-adapter-nhif-shif"
requires-python = ">=3.12"
dependencies = [
	"pytest>=8.0",
	"pytest-asyncio>=0.24",
	"httpx>=0.27",
	"pact-python>=2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
