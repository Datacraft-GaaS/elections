[workspace]

[package]
name = "eel-adapter-telco-vpn-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "IPsec tunnel health probe via strongSwan swanctl"

[[bin]]
name = "eel-adapter-telco-vpn"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
