[project]
name = "eel-ai-monitoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.7",
  "uuid6>=2024.1.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_monitoring"]

[tool.pyright]
pythonVersion = "3.12"
strict = true

[tool.ruff]
line-length = 100
