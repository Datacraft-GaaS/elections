[project]
name = "eel-anomaly-training"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.7",
  "uuid6>=2024.1.12",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "skl2onnx>=1.17",
  "onnxruntime>=1.18",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyright>=1.1", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eel_anomaly_training"]

[tool.pyright]
pythonVersion = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
