name: eel_kit_l1
description: EEL Kit L1 on-device IsoForest anomaly plugin
publish_to: none
version: 0.1.0
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
dependencies:
  flutter:
    sdk: flutter
  eel_kit_sdk:
    path: ../../../../packages/kit-sdk-flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0"
flutter:
  plugin:
    platforms:
      android:
        package: io.eel.kit_l1
        pluginClass: EelKitL1Plugin
      ios:
        pluginClass: EelKitL1Plugin
