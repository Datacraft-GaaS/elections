[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-rfid-reader-driver"
version = "0.1.0"
description = "EPC Gen2v2 RFID reader driver for ballot-box cover custody"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115",
	"uvicorn>=0.30",
	"httpx>=0.27",
	"pydantic>=2.0",
	"asyncio-mqtt>=0.16",
	"uuid6>=2024.1",
	"sllurp>=0.4",
	"bleak>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eel_rfid_reader"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
	"pyright>=1.1",
	"pytest>=8.0",
	"pytest-asyncio>=0.24",
	"pytest-httpserver>=1.0",
	"httpx>=0.27",
]
