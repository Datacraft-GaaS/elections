[package]
name = "printing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "M39 ballot printing chain domain and integration stubs"

[lib]
name = "printing"
path = "src/lib.rs"

[[bin]]
name = "printing-api"
path = "src/main.rs"

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
uuid       = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
eel-spec-helpers-rs = { version = "0.1.0", path = "../../../../packages/eel-spec-helpers-rs" }
axum              = { workspace = true }
tokio             = { workspace = true }
sqlx              = { workspace = true }
eel-outbox-rs     = { workspace = true }
async-trait       = "0.1"
anyhow            = "1"

[dev-dependencies]
serde_json = { workspace = true }
tower      = { workspace = true }
axum       = { workspace = true }
tokio      = { workspace = true }
