[project]
name = "eel-abis-console"
version = "0.1.0"
requires-python = ">=3.12"
description = "Adjudicator review console for the eel ABIS"
dependencies = [
    "django>=5.0",
    "dj-database-url>=2.1",
    "psycopg[binary]>=3.1",
    "django-htmx>=1.17",
    "django-widget-tweaks>=1.5",
    "eel-web @ file:///./packages/eel-web-py",
    "pytest>=8",
    "pytest-django>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["abis_console"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "abis_console.settings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
