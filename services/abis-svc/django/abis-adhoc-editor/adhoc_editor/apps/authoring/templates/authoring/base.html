<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ad-hoc Editor{% endblock %} | eel ABIS</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #f8f9fa; color: #212529; }
        a:focus, button:focus, input:focus, textarea:focus, select:focus {
            outline: 3px solid #0d6efd; outline-offset: 2px;
        }
        .skip-link { position: absolute; top: -40px; left: 0; background: #000; color: #fff; padding: 8px; z-index: 100; }
        .skip-link:focus { top: 0; }
        header { background: #1a1a2e; color: #fff; padding: 12px 24px; }
        header h1 { margin: 0; font-size: 1.25rem; }
        nav a { color: #adb5bd; margin-right: 16px; text-decoration: none; }
        nav a:hover, nav a[aria-current] { color: #fff; text-decoration: underline; }
        main { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 1rem; min-height: 48px; }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header role="banner">
        <h1>eel ABIS Ad-hoc Editor</h1>
        <nav aria-label="Main navigation">
            <a href="{% url 'report_list' %}">My Reports</a>
            <a href="{% url 'report_list' %}?scope=shared">Shared</a>
            <a href="{% url 'report_list' %}?scope=org">Organisation</a>
        </nav>
    </header>
    <main id="main-content" role="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
