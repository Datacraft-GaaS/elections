[project]
name = "eel-abis-reports-console"
version = "0.1.0"
requires-python = ">=3.12"
description = "Internal staff console for ABIS report management"
dependencies = [
    "django>=5.0",
    "dj-database-url>=2.1",
    "psycopg[binary]>=3.1",
    "django-htmx>=1.17",
    "django-widget-tweaks>=1.5",
    "django-storages[s3]>=1.14",
    "matplotlib>=3.9",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pyright>=1.1",
    "django-stubs[compatible-mypy]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abis_reports_console"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "abis_reports_console.settings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
