<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ABIS Reports Console{% endblock %}</title>
    <style>
        /* WCAG AA design tokens */
        :root {
            --color-bg: #ffffff;
            --color-surface: #f5f5f5;
            --color-border: #d1d5db;
            --color-text: #111827;
            --color-text-muted: #6b7280;
            --color-primary: #1d4ed8;
            --color-primary-hover: #1e40af;
            --color-danger: #dc2626;
            --color-success: #16a34a;
            --color-warning: #d97706;
            --color-info: #0284c7;
            /* Status badge backgrounds - AAA contrast on white */
            --badge-queued: #e5e7eb;
            --badge-queued-text: #374151;
            --badge-extracting: #dbeafe;
            --badge-extracting-text: #1e40af;
            --badge-complete: #dcfce7;
            --badge-complete-text: #166534;
            --badge-failed: #fee2e2;
            --badge-failed-text: #991b1b;
            --badge-pending: #fef9c3;
            --badge-pending-text: #713f12;
            --badge-cancelled: #f3f4f6;
            --badge-cancelled-text: #6b7280;
            --min-target: 48px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--color-bg); color: var(--color-text); line-height: 1.5; }
        a { color: var(--color-primary); }
        a:focus, button:focus, input:focus, select:focus, textarea:focus {
            outline: 3px solid var(--color-primary);
            outline-offset: 2px;
        }
        .skip-link {
            position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden;
        }
        .skip-link:focus {
            position: fixed; left: 8px; top: 8px; width: auto; height: auto;
            background: var(--color-primary); color: #fff; padding: 8px 16px;
            border-radius: 4px; z-index: 1000; text-decoration: none;
        }
        header[role="banner"] { background: var(--color-primary); color: #fff; padding: 12px 24px; }
        header a { color: #fff; font-weight: 600; text-decoration: none; }
        nav[aria-label="Main navigation"] { background: var(--color-surface); border-bottom: 1px solid var(--color-border); padding: 0 24px; }
        nav ul { list-style: none; display: flex; gap: 0; }
        nav ul li a {
            display: block; padding: 12px 16px; min-height: var(--min-target);
            display: flex; align-items: center;
            color: var(--color-text); text-decoration: none; font-size: 0.9rem;
        }
        nav ul li a:hover, nav ul li a[aria-current="page"] { background: var(--color-border); }
        main { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em;
        }
        .badge-queued    { background: var(--badge-queued);    color: var(--badge-queued-text); }
        .badge-extracting { background: var(--badge-extracting); color: var(--badge-extracting-text); }
        .badge-complete  { background: var(--badge-complete);  color: var(--badge-complete-text); }
        .badge-failed    { background: var(--badge-failed);    color: var(--badge-failed-text); }
        .badge-pending   { background: var(--badge-pending);   color: var(--badge-pending-text); }
        .badge-cancelled { background: var(--badge-cancelled); color: var(--badge-cancelled-text); }
        .badge-delivering { background: var(--badge-extracting); color: var(--badge-extracting-text); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: var(--min-target); min-width: var(--min-target);
            padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
            font-size: 0.9rem; font-weight: 500; text-decoration: none;
        }
        .btn-primary { background: var(--color-primary); color: #fff; }
        .btn-primary:hover { background: var(--color-primary-hover); color: #fff; }
        .btn-danger  { background: var(--color-danger); color: #fff; }
        .btn-sm { min-height: 36px; padding: 4px 12px; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--color-border); }
        th { background: var(--color-surface); font-weight: 600; font-size: 0.85rem; }
        tr:hover td { background: var(--color-surface); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 500; margin-bottom: 4px; }
        input, select, textarea {
            width: 100%; padding: 8px 12px; min-height: 44px;
            border: 1px solid var(--color-border); border-radius: 6px;
            font-size: 1rem; background: #fff; color: var(--color-text);
        }
        .error-list { background: var(--badge-failed); color: var(--badge-failed-text); padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
        .error-list li { margin-left: 20px; }
        footer[role="contentinfo"] { border-top: 1px solid var(--color-border); padding: 16px 24px; color: var(--color-text-muted); font-size: 0.8rem; margin-top: 40px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<header role="banner">
    <a href="/reports/">ABIS Reports Console</a>
</header>

<nav aria-label="Main navigation">
    <ul>
        <li><a href="/reports/runs/new/">New Run</a></li>
        <li><a href="/reports/deliveries/">Deliveries</a></li>
        <li><a href="/reports/subscriptions/new/">Subscribe</a></li>
        <li><a href="/admin/eel_reports/">Admin</a></li>
    </ul>
</nav>

<main id="main-content" role="main">
    {% block content %}{% endblock %}
</main>

<footer role="contentinfo">
    <p>ABIS Reports Console - Internal staff use only</p>
</footer>

{% block extra_scripts %}{% endblock %}
</body>
</html>
