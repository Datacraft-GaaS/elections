[project]
name = "eel-report-deliverers"
version = "0.1.0"
description = "Report delivery workers for gov-printer and KBC SFTP channels"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"httpx>=0.27",
	"pydantic>=2.7",
	"paramiko>=3.4",
	"lxml>=5.2",
	"python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.2",
	"pytest-asyncio>=0.23",
	"pyright>=1.1",
	"httpx>=0.27",
	"pytest-httpserver>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eel_report_deliverers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
