# deploy/service.yaml - abis-svc deployment manifest (WP-3.6, M03)
# Three deployments: abis-api, abis-matcher (worker), abis-vendor (Python).
# abis-matcher pods pinned to confidential-compute nodes.

name: abis-svc
image: harbor.eel.internal/eel/abis-svc
artifacts:
  - name: abis-api
    image: harbor.eel.internal/eel/abis-api
    port: 8080
    binary: abis-api
  - name: abis-matcher
    image: harbor.eel.internal/eel/abis-matcher
    binary: abis-matcher
    node_selector:
      "eel.io/enclave": "sev-snp"
    tolerations:
      - key: "eel.io/enclave"
        operator: "Equal"
        value: "sev-snp"
        effect: "NoSchedule"
      - key: "eel.io/enclave"
        operator: "Equal"
        value: "tdx"
        effect: "NoSchedule"
  - name: abis-vendor
    image: harbor.eel.internal/eel/abis-vendor-py
    command: ["python", "-m", "abis_vendor.worker"]

sites: []

strategy:
  primary: blue-green
  mirror:  blue-green
  edge-nairobi:  rolling
  edge-mombasa:  rolling
  edge-kisumu:   rolling
  edge-eldoret:  rolling
  edge-garissa:  rolling

replicas:
  primary:
    abis-api:     3
    abis-matcher: 4
    abis-vendor:  2
  mirror:
    abis-api:     3
    abis-matcher: 4
    abis-vendor:  2
  edge-nairobi:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1
  edge-mombasa:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1
  edge-kisumu:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1
  edge-eldoret:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1
  edge-garissa:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1

env:
  EEL_ABIS_ATTESTATION: "sev-snp"  # override to "software" in dev/kind
  EEL_ABIS_LOWER_THRESHOLD: "0.75"
  EEL_ABIS_UPPER_THRESHOLD: "0.90"
