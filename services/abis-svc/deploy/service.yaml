# deploy/service.yaml - abis-svc deployment manifest (WP-3.6, M03)
# Three deployments: abis-api, abis-matcher (worker), abis-vendor (Python).
# abis-matcher pods pinned to confidential-compute nodes.

name: abis-svc
image: harbor.eel.internal/eel/abis-svc
artifacts:
  - name: abis-api
    image: harbor.eel.internal/eel/abis-api
    ports:
      - name: rest
        containerPort: 8080
        protocol: TCP
      - name: grpc
        containerPort: 8443
        protocol: TCP
      - name: health
        containerPort: 8081
        protocol: TCP
      - name: metrics
        containerPort: 9090
        protocol: TCP
    binary: abis-api
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  - name: abis-matcher
    image: harbor.eel.internal/eel/abis-matcher
    ports:
      - name: health
        containerPort: 8081
        protocol: TCP
      - name: metrics
        containerPort: 9090
        protocol: TCP
    binary: abis-matcher
    node_selector:
      "eel.io/enclave": "sev-snp"
    tolerations:
      - key: "eel.io/enclave"
        operator: "Equal"
        value: "sev-snp"
        effect: "NoSchedule"
      - key: "eel.io/enclave"
        operator: "Equal"
        value: "tdx"
        effect: "NoSchedule"
    resources:
      requests:
        cpu: "8"
        memory: "16Gi"
      limits:
        cpu: "8"
        memory: "16Gi"
  - name: abis-adjudicator
    image: harbor.eel.internal/eel/abis-adjudicator
    ports:
      - name: health
        containerPort: 8081
        protocol: TCP
      - name: metrics
        containerPort: 9090
        protocol: TCP
    binary: abis-adjudicator
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
  - name: abis-vendor
    image: harbor.eel.internal/eel/abis-vendor-py
    ports:
      - name: vendor
        containerPort: 8090
        protocol: TCP
    command: ["python", "-m", "abis_vendor.worker"]
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

sites: []

strategy:
  primary: blue-green
  mirror:  blue-green
  edge-nairobi:  rolling
  edge-mombasa:  rolling
  edge-kisumu:   rolling
  edge-eldoret:  rolling
  edge-garissa:  rolling

replicas:
  primary:
    abis-api:     3
    abis-matcher: 4
    abis-vendor:  2
  mirror:
    abis-api:     3
    abis-matcher: 4
    abis-vendor:  2
  edge-nairobi:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1
  edge-mombasa:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1
  edge-kisumu:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1
  edge-eldoret:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1
  edge-garissa:
    abis-api:     2
    abis-matcher: 2
    abis-vendor:  1

env:
  EEL_ABIS_ATTESTATION: "sev-snp"  # override to "software" in dev/kind
  EEL_ABIS_LOWER_THRESHOLD: "0.75"
  EEL_ABIS_UPPER_THRESHOLD: "0.90"
