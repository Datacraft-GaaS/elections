apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eel-abis-matcher
  namespace: abis
  labels:
    app.kubernetes.io/name: abis-matcher
    app.kubernetes.io/part-of: abis-svc
    eel.internal/managed-by: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: abis-matcher
  minReplicas: 6
  maxReplicas: 60
  metrics:
    - type: Pods
      pods:
        metric:
          name: eel_abis_matcher_queue_depth
        target:
          type: AverageValue
          averageValue: "100"
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 6
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 2
          periodSeconds: 180
