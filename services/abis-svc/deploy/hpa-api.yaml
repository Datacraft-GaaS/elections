apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eel-abis-api
  namespace: abis
  labels:
    app.kubernetes.io/name: abis-api
    app.kubernetes.io/part-of: abis-svc
    eel.internal/managed-by: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: abis-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: eel_abis_api_request_rate
        target:
          type: AverageValue
          averageValue: "500"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
