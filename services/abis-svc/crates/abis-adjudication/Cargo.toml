[package]
name = "eel-abis-adjudication"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Adjudication workflow, FSM, and reviewer audit chain for the eel ABIS"

[lib]
name = "eel_abis_adjudication"
path = "src/lib.rs"

[features]
# Enable test doubles (Ed25519TestSigner) for integration tests and external test crates.
test-utils = []

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
sqlx        = { workspace = true }
tokio       = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
blake3      = { workspace = true }
hex         = { workspace = true }

ed25519-dalek  = { workspace = true }
eel-crypto-rs = { version = "0.1.0", path = "../../../../packages/eel-crypto-rs", default-features = false }
eel-events-rs = { version = "0.1.0", path = "../../../../packages/eel-events-rs", default-features = false }

[dev-dependencies]
rstest      = { workspace = true }
tokio       = { workspace = true }
eel-events-rs = { version = "0.1.0", path = "../../../../packages/eel-events-rs", default-features = false, features = ["test-utils"] }
