[package]
name = "abis-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "abis-api"
path = "src/main.rs"

[lib]
name = "abis_api"
path = "src/lib.rs"

[dependencies]
abis-matcher      = { version = "0.1.0", path = "../abis-matcher", features = ["mock"] }
abis-attest       = { version = "0.1.0", path = "../abis-attest" }
eel-abis-vendor   = { version = "0.1.0", path = "../abis-vendor" }
axum              = { workspace = true, features = ["macros", "tokio", "multipart"] }
tokio             = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa            = { workspace = true }
utoipa-swagger-ui = { workspace = true }
tower-http        = { workspace = true }
sqlx              = { workspace = true }
uuid              = { workspace = true, features = ["v4", "v7"] }
chrono            = { workspace = true }
thiserror         = { workspace = true }
bytes             = { workspace = true }
sha2              = { workspace = true }
hex               = { workspace = true }
base64            = { workspace = true }

[dev-dependencies]
rstest            = { workspace = true }
tower             = { workspace = true, features = ["util"] }

[features]
# Enables the PostgreSQL-backed integration tests (needs a reachable
# DATABASE_URL; run with --features db-tests -- --include-ignored).
db-tests = []
