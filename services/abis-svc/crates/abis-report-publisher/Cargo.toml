[package]
name            = "eel-abis-report-publisher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish         = false
description     = "Report publication, delivery scheduling, and channel adapters for the ABIS service (RPT-B)"

[features]
default = []
# Enable PGP encryption for email channel. Requires rpgp crate.
# Build will fail with a clear error if this feature is enabled without rpgp.
pgp = []

[lib]
name = "eel_abis_report_publisher"
path = "src/lib.rs"

[dependencies]
# Workspace deps
axum              = { workspace = true }
tokio             = { workspace = true }
sqlx              = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
sha2              = { workspace = true }
hex               = { workspace = true }
base64            = { workspace = true }
reqwest           = { workspace = true }
rdkafka           = { workspace = true }
prometheus        = { workspace = true }
lettre            = { workspace = true }
ssh2              = { workspace = true }
httpmock          = { workspace = true }

# Intra-workspace
eel-crypto-rs     = { path = "../../../../packages/eel-crypto-rs" }
eel-events-rs     = { path = "../../../../packages/eel-events-rs" }
eel-outbox-rs     = { path = "../../../../packages/eel-outbox-rs" }
eel-resilience-rs = { workspace = true }

[dev-dependencies]
rstest            = { workspace = true }
tokio             = { workspace = true }
httpmock          = { workspace = true }
tempfile          = { workspace = true }
