[project]
name = "eel-hello-django"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hello_project.settings"
