[package]
name            = "eel-kit-cert-transparency"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
rust-version.workspace = true
description     = "CT-log-style transparency for kit certificate issuance (HARD-12)"

[lib]
name = "eel_kit_cert_transparency"
path = "src/lib.rs"

[dependencies]
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }
sha2            = { workspace = true }
hex             = { workspace = true }
chrono          = { workspace = true }
uuid            = { workspace = true }
base64          = { workspace = true }
ed25519-dalek   = { workspace = true }
axum            = { workspace = true }
tokio           = { workspace = true }

eel-crypto-rs   = { path = "../../../../packages/eel-crypto-rs", default-features = false }

[dev-dependencies]
rstest          = { workspace = true }
