# Virtual workspace manifest for biometric-edge-svc (WP-3.8).
# Run `cargo build --release --workspace` from this directory, or use
# `-p edge-api -p kit-attest` from the root eel workspace.
[workspace]
resolver = "2"
members = [
    "crates/edge-api",
    "crates/kit-attest",
    "crates/diaspora",
    "crates/sensor-driver",
    "crates/biometric-edge-integration-tests",
    # nearform-nbis is the vendored NBIS FFI boundary and bvr-desktop/bridge the
    # C ABI bridge to the Qt client. Both are real crates that were sitting
    # outside this workspace, so cargo rejected their manifests for claiming a
    # workspace they were not members of.
    "crates/nearform-nbis",
    "apps/bvr-desktop/bridge",
]

exclude = [
  # These inherit dependencies from the repository root workspace, so
  # they are members there. Cargo assigns a package to the nearest enclosing
  # workspace, so without excluding them here the root can never claim them
  # and they belong to nothing at all.
  "crates/kit-cert-transparency",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "Apache-2.0"
rust-version = "1.83"
authors      = ["eel contributors"]
repository   = "https://gitea.internal/eel/eel"

[workspace.dependencies]
axum             = { version = "0.8", features = ["macros", "tokio", "multipart"] }
tower            = { version = "0.5", features = ["full"] }
tower-http       = { version = "0.6", features = ["full"] }
tokio            = { version = "1",   features = ["full"] }
serde            = { version = "1",   features = ["derive"] }
serde_json       = { version = "1" }
tracing          = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid             = { version = "1",   features = ["v4", "v7", "serde"] }
thiserror        = { version = "2" }
anyhow           = { version = "1" }
chrono           = { version = "0.4", features = ["serde"] }
base64           = { version = "0.22" }
sha2             = { version = "0.10" }
hex              = { version = "0.4" }
reqwest          = { version = "0.12", features = ["json"], default-features = false }
sqlx             = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
rstest           = { version = "0.23" }
blake3           = { version = "1" }
chrono-tz        = { version = "0.10" }
utoipa           = { version = "4", features = ["axum_extras"] }
proptest         = { version = "1" }

# Internal crates
kit-attest   = { path = "crates/kit-attest" }
edge-api     = { path = "crates/edge-api" }
eel-diaspora = { path = "crates/diaspora" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
opt-level     = 3
