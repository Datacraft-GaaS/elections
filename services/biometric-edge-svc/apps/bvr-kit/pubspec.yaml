name: eel_bvr_kit
description: eel BVR Kit - biometric voter registration application (WP-3.8, M01).
version: 1.0.1+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared design system (EelScaffold, EelColors, EelTextStyle). Imported
  # across lib/, so it is a real dependency rather than a stray import.
  eel_design:
    path: ../../../../packages/design-system/flutter
  eel_drivers:
    path: ../../../../packages/eel_drivers

  eel_bvi_kit:
    path: ../bvi-kit
  eel_kit_sdk:
    path: ../../../../packages/kit-sdk-flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0


  crypto: ^3.0.3

  dio: ^5.4.0

  eel_core_flutter: 
    path: ../../../../packages/eel-core-flutter

  flutter_secure_storage: ^9.0.0

  hooks_riverpod: ^2.5.0

  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
