name: eel_bvi_kit
description: eel BVI Kit - biometric voter identification application (WP-3.8, M05).
version: 1.0.1+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  eel_drivers:
    path: ../../../../packages/eel_drivers

  eel_kit_sdk:
    path: ../../../../packages/kit-sdk-flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  logging: any
  flutter_secure_storage: any
  uuid: any
  dio: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # P-256 key fixtures for mode-bundle signature tests
  pointycastle: ^3.9.1

flutter:
  generate: true
  uses-material-design: true
