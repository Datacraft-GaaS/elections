[package]
name = "eel-bvr-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "eel_bvr_bridge"
# Static library so the Qt binary links one object and has no runtime search
# path to configure.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
eel-bvr-workflow-rs = { path = "../../../../../packages/eel-bvr-workflow-rs" }
eel-bvr-store-rs = { path = "../../../../../packages/eel-bvr-store-rs" }
eel-crypto-rs = { path = "../../../../../packages/eel-crypto-rs" }
sensor-driver = { path = "../../../crates/sensor-driver" }

[dev-dependencies]
serde_json = { workspace = true }
