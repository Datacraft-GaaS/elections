[package]
name = "eel-bvr-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Off by default. A production build physically cannot contain the mock sensor,
# so a station cannot be shipped with it by omission or by accident. Development
# and CI builds enable it explicitly with --features mock-sensor.
mock-sensor = []

[lib]
name = "eel_bvr_bridge"
# Static library so the Qt binary links one object and has no runtime search
# path to configure.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
eel-bvr-workflow-rs = { version = "0.1.0", path = "../../../../../packages/eel-bvr-workflow-rs" }
eel-bvr-store-rs = { version = "0.1.0", path = "../../../../../packages/eel-bvr-store-rs" }
eel-crypto-rs = { version = "0.1.0", path = "../../../../../packages/eel-crypto-rs" }
sensor-driver = { version = "0.1.0", path = "../../../crates/sensor-driver" }

[dev-dependencies]
serde_json = { workspace = true }
