name: eel_cvr_field_officer
description: CVR field-officer mobile app for continuous voter registration (M35).
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # kit-sdk-flutter provides: offline queue, attestation, SPKI-pinned HTTP,
  # HLC clock, duress detection, accessibility widgets, Isar encrypted store.
  eel_kit_sdk:
    path: ../../../../packages/kit-sdk-flutter

  # Wave M0 foundations (plan §11): eel_design is the token-derived theme +
  # component library; eel_core_flutter is the app-tier bootstrap FSM,
  # session, connectivity probe, outbox drain and problem+json parsing.
  eel_design:
    path: ../../../../packages/design-system/flutter
  eel_core_flutter:
    path: ../../../../packages/eel-core-flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence (offline queue)
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # Networking
  http: ^1.2.1

  # Hashing (SHA-256 integrity digests) + UUIDv7 capture ids
  crypto: ^3.0.3
  uuid: ^4.5.1

  # Camera + image picker
  image_picker: ^1.1.2
  camera: ^0.11.0

  # Location
  geolocator: ^13.0.0

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # Time zones
  timezone: ^0.9.4


  dio: ^5.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/l10n/
