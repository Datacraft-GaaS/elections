[package]
name = "voter-card"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Voter ID card issuance (WP-4.10, M53, feature-flagged)"

[lib]
name = "voter_card"
path = "src/lib.rs"

[[bin]]
name = "voter-card"
path = "src/main.rs"

[dependencies]
bvr-domain        = { path = "../bvr-domain" }
axum              = { workspace = true }
tower-http        = { workspace = true }
tokio             = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
utoipa            = { workspace = true }
utoipa-swagger-ui = { workspace = true }
eel-outbox-rs     = { workspace = true }
sqlx              = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
thiserror         = { workspace = true }
anyhow            = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
[dev-dependencies]
rstest        = { workspace = true }
tokio         = { workspace = true }
eel-trace-rs  = { workspace = true }

[features]
# Enables the PostgreSQL round-trip test (needs a reachable DATABASE_URL).
db-tests = []
