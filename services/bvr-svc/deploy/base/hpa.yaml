apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bvr-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bvr-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
