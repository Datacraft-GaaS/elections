apiVersion: apps/v1
kind: Deployment
metadata:
  name: bvr-batch
  labels:
    app: bvr-batch
    component: worker
    service: bvr-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bvr-batch
  template:
    metadata:
      labels:
        app: bvr-batch
    spec:
      containers:
        - name: bvr-batch
          image: harbor.eel.internal/eel/bvr-batch:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bvr-secrets
                  key: database_url
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "2Gi"
