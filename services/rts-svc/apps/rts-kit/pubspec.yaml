name: eel_rts_kit
description: >
  eel Results Transmission System kit app. Scan, sign, and transmit Form 34A.
  Supports Android (new KIEMS + legacy via feature flag) and iOS (polish only).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  camera: ^0.10.5+9
  crypto: ^3.0.3
  dio: ^5.4.0
  eel_drivers:
    path: ../../../../packages/eel_drivers

  eel_kit_sdk:
    path: ../../../../packages/kit-sdk-flutter
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  flutter_secure_storage: ^9.0.0
  freezed_annotation: ^2.4.1
  go_router: ^13.2.0
  hooks_riverpod: ^2.5.0
  image: ^4.1.7
  intl: ^0.20.0
  json_annotation: ^4.9.0
  logging: ^1.2.0
  path: ^1.9.0
  sqflite: ^2.3.2
  wakelock_plus: ^1.2.7

  usb_serial: any
  uuid: any
  eel_design: { path: ../../../../packages/design-system/flutter }
dev_dependencies:
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # P-256 key fixtures for mode-bundle signature tests
  pointycastle: ^3.9.1

flutter:
  generate: true

  assets:
    - lib/src/i18n/
