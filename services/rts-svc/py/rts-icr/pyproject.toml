[project]
name = "rts-icr"
version = "0.1.0"
description = "ICR/OCR worker for Form 34A handwriting recognition"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.18",
    "paddlepaddle>=2.6; sys_platform != 'darwin'",
    "pytesseract>=0.3",
    "Pillow>=10",
    "pydantic>=2",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rts_icr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
