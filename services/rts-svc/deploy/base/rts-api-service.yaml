apiVersion: v1
kind: Service
metadata:
  name: rts-api
  labels:
    app: rts-api
    part-of: rts-svc
spec:
  type: ClusterIP
  selector:
    app: rts-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
