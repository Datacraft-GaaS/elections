# deploy/service.yaml - rts-svc WP-3.1 core
name: rts-svc
image: harbor.eel.internal/eel/rts-svc
artifacts:
  - name: rts-api
    port: 8080
  - name: rts-tally
    port: null
  - name: rts-publisher
    port: null
  - name: rts-projections
    port: null
sites:
  - primary
  - mirror
strategy:
  primary: blue-green
  mirror: blue-green
replicas:
  primary: 3
  mirror: 3
