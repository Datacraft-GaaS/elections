[workspace]
resolver = "2"
members = [
    "crates/rts-domain",
    "crates/rts-tally",
    "crates/rts-projections",
    "crates/rts-publisher",
    "crates/rts-api",
    "crates/rts-integration-tests",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "Apache-2.0"
rust-version = "1.83"
authors      = ["eel contributors"]
repository   = "https://gitea.internal/eel/eel"

[workspace.dependencies]
# Internal rts crates
rts-domain       = { path = "crates/rts-domain" }
rts-tally        = { path = "crates/rts-tally" }
rts-projections  = { path = "crates/rts-projections" }
rts-publisher    = { path = "crates/rts-publisher" }
rts-api          = { path = "crates/rts-api" }

# eel platform packages
eel-eventstore-rs  = { path = "../../packages/eel-eventstore-rs" }
eel-events-rs      = { path = "../../packages/eel-events-rs" }
eel-hlc-rs         = { path = "../../packages/eel-hlc-rs" }
eel-crypto-rs      = { path = "../../packages/eel-crypto-rs" }
eel-api-server-rs  = { path = "../../packages/eel-api-server-rs" }
eel-auth-rs        = { path = "../../packages/eel-auth-rs" }

# HTTP / gRPC
axum              = { version = "0.8",  features = ["macros", "tokio"] }
tower             = { version = "0.5",  features = ["full"] }
tonic             = { version = "0.12", features = ["tls", "transport"] }

# Async
tokio             = { version = "1", features = ["full"] }

# Kafka
rdkafka           = { version = "0.37", features = ["cmake-build", "ssl"] }

# Database
sqlx              = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# OpenAPI
utoipa            = { version = "4",   features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "7",   features = ["axum"] }

# Serialization
serde             = { version = "1",   features = ["derive"] }
serde_json        = { version = "1" }

# IDs
uuid              = { version = "1",   features = ["v4", "v7", "serde"] }

# Error handling
thiserror         = { version = "2" }

# Time
chrono            = { version = "0.4", features = ["serde"] }

# Validation
garde             = { version = "0.20", features = ["derive", "full"] }

# Observability
tracing              = { version = "0.1" }
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }

# Testing
rstest = { version = "0.23" }
