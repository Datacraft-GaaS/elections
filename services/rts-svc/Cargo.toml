[workspace]
resolver = "2"
members = [
    "crates/rts-domain",
    "crates/rts-tally",
    "crates/rts-projections",
    "crates/rts-publisher",
    "crates/rts-api",
    "crates/rts-integration-tests",
    "crates/rts-device-api",
    "crates/rts-ro-api",
    # WP-3.3
    "crates/declaration",
    "crates/ballot-serial",
]

exclude = [
  # These inherit dependencies from the repository root workspace, so
  # they are members there. Cargo assigns a package to the nearest enclosing
  # workspace, so without excluding them here the root can never claim them
  # and they belong to nothing at all.
  "crates/bft-tally",
  "crates/fhe-tally",
  "crates/behavioural-biometrics",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "Apache-2.0"
rust-version = "1.83"
authors      = ["eel contributors"]
repository   = "https://gitea.internal/eel/eel"

[workspace.dependencies]
# Internal rts crates
rts-domain       = { version = "0.1.0", path = "crates/rts-domain" }
rts-tally        = { version = "0.1.0", path = "crates/rts-tally" }
rts-projections  = { version = "0.1.0", path = "crates/rts-projections" }
rts-publisher    = { version = "0.1.0", path = "crates/rts-publisher" }
rts-api          = { version = "0.1.0", path = "crates/rts-api" }

# eel platform packages
eel-eventstore-rs  = { version = "0.1.0", path = "../../packages/eel-eventstore-rs" }
eel-events-rs      = { version = "0.1.0", path = "../../packages/eel-events-rs" }
eel-hlc-rs         = { version = "0.1.0", path = "../../packages/eel-hlc-rs" }
eel-crypto-rs      = { version = "0.1.0", path = "../../packages/eel-crypto-rs" }
eel-api-server-rs  = { version = "0.1.0", path = "../../packages/eel-api-server-rs" }
eel-auth-rs        = { version = "0.1.0", path = "../../packages/eel-auth-rs" }
eel-outbox-rs      = { version = "0.1.0", path = "../../packages/eel-outbox-rs" }
eel-trace-rs       = { version = "0.1.0", path = "../../packages/eel-trace-rs" }

# Codecs (SMS fallback)
ciborium           = { version = "0.2" }
zstd               = { version = "0.13" }

# Crypto and encoding
ed25519-dalek      = { version = "2", features = ["rand_core"] }
base64             = { version = "0.22" }
hex                = { version = "0.4" }
sha2               = { version = "0.10" }
# HTTP / gRPC
axum              = { version = "0.8",  features = ["macros", "tokio"] }
tower             = { version = "0.5",  features = ["full"] }
tonic             = { version = "0.12", features = ["tls", "transport"] }

# Async
tokio             = { version = "1", features = ["full"] }

# Kafka
rdkafka           = { version = "0.37", features = ["cmake-build", "ssl"] }

# Database
sqlx              = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# OpenAPI
utoipa            = { version = "4",   features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "7",   features = ["axum"] }

# Serialization
serde             = { version = "1",   features = ["derive"] }
serde_json        = { version = "1" }

# IDs
uuid              = { version = "1",   features = ["v4", "v7", "serde"] }

# Error handling
thiserror         = { version = "2" }

# Time
chrono            = { version = "0.4", features = ["serde"] }

# Validation
garde             = { version = "0.20", features = ["derive", "full"] }

# Observability
tracing              = { version = "0.1" }
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }

# Testing
rstest = { version = "0.23" }
