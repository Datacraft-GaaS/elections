[package]
name = "rts-ro-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Returning Officer backend API for 34A review, 34B/34C compilation, disputes (WP-3.2 M09)"

[lib]
name = "rts_ro_api"
path = "src/lib.rs"

[[bin]]
name = "rts-ro-api"
