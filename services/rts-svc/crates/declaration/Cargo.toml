[package]
name = "declaration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Event-sourced declaration, certificate, and petition-window aggregates for rts-svc (WP-3.3, M51)"

[lib]
name = "declaration"
path = "src/lib.rs"

[dependencies]
eel-eventstore-rs  = { path = "../../../../packages/eel-eventstore-rs" }
eel-events-rs      = { path = "../../../../packages/eel-events-rs" }
eel-hlc-rs         = { path = "../../../../packages/eel-hlc-rs" }
eel-crypto-rs      = { path = "../../../../packages/eel-crypto-rs" }
eel-outbox-rs      = { path = "../../../../packages/eel-outbox-rs" }

axum              = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
thiserror         = { workspace = true }
ed25519-dalek     = { workspace = true }
hex               = "0.4"
tracing           = { workspace = true }
tokio             = { workspace = true }

[dev-dependencies]
proptest          = "1"
tokio             = { workspace = true }
serde_json        = { workspace = true }
eel-trace-rs      = { workspace = true }
