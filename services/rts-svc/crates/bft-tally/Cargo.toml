[package]
name        = "eel-rts-bft-tally"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
rust-version.workspace = true
description = "HotStuff BFT consensus for tally aggregation (HARD-B item 8). N=4, f=1. Replaces Kafka-transactional consumer."

[lib]
name = "eel_rts_bft_tally"
path = "src/lib.rs"

[[test]]
name = "bft_test"
path = "tests/bft_test.rs"

[dependencies]
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
tokio            = { workspace = true }
axum             = { workspace = true }
sha2             = { workspace = true }
blake3           = { workspace = true }
ed25519-dalek    = { workspace = true }
uuid             = { workspace = true }
chrono           = { workspace = true }
hex              = { workspace = true }
async-trait      = "0.1"
rand             = "0.8"

[dev-dependencies]
rstest           = { workspace = true }
tokio            = { workspace = true }
