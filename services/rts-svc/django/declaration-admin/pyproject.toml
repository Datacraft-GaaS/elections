[project]
name = "declaration-admin"
version = "0.1.0"
description = "Django admin console for declaration lifecycle and ballot-serial reconciliation (WP-3.3, M51, M63)"
requires-python = ">=3.12"
dependencies = [
	"django>=4.2",
	"pydantic>=2.0",
	"eel-web @ file:///${PROJECT_ROOT}/packages/eel-web-py",
	"httpx>=0.27",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-django>=4.8",
	"pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["declaration_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "declaration_admin.settings"

[tool.pyright]
pythonVersion = "3.12"
