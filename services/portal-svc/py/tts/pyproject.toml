[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-portal-tts"
version = "0.1.0"
description = "eel portal-svc: TTS audio generation worker for referendum explainer (M68)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "anyio>=4.4",
]

[project.optional-dependencies]
kafka = [
    "aiokafka>=0.11",
]
tts = [
    "piper-tts>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eel_tts"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyright>=1.1.370",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingModuleSource = false
