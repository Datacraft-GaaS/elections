[package]
name = "tlog-sequencer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Domain-tagged sequencer for the eel transparency log (WP-2.1)"

[[bin]]
name = "tlog-sequencer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tlog-domain = { path = "../tlog-domain" }
eel-crypto-rs = { path = "../../../../packages/eel-crypto-rs" }

axum = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hex = "0.4"
anyhow = { workspace = true }
