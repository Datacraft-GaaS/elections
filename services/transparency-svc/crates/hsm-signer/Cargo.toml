[package]
name = "hsm-signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "gRPC HSM signer service for the eel platform (WP-2.2)"

[[bin]]
name = "hsm-signer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[build-dependencies]
tonic-build = { workspace = true }

[dependencies]
# Internal
eel-crypto-rs  = { path = "../../../../packages/eel-crypto-rs", features = ["pkcs11"] }
eel-auth-rs    = { path = "../../../../packages/eel-auth-rs" }
eel-events-rs  = { path = "../../../../packages/eel-events-rs" }
eel-outbox-rs  = { path = "../../../../packages/eel-outbox-rs" }

# gRPC / HTTP
axum           = { workspace = true }
tonic          = { workspace = true }
prost          = { workspace = true }
tokio          = { workspace = true }
tokio-stream   = { version = "0.1", features = ["sync"] }

# Crypto helpers
cryptoki       = { workspace = true }
sha2           = "0.10"

# Data
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
uuid           = { workspace = true }
chrono         = { workspace = true }
hex            = "0.4"
anyhow         = { workspace = true }

# Observability
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus     = "0.13"

# Rate limiting
governor       = "0.6"

# Crypto
ed25519-dalek  = { workspace = true }

# Concurrency
dashmap        = "6"

[dev-dependencies]
tokio          = { workspace = true }
anyhow         = { workspace = true }
ed25519-dalek  = { workspace = true }
rand_core      = { version = "0.6", features = ["getrandom"] }
