[project]
name = "grievance-channels"
version = "0.1.0"
description = "USSD/SMS/WhatsApp grievance intake and case routing for ecc-svc (WP-4.1)"
requires-python = ">=3.12"
dependencies = [
	"pydantic>=2",
	"httpx>=0.27",
	"cryptography>=42",
	"uuid6>=0.7",
	"python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grievance_channels"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
