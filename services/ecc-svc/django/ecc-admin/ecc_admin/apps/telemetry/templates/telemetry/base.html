<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title|default:"ECC Telemetry Admin" }}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #1a1a1a; }
    .nav { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
    .nav a { color: #a8d8ff; text-decoration: none; font-size: 0.95rem; }
    .nav a:hover, .nav a[aria-current="page"] { color: #fff; text-decoration: underline; }
    .nav .brand { font-weight: 700; font-size: 1.1rem; color: #fff; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.5rem; margin: 0 0 20px; }
    h2 { font-size: 1.2rem; margin: 16px 0 10px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e5e5e5; font-size: 0.9rem; }
    th { background: #f0f0f0; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .btn { display: inline-block; padding: 8px 16px; border-radius: 4px; border: 0; cursor: pointer; font-size: 0.9rem; font-weight: 600; min-height: 44px; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #6b7280; color: #fff; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; border: 1px solid #e5e5e5; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
    .form-row label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-row input, .form-row select, .form-row textarea { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem; min-width: 180px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; font-weight: 700; }
    .badge-critical { background: #fee2e2; color: #dc2626; }
    .badge-high { background: #ffedd5; color: #ea580c; }
    .badge-medium { background: #fef9c3; color: #ca8a04; }
    .badge-low { background: #dbeafe; color: #2563eb; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    #result-area { margin-top: 20px; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="nav" role="navigation" aria-label="Main navigation">
  <span class="brand">ECC Telemetry Admin</span>
  <a href="{% url 'telemetry:hard_questions' %}"
     {% if request.resolver_match.url_name == 'hard_questions' %}aria-current="page"{% endif %}>
    Preset Queries
  </a>
  <a href="{% url 'telemetry:query_builder' %}"
     {% if request.resolver_match.url_name == 'query_builder' %}aria-current="page"{% endif %}>
    Query Builder
  </a>
  <a href="{% url 'telemetry:evidence_export' %}"
     {% if request.resolver_match.url_name == 'evidence_export' %}aria-current="page"{% endif %}>
    Evidence Export
  </a>
  <a href="{% url 'admin:index' %}">Django Admin</a>
</nav>
<main>
  {% if messages %}
    <ul role="list" aria-live="polite" style="list-style:none;padding:0;margin-bottom:16px">
      {% for msg in messages %}
        <li style="background:#d1fae5;border:1px solid #6ee7b7;padding:10px;border-radius:4px;margin-bottom:6px">{{ msg }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
