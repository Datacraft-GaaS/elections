[project]
name = "ecc-admin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "python-dateutil>=2.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ecc_admin.settings"
python_files = ["tests/test_*.py"]
asyncio_mode = "auto"
