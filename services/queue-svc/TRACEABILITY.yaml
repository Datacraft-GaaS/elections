version: "1.0"
work_package: "WP-4.2"
module: "M19"
requirements:
  - id: M19-R01
    description: "Real-time queue snapshot fusion from kit, clerk, CV and QR sources"
    implementations: ["crates/queue-pipeline/src/pipeline.rs::fuse_snapshot"]
    tests: ["crates/queue-pipeline/src/pipeline.rs::tests::test_fuse_snapshot"]
  - id: M19-R02
    description: "Wait-time breach detection and disenfranchisement flagging"
    implementations: ["crates/queue-pipeline/src/pipeline.rs::check_wait_breach"]
    tests: ["crates/queue-pipeline/src/pipeline.rs::tests::test_wait_breach"]
  - id: M19-R03
    description: "s.14A recommendation with Chair HSM sign gate"
    implementations: ["crates/queue-pipeline/src/pipeline.rs::recommend_s14a"]
    tests: ["crates/queue-pipeline/src/pipeline.rs::tests::test_s14a_recommended"]
  - id: M19-R04
    description: "Public queue map via LiveView SSE"
    implementations: ["ex/queue_map/lib/queue_map_live/live/station_map_live.ex"]
    tests: ["ex/queue_map/test/queue_map_live/station_map_live_test.exs"]
  - id: M19-R05
    description: "CV headcount from camera feeds"
    implementations: ["py/cv-headcount/src/cv_headcount/service.py"]
    tests: ["py/cv-headcount/tests/ci/test_cv_headcount.py"]
events:
  - type: "eel.queue.snapshot.v1"
    producer: "crates/queue-pipeline"
    schema_ref: "packages/openapi-contracts/queue/transparency.yaml"
  - type: "eel.queue.wait_time_breached.v1"
    producer: "crates/queue-pipeline"
  - type: "eel.queue.disenfranchisement_flag.v1"
    producer: "crates/queue-pipeline"
  - type: "eel.queue.s14a_recommended.v1"
    producer: "crates/queue-pipeline"
