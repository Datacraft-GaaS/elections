[package]
name        = "eel-field-mobile-telemetry-ingest"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
rust-version.workspace = true
publish     = false
description = "Server-side telemetry ingestion pipeline for field mobile devices (IEMS)"

[lib]
name = "eel_field_mobile_telemetry_ingest"
path = "src/lib.rs"

[[test]]
name    = "telemetry_test"
path    = "tests/telemetry_test.rs"

[dependencies]
# HTTP / async
axum            = { workspace = true }
tokio           = { workspace = true }
tokio-util      = { workspace = true }
reqwest         = { workspace = true }

# Database (runtime queries only; no compile-time DATABASE_URL)
sqlx            = { workspace = true }

# Serialization
serde           = { workspace = true }
serde_json      = { workspace = true }

# Errors + tracing
thiserror       = { workspace = true }
tracing         = { workspace = true }

# IDs
uuid            = { workspace = true }

# Time
chrono          = { workspace = true }

# Crypto
sha2            = { workspace = true }
hex             = { workspace = true }
base64          = { workspace = true }
blake3          = { workspace = true }
hmac            = { workspace = true }

# Metrics
prometheus      = { workspace = true }

# Temp files
tempfile        = { workspace = true }

# eel platform packages
eel-crypto-rs  = { version = "0.1.0", path = "../../../../packages/eel-crypto-rs" }
eel-events-rs  = { version = "0.1.0", path = "../../../../packages/eel-events-rs" }
eel-outbox-rs  = { version = "0.1.0", path = "../../../../packages/eel-outbox-rs" }
eel-auth-rs    = { version = "0.1.0", path = "../../../../packages/eel-auth-rs", default-features = false }
eel-resilience-rs = { version = "0.1.0", path = "../../../../packages/eel-resilience-rs" }

[dev-dependencies]
tokio           = { workspace = true }
