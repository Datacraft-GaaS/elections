name: citizen_verify
description: >
  Citizen Verify app (M13/M29). Public-facing PWA: OTP login, register lookup,
  station finder, results browser with client-side Merkle proof, incident reporting,
  bookmarks. 10M concurrent users, soft attestation, aggressive caching.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: { sdk: flutter }
  flutter_riverpod: ^2.5.0
  hooks_riverpod: ^2.5.0
  flutter_hooks: ^0.20.5
  go_router: ^13.2.0
  eel_core_flutter: { path: ../../../../packages/eel-core-flutter }
  eel_design: { path: ../../../../packages/design-system/flutter }
  eel_kit_sdk: { path: ../../../../packages/kit-sdk-flutter }
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.1.5
  geolocator: ^13.0.1
  audio_session: ^0.1.18
  just_audio: ^0.9.36
  cached_network_image: ^3.3.1
  intl: ^0.20.0
  flutter_svg: ^2.0.10
  share_plus: ^7.2.2
  url_launcher: ^6.2.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0


  uuid: ^4.5.1
dev_dependencies:
  flutter_test: { sdk: flutter }
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  integration_test: { sdk: flutter }

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/en/
    - assets/audio/sw/
