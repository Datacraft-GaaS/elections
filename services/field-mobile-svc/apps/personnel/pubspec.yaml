name: eel_personnel
description: "Worker check-in/check-out console for 250k concurrent election workers."
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared design system (EelScaffold, EelColors, EelTextStyle). Imported
  # across lib/, so it is a real dependency rather than a stray import.
  eel_design:
    path: ../../../../packages/design-system/flutter
  flutter_localizations:
    sdk: flutter
  eel_kit_sdk:
    path: ../../../../packages/kit-sdk-flutter
  flutter_riverpod: ^2.5.0
  hooks_riverpod: ^2.5.0
  flutter_hooks: ^0.20.5
  dio: ^5.4.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.0
  go_router: ^13.0.0
  geolocator: ^13.0.0


  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
