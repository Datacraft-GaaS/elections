[project]
name = "wa-bot"
version = "0.1.0"
description = "WhatsApp Business API webhook for eel voter services (WP-4.7, M13/M23/M35)"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"pydantic>=2",
	"httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
