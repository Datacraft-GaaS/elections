# Virtual workspace manifest for support-admin-svc.
# The root eel workspace also picks up these crates via services/*/crates/*.
[workspace]
resolver = "2"
members = [
    "crates/budget",
    "crates/payroll",
    "crates/archive",
    "crates/special-voter",
    "crates/intent",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "Apache-2.0"
rust-version = "1.83"
authors      = ["eel contributors"]
repository   = "https://gitea.internal/eel/eel"

[workspace.dependencies]
axum              = { version = "0.8",  features = ["macros", "tokio"] }
tower             = { version = "0.5",  features = ["full"] }
tower-http        = { version = "0.6",  features = ["full"] }
tokio             = { version = "1",    features = ["full"] }
sqlx              = { version = "0.8",  features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
utoipa            = { version = "4",    features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "7",    features = ["axum"] }
serde             = { version = "1",    features = ["derive"] }
serde_json        = { version = "1" }
tracing           = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid              = { version = "1",    features = ["v4", "v7", "serde"] }
thiserror         = { version = "2" }
anyhow            = { version = "1" }
chrono            = { version = "0.4",  features = ["serde"] }
sha2              = { version = "0.10" }
hex               = { version = "0.4" }
base64            = { version = "0.22" }
tar               = { version = "0.4" }
flate2            = { version = "1" }
rstest            = { version = "0.23" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
opt-level     = 3
