[package]
name = "special-voter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Domain aggregates, events, and guardrails for M25 special voter workflows (WP-5.5)"

[lib]
name = "special_voter"
path = "src/lib.rs"

[[bin]]
name = "special-voter-api"
path = "src/main.rs"

[dependencies]
eel-eventstore-rs = { version = "0.1.0", path = "../../../../packages/eel-eventstore-rs" }
eel-events-rs     = { version = "0.1.0", path = "../../../../packages/eel-events-rs" }
eel-hlc-rs        = { version = "0.1.0", path = "../../../../packages/eel-hlc-rs" }
serde             = { workspace = true }
serde_json        = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
axum              = { workspace = true }
tokio             = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower      = { workspace = true }
axum       = { workspace = true }
tokio      = { workspace = true }
