[project]
name = "support-admin"
version = "0.1.0"
description = "Django admin for M25 special voter workflows and M27 intent preservation (WP-5.5)"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2",
    "pydantic>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["support_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "support_admin.settings"
