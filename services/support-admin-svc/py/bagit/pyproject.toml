[project]
name = "eel-bagit"
version = "0.1.0"
description = "BagIt package builder and verifier for support-admin-svc WP-5.6 M69"
requires-python = ">=3.12"
dependencies = [
	"pydantic>=2",
	"uuid6>=0.7",
]
[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-asyncio>=0.23",
	"pyright>=1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/bagit_pkg"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.pyright]
pythonVersion = "3.12"
