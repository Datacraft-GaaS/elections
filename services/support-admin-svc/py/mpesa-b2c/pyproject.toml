[project]
name = "eel-mpesa-b2c"
version = "0.1.0"
description = "M-Pesa B2C disbursement client for support-admin-svc WP-5.6"
requires-python = ">=3.12"
dependencies = [
	"pydantic>=2",
	"httpx>=0.27",
	"uuid6>=0.7",
]
[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-asyncio>=0.23",
	"pytest-httpserver>=1.0",
	"pyright>=1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mpesa_b2c"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.pyright]
pythonVersion = "3.12"
