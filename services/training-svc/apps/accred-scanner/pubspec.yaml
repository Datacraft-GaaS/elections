name: eel_accred_scanner
description: >
  eel accreditation QR badge scanner for M42 media and M43 observer credentials.
  Offline CRL cache with 5-minute refresh. WP-5.4.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared design system (EelScaffold, EelColors, EelTextStyle). Imported
  # across lib/, so it is a real dependency rather than a stray import.
  eel_design:
    path: ../../../../packages/design-system/flutter
  eel_kit_sdk:
    path: ../../../../packages/kit-sdk-flutter

  flutter_riverpod: ^2.5.0
  hooks_riverpod: ^2.5.0
  flutter_hooks: ^0.20.5
  go_router: ^13.2.0
  mobile_scanner: ^5.1.0
  sqflite: ^2.3.2
  path: ^1.9.0
  dio: ^5.4.0
  connectivity_plus: ^6.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
