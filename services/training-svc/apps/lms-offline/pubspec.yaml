name: eel_lms_offline
description: >
  eel offline LMS app for poll worker training modules. Supports Android 8+ and iOS 14+.
  Downloads up to 5 modules for offline use. M38 (WP-5.4).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared design system (EelScaffold, EelColors, EelTextStyle). Imported
  # across lib/, so it is a real dependency rather than a stray import.
  eel_design:
    path: ../../../../packages/eel_design

  eel_kit_sdk:
    path: ../../../../packages/kit-sdk-flutter

  flutter_riverpod: ^2.5.0
  hooks_riverpod: ^2.5.0
  flutter_hooks: ^0.20.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  go_router: ^13.2.0
  sqflite: ^2.3.2
  path: ^1.9.0
  dio: ^5.4.0
  crypto: ^3.0.3
  connectivity_plus: ^6.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
