[package]
name = "training-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "HTTP API surface for training-svc WP-5.4 (M37, M38, M42, M43, M60)"

[lib]
name = "training_api"
path = "src/lib.rs"

[[bin]]
name = "training-api"
path = "src/main.rs"

[dependencies]
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { workspace = true }
tokio             = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
uuid              = { workspace = true, features = ["v4", "v5", "v7", "serde"] }
chrono            = { workspace = true }
hex               = { workspace = true }
sha2              = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror         = { workspace = true }
eel-spec-helpers-rs = { path = "../../../../packages/eel-spec-helpers-rs" }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
reqwest = { workspace = true }

[features]
# Gates the live cross-service LMS tests in tests/lms_integration.rs, which need
# the Rust LMS on :8080 and the Django LMS on :8000. Off by default so a plain
# `cargo test` reports them as ignored with their prerequisite rather than
# failing on a refused connection.
integration-tests = []
