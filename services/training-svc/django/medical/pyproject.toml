[project]
name = "eel-medical"
version = "0.1.0"
description = "M60 Medical First Response for training-svc (WP-5.4)"
requires-python = ">=3.12"
dependencies = [
	"django>=5.0",
	"djangorestframework>=3.15",
	"uuid6>=0.7",
	"python-dateutil>=2.9",
	"pytest>=8.0",
	"pytest-django>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medical_project", "medical_app"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "medical_project.settings"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
