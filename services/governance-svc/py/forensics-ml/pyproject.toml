[project]
name = "forensics-ml"
version = "0.1.0"
description = "M66 Election Financial Forensics ML worker: RD/IV/DiD econometric models for governance-svc (WP-5.3)"
requires-python = ">=3.12"
dependencies = [
	"pydantic>=2",
	"httpx>=0.27",
	"uuid6>=0.7",
	"python-dateutil>=2.9",
	"scipy>=1.13",
	"numpy>=1.26",
	"statsmodels>=0.14",
	"pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensics_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
