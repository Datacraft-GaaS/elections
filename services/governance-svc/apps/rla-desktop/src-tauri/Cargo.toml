[package]
name = "rla-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.83"
publish = false
description = "RLA audit laptop app — Tauri 2 offline audit desktop (WP-5.1 M21)"

[workspace]

[lib]
name = "rla_desktop_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rla-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = { version = "1" }
tokio            = { version = "1", features = ["full"] }
sqlx             = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
uuid             = { version = "1", features = ["v4", "v7"] }
chrono           = { version = "0.4", features = ["serde"] }
thiserror        = { version = "2" }
tracing          = { version = "0.1" }
sha2             = { version = "0.10" }
hex              = { version = "0.4" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
