[package]
name = "eel-governance-recall"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "M48 Recall petition lifecycle: signature collection, OCR import, Art.104 threshold, M50 handoff (WP-5.2)"

[lib]
name = "eel_governance_recall"
path = "src/lib.rs"

[[bin]]
name = "eel-governance-recall"
path = "src/main.rs"

[dependencies]
eel-memstore-rs = { version = "0.1.0", path = "../../../../packages/eel-memstore-rs" }
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { workspace = true }
tokio             = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror         = { workspace = true }
sha2              = { workspace = true }
hex               = { workspace = true }

[dev-dependencies]
tokio  = { workspace = true }
proptest = "1"
