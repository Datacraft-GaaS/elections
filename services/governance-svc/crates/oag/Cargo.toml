[package]
name = "eel-governance-oag"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "M58/M59 OAG Interface — engagement scoping, evidence extracts, response tracking, published-report registry (WP-5.1)"

[lib]
name = "eel_governance_oag"
path = "src/lib.rs"

[[bin]]
name = "eel-governance-oag"
path = "src/main.rs"

[dependencies]
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { workspace = true }
tokio             = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror         = { workspace = true }

sha2              = { workspace = true }
hex              = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
