[package]
name = "eel-governance-review"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "M41 Post-Election Review: findings, recommendations, parliament referrals, long-drip scheduler (WP-5.3)"

[lib]
name = "eel_governance_review"
path = "src/lib.rs"

[[bin]]
name = "eel-governance-review"
path = "src/main.rs"

[dependencies]
eel-memstore-rs = { path = "../../../../packages/eel-memstore-rs" }
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { workspace = true }
tokio             = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror         = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
