[package]
name = "eel-governance-by-election"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "M50 By-election operations: register subset, kit plan, 10-concurrent support, cost report at T+14 (WP-5.2)"

[lib]
name = "eel_governance_by_election"
path = "src/lib.rs"

[[bin]]
name = "eel-governance-by-election"
path = "src/main.rs"

[dependencies]
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { workspace = true }
tokio             = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror         = { workspace = true }
sha2              = { workspace = true }
hex               = { workspace = true }

[dev-dependencies]
tokio  = { workspace = true }
proptest = "1"
