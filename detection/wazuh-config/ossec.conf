<!--
  Wazuh agent config for EEL election infrastructure (biometric/kit devices, servers).
  References: ADR 0004 (Platform), ADR 0009 (Resilience), ADR 0019 (Edge topology).
  Ships to central SIEM at wazuh.eel.local.

  Mode: agent (registered to wazuh.eel.local manager).
  Compliance: DPA 2019 Kenya §6, Elections Act §34, NIST SP 800-53 AU-2.
  M5 hardening: agent TLS auth, mTLS to manager, syscheck expansion, canary monitoring,
                SCA policies, vulnerability detection, FIM on critical paths.
-->
<ossec_config>

  <!-- 0. Agent TLS / mTLS to manager (M5 hardening) -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>10000</queue_size>
    <events_per_second>1000</events_per_second>
  </client_buffer>

  <server>
    <address>wazuh.eel.local</address>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>10000</queue_size>
    <ca_cert>/var/ossec/etc/wazuh_ca.pem</ca_cert>
    <agent_cert>/var/ossec/etc/wazuh_agent.pem</agent_cert>
    <agent_key>/var/ossec/etc/wazuh_agent.key</agent_key>
  </server>

  <enrollment>
    <enabled>yes</enabled>
    <agent_name>eel-bvr-$(hostname)</agent_name>
    <server_url>https://wazuh.eel.local:55000</server_url>
    <agent_address>auto</agent_address>
    <groups>eel_biometric,eel_m5_drill,eel_canary,eel_audit</groups>
  </enrollment>

  <global>
    <white_list>127.0.0.1</white_list>
    <white_list>10.0.0.0/8</white_list>
    <white_list>172.16.0.0/12</white_list>
    <white_list>192.168.0.0/16</white_list>
  </global>

  <!-- 1. Log collection: kernel, audit, application, Falco, Tetragon -->
  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>audit</log_format>
    <frequency>10</frequency>
  </localfile>

  <localfile>
    <location>/var/log/eel/audit/*.json</location>
    <log_format>json</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/var/log/eel/biometric/*.log</location>
    <log_format>json</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/var/log/eel/outbox/*.log</location>
    <log_format>json</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/var/log/eel/form/*.log</location>
    <log_format>json</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/data/local/eel/audit/*.audit</location>
    <log_format>syslog</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/data/data/com.eel.bvr/files/audit/*.audit</location>
    <log_format>syslog</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/data/data/com.eel.bvi/files/audit/*.audit</location>
    <log_format>syslog</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/var/log/falco/events.log</location>
    <log_format>json</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/var/log/tetragon/tetragon.log</location>
    <log_format>json</log_format>
    <frequency>5</frequency>
  </localfile>

  <localfile>
    <location>/var/log/wazuh/canary/*.log</location>
    <log_format>json</log_format>
    <frequency>1</frequency>
  </localfile>

  <!-- 2. Syscheck (file integrity monitoring) — M5 hardened paths -->
  <syscheck>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <disabled>no</disabled>
    <max_files_per_second>100</max_files_per_second>

    <!-- EEL audit shadow files (must never change) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/var/lib/eel/audit_shadows</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/data/local/eel/audit</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/data/data/com.eel.bvr/files/audit</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/data/data/com.eel.bvi/files/audit</directories>

    <!-- Canary tokens (M5 hardening) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/data/local/eel/canary</directories>
    <files check_all="yes" realtime="yes" restrict="f">/data/local/eel/canary/fake-ed25519-key.bin</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/local/eel/canary/fake-aes-256-blob.bin</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/local/eel/canary/fake-bff-api-key.txt</files>

    <!-- Ed25519 signing key (HSM) -->
    <files check_all="yes" realtime="yes" restrict="f">/etc/eel/keys/signing_key.bin</files>
    <files check_all="yes" realtime="yes" restrict="f">/dev/hsm</files>

    <!-- Biometric templates (encrypted) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/data/local/eel/biometric/encrypted</directories>
    <files check_all="yes" realtime="yes" restrict="f">/data/user_de/0/com.eel.bvr/files/biometric/canary-fp-001.bin</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/user_de/0/com.eel.bvr/files/biometric/canary-fp-002.bin</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/user_de/0/com.eel.bvi/files/biometric/canary-iris-001.bin</files>

    <!-- BVR/BVI application binary (integrity) -->
    <files check_all="yes" realtime="yes" restrict="f">/data/app/com.eel.bvr/lib/libflutter.so</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/app/com.eel.bvr/lib/libbvr.so</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/app/com.eel.bvr/lib/canary-libbvr.so</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/app/com.eel.bvi/lib/libflutter.so</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/app/com.eel.bvi/lib/libbvi.so</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/app/com.eel.rts/lib/librts.so</files>

    <!-- Form 34A/B/C files (election integrity) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/data/local/eel/forms</directories>
    <files check_all="yes" realtime="yes" restrict="f">/data/local/eel/forms/form34a-*.json</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/local/eel/forms/form34b-*.json</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/local/eel/forms/form34c-*.json</files>

    <!-- MDM policy files -->
    <files check_all="yes" realtime="yes" restrict="f">/data/system/device_policy.xml</files>
    <files check_all="yes" realtime="yes" restrict="f">/data/system/device_policy_canary.xml</files>

    <!-- BFF / API configs -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/eel/bff</directories>
    <files check_all="yes" realtime="yes" restrict="f">/etc/eel/bff/api_key.txt</files>

    <!-- Ignore volatile directories -->
    <ignore>/data/local/tmp</ignore>
    <ignore>/data/system</ignore>
    <ignore>/var/log</ignore>
  </syscheck>

  <!-- 3. Rootkit detection (passive — Falco/Tetragon handle active) -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>86400</frequency>
    <system_audit>yes</system_audit>
    <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
  </rootcheck>

  <!-- 4. SCA (security configuration assessment) — M5 hardened -->
  <sca>
    <disabled>no</disabled>
    <scan_on_start>yes</scan_on_start>
    <frequency>86400</frequency>
    <policies>
      <policy>/var/ossec/etc/shared/eel_election_hardening.yml</policy>
      <policy>/var/ossec/etc/shared/eel_biometric_hardening.yml</policy>
      <policy>/var/ossec/etc/shared/cis_linux.yml</policy>
      <policy>/var/ossec/etc/shared/cis_android.yml</policy>
    </policies>
  </sca>

  <!-- 5. Vulnerability detection (M5) -->
  <vulnerability-detector>
    <disabled>no</disabled>
    <interval>5h</interval>
    <run_on_start>yes</run_on_start>
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>trusty</os>
      <os>xenial</os>
      <os>bionic</os>
      <os>focal</os>
    </provider>
    <provider name="nvd">
      <enabled>yes</enabled>
    </provider>
  </vulnerability-detector>

  <!-- 6. Active response — auto-ban IPs triggering multiple alerts -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100110,100111,100112,100114,100115,100312,100313,100410,100510,100511,100711,100713,100810,100912</rules_id>
    <timeout>600</timeout>
  </active-response>

  <active-response>
    <disabled>no</disabled>
    <command>eel-audit-route</command>
    <location>local</location>
    <rules_id>100110,100111,100114,100115,100510,100810</rules_id>
    <timeout>0</timeout>
  </active-response>

  <!-- 7. Log rotation -->
  <logcollector>
    <open_attempts>3</open_attempts>
    <run_daemon>no</run_daemon>
  </logcollector>

  <!-- 8. M5 48h drill correlation group (read-only context for canary correlation) -->
  <labels>
    <label key="m5_drill">enabled</label>
    <label key="correlation_keys">audit-corr-vote-001,audit-corr-form-001,bio-corr-fp-001,bio-corr-iris-001,crypto-corr-ed25519-001,net-corr-bff-001,sc-corr-library-001,mdm-corr-kiosk-001</label>
  </labels>

</ossec_config>
