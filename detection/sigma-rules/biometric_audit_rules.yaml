---
title: EEL — BVR Enrollment Outside Registration Window
id: eel-bvr-0010
status: production
description: Biometric enrollment attempted outside official registration hours.
references:
  - Elections Act
tags:
  - election.integrity
  - off-hours
logsource:
  product: eel
  service: audit_service
detection:
  selection:
    EventType: 'enrollment'
    UtcHour:
      lt: 7
      gt: 18
  condition: selection
level: warning
fields:
  - auditId
  - actorId
  - whenUtc

