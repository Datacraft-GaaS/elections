title: EEL — Biometric Audit Log Tampering
id: eel-bvr-0001
status: production
description: Audit log file deleted, truncated, or modified after enrollment session.
references:
  - DPA 2019 Kenya §6
  - Elections Act §34
  - NIST SP 800-53 AU-2
tags:
  - audit.tamper
  - file.delete
  - DPA-2019-S6
logsource:
  product: linux
  service: syslog
  category: file_audit
detection:
  selection:
    - FileName|contains:
      - '.audit'
      - '.log'
      - 'audit_shadow'
      Directory|contains: '/data/data/com.eel.bvr' or '/data/data/com.eel.bvi' or '/data/local/eel/audit'
  condition: selection
level: critical
fields:
  - SubjectUserName
  - SubjectDomainName
  - FileName
  - CommandLine
  - IpAddress

---
title: EEL — Biometric Enrollment From Untrusted Location
id: eel-bvr-0002
status: production
description: BVR enrollment attempted outside station polygon boundary.
references:
  - Elections Act §34
  - DPA 2019 Kenya §6
tags:
  - election.integrity
  - gps.spoof
  - DPA-2019-S6
logsource:
  product: linux
  service: auditd
detection:
  selection:
    - Image|contains: 'com.eel.bvr' or 'bvr-kit'
    - CommandLine|contains: 'enrol' or 'enrollment'
  filter_location_mismatch:
    - GpsCoordinates|contains: 'outside_polygon'
  condition: selection and filter_location_mismatch
level: warning

---
title: EEL — Proof Hash Mismatch on Enrollment
id: eel-bvr-0003
status: production
description: Proof hash in audit entry does not match recomputed SHA-256 of payload — audit chain broken.
references:
  - RFC 8785 (canonical JSON)
  - NIST SP 800-53 AU-10
tags:
  - audit.integrity
  - hash.mismatch
  - DPA-2019-S6
logsource:
  product: eel
  service: audit_service
detection:
  selection:
    EventType: 'enrollment'
    ProofHashStatus: 'mismatch'
  condition: selection
level: critical
fields:
  - auditId
  - actorId
  - actorRole
  - proofHash
  - expectedProofHash

---
title: EEL — Ed25519 Signature Verification Failed
id: eel-bvr-0004
status: production
description: Ed25519 signature on audit entry failed verification — tampering detected.
references:
  - NIST SP 800-53 AU-10
  - DPA 2019 Kenya §6
tags:
  - crypto.integrity
  - signature.fail
  - DPA-2019-S6
logsource:
  product: eel
  service: audit_service
detection:
  selection:
    EventType: 'enrollment' or 'verification'
    SignatureStatus: 'invalid'
  condition: selection
level: critical

---
title: EEL — Dual Biometric Capture Failed — Fingerprint Quality Below Threshold
id: eel-bvr-0005
status: production
description: Fingerprint quality score below configured minimum (BiometricCapturePolicy fpMinQuality).
references:
  - M3 hardware integration spec
  - ICAO 9303
tags:
  - biometric.quality
  - FAP60
  - enrollment.quality
logsource:
  product: eel
  service: biometric_capture
detection:
  selection:
    BiometricType: 'fingerprint'
    QualityScore|lt: 50
  condition: selection
level: warning
fields:
  - sessionId
  - qualityScore
  - fpMinQuality
  - environmentHint

