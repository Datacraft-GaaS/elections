title: EEL — Hardware M3 — FAP60 Sensor Unexpected Access (Non-BVR Process)
id: eel-hw-003
status: critical
description: FAP60 USB fingerprint sensor accessed by process other than BVR/BVI biometric app — potential hardware extraction.
references:
  - M3-HARDWARE-INTEGRATION
  - ADR-0004
  - DPA-2019-S6
logsource:
  product: linux
  service: auditd
detection:
  selection:
    EventType: 'file_open'
    FilePath: contains '/dev/usb' or contains 'fap60' or contains 'FUFingerSDK'
    ProcessName: not in ['com.eel.bvr', 'bvr-kit', 'fingerprint_driver', 'system_server']
  condition: selection
level: critical
fields: [auditId, processName, filePath, deviceId, whenUtc]
tags:
  - hardware
  - M3
  - sensor-access
  - DPA-2019-S6

