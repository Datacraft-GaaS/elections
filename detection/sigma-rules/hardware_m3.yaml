title: EEL — Hardware M3 — Fingerprint Quality Below Threshold (FAP60)
id: eel-hw-001
status: warning
description: FAP60 fingerprint sensor reports quality score below BiometricCapturePolicy fpMinQuality (50).
references:
  - M3-HARDWARE-INTEGRATION
  - ICAO-9303
  - ADR-0004
logsource:
  product: eel
  service: biometric_capture
detection:
  selection:
    BiometricType: 'fingerprint'
    QualityScore: < 50
    SensorType: 'FAP60'
  condition: selection
level: warning
fields: [auditId, sessionId, qualityScore, fpMinQuality, environmentHint, deviceId, stationId]
tags:
  - hardware
  - M3
  - biometric.quality
  - FAP60

