title: EEL — Hardware M3 — GSM Modem Access Outside RTS App
id: eel-hw-005
status: critical
description: GSM serial modem (USB) opened by non-RTS process — SMS injection / command injection risk.
references:
  - M3-SMS-USB-MANIFEST
  - M3-HARDWARE-INTEGRATION
  - ADR-0010
logsource:
  product: linux
  service: auditd
detection:
  selection:
    EventType: 'file_open'
    FilePath: startswith '/dev/ttyUSB' or startswith '/dev/ttyACM'
    ProcessName: not in ['com.eel.rts', 'rts-kit', 'gsm_server', 'system_server']
  condition: selection
level: critical
fields: [auditId, processName, filePath, deviceId, whenUtc]
tags:
  - hardware
  - M3
  - GSM
  - SMS-injection

---
title: EEL — Hardware M3 — RTS Reader / RFID Access Outside Expected Process
id: eel-hw-006
status: alert
description: RFID / USB HID reader accessed by non-inventory/non-RTS process — unauthorized tag reading.
references:
  - M3-HARDWARE-INTEGRATION
  - Inventory integration spec
logsource:
  product: linux
  service: auditd
detection:
  selection:
    EventType: 'file_open'
    FilePath: contains 'hidraw' or contains 'rfid' or contains 'ttyUSB'
    ProcessName: not in ['com.eel.inventory', 'rts-kit', 'inventory_app', 'system_server']
  condition: selection
level: alert
fields: [auditId, processName, filePath, deviceId, whenUtc]
tags:
  - hardware
  - M3
  - RFID
  - unauthorized-access
