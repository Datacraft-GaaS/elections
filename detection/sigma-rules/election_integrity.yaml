title: EEL — Election Integrity — Double Voting / Same Voter ID Multiple Times
id: eel-ei-001
status: production
description: Same voter ID (IPRS national ID) used more than once at any station within election period. References Elections Act §34, DPA 2019 §6, ADR 0023.
references:
  - Elections Act §34
  - DPA 2019 Kenya §6
  - ADR-0023-rfp-alignment
logsource:
  product: eel
  service: audit_service
detection:
  selection:
    EventType: 'voter_registration' or 'vote_cast' or 'enrollment'
  filter_duplicate:
    VoterId|count: > 1
  condition: selection and filter_duplicate
level: critical
fields:
  - auditId
  - voterId
  - stationId
  - actorId
  - whenUtc
  - proofHash
tags:
  - election.integrity
  - double-voting
  - DPA-2019-S6

