---
# WP-0.5: lint pipeline
# Runs on every push and PR.
when:
  - event: [push, pull_request]

steps:
  # `--check`, not the best-effort `just fmt` script, which exits 0 by design.
  # The root workspace glob does not reach the nested workspaces (bvr-svc,
  # rts-svc, support-admin-svc), so those are checked explicitly.
  - name: rust-fmt
    image: eel/build-image:latest
    commands:
      - cargo fmt --check --all
      - |
        for ws in services/bvr-svc services/rts-svc services/support-admin-svc; do
          cargo fmt --all --check --manifest-path "$ws/Cargo.toml" \
            || { echo "FMT FAILED: $ws"; exit 1; }
        done

  # Same script `just lint` runs, so CI and a local run cannot disagree.
  # A bare `cargo clippy --workspace` does not reach the nested workspaces,
  # and `-D warnings` promotes ~2000 missing_docs warnings to errors, which
  # AGENTS.md explicitly tolerates.
  - name: rust-clippy
    image: eel/build-image:latest
    commands:
      - tools/foreach-workspace.sh lint ./tools/cargo-workspace-lint.sh

  # SANY, not TLC: TLC needs a .cfg per spec and only a handful have one, so
  # it would silently skip most of the corpus. SANY needs no config and is what
  # TLC invokes anyway. The script explains why the exit code is not the signal.
  - name: tla-sany
    image: eel/build-image:latest
    commands:
      - tools/check-tla-specs.sh

  - name: python-ruff
    image: eel/build-image:latest
    commands:
      - |
        if find services -name '*.py' -print -quit | grep -q .; then
          ruff check services packages tools
          ruff format --check services packages tools
        else
          echo "no Python sources, skip"
        fi

  - name: elixir-fmt
    image: eel/build-image:latest
    commands:
      - |
        if find services -name '*.ex' -o -name '*.exs' | grep -q .; then
          find services -type d -name '_build' -prune -o -name 'mix.exs' -print \
            | xargs -I{} sh -c 'cd "$(dirname {})" && mix format --check-formatted'
        else
          echo "no Elixir sources, skip"
        fi

  - name: spectral-openapi
    image: eel/build-image:latest
    commands:
      - |
        if ls packages/openapi-contracts/**/*.yaml 2>/dev/null | grep -q .; then
          spectral lint packages/openapi-contracts/**/*.yaml --ruleset .spectral.yaml
        else
          echo "no OpenAPI specs, skip"
        fi

  - name: buf-lint
    image: eel/build-image:latest
    commands:
      - |
        if find . -name 'buf.yaml' -not -path '*/node_modules/*' | grep -q .; then
          buf lint
        else
          echo "no buf configs, skip"
        fi

  - name: pnpm-lint
    image: eel/build-image:latest
    commands:
      - |
        if find services packages -name 'package.json' -not -path '*/node_modules/*' | grep -q .; then
          pnpm --recursive lint
        else
          echo "no TypeScript sources, skip"
        fi

  - name: pre-commit
    image: eel/build-image:latest
    commands:
      - pre-commit run --all-files
