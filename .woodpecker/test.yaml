---
# WP-0.5: test pipeline
# Matrix per language. Each step is conditional on files existing.
when:
  - event: [push, pull_request]

matrix:
  include:
    - LANG: rust
    - LANG: python
    - LANG: elixir
    - LANG: flutter
    - LANG: node

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eel
      POSTGRES_PASSWORD: eel
      POSTGRES_DB: eel_abis

steps:
  - name: test-rust
    image: eel/build-image:latest
    when:
      matrix:
        LANG: rust
    environment:
      DATABASE_URL: postgres://eel:eel@database:5432/eel_abis
      EEL_ABIS_DATABASE_URL: postgres://eel:eel@database:5432/eel_abis
    commands:
      - |
        # Wait for Postgres and apply migrations (idempotent).
        for i in $(seq 1 30); do
          if cargo run -q -p eel-migrate; then break; fi
          sleep 1
        done
      - cargo nextest run --workspace --all-features --no-fail-fast

  # `eel-migrate` above logs a failure and carries on to the next file, so a
  # migration that cannot be applied does not fail that step. This one applies
  # the same set with ON_ERROR_STOP and fails the build, and rejects any .sql
  # under a migrations/ directory that eel-migrate cannot reach.
  - name: check-migrations
    image: eel/build-image:latest
    when:
      matrix:
        LANG: rust
    environment:
      DATABASE_URL: postgres://eel:eel@database:5432/eel_mig_test
    commands:
      - tools/check-migrations.sh

  - name: test-python
    image: eel/build-image:latest
    when:
      matrix:
        LANG: python
    commands:
      - |
        find services -type d -name 'py' | while read pydir; do
          if [ -f "$pydir/pyproject.toml" ]; then
            echo "==> testing $pydir"
            (cd "$pydir" && uv run pytest tests/ci -x -q)
          fi
        done
        if ! find services -type d -name 'py' | grep -q .; then
          echo "no Python service dirs, skip"
        fi

  # The leg above walks `services/*/py`, which is the Rust-workspace Python
  # services. Every Django app lives at `services/*/django/<app>`, so none of
  # them was ever run -- 15 apps with ~180 tests, and two of them could not
  # even import their dependencies. Walk the shape Django apps actually have.
  #
  # `uv run` silently falls back to whatever pytest is on PATH when the venv
  # lacks it, so a stale venv runs the suite under a different interpreter
  # instead of failing. `--all-extras` rather than `--extra dev`: a few of these
  # apps carry pytest in the main dependency list with no extras table at all,
  # and `--extra dev` errors out on those.
  - name: test-django
    image: eel/build-image:latest
    when:
      matrix:
        LANG: python
    environment:
      DATABASE_URL: postgres://eel:eel@database:5432/eel_mig_test
      DB_NAME: eel_mig_test
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: eel
      DB_PASSWORD: eel
      DJANGO_TEST_SQLITE: "true"
    commands:
      - |
        # The failure flag, not `exit 1` inside the loop: that runs in the
        # pipeline's subshell, and the `if` below would then reset the script's
        # status to 0, so the step could never fail.
        found=0
        failed=""
        for mp in $(find services -path '*/django/*' -name manage.py \
                      -not -path '*/.venv/*'); do
          dir=$(dirname "$mp")
          # Any test file under the app, not only a top-level `tests/`. Two
          # apps (inventory-admin, ecc-admin) keep their tests beside the code
          # at `apps/<app>/tests/`, so the narrower filter skipped them and the
          # step still reported success -- a discovery filter that excludes the
          # files it is meant to run is indistinguishable from a passing suite.
          find "$dir" -name 'test_*.py' -not -path '*/.venv/*' \
            -not -path '*/node_modules/*' | grep -q . || continue
          found=$((found + 1))
          echo "==> testing $dir"
          (cd "$dir" && uv sync --all-extras -q && uv run python manage.py check \
             && uv run pytest -q -p no:cacheprovider) \
            || failed="$failed $dir"
        done
        if [ "$found" -eq 0 ]; then
          echo "no Django apps found -- the walk is wrong" >&2
          exit 1
        fi
        if [ -n "$failed" ]; then
          echo "DJANGO TESTS FAILED:" >&2
          for d in $failed; do echo "  $d" >&2; done
          exit 1
        fi
        echo "test-django: $found apps passed"

  - name: test-elixir
    image: eel/build-image:latest
    when:
      matrix:
        LANG: elixir
    commands:
      - |
        find services -name 'mix.exs' | while read mixfile; do
          dir=$(dirname "$mixfile")
          echo "==> testing $dir"
          (cd "$dir" && mix deps.get && mix test --no-start)
        done
        if ! find services -name 'mix.exs' | grep -q .; then
          echo "no Elixir sources, skip"
        fi

  - name: test-flutter
    image: eel/build-image:latest
    when:
      matrix:
        LANG: flutter
    commands:
      - |
        # flutter analyze --fatal-infos is the gate; test follows.
        # Per-app matrix is in .woodpecker/mobile.yaml for full CI.
        find services -path '*/apps/*' -name 'pubspec.yaml' | while read f; do
          dir=$(dirname "$f")
          echo "==> analyzing $dir"
          (cd "$dir" && flutter analyze --fatal-infos) || { echo "ANALYZE FAILED: $dir"; exit 1; }
          echo "==> testing $dir"
          (cd "$dir" && flutter test) || { echo "TEST FAILED: $dir"; exit 1; }
        done
        if ! find services -path '*/apps/*' -name 'pubspec.yaml' | grep -q .; then
          echo "no Flutter sources, skip"
        fi

  - name: test-node
    image: eel/build-image:latest
    when:
      matrix:
        LANG: node
    commands:
      - |
        find services packages -path '*/astro/*' -name 'package.json' \
          -not -path '*/node_modules/*' | while read f; do
          dir=$(dirname "$f")
          echo "==> testing $dir"
          (cd "$dir" && pnpm install --frozen-lockfile && pnpm exec vitest run)
        done
        if ! find services packages -path '*/astro/*' -name 'package.json' \
            -not -path '*/node_modules/*' | grep -q .; then
          echo "no Astro/TS sources, skip"
        fi
