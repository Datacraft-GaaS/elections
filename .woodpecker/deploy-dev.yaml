---
# WP-0.5: dev cluster deploy, ArgoCD app sync on main branch
when:
  - event: push
    branch: main

steps:
  - name: argocd-sync
    image: eel/build-image:latest
    environment:
      ARGOCD_SERVER: argocd.dev.internal
      ARGOCD_AUTH_TOKEN:
        from_secret: argocd_dev_token
    commands:
      - |
        appsets=$(find platform/argocd/applicationsets -name '*.yaml' 2>/dev/null)
        if [ -z "$appsets" ]; then
          echo "no ArgoCD ApplicationSets found, skip deploy-dev"
          exit 0
        fi
        for appset in $appsets; do
          appset_name=$(yq eval '.metadata.name' "$appset")
          echo "==> syncing ApplicationSet: $appset_name"
          # ArgoCD CLI syncs the individual apps generated by this ApplicationSet.
          argocd appset get "$appset_name" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            | grep 'Name:' \
            | awk '{print $2}' \
            | while read appname; do
                echo "  syncing app: $appname"
                argocd app sync "$appname" \
                  --server "$ARGOCD_SERVER" \
                  --auth-token "$ARGOCD_AUTH_TOKEN" \
                  --grpc-web \
                  --timeout 300 \
                  --prune \
                  --force
              done
        done
