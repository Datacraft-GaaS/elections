---
# WP-0.5: mutation testing
# PR: changed crates only. Main: full workspace on weekly cron.
when:
  - event: [push, pull_request]
  - event: cron
    cron: weekly

steps:
  - name: cargo-mutants-pr
    image: eel/build-image:latest
    when:
      event: pull_request
    commands:
      - |
        # Find crates changed relative to main and run cargo-mutants on them only.
        git fetch origin main --depth=1
        changed_crates=$(git diff --name-only origin/main...HEAD \
          | grep -E '^(packages|services|tools)/[^/]+/.*\.rs$' \
          | sed 's|/[^/]*$||' \
          | sort -u \
          | xargs -I{} sh -c 'find {} -name "Cargo.toml" -maxdepth 2 -print' \
          | sed 's|/Cargo.toml||' \
          | sort -u)
        if [ -z "$changed_crates" ]; then
          echo "no changed Rust crates, skip mutation"
          exit 0
        fi
        for crate in $changed_crates; do
          echo "==> mutation testing $crate"
          cargo mutants \
            --manifest-path "$crate/Cargo.toml" \
            --timeout 120 \
            --output mutation-report-$(basename "$crate").json \
            -- --no-fail-fast
        done

  - name: cargo-mutants-main
    image: eel/build-image:latest
    when:
      branch: main
      event: [push, cron]
    commands:
      - |
        echo "==> full workspace mutation test"
        cargo mutants --workspace --timeout 120 --output mutation-report-full.json

  artifacts:
    - mutation-report-*.json
