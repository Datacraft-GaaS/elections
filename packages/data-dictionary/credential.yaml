# Credential issuance data dictionary
# Data classes: A=PII-sensitive, B=PII-adjacent, C=system/non-PII, D=metadata/operational
# Credentials are W3C Verifiable Credentials issued by transparency-svc via HSM
# Lawful basis: Kenya DPA 2019 s.25 public task; Elections Act s.4 officer and kit authorisation
context: credential
service: transparency-svc
updated: "2026-08-21"
tables:
  - table: credentials
    description: "W3C Verifiable Credentials issued by the HSM signer for voters, election officers, and kits"
    store: T1-credentials
    columns:
      - column: credential_id
        type: "UUID"
        data_class: C
        pii_purpose: "Not PII - system identifier"
        retention: "Credential validity + 5 years"
        notes: "UUIDv7; primary key"
      - column: subject_id
        type: "TEXT"
        data_class: B
        pii_purpose: "DID or SPIFFE URI of the credential subject; PII-adjacent for voter credentials"
        retention: "Credential validity + 5 years"
        notes: "For voter VCs: pseudonymous DID; for officer/kit VCs: SPIFFE URI; no national_id"
      - column: credential_type
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - credential schema type"
        retention: "Credential validity + 5 years"
        notes: "Values: VoterCard, PresidingOfficerAuth, KitAttestation, WitnessAccreditation"
      - column: issuer_id
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - DID of the issuing authority"
        retention: "Credential validity + 5 years"
        notes: "did:web:eel.local issuer DID; maps to HSM public key"
      - column: issued_at
        type: "TIMESTAMPTZ"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Credential validity + 5 years"
        notes: "HLC of issuance"
      - column: expiry
        type: "TIMESTAMPTZ"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Credential validity + 5 years"
        notes: "Voter VCs: election day end; officer/kit: shift end or election cycle end"
      - column: vc_ref
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - MinIO object reference for signed VC JSON-LD"
        retention: "Credential validity + 5 years"
        notes: "MinIO path; VC payload signed by HSM; not stored inline"
      - column: hsm_sig
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - HSM signature over VC"
        retention: "Credential validity + 5 years"
        notes: "Ed25519 by election HSM; verifiable by published public cert"
      - column: revoked_at
        type: "TIMESTAMPTZ"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Credential validity + 5 years"
        notes: "Null when active; HLC of revocation"
      - column: revoked_by
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - SPIFFE ID of revoking service or officer"
        retention: "Credential validity + 5 years"
        notes: "Logged for accountability"
      - column: revocation_reason
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - reason code for revocation"
        retention: "Credential validity + 5 years"
        notes: "Values: kit_compromised, officer_removed, voter_disenfranchised, test_credential"

  - table: credential_batches
    description: "Batch issuance records for high-volume credential campaigns (voter card runs, kit provisioning)"
    store: T1-credentials
    columns:
      - column: batch_id
        type: "UUID"
        data_class: C
        pii_purpose: "Not PII - system identifier"
        retention: "Election cycle + 5 years"
        notes: "UUIDv7; primary key"
      - column: batch_type
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - type of credentials in batch"
        retention: "Election cycle + 5 years"
        notes: "Values: voter_card, kit_attestation, officer_auth"
      - column: count
        type: "INTEGER"
        data_class: D
        pii_purpose: "Operational metadata - number of credentials in batch"
        retention: "Election cycle + 5 years"
        notes: "Used for reconciliation against voter register counts"
      - column: issued_by
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - SPIFFE ID of issuing service instance"
        retention: "Election cycle + 5 years"
        notes: "transparency-svc SPIFFE URI; logged for accountability"
      - column: issued_at
        type: "TIMESTAMPTZ"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Election cycle + 5 years"
        notes: "HLC of batch completion"
      - column: election_id
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - election cycle this batch is scoped to"
        retention: "Election cycle + 5 years"
        notes: "e.g. KE-2027-GEN; credentials invalid outside their election scope"

  - table: events
    description: "Append-only event-store for all credential domain events (issuance, revocation, batch)"
    store: T2-eventstore
    columns:
      - column: id
        type: "UUID"
        data_class: C
        pii_purpose: "Not PII - event identifier"
        retention: "Elections Act s.32: 15 years"
        notes: "UUIDv7; primary key; append-only"
      - column: stream_id
        type: "UUID"
        data_class: C
        pii_purpose: "Not PII - aggregate stream identifier (credential_id or batch_id)"
        retention: "Elections Act s.32: 15 years"
        notes: "Identifies the aggregate this event belongs to"
      - column: stream_version
        type: "BIGINT"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Elections Act s.32: 15 years"
        notes: "Monotonically increasing per stream"
      - column: event_type
        type: "TEXT"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Elections Act s.32: 15 years"
        notes: "e.g. credential.issued, credential.revoked, credential.batch.completed"
      - column: payload_hash
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - SHA-256 of serialised event payload"
        retention: "Elections Act s.32: 15 years"
        notes: "Payload in MinIO; hash enables tamper detection"
      - column: metadata_hash
        type: "TEXT"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Elections Act s.32: 15 years"
        notes: "SHA-256 of CloudEvents metadata headers"
      - column: producer_sig
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - service signing key signature"
        retention: "Elections Act s.32: 15 years"
        notes: "Ed25519 by transparency-svc SPIFFE private key"
      - column: hsm_countersig
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - HSM countersignature"
        retention: "Elections Act s.32: 15 years"
        notes: "All credential events are HSM co-signed"
      - column: recorded_at
        type: "TIMESTAMPTZ"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Elections Act s.32: 15 years"
        notes: "Wall-clock insert time"
      - column: hlc
        type: "TEXT"
        data_class: D
        pii_purpose: "Operational metadata"
        retention: "Elections Act s.32: 15 years"
        notes: "HLC string; authoritative ordering key"
      - column: prev_hash
        type: "TEXT"
        data_class: C
        pii_purpose: "Not PII - hash-chain link"
        retention: "Elections Act s.32: 15 years"
        notes: "SHA-256 of preceding event id"
