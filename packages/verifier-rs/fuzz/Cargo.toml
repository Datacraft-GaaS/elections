[package]
name = "verifier-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
eel_verifier   = { path = "..", default-features = false, features = ["cdylib"] }
hex            = "0.4"
serde_json     = "1"

[[bin]]
name = "fuzz_inclusion_proof"
path = "fuzz_targets/fuzz_inclusion_proof.rs"
test = false
doc = false

[[bin]]
name = "fuzz_consistency_proof"
path = "fuzz_targets/fuzz_consistency_proof.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sth_parse"
path = "fuzz_targets/fuzz_sth_parse.rs"
test = false
doc = false
