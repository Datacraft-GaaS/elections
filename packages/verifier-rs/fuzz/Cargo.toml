[package]
name = "verifier-rs-fuzz"
version = "0.1.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
eel_verifier   = { version = "0.1.0", path = "..", default-features = false, features = ["cdylib"] }
hex            = "0.4"
serde_json     = "1"

[[bin]]
name = "fuzz_inclusion_proof"
path = "fuzz_targets/fuzz_inclusion_proof.rs"
test = false
doc = false

[[bin]]
name = "fuzz_consistency_proof"
path = "fuzz_targets/fuzz_consistency_proof.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sth_parse"
path = "fuzz_targets/fuzz_sth_parse.rs"
test = false
doc = false

# Detached from the parent workspace on purpose: the root member globs do not
# include fuzz/, so without this cargo walks up, finds the root, and rejects
# the manifest for claiming a workspace it is not a member of. This is the
# arrangement the cargo-fuzz book prescribes.
[workspace]
