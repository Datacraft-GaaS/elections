[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-loadshedding-py"
version = "0.1.0"
description = "CoDel-inspired load shedding middleware for the eel platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"starlette>=0.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eel_loadshedding"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
	"pytest>=8.0",
	"pytest-asyncio>=0.24",
	"pyright>=1.1",
	"httpx>=0.27",
]
