[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-events-py"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"pydantic>=2.0",
	"httpx>=0.27",
	"pynacl>=1.5",
	"uuid6>=2024.1.12",
]

[dependency-groups]
dev = [
	"pytest>=8.0",
	"pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eel_events"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
