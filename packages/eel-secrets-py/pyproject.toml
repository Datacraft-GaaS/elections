[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-secrets-py"
version = "0.1.0"
description = "OpenBao (Vault-compatible) secrets client for the eel platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eel_secrets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "respx>=0.21",
]
