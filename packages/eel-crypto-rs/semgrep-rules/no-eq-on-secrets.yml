rules:
  - id: no-eq-on-secrets
    languages: [rust]
    severity: ERROR
    message: >
      Direct equality comparison (`==`) on secret byte types is forbidden.
      Use `eel_crypto_rs::constant_time::ct_eq` or `subtle::ConstantTimeEq`
      to prevent timing side-channel attacks.
    patterns:
      # Match == on any type whose name contains Secret, Key, Token, Hash,
      # Signature, Password, Pin, or Digest.
      - pattern: $A == $B
        metavariable-regex:
          metavariable: $A
          regex: ".*(secret|Secret|key|Key|token|Token|hash|Hash|signature|Signature|password|Password|pin|Pin|digest|Digest|mac|Mac|hmac|Hmac).*"
      - pattern: $A == $B
        metavariable-regex:
          metavariable: $B
          regex: ".*(secret|Secret|key|Key|token|Token|hash|Hash|signature|Signature|password|Password|pin|Pin|digest|Digest|mac|Mac|hmac|Hmac).*"

  - id: no-ne-on-secrets
    languages: [rust]
    severity: ERROR
    message: >
      Direct inequality comparison (`!=`) on secret byte types is forbidden.
      Use `!eel_crypto_rs::constant_time::ct_eq(...)` instead.
    patterns:
      - pattern: $A != $B
        metavariable-regex:
          metavariable: $A
          regex: ".*(secret|Secret|key|Key|token|Token|hash|Hash|signature|Signature|password|Password|pin|Pin|digest|Digest|mac|Mac|hmac|Hmac).*"

  - id: no-partialord-on-secrets
    languages: [rust]
    severity: WARNING
    message: >
      Ordering comparisons on secret values may leak timing information.
      Use constant-time comparison primitives from the `subtle` crate.
    patterns:
      - pattern: $A < $B
        metavariable-regex:
          metavariable: $A
          regex: ".*(secret|Secret|key|Key|password|Password|pin|Pin).*"
      - pattern: $A > $B
        metavariable-regex:
          metavariable: $A
          regex: ".*(secret|Secret|key|Key|password|Password|pin|Pin).*"
