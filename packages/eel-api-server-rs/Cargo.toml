[package]
name = "eel-api-server-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "eel_api_server_rs"
path = "src/lib.rs"

[dependencies]
eel-auth-rs          = { version = "0.1.0", path = "../eel-auth-rs" }
eel-resilience-rs    = { version = "0.1.0", path = "../eel-resilience-rs" }
eel-loadshedding-rs  = { version = "0.1.0", path = "../eel-loadshedding-rs" }
eel-observability-rs = { version = "0.1.0", path = "../eel-observability-rs" }
eel-outbox-rs        = { version = "0.1.0", path = "../eel-outbox-rs" }
eel-events-rs        = { version = "0.1.0", path = "../eel-events-rs" }
eel-secrets-rs       = { version = "0.1.0", path = "../eel-secrets-rs" }
eel-crypto-rs        = { version = "0.1.0", path = "../eel-crypto-rs" }

axum                 = { workspace = true }
tower                = { workspace = true }
tower-http           = { workspace = true }
tonic                = { workspace = true }
tokio                = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
serde_cbor           = { version = "0.11" }
utoipa               = { workspace = true }
utoipa-swagger-ui    = { workspace = true }
thiserror            = { workspace = true }
tracing              = { workspace = true }
uuid                 = { workspace = true }
bytes                = "1"
http                 = "1"
http-body-util       = "0.1"
flate2               = "1"
zstd                 = "0.14"
base64               = "0.22"
prometheus           = { version = "0.14", features = ["process"] }
async-trait          = "0.1"
pin-project-lite     = "0.2"

[dev-dependencies]
tokio                = { workspace = true }
rstest               = { workspace = true }
reqwest              = { version = "0.12", features = ["json"], default-features = false }
