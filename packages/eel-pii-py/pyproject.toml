[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-pii-py"
version = "0.1.0"
description = "PII classification wrappers for the eel platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eel_pii"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
]
