name: eel_core_flutter
description: >-
  eel app-tier core for Flutter: bootstrap FSM, session/auth (OIDC PKCE +
  biometric step-up), config, connectivity probe, tamper events, typed outbox
  drain, problem+json parsing. App-tier (device-tier lives in eel_kit_sdk).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # kit-sdk: EelHttpClient, EelSecureStore, outbox primitives, HLC
  eel_kit_sdk:
    path: ../../packages/kit-sdk-flutter

  # Shared design system (EelScaffold, EelColors, EelTextStyle). Imported by
  # lib/src/gallery, so it is a real dependency rather than a stray import.
  eel_design:
    path: ../eel_design

  # State
  flutter_riverpod: ^2.5.0
  hooks_riverpod: ^2.5.0

  # Auth
  oauth2_client: ^3.3.0
  local_auth: ^2.2.0

  # Connectivity + config
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.0.0

  # Networking + models
  dio: ^5.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  crypto: ^3.0.3
  mocktail: ^1.0.5
  mockito: ^5.4.6
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^3.0.0
flutter:
  generate: false