[project]
name = "eel-service-template"
version = "0.1.0"
description = "FastAPI service cookiecutter template for the eel platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"cookiecutter>=2.5",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []  # Template only, no Python package to install

[tool.pytest.ini_options]
testpaths = ["tests"]
