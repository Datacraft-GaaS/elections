[project]
name = "{{cookiecutter.svc_name}}-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "eel-auth-py>=0.1.0",
    "eel-resilience-py>=0.1.0",
    "eel-loadshedding-py>=0.1.0",
    "eel-observability-py>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
