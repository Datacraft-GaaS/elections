openapi: 3.1.0
info:
  title: eel-governance-post-election-review
  version: 1.0.0
  description: >
    Module M41: Post-Election Review.
    Manages the lifecycle of post-election reviews including data collection,
    analysis, findings, and final report publication.
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: reviews
    description: Post-election review lifecycle
  - name: findings
    description: Review findings

security:
  - bearerAuth: []
  - mtls: []

paths:
  /api/v1/governance/review/reviews:
    post:
      operationId: initiatePostElectionReview
      tags: [reviews]
      summary: Initiate a post-election review
      description: >
        Creates a new post-election review with assigned reviewers.
        Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInitRequest"
      responses:
        "201":
          description: Review initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listPostElectionReviews
      tags: [reviews]
      summary: List post-election reviews
      description: Paginated list of post-election reviews. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: election_id
          in: query
          schema:
            type: string
            format: uuid
            x-eel-data-class: C
        - name: status
          in: query
          schema:
            type: string
            enum: [initiated, collecting, analysing, draft_report, published]
            x-eel-data-class: C
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionReviewPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/review/reviews/{review_id}:
    get:
      operationId: getPostElectionReview
      tags: [reviews]
      summary: Get post-election review detail
      description: Returns full detail for a specific review. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/ReviewIdPath"
      responses:
        "200":
          description: Review detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/review/reviews/{review_id}/findings:
    post:
      operationId: addReviewFinding
      tags: [findings]
      summary: Add a finding to a review
      description: >
        Adds a categorised finding with severity and recommendation to the review.
        Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/ReviewIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewFindingRequest"
      responses:
        "201":
          description: Finding added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewFinding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/review/reviews/{review_id}/publish:
    post:
      operationId: publishReviewReport
      tags: [reviews]
      summary: Publish the final review report
      description: >
        Transitions the review to published status, making the final report
        available. Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/ReviewIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report_url:
                  type: string
                  format: uri
                  description: Presigned MinIO URL to the final report PDF
                  x-eel-data-class: C
      responses:
        "200":
          description: Review published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key
    ReviewIdPath:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-eel-data-class: C
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          x-eel-data-class: D
        page_size:
          type: integer
          x-eel-data-class: D
        total:
          type: integer
          x-eel-data-class: D
        total_pages:
          type: integer
          x-eel-data-class: D

    ReviewerAssignment:
      type: object
      required: [role]
      properties:
        role:
          type: string
          x-eel-data-class: C

    ReviewInitRequest:
      type: object
      required: [election_id, scope, scope_code, reviewers]
      properties:
        election_id:
          type: string
          format: uuid
          x-eel-data-class: C
        scope:
          type: string
          enum: [national, county, constituency]
          x-eel-data-class: C
        scope_code:
          type: string
          description: County or constituency code when scope is not national
          x-eel-data-class: C
        reviewers:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerAssignment"
          minItems: 1
          x-eel-data-class: C

    ElectionReview:
      type: object
      required: [review_id, election_id, scope, scope_code, reviewers, status, created_at]
      properties:
        review_id:
          type: string
          format: uuid
          description: UUIDv7 review identifier
          x-eel-data-class: C
        election_id:
          type: string
          format: uuid
          x-eel-data-class: C
        scope:
          type: string
          enum: [national, county, constituency]
          x-eel-data-class: C
        scope_code:
          type: string
          x-eel-data-class: C
        reviewers:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerAssignment"
          x-eel-data-class: C
        status:
          type: string
          enum: [initiated, collecting, analysing, draft_report, published]
          x-eel-data-class: C
        report_url:
          type: string
          format: uri
          nullable: true
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    ElectionReviewPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ElectionReview"
        meta:
          $ref: "#/components/schemas/PageMeta"

    ReviewFindingRequest:
      type: object
      required: [category, severity, description, recommendation]
      properties:
        category:
          type: string
          x-eel-data-class: C
        severity:
          type: string
          enum: [minor, moderate, major]
          x-eel-data-class: C
        description:
          type: string
          maxLength: 5000
          x-eel-data-class: C
        recommendation:
          type: string
          maxLength: 2000
          x-eel-data-class: C

    ReviewFinding:
      type: object
      required: [finding_id, review_id, category, severity, description, recommendation, created_at]
      properties:
        finding_id:
          type: string
          format: uuid
          description: UUIDv7 finding identifier
          x-eel-data-class: C
        review_id:
          type: string
          format: uuid
          x-eel-data-class: C
        category:
          type: string
          x-eel-data-class: C
        severity:
          type: string
          enum: [minor, moderate, major]
          x-eel-data-class: C
        description:
          type: string
          x-eel-data-class: C
        recommendation:
          type: string
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
