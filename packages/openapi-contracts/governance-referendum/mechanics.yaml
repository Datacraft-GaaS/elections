openapi: 3.1.0
info:
  title: eel-governance-referendum
  version: 1.0.0
  description: >
    Module M49: Referendum Mechanics.
    Public transparency for referendum questions and results, plus the
    24-of-47 county compliance threshold tracker. Admin endpoint for
    registering referendum questions.
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: questions
    description: Referendum questions
  - name: results
    description: Referendum results
  - name: threshold
    description: County threshold compliance

security:
  - bearerAuth: []

paths:
  /api/v1/governance/referendum/questions:
    get:
      operationId: listReferendumQuestions
      tags: [questions]
      summary: List referendum questions
      description: >
        Returns all registered referendum questions in English and Swahili.
        Tier 1 public endpoint with Merkle proof.
      security: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      responses:
        "200":
          description: Referendum questions
          headers:
            X-Eel-Cosign-Sig:
              description: Ed25519 co-signature over response body
              schema:
                type: string
            X-Eel-Merkle-Proof:
              description: Merkle inclusion proof
              schema:
                type: string
            X-Eel-Snapshot-Id:
              description: Snapshot identifier (UUIDv7)
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                required: [questions]
                properties:
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReferendumQuestion"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: registerReferendumQuestion
      tags: [questions]
      summary: Register a referendum question (admin)
      description: >
        Registers a referendum question with bilingual text and answer options.
        Requires gazette reference. Tier 3 admin endpoint. Idempotent via Idempotency-Key.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferendumQuestionRequest"
      responses:
        "201":
          description: Referendum question registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferendumQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/referendum/results:
    get:
      operationId: getReferendumResults
      tags: [results]
      summary: Referendum results
      description: >
        Returns national and per-county yes/no vote counts.
        Tier 1 public endpoint with Merkle proof.
      security: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      responses:
        "200":
          description: Referendum results
          headers:
            X-Eel-Cosign-Sig:
              schema:
                type: string
            X-Eel-Merkle-Proof:
              schema:
                type: string
            X-Eel-Snapshot-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferendumResults"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/referendum/county-threshold:
    get:
      operationId: getCountyThresholdStatus
      tags: [threshold]
      summary: 24-of-47 county compliance status
      description: >
        Returns whether the referendum has met the constitutional requirement
        of approval in at least 24 of 47 counties. Tier 1 public endpoint with Merkle proof.
      security: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      responses:
        "200":
          description: County threshold status
          headers:
            X-Eel-Cosign-Sig:
              schema:
                type: string
            X-Eel-Merkle-Proof:
              schema:
                type: string
            X-Eel-Snapshot-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountyThresholdStatus"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    ReferendumOption:
      type: object
      required: [label, code]
      properties:
        label:
          type: string
          x-eel-data-class: C
        code:
          type: string
          x-eel-data-class: C

    ReferendumQuestionRequest:
      type: object
      required: [question_id, text_en, text_sw, gazette_ref, options]
      properties:
        question_id:
          type: string
          x-eel-data-class: C
        text_en:
          type: string
          description: Question text in English
          x-eel-data-class: C
        text_sw:
          type: string
          description: Question text in Swahili
          x-eel-data-class: C
        gazette_ref:
          type: string
          description: Kenya Gazette reference for the referendum
          x-eel-data-class: C
        options:
          type: array
          items:
            $ref: "#/components/schemas/ReferendumOption"
          minItems: 2
          x-eel-data-class: C

    ReferendumQuestion:
      type: object
      required: [question_id, text_en, text_sw, gazette_ref, options, created_at]
      properties:
        question_id:
          type: string
          x-eel-data-class: C
        text_en:
          type: string
          x-eel-data-class: C
        text_sw:
          type: string
          x-eel-data-class: C
        gazette_ref:
          type: string
          x-eel-data-class: C
        options:
          type: array
          items:
            $ref: "#/components/schemas/ReferendumOption"
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C

    CountyResult:
      type: object
      required: [county_code, county_name, yes_votes, no_votes, total_votes, approved]
      properties:
        county_code:
          type: string
          x-eel-data-class: C
        county_name:
          type: string
          x-eel-data-class: C
        yes_votes:
          type: integer
          x-eel-data-class: C
        no_votes:
          type: integer
          x-eel-data-class: C
        total_votes:
          type: integer
          x-eel-data-class: C
        approved:
          type: boolean
          description: Whether yes votes exceed 50% in this county
          x-eel-data-class: C

    ReferendumResults:
      type: object
      required: [question_id, national_yes, national_no, national_total, county_results, snapshot_at]
      properties:
        question_id:
          type: string
          x-eel-data-class: C
        national_yes:
          type: integer
          x-eel-data-class: C
        national_no:
          type: integer
          x-eel-data-class: C
        national_total:
          type: integer
          x-eel-data-class: C
        county_results:
          type: array
          items:
            $ref: "#/components/schemas/CountyResult"
          x-eel-data-class: C
        snapshot_at:
          type: string
          format: date-time
          x-eel-data-class: C

    CountyThresholdStatus:
      type: object
      required: [counties_required, counties_approved, threshold_met, snapshot_at]
      properties:
        counties_required:
          type: integer
          description: Constitutional minimum (24)
          x-eel-data-class: C
        counties_approved:
          type: integer
          description: Counties where yes votes exceed 50%
          x-eel-data-class: C
        threshold_met:
          type: boolean
          x-eel-data-class: C
        county_breakdown:
          type: array
          items:
            type: object
            required: [county_code, approved]
            properties:
              county_code:
                type: string
                x-eel-data-class: C
              approved:
                type: boolean
                x-eel-data-class: C
        snapshot_at:
          type: string
          format: date-time
          x-eel-data-class: C

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
