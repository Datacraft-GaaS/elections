openapi: 3.1.0
info:
  title: eel-governance-intl-observer
  version: 1.0.0
  description: >
    Module M57: International Observer Coordination.
    Manages accreditation and reporting for international election observer missions.
    Lead observer identity is stored as a hash (class B).
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: missions
    description: Observer mission lifecycle
  - name: reports
    description: Observer mission reports

security:
  - bearerAuth: []
  - mtls: []

paths:
  /api/v1/governance/intl-observer/missions:
    post:
      operationId: registerObserverMission
      x-handler-bound: governance-svc.governance-intl-observer.register_observer_mission
      tags: [missions]
      summary: Register an international observer mission
      description: >
        Creates an observer mission record with accreditation details.
        Lead observer identity is stored as a hash. Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObserverMissionRequest"
      responses:
        "201":
          description: Mission registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserverMission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listObserverMissions
      x-handler-bound: governance-svc.governance-intl-observer.list_observer_missions
      tags: [missions]
      summary: List observer missions
      description: Paginated list of international observer missions. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [registered, accredited, deployed, completed]
            x-eel-data-class: C
        - name: country_of_origin
          in: query
          schema:
            type: string
            x-eel-data-class: C
      responses:
        "200":
          description: Mission list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserverMissionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/intl-observer/missions/{mission_id}:
    get:
      operationId: getObserverMission
      x-handler-bound: governance-svc.governance-intl-observer.get_observer_mission
      tags: [missions]
      summary: Get observer mission detail
      description: Returns full detail for a specific mission. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/MissionIdPath"
      responses:
        "200":
          description: Mission detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserverMission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/intl-observer/missions/{mission_id}/reports:
    post:
      operationId: submitObserverReport
      x-handler-bound: governance-svc.governance-intl-observer.submit_observer_report
      tags: [reports]
      summary: Submit an observer mission report
      description: >
        Submits a preliminary, interim, or final observer report.
        Evidence references (e.g. MinIO object keys) can be attached.
        Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/MissionIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObserverReportRequest"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserverReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listObserverReports
      x-handler-bound: governance-svc.governance-intl-observer.list_observer_reports
      tags: [reports]
      summary: List reports for an observer mission
      description: Paginated list of reports for a mission. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/MissionIdPath"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: report_type
          in: query
          schema:
            type: string
            enum: [preliminary, interim, final]
            x-eel-data-class: C
      responses:
        "200":
          description: Report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserverReportPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key
    MissionIdPath:
      name: mission_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-eel-data-class: C
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          x-eel-data-class: D
        page_size:
          type: integer
          x-eel-data-class: D
        total:
          type: integer
          x-eel-data-class: D
        total_pages:
          type: integer
          x-eel-data-class: D

    ObserverMissionRequest:
      type: object
      required: [mission_name, organisation, lead_observer_id_hash, country_of_origin, observer_count, accreditation_ref]
      properties:
        mission_name:
          type: string
          x-eel-data-class: C
        organisation:
          type: string
          x-eel-data-class: C
        lead_observer_id_hash:
          type: string
          description: SHA-256 hash of lead observer identity document
          x-eel-data-class: B
        country_of_origin:
          type: string
          x-eel-data-class: C
        observer_count:
          type: integer
          minimum: 1
          x-eel-data-class: C
        accreditation_ref:
          type: string
          x-eel-data-class: C

    ObserverMission:
      type: object
      required: [mission_id, mission_name, organisation, lead_observer_id_hash, country_of_origin, observer_count, accreditation_ref, status, created_at]
      properties:
        mission_id:
          type: string
          format: uuid
          description: UUIDv7 mission identifier
          x-eel-data-class: C
        mission_name:
          type: string
          x-eel-data-class: C
        organisation:
          type: string
          x-eel-data-class: C
        lead_observer_id_hash:
          type: string
          x-eel-data-class: B
        country_of_origin:
          type: string
          x-eel-data-class: C
        observer_count:
          type: integer
          x-eel-data-class: C
        accreditation_ref:
          type: string
          x-eel-data-class: C
        status:
          type: string
          enum: [registered, accredited, deployed, completed]
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    ObserverMissionPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObserverMission"
        meta:
          $ref: "#/components/schemas/PageMeta"

    ObserverReportRequest:
      type: object
      required: [report_type, findings, recommendations]
      properties:
        report_type:
          type: string
          enum: [preliminary, interim, final]
          x-eel-data-class: C
        findings:
          type: string
          maxLength: 20000
          x-eel-data-class: C
        recommendations:
          type: string
          maxLength: 10000
          x-eel-data-class: C
        evidence_refs:
          type: array
          items:
            type: string
          description: MinIO object keys or external URIs for supporting evidence
          x-eel-data-class: C

    ObserverReport:
      type: object
      required: [report_id, mission_id, report_type, findings, recommendations, created_at]
      properties:
        report_id:
          type: string
          format: uuid
          description: UUIDv7 report identifier
          x-eel-data-class: C
        mission_id:
          type: string
          format: uuid
          x-eel-data-class: C
        report_type:
          type: string
          enum: [preliminary, interim, final]
          x-eel-data-class: C
        findings:
          type: string
          x-eel-data-class: C
        recommendations:
          type: string
          x-eel-data-class: C
        evidence_refs:
          type: array
          items:
            type: string
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C

    ObserverReportPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObserverReport"
        meta:
          $ref: "#/components/schemas/PageMeta"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
