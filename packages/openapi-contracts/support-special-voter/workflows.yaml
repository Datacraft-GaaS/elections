openapi: "3.1.0"

info:
  title: eel-support-special-voter
  version: "1.0.0"
  description: |
    Module M25 special voter workflows (WP-5.5).

    Manages five special-voter categories: REMAND_PRISON, HOSPITAL, BARRACKS,
    REFUGEE_CAMP (conditional on REFUGEE_VOTING_ENABLED flag), and IDP_CAMP.
    Includes facility management, event log, special Form 34 variants,
    IDP reassignment, s.44A override guardrails, and IAB 5% sample audit.

    Trust domain: eel.local. Internal kit submission uses SVID mTLS.
    Public endpoints are Tier 1 (signed-static, CDN).
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: "https://support-admin.eel.local"
    description: "Internal (mTLS required for kit endpoints)"
  - url: "https://api.eel.local"
    description: "External API gateway (JWT required)"

security:
  - BearerJWT: []

tags:
  - name: facilities
    description: "Special voter facility management"
  - name: events
    description: "Special voter event log"
  - name: forms
    description: "Special Form 34 variants"
  - name: idp
    description: "IDP voter reassignment"
  - name: audit
    description: "IAB 5% sample audit"
  - name: public
    description: "Public voter count endpoints (Tier 1)"

paths:
  /v1/special/facilities:
    get:
      operationId: listSpecialFacilities
      x-handler-bound: support-admin-svc.support-special-voter.list_special_facilities
      tags: [facilities]
      summary: "List all special voter facilities"
      security:
        - BearerJWT: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [REMAND_PRISON, HOSPITAL, BARRACKS, REFUGEE_CAMP, IDP_CAMP]
        - name: county_code
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "Facility list"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialVoterFacility"

  /v1/special/facilities/{id}:
    get:
      operationId: getSpecialFacility
      x-handler-bound: support-admin-svc.support-special-voter.get_special_facility
      tags: [facilities]
      summary: "Facility detail and status"
      security:
        - BearerJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Facility detail"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialVoterFacility"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/special/facilities/{id}/events:
    post:
      operationId: submitSpecialVoterEvent
      x-handler-bound: support-admin-svc.support-special-voter.submit_special_voter_event
      tags: [events]
      summary: "Submit special voter event from kit"
      description: |
        Internal gRPC / HTTP; kit SVID mTLS only. Idempotent via Idempotency-Key.
        Event anchored to Merkle chain within 60 minutes.
      security:
        - KitMTLS: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialVoterEventRequest"
      responses:
        "202":
          description: "Accepted"
        "422":
          description: "Idempotency key reuse or validation error"
    get:
      operationId: listSpecialVoterEvents
      x-handler-bound: support-admin-svc.support-special-voter.list_special_voter_events
      tags: [events]
      summary: "Event log for a facility"
      security:
        - BearerJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Event list"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialVoterEventRecord"

  /v1/special/forms/34:
    post:
      operationId: submitSpecialForm34
      x-handler-bound: support-admin-svc.support-special-voter.submit_special_form34
      tags: [forms]
      summary: "Submit special Form 34 from kit"
      security:
        - KitMTLS: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialForm34Request"
      responses:
        "202":
          description: "Accepted; form queued for Merkle anchor"
    get:
      operationId: listSpecialForms34
      x-handler-bound: support-admin-svc.support-special-voter.list_special_forms34
      tags: [forms]
      summary: "List published special Form 34 variants"
      security: []
      responses:
        "200":
          description: "Form list"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialForm34Summary"

  /v1/special/forms/34/{id}:
    get:
      operationId: getSpecialForm34
      x-handler-bound: support-admin-svc.support-special-voter.get_special_form34
      tags: [forms]
      summary: "Single form with Merkle proof"
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Form detail with Merkle proof"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialForm34Detail"

  /v1/special/idp/reassignments:
    post:
      operationId: recordIDPReassignment
      x-handler-bound: support-admin-svc.support-special-voter.record_idp_reassignment
      tags: [idp]
      summary: "Record IDP voter reassignment"
      description: "IEBC officer JWT required. Idempotent. Triggers overcounting guard."
      security:
        - BearerJWT: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IDPReassignmentRequest"
      responses:
        "201":
          description: "Created"
        "409":
          description: "Voter already reassigned"

  /v1/special/dashboard:
    get:
      operationId: getSpecialDashboard
      x-handler-bound: support-admin-svc.support-special-voter.get_special_dashboard
      tags: [facilities]
      summary: "Ops coordinator live status"
      security:
        - BearerJWT: []
      responses:
        "200":
          description: "Live dashboard"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialDashboard"

  /v1/special/audit/sample/{category}:
    get:
      operationId: getAuditSample
      x-handler-bound: support-admin-svc.support-special-voter.get_audit_sample
      tags: [audit]
      summary: "IAB random 5% sample authentication logs"
      description: "IAB_AUDITOR JWT required. Rate-limited 10/hr."
      security:
        - BearerJWT: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [REMAND_PRISON, HOSPITAL, BARRACKS, REFUGEE_CAMP, IDP_CAMP]
        - name: merkle_seed
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Audit sample"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSample"
        "429":
          description: "Rate limit exceeded"

  /v1/special/public/counts:
    get:
      operationId: getPublicVoterCounts
      x-handler-bound: support-admin-svc.support-special-voter.get_public_voter_counts
      tags: [public]
      summary: "Voter counts per facility (no PII)"
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "Public voter counts"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicFacilityCount"

components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    KitMTLS:
      type: mutualTLS
      description: "SVID mTLS for kit certificate"

  responses:
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    SpecialVoterFacility:
      type: object
      required: [id, category, county_code, presiding_officer_id, voting_date, session_state]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum: [REMAND_PRISON, HOSPITAL, BARRACKS, REFUGEE_CAMP, IDP_CAMP]
        county_code:
          type: string
        presiding_officer_id:
          type: string
        voting_date:
          type: string
          format: date
        published_voter_count:
          type: integer
        session_state:
          type: string
          enum: [SEALED, DUAL_BIOMETRIC_PENDING, OPEN, SUSPENDED, CLOSED]
        violation_pending_ack:
          type: boolean

    SpecialVoterEventRequest:
      type: object
      required: [event_type, officer_id, witness_ids]
      properties:
        event_type:
          type: string
        officer_id:
          type: string
        witness_ids:
          type: array
          items:
            type: string
        reason_code:
          type: string

    SpecialVoterEventRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        officer_id:
          type: string
        witness_ids:
          type: array
          items:
            type: string
        reason_code:
          type: string
        merkle_node_id:
          type: string
        event_at:
          type: string
          format: date-time

    SpecialForm34Request:
      type: object
      required: [facility_id, form_variant, tallies, signatures]
      properties:
        facility_id:
          type: string
          format: uuid
        form_variant:
          type: string
          enum: [34A-R, 34A-H, 34A-B, 34A-I]
        tallies:
          type: object
        signatures:
          type: array
          items:
            type: string

    SpecialForm34Summary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
        form_variant:
          type: string
        transmitted_at:
          type: string
          format: date-time
        merkle_node_id:
          type: string

    SpecialForm34Detail:
      allOf:
        - $ref: "#/components/schemas/SpecialForm34Summary"
        - type: object
          properties:
            tallies:
              type: object
            merkle_proof:
              type: array
              items:
                type: string

    IDPReassignmentRequest:
      type: object
      required: [voter_id_enc, original_station_code, idp_facility_id, displacement_source, effective_date]
      properties:
        voter_id_enc:
          type: string
          description: "Encrypted voter ID; never transmitted in plaintext"
        original_station_code:
          type: string
        idp_facility_id:
          type: string
          format: uuid
        displacement_source:
          type: string
          enum: [UNHCR, NDOC, RED_CROSS, COUNTY_GOVT, OTHER]
        effective_date:
          type: string
          format: date

    SpecialDashboard:
      type: object
      properties:
        facilities:
          type: array
          items:
            $ref: "#/components/schemas/SpecialVoterFacility"
        violation_events:
          type: array
          items:
            type: object

    AuditSample:
      type: object
      properties:
        category:
          type: string
        merkle_seed:
          type: string
        sampled_event_ids:
          type: array
          items:
            type: string
            format: uuid
        sample_fraction:
          type: number

    PublicFacilityCount:
      type: object
      properties:
        facility_id:
          type: string
          format: uuid
        category:
          type: string
        county_code:
          type: string
        published_voter_count:
          type: integer

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
