        transferred_at:
          type: string
          format: date-time
          x-eel-data-class: D
        officer_id:
          type: string
          description: Officer who authorised the transfer
          x-eel-data-class: C
        witness_id:
          type: string
          nullable: true
          description: Witnessing officer (required for election_day_deployment)
          x-eel-data-class: C

    CustodyTransferCreate:
      type: object
      required:
        - to_custodian_id
        - to_location
        - reason
        - officer_id
      properties:
        to_custodian_id:
          type: string
          x-eel-data-class: C
        to_location:
          type: string
          x-eel-data-class: C
        reason:
          type: string
          enum:
            - initial_assignment
            - election_day_deployment
            - post_election_return
            - maintenance
            - reallocation
            - reconciliation
          x-eel-data-class: C
        officer_id:
          type: string
          x-eel-data-class: C
        witness_id:
          type: string
          x-eel-data-class: C

    CustodyTransferPage:
      type: object
      required: [items, total, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustodyTransfer'
        total:
          type: integer
          x-eel-data-class: D
        next_cursor:
          type: string
          nullable: true
          x-eel-data-class: D

    Seal:
      type: object
      required:
        - seal_id
        - asset_id
        - seal_number
        - sealed_by_id
        - sealed_at
        - status
      properties:
        seal_id:
          type: string
          description: Unique seal identifier
          x-eel-data-class: C
        asset_id:
          type: string
          x-eel-data-class: C
        seal_number:
          type: string
          description: Physical seal serial printed on the tag
          x-eel-data-class: C
          example: SL-2026-0048821
        sealed_by_id:
          type: string
          description: Officer who applied the seal
          x-eel-data-class: C
        sealed_at:
          type: string
          format: date-time
          x-eel-data-class: D
        status:
          type: string
          enum: [intact, broken, voided]
          x-eel-data-class: C

    SealCreate:
      type: object
      required:
        - asset_id
        - seal_number
        - sealed_by_id
      properties:
        asset_id:
          type: string
          x-eel-data-class: C
        seal_number:
          type: string
          x-eel-data-class: C
        sealed_by_id:
          type: string
          x-eel-data-class: C

    SealBreak:
      type: object
      required:
        - break_id
        - seal_id
        - broken_by_id
        - countersign_id
        - reason
        - broken_at
      properties:
        break_id:
          type: string
          description: Unique break-event identifier
          x-eel-data-class: C
        seal_id:
          type: string
          x-eel-data-class: C
        broken_by_id:
          type: string
          description: Primary officer who broke the seal
          x-eel-data-class: C
        countersign_id:
          type: string
          description: Counter-signing officer (dual-control)
          x-eel-data-class: C
        reason:
          type: string
          enum:
            - count_commencement
            - inspection
            - evidence_seizure
            - authorised_recount
          x-eel-data-class: C
        broken_at:
          type: string
          format: date-time
          x-eel-data-class: D

    SealBreakCreate:
      type: object
      required:
        - broken_by_id
        - countersign_id
        - reason
      properties:
        broken_by_id:
          type: string
          x-eel-data-class: C
        countersign_id:
          type: string
          x-eel-data-class: C
        reason:
          type: string
          enum:
            - count_commencement
            - inspection
            - evidence_seizure
            - authorised_recount
          x-eel-data-class: C

    Reserve:
      type: object
      required:
        - reserve_id
        - asset_type
        - location
        - quantity
        - min_threshold
        - status
      properties:
        reserve_id:
          type: string
          description: Unique reserve record identifier
          x-eel-data-class: C
        asset_type:
          type: string
          enum: [ballot_box, ream_paper, stamp_set, result_form, biometric_kit, seal, other]
          x-eel-data-class: C
        location:
          type: string
          description: Warehouse or depot location code
          x-eel-data-class: C
          example: DEPOT-NAIROBI-EAST
        quantity:
          type: integer
          minimum: 0
          description: Units currently on hand
          x-eel-data-class: C
        min_threshold:
          type: integer
          minimum: 0
          description: Minimum stock level triggering a low-stock alert
          x-eel-data-class: C
        status:
          type: string
          enum: [adequate, low, critical, depleted]
          description: Computed from quantity vs. min_threshold
          x-eel-data-class: C

    ReservePage:
      type: object
      required: [items, total, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reserve'
        total:
          type: integer
          x-eel-data-class: D
        next_cursor:
          type: string
          nullable: true
          x-eel-data-class: D

    CustodySummary:
      type: object
      required:
        - total_assets
        - assets_in_custody
        - assets_in_transit
        - broken_seals_today
        - discrepancy_count
        - generated_at
      properties:
        total_assets:
          type: integer
          description: Total registered assets in scope
          x-eel-data-class: D
        assets_in_custody:
          type: integer
          description: Assets with status in_custody
          x-eel-data-class: D
        assets_in_transit:
          type: integer
          description: Assets with status in_transit
          x-eel-data-class: D
        broken_seals_today:
          type: integer
          description: Seal-break events recorded on the current calendar day (UTC)
          x-eel-data-class: D
        discrepancy_count:
          type: integer
          description: Open discrepancies from reconciliation sessions
          x-eel-data-class: D
        generated_at:
          type: string
          format: date-time
          description: Timestamp at which the snapshot was computed
          x-eel-data-class: D

    Discrepancy:
      type: object
      required: [asset_type, issue]
      properties:
        asset_type:
          type: string
          x-eel-data-class: C
        serial_number:
          type: string
          nullable: true
          x-eel-data-class: C
        issue:
          type: string
          enum: [missing, extra, damaged, wrong_location]
          x-eel-data-class: C
        notes:
          type: string
          nullable: true
          x-eel-data-class: C

    ReconcileReport:
      type: object
      required:
        - reconcile_id
        - station_code
        - election_id
        - assets_expected
        - assets_found
        - discrepancies
        - status
        - officer_id
      properties:
        reconcile_id:
          type: string
          description: Unique reconciliation session identifier
          x-eel-data-class: C
        station_code:
          type: string
          description: Polling station or depot being reconciled
          x-eel-data-class: C
          example: POLL-NRB-001
        election_id:
          type: string
          x-eel-data-class: C
          example: elec-2026-general
        assets_expected:
          type: integer
          description: Total assets the system expected to find at the station
          x-eel-data-class: C
        assets_found:
          type: integer
          description: Total assets physically verified
          x-eel-data-class: C
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/Discrepancy'
          x-eel-data-class: C
        status:
          type: string
          enum: [pending, in_progress, reconciled, discrepancy_found]
          x-eel-data-class: C
        officer_id:
          type: string
          description: Officer conducting the reconciliation
          x-eel-data-class: C

    ReconcileCreate:
      type: object
      required:
        - station_code
        - election_id
        - assets_expected
        - assets_found
        - discrepancies
        - officer_id
      properties:
        station_code:
          type: string
          x-eel-data-class: C
        election_id:
          type: string
          x-eel-data-class: C
        assets_expected:
          type: integer
          x-eel-data-class: C
        assets_found:
          type: integer
          x-eel-data-class: C
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/Discrepancy'
          x-eel-data-class: C
        officer_id:
          type: string
          x-eel-data-class: C

    # ---- Error schema ----

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI
        title:
          type: string
          description: Human-readable short title
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation of this occurrence
        instance:
          type: string
          format: uri-reference
          description: URI identifying this specific occurrence
        trace_id:
          type: string
          description: Distributed trace identifier for correlation
          example: 4bf92f3577b34da6a3ce929d0e0e4736

  # ---- Shared error responses ----

  responses:
    BadRequest:
      description: Bad request, malformed input
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.eel.internal/common/bad_request
            title: Bad Request
            status: 400
            detail: 'serial_number: field is required'
            instance: /api/v1/custody/assets

    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.eel.internal/common/unauthorized
            title: Unauthorized
            status: 401
            detail: Bearer token is missing or has expired.
            instance: /api/v1/custody/assets

    Forbidden:
      description: Valid JWT but SpiceDB permission check failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.eel.internal/common/forbidden
            title: Forbidden
            status: 403
            detail: Caller does not hold the required permission for this resource.
            instance: /api/v1/custody/assets

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.eel.internal/common/not_found
            title: Not Found
            status: 404
            detail: No asset found with the provided identifier.
            instance: /api/v1/custody/assets/ast-unknown

    Conflict:
      description: State conflict, resource already exists or concurrent modification
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.eel.internal/common/conflict
            title: Conflict
            status: 409
            detail: An asset with this serial number already exists.
            instance: /api/v1/custody/assets

    UnprocessableEntity:
      description: Semantically invalid request, validation passed but business rule failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.eel.internal/custody/invalid_transition
            title: Unprocessable Entity
            status: 422
            detail: Asset is already sealed; break the existing seal before applying a new one.
            instance: /api/v1/custody/seals

    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.eel.internal/common/internal_error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred. Use trace_id to report this incident.
            instance: /api/v1/custody/assets
            trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
