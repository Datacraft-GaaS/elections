          description: Unique transfer event identifier
          x-eel-data-class: C
        asset_id:
          type: string
          x-eel-data-class: C
        from_custodian_id:
          type: string
          x-eel-data-class: C
        to_custodian_id:
          type: string
          x-eel-data-class: C
        from_location:
          type: string
          x-eel-data-class: C
        to_location:
          type: string
          x-eel-data-class: C
        reason:
          type: string
          enum:
            - initial_assignment
            - election_day_deployment
            - post_election_return
            - maintenance
            - reallocation
            - reconciliation
