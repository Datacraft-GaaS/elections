openapi: 3.1.0
info:
  title: eel-governance-county-coord
  version: 1.0.0
  description: >
    Module M56: County-National Coordination.
    County coordinators submit polling-day status reports and escalate critical
    incidents to the national operations centre.
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: status-reports
    description: County polling-day status reports
  - name: escalations
    description: County-to-national escalations

security:
  - bearerAuth: []
  - mtls: []

paths:
  /api/v1/governance/county-coord/status-reports:
    post:
      operationId: submitCountyStatusReport
      tags: [status-reports]
      summary: County coordinator submits a status report
      description: >
        Records the current polling-day operational status for a county.
        Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountyStatusReportRequest"
      responses:
        "201":
          description: Status report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountyStatusReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listCountyStatusReports
      tags: [status-reports]
      summary: List county status reports
      description: Paginated list of county status reports. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: county_code
          in: query
          schema:
            type: string
            x-eel-data-class: C
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Status report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountyStatusReportPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/county-coord/escalations:
    post:
      operationId: escalateToNational
      tags: [escalations]
      summary: County escalates an incident to national
      description: >
        Records a county-to-national escalation for a critical incident.
        Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoordinationEscalationRequest"
      responses:
        "201":
          description: Escalation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinationEscalation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listEscalations
      tags: [escalations]
      summary: National escalation feed
      description: Paginated feed of all county escalations for national review. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: county_code
          in: query
          schema:
            type: string
            x-eel-data-class: C
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
            x-eel-data-class: C
      responses:
        "200":
          description: Escalation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinationEscalationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          x-eel-data-class: D
        page_size:
          type: integer
          x-eel-data-class: D
        total:
          type: integer
          x-eel-data-class: D
        total_pages:
          type: integer
          x-eel-data-class: D

    CountyStatusReportRequest:
      type: object
      required: [county_code, stations_open, stations_closed_early, incidents, submitted_at]
      properties:
        county_code:
          type: string
          x-eel-data-class: C
        stations_open:
          type: integer
          minimum: 0
          x-eel-data-class: C
        stations_closed_early:
          type: integer
          minimum: 0
          x-eel-data-class: C
        incidents:
          type: integer
          minimum: 0
          x-eel-data-class: C
        notes:
          type: string
          maxLength: 2000
          x-eel-data-class: C
        submitted_at:
          type: string
          format: date-time
          x-eel-data-class: C

    CountyStatusReport:
      type: object
      required: [report_id, county_code, stations_open, stations_closed_early, incidents, submitted_at, created_at]
      properties:
        report_id:
          type: string
          format: uuid
          description: UUIDv7 report identifier
          x-eel-data-class: C
        county_code:
          type: string
          x-eel-data-class: C
        stations_open:
          type: integer
          x-eel-data-class: C
        stations_closed_early:
          type: integer
          x-eel-data-class: C
        incidents:
          type: integer
          x-eel-data-class: C
        notes:
          type: string
          x-eel-data-class: C
        submitted_at:
          type: string
          format: date-time
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C

    CountyStatusReportPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CountyStatusReport"
        meta:
          $ref: "#/components/schemas/PageMeta"

    CoordinationEscalationRequest:
      type: object
      required: [county_code, incident_type, severity, description]
      properties:
        county_code:
          type: string
          x-eel-data-class: C
        incident_type:
          type: string
          x-eel-data-class: C
        severity:
          type: string
          enum: [low, medium, high, critical]
          x-eel-data-class: C
        description:
          type: string
          maxLength: 3000
          x-eel-data-class: C

    CoordinationEscalation:
      type: object
      required: [escalation_id, county_code, incident_type, severity, description, status, created_at]
      properties:
        escalation_id:
          type: string
          format: uuid
          description: UUIDv7 escalation identifier
          x-eel-data-class: C
        county_code:
          type: string
          x-eel-data-class: C
        incident_type:
          type: string
          x-eel-data-class: C
        severity:
          type: string
          enum: [low, medium, high, critical]
          x-eel-data-class: C
        description:
          type: string
          x-eel-data-class: C
        status:
          type: string
          enum: [open, acknowledged, resolved]
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    CoordinationEscalationPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CoordinationEscalation"
        meta:
          $ref: "#/components/schemas/PageMeta"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
