openapi: "3.1.0"

info:
  title: eel-vprs-portal
  version: "1.0.0"
  description: >
    Voter Pre-Registration System (VPRS) public and accredited API, module M04.
    Citizens submit pre-registration applications before in-person registration.
    Field kits retrieve pre-filled forms via the handoff endpoint using mTLS.
    All write endpoints require Idempotency-Key. Error responses use RFC 9457 problem+json.
  contact:
    name: eel platform team
    email: platform@eel.local
  license:
    name: Proprietary
    identifier: LicenseRef-eel-proprietary

servers:
  - url: "https://api.eel.local"
    description: "Production"
  - url: "https://api.staging.eel.local"
    description: "Staging"

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      $ref: "../_shared/components.yaml#/components/securitySchemes/bearerAuth"
    mtls:
      $ref: "../_shared/components.yaml#/components/securitySchemes/mtls"

  schemas:

    VPRSApplicationStatus:
      type: string
      description: "Lifecycle state of a pre-registration application."
      enum:
        - draft
        - submitted
        - otp_pending
        - otp_verified
        - clearance_pending
        - approved
        - converted
        - cancelled
        - expired
      x-eel-data-class: B

    VPRSApplication:
      type: object
      description: "Pre-registration application record."
      required:
        - app_id
        - id_number_hash
        - status
        - created_at
        - expires_at
      properties:
        app_id:
          $ref: "../_shared/components.yaml#/components/schemas/UUIDv7"
          description: "Unique application identifier."
          x-eel-data-class: B
        id_number_hash:
          type: string
          description: "SHA-256(salt||national_id_number). The raw ID is never stored server-side."
          pattern: "^[0-9a-f]{64}$"
          x-eel-data-class: B
          example: "a3f5c2d1b4e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2"
        biographic_fields:
          $ref: "#/components/schemas/BiographicFields"
        status:
          $ref: "#/components/schemas/VPRSApplicationStatus"
        qr_token:
          type: string
          description: "Opaque token encoded in the handoff QR code. Valid for handoff only after status=approved."
          minLength: 32
          maxLength: 128
          nullable: true
          x-eel-data-class: B
          example: "eyJhcHBfaWQiOiIwMTkxM2Y3ZSIsImtleSI6ImFiYzEyMyJ9"
        county_code:
          type: string
          description: "KNBS county code where the application was submitted."
          minLength: 2
          maxLength: 3
          x-eel-data-class: B
          example: "047"
        preferred_registration_center:
          type: string
          description: "Station code the citizen prefers for in-person registration."
          maxLength: 20
          nullable: true
          x-eel-data-class: B
          example: "KE-047-0042"
        created_at:
          type: string
          format: date-time
          description: "ISO 8601 UTC timestamp of application creation."
          x-eel-data-class: B
          example: "2027-01-15T08:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: "ISO 8601 UTC timestamp of last status change."
          x-eel-data-class: B
          example: "2027-01-15T08:35:00Z"
        expires_at:
          type: string
          format: date-time
          description: "Application expiry, after this the QR token and pre-filled form are invalidated."
          x-eel-data-class: B
          example: "2027-01-22T08:30:00Z"
      additionalProperties: false

    BiographicFields:
      type: object
      description: >
        Citizen-supplied biographical data. Fields are hashed or pseudonymised at rest.
        The API surface exposes only what the citizen explicitly provided.
      required:
        - surname
        - first_name
        - date_of_birth
        - gender
      properties:
        surname:
          type: string
          description: "Family name as it appears on the national ID."
          minLength: 1
          maxLength: 100
          x-eel-data-class: A
          example: "Odhiambo"
        first_name:
          type: string
          description: "Given name(s)."
          minLength: 1
          maxLength: 100
          x-eel-data-class: A
          example: "Grace"
        other_names:
          type: string
          description: "Middle or additional names, optional."
          maxLength: 100
          nullable: true
          x-eel-data-class: A
        date_of_birth:
          type: string
          format: date
          description: "Date of birth in ISO 8601 (YYYY-MM-DD)."
          x-eel-data-class: A
          example: "1998-03-22"
        gender:
          type: string
          enum: [M, F, X]
          description: "Gender as recorded on national ID. X for undisclosed."
          x-eel-data-class: A
        phone_number_hash:
          type: string
          description: "SHA-256(salt||e164_phone). Used for OTP delivery routing only."
          pattern: "^[0-9a-f]{64}$"
          nullable: true
          x-eel-data-class: A
        district_of_origin:
          type: string
          description: "Administrative district as stated on ID."
          maxLength: 100
          nullable: true
          x-eel-data-class: A
        id_series:
          type: string
          description: "National ID series prefix (last two chars of ID number). Not uniquely identifying."
          pattern: "^[0-9]{2}$"
          nullable: true
          x-eel-data-class: B
      additionalProperties: false

    VPRSApplicationCreate:
      type: object
      description: "Request body for creating a new pre-registration application."
      required:
        - id_number_hash
        - biographic_fields
        - county_code
      properties:
        id_number_hash:
          type: string
          description: "SHA-256(salt||national_id_number). Compute client-side; do not send raw ID."
          pattern: "^[0-9a-f]{64}$"
          x-eel-data-class: B
          example: "a3f5c2d1b4e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2"
        biographic_fields:
          $ref: "#/components/schemas/BiographicFields"
        county_code:
          type: string
          minLength: 2
          maxLength: 3
          x-eel-data-class: B
          example: "047"
        preferred_registration_center:
          type: string
          maxLength: 20
          nullable: true
          x-eel-data-class: B
      additionalProperties: false

    HandoffForm:
      type: object
      description: "Pre-filled registration form payload retrieved by a field kit after scanning the citizen QR."
      required:
        - app_id
        - biographic_fields
        - county_code
        - form_version
        - expires_at
      properties:
        app_id:
          $ref: "../_shared/components.yaml#/components/schemas/UUIDv7"
          x-eel-data-class: B
        biographic_fields:
          $ref: "#/components/schemas/BiographicFields"
        county_code:
          type: string
          x-eel-data-class: B
        preferred_registration_center:
          type: string
          nullable: true
          x-eel-data-class: B
        form_version:
          type: string
          description: "Kit form schema version this payload targets."
          x-eel-data-class: D
          example: "v2.3"
        expires_at:
          type: string
          format: date-time
          x-eel-data-class: B
          example: "2027-01-22T08:30:00Z"
        signature:
          type: string
          description: "ECDSA P-256 signature over the canonical JSON serialisation of this object."
          x-eel-data-class: C
      additionalProperties: false

    OTPRequest:
      type: object
      description: "Request an SMS OTP challenge for a phone number hash."
      required:
        - app_id
        - phone_number_hash
      properties:
        app_id:
          $ref: "../_shared/components.yaml#/components/schemas/UUIDv7"
          description: "Application to associate this OTP challenge with."
          x-eel-data-class: B
        phone_number_hash:
          type: string
          description: "SHA-256(salt||e164_phone). The OTP is delivered to the matching phone."
          pattern: "^[0-9a-f]{64}$"
          x-eel-data-class: A
      additionalProperties: false

    OTPRequestResponse:
      type: object
      description: "Response after requesting an OTP."
      required:
        - challenge_id
        - expires_at
        - attempts_remaining
      properties:
        challenge_id:
          $ref: "../_shared/components.yaml#/components/schemas/UUIDv7"
          x-eel-data-class: E
        expires_at:
          type: string
          format: date-time
          x-eel-data-class: E
        attempts_remaining:
          type: integer
          minimum: 0
          maximum: 5
          x-eel-data-class: E
      additionalProperties: false

    OTPVerify:
      type: object
      description: "Verify an OTP code against a previously issued challenge."
      required:
        - challenge_id
        - otp_code
      properties:
        challenge_id:
          $ref: "../_shared/components.yaml#/components/schemas/UUIDv7"
          x-eel-data-class: E
        otp_code:
          type: string
          description: "6-digit numeric OTP."
          pattern: "^[0-9]{6}$"
          x-eel-data-class: A
      additionalProperties: false

    OTPVerifyResponse:
      type: object
      description: "Result of OTP verification."
      required:
        - verified
        - app_id
      properties:
        verified:
          type: boolean
          x-eel-data-class: B
        app_id:
          $ref: "../_shared/components.yaml#/components/schemas/UUIDv7"
          x-eel-data-class: B
        status:
          $ref: "#/components/schemas/VPRSApplicationStatus"
      additionalProperties: false

    AnalyticsSummary:
      type: object
      description: "Aggregate analytics per county. Contains no PII."
      required:
        - county_code
        - submitted_count
        - converted_count
        - as_of
      properties:
        county_code:
          type: string
          description: "KNBS county code."
          x-eel-data-class: C
          example: "047"
        county_name:
          type: string
          description: "Human-readable county name."
          x-eel-data-class: C
          example: "Nairobi"
        submitted_count:
          type: integer
          description: "Total pre-registration applications submitted."
          minimum: 0
          x-eel-data-class: C
        converted_count:
          type: integer
          description: "Applications that resulted in a completed in-person registration."
          minimum: 0
          x-eel-data-class: C
        otp_verified_count:
          type: integer
          description: "Applications where OTP was successfully verified."
          minimum: 0
          x-eel-data-class: C
        approval_rate_pct:
          type: number
          format: float
          description: "Percentage of submitted applications that reached approved status."
          minimum: 0
          maximum: 100
          x-eel-data-class: C
        as_of:
          type: string
          format: date-time
          description: "Snapshot timestamp for this aggregate."
          x-eel-data-class: C
      additionalProperties: false

    AnalyticsResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsSummary"
          x-eel-data-class: C
        pagination:
          $ref: "../_shared/components.yaml#/components/schemas/Pagination"
      additionalProperties: false

paths:

  /api/v1/vprs/applications:
    post:
      operationId: createVPRSApplication
      x-handler-bound: vprs-svc.vprs.create_application
      summary: "Submit a new pre-registration application"
      description: >
        Citizens submit biographical data and a hashed ID number to begin the pre-registration
        process. An OTP challenge is NOT triggered by this call; use POST /api/v1/vprs/otp/request.
        The endpoint is idempotent on Idempotency-Key: a repeated request with the same key
        returns the existing application rather than creating a duplicate.
      tags: [vprs-applications]
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      security:
        - bearerAuth: ["vprs:citizen:write"]
      parameters:
        - $ref: "../_shared/components.yaml#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VPRSApplicationCreate"
          application/cbor:
            schema:
              $ref: "#/components/schemas/VPRSApplicationCreate"
      responses:
        "201":
          description: "Application created."
          headers:
            X-Eel-Request-Id:
              $ref: "../_shared/components.yaml#/components/headers/X-Eel-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPRSApplication"
            application/cbor:
              schema:
                $ref: "#/components/schemas/VPRSApplication"
        "200":
          description: "Idempotent replay, application already exists for this Idempotency-Key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPRSApplication"
        "400":
          $ref: "../_shared/components.yaml#/components/responses/400BadRequest"
        "401":
          $ref: "../_shared/components.yaml#/components/responses/401Unauthorized"
        "403":
          $ref: "../_shared/components.yaml#/components/responses/403Forbidden"
        "409":
          description: "Duplicate application for this id_number_hash in this election cycle."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Problem"
              example:
                type: "https://errors.eel.local/t2/duplicate-application"
                title: "Duplicate Application"
                status: 409
                detail: "A pre-registration application already exists for this identity."
                eel_trace_id: "01913f7e-0002-7abc-8000-000000000002"
        "422":
          $ref: "../_shared/components.yaml#/components/responses/422UnprocessableEntity"
        "429":
          $ref: "../_shared/components.yaml#/components/responses/429TooManyRequests"
        "500":
          $ref: "../_shared/components.yaml#/components/responses/500InternalServerError"

  /api/v1/vprs/applications/{app_id}:
    get:
      operationId: getVPRSApplication
      x-handler-bound: vprs-svc.vprs.get_status
      summary: "Retrieve application status"
      description: >
        Returns the current state of a pre-registration application.
        Citizens may only fetch their own application; VPRS admin roles may fetch any.
      tags: [vprs-applications]
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      security:
        - bearerAuth: ["vprs:citizen:read"]
      parameters:
        - name: app_id
          in: path
          required: true
          description: "UUIDv7 application identifier."
          schema:
            $ref: "../_shared/components.yaml#/components/schemas/UUIDv7"
      responses:
        "200":
          description: "Application found."
          headers:
            X-Eel-Request-Id:
              $ref: "../_shared/components.yaml#/components/headers/X-Eel-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPRSApplication"
            application/cbor:
              schema:
                $ref: "#/components/schemas/VPRSApplication"
        "401":
          $ref: "../_shared/components.yaml#/components/responses/401Unauthorized"
        "403":
          $ref: "../_shared/components.yaml#/components/responses/403Forbidden"
        "404":
          description: "Application not found."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Problem"
              example:
                type: "https://errors.eel.local/t2/application-not-found"
                title: "Application not found"
                status: 404
                detail: "No application found with that identifier."
                eel_trace_id: "01913f7e-0003-7abc-8000-000000000003"
        "500":
          $ref: "../_shared/components.yaml#/components/responses/500InternalServerError"

    delete:
      operationId: cancelVPRSApplication
      x-handler-bound: vprs-svc.vprs.cancel_application
      summary: "Citizen cancellation of pre-registration application"
      description: >
        Cancels an application in draft, submitted, otp_pending, or otp_verified status.
        Applications in clearance_pending, approved, or converted state cannot be cancelled
        via this endpoint; a grievance must be filed instead.
        Idempotent: deleting an already-cancelled application returns 200.
      tags: [vprs-applications]
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      security:
        - bearerAuth: ["vprs:citizen:write"]
      parameters:
        - name: app_id
          in: path
          required: true
          schema:
            $ref: "../_shared/components.yaml#/components/schemas/UUIDv7"
        - $ref: "../_shared/components.yaml#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: "Application cancelled (or was already cancelled)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPRSApplication"
        "401":
          $ref: "../_shared/components.yaml#/components/responses/401Unauthorized"
        "403":
          $ref: "../_shared/components.yaml#/components/responses/403Forbidden"
        "404":
          $ref: "../_shared/components.yaml#/components/responses/404NotFound"
        "409":
          description: "Application is in a terminal state that does not permit cancellation."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Problem"
        "500":
          $ref: "../_shared/components.yaml#/components/responses/500InternalServerError"

  /api/v1/vprs/handoff/{token}:
    get:
      operationId: getVPRSHandoffForm
      x-handler-bound: vprs-svc.vprs.get_handoff
      summary: "Kit retrieves pre-filled registration form via handoff token"
      description: >
        Field registration kits call this endpoint after scanning a citizen QR code.
        The endpoint requires mTLS with a valid kit certificate (eel.local kit CA).
        The token is single-use and expires in 7 days; a consumed token returns 410.
        Returns a HandoffForm that the kit software pre-populates on the registration screen.
      tags: [vprs-handoff]
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      security:
        - mtls: []
      parameters:
        - name: token
          in: path
          required: true
          description: "Opaque handoff token from the citizen QR code."
          schema:
            type: string
            minLength: 32
            maxLength: 128
            x-eel-data-class: B
      responses:
        "200":
          description: "Handoff form payload."
          headers:
            X-Eel-Request-Id:
              $ref: "../_shared/components.yaml#/components/headers/X-Eel-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffForm"
            application/cbor:
              schema:
                $ref: "#/components/schemas/HandoffForm"
        "401":
          $ref: "../_shared/components.yaml#/components/responses/401Unauthorized"
        "404":
          $ref: "../_shared/components.yaml#/components/responses/404NotFound"
        "410":
          description: "Token has expired or has already been consumed."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Problem"
              example:
                type: "https://errors.eel.local/t2/handoff-consumed"
                title: "Handoff token consumed"
                status: 410
        "500":
          $ref: "../_shared/components.yaml#/components/responses/500InternalServerError"

  /api/v1/vprs/otp/request:
    post:
      operationId: requestVPRSOTP
      x-handler-bound: vprs-svc.vprs.request_otp
      summary: "Request an SMS OTP challenge"
      description: >
        Delivers a 6-digit OTP via SMS to the phone number matching the provided hash.
        Rate-limited to 3 requests per 10-minute window per phone hash.
        The challenge expires after 10 minutes.
      tags: [vprs-otp]
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      security: []
      parameters:
        - $ref: "../_shared/components.yaml#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPRequest"
          application/cbor:
            schema:
              $ref: "#/components/schemas/OTPRequest"
      responses:
        "202":
          description: "OTP dispatched. Client polls /otp/verify."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPRequestResponse"
        "400":
          $ref: "../_shared/components.yaml#/components/responses/400BadRequest"
        "404":
          description: "Application not found for the given app_id."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Problem"
        "429":
          description: "OTP rate limit exceeded."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Problem"
              example:
                type: "https://errors.eel.local/t2/otp-rate-limited"
                title: "OTP rate limited"
                status: 429
        "500":
          $ref: "../_shared/components.yaml#/components/responses/500InternalServerError"

  /api/v1/vprs/otp/verify:
    post:
      operationId: verifyVPRSOTP
      x-handler-bound: vprs-svc.vprs.verify_otp
      summary: "Verify an OTP code"
      description: >
        Validates a 6-digit OTP against the outstanding challenge. On success the application
        advances to otp_verified status and a clearance check is queued asynchronously.
        Incorrect codes decrement attempts_remaining; at 0 the challenge is invalidated.
      tags: [vprs-otp]
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      security: []
      parameters:
        - $ref: "../_shared/components.yaml#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPVerify"
          application/cbor:
            schema:
              $ref: "#/components/schemas/OTPVerify"
      responses:
        "200":
          description: "OTP verified."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPVerifyResponse"
        "400":
          $ref: "../_shared/components.yaml#/components/responses/400BadRequest"
        "404":
          description: "Challenge not found or expired."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Problem"
        "422":
          description: "OTP code incorrect."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/components.yaml#/components/schemas/Problem"
        "429":
          $ref: "../_shared/components.yaml#/components/responses/429TooManyRequests"
        "500":
          $ref: "../_shared/components.yaml#/components/responses/500InternalServerError"

  /api/v1/vprs/admin/analytics:
    get:
      operationId: getVPRSAnalytics
      x-handler-bound: vprs-svc.vprs.get_vprs_analytics
      summary: "Admin analytics, aggregate application statistics by county"
      description: >
        Returns aggregate pre-registration statistics per county. No PII is returned.
        Requires vprs:admin:read scope and SpiceDB VPRS_ANALYST or higher role.
        Supports pagination via cursor.
      tags: [vprs-admin]
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.9%"
      security:
        - bearerAuth: ["vprs:admin:read"]
      parameters:
        - $ref: "../_shared/components.yaml#/components/parameters/CursorParam"
        - $ref: "../_shared/components.yaml#/components/parameters/PerPageParam"
        - name: county_code
          in: query
          required: false
          description: "Filter to a single county (KNBS code)."
          schema:
            type: string
            minLength: 2
            maxLength: 3
            x-eel-data-class: C
        - name: as_of
          in: query
          required: false
          description: "ISO 8601 date-time to request a point-in-time snapshot."
          schema:
            type: string
            format: date-time
            x-eel-data-class: C
      responses:
        "200":
