openapi: 3.1.0
info:
  title: eel-inventory-management
  version: 1.0.0
  description: >
    Module M20: Inventory Management non-custody APIs.
    Public transparency endpoints for kit allocation, material status, shortfalls, and audit trail.
    Internal custody APIs are owned by WP-0.4a.
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: kits
    description: Kit allocation transparency
  - name: materials
    description: Ballot material status
  - name: shortfalls
    description: Material shortfall reporting
  - name: audit
    description: Inventory audit trail

security:
  - bearerAuth: []

paths:
  /api/v1/inventory/kits:
    get:
      operationId: listKitAllocationSummary
      x-handler-bound: inventory-svc.inventory.list_kit_allocation_summary
      tags: [kits]
      summary: Public kit allocation summary
      description: >
        Returns kit allocation counts per constituency. Kit IDs are obscured;
        only aggregate counts are exposed. Tier 1 public endpoint with Merkle proof.
      security: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.5%"
      parameters:
        - name: constituency_code
          in: query
          schema:
            type: string
            x-eel-data-class: C
          description: Optional filter by constituency code
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Kit allocation summary list
          headers:
            X-Eel-Cosign-Sig:
              description: Ed25519 co-signature over response body
              schema:
                type: string
            X-Eel-Merkle-Proof:
              description: Merkle inclusion proof for response snapshot
              schema:
                type: string
            X-Eel-Snapshot-Id:
              description: Snapshot identifier (UUIDv7)
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitAllocationSummaryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/kits/{constituency_code}/allocation:
    get:
      operationId: getConstituencyKitAllocation
      x-handler-bound: inventory-svc.inventory.get_constituency_kit_allocation
      tags: [kits]
      summary: Kit allocation for a constituency
      description: Returns kit allocation detail for a specific constituency. Tier 1 public endpoint.
      security: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/ConstituencyCodePath"
      responses:
        "200":
          description: Constituency kit allocation
          headers:
            X-Eel-Cosign-Sig:
              schema:
                type: string
            X-Eel-Merkle-Proof:
              schema:
                type: string
            X-Eel-Snapshot-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstituencyKitAllocation"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/materials/{constituency_code}/status:
    get:
      operationId: getMaterialStatus
      x-handler-bound: inventory-svc.inventory.get_material_status
      tags: [materials]
      summary: Ballot paper and material status for a constituency
      description: >
        Returns ballot paper and consumable material counts for a constituency.
        Requires JWT. Counts only; class C data.
      security:
        - bearerAuth: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/ConstituencyCodePath"
      responses:
        "200":
          description: Material status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/shortfalls:
    post:
      operationId: reportShortfall
      x-handler-bound: inventory-svc.inventory.report_shortfall
      tags: [shortfalls]
      summary: Report a material shortfall
      description: >
        Record a material shortfall for a constituency. Tier 3 endpoint requiring JWT plus
        SpiceDB authorisation. Idempotent via Idempotency-Key.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortfallReportRequest"
      responses:
        "201":
          description: Shortfall recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortfallReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listShortfalls
      x-handler-bound: inventory-svc.inventory.list_shortfalls
      tags: [shortfalls]
      summary: List material shortfalls
      description: Paginated list of shortfall reports. Tier 3 endpoint.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [reported, dispatched, resolved]
            x-eel-data-class: C
        - name: constituency_code
          in: query
          schema:
            type: string
            x-eel-data-class: C
      responses:
        "200":
          description: Shortfall list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortfallPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/inventory/audit-trail:
    get:
      operationId: getInventoryAuditTrail
      x-handler-bound: inventory-svc.inventory.get_inventory_audit_trail
      tags: [audit]
      summary: Inventory audit log
      description: >
        Paginated audit log of inventory events. Class C and D data.
        Tier 3 endpoint requiring JWT plus SpiceDB authorisation.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 200
        p99_ms: 500
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: constituency_code
          in: query
          schema:
            type: string
            x-eel-data-class: C
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTrailPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key; repeated requests with same key return cached response
    ConstituencyCodePath:
      name: constituency_code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z0-9]{3,10}$"
        x-eel-data-class: C
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          x-eel-data-class: D
        page_size:
          type: integer
          x-eel-data-class: D
        total:
          type: integer
          x-eel-data-class: D
        total_pages:
          type: integer
          x-eel-data-class: D

    KitAllocationSummary:
      type: object
      required: [constituency_code, total_kits_allocated, kits_delivered, kits_pending]
      properties:
        constituency_code:
          type: string
          x-eel-data-class: C
        constituency_name:
          type: string
          x-eel-data-class: C
        total_kits_allocated:
          type: integer
          x-eel-data-class: C
        kits_delivered:
          type: integer
          x-eel-data-class: C
        kits_pending:
          type: integer
          x-eel-data-class: C
        snapshot_at:
          type: string
          format: date-time
          x-eel-data-class: C

    KitAllocationSummaryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KitAllocationSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"

    ConstituencyKitAllocation:
      type: object
      required: [constituency_code, total_kits_allocated, kits_delivered, kits_pending, polling_stations]
      properties:
        constituency_code:
          type: string
          x-eel-data-class: C
        constituency_name:
          type: string
          x-eel-data-class: C
        total_kits_allocated:
          type: integer
          x-eel-data-class: C
        kits_delivered:
          type: integer
          x-eel-data-class: C
        kits_pending:
          type: integer
          x-eel-data-class: C
        polling_stations:
          type: integer
          x-eel-data-class: C
        snapshot_at:
          type: string
          format: date-time
          x-eel-data-class: C

    MaterialStatus:
      type: object
      required: [constituency_code, ballot_papers_allocated, ballot_papers_received, ink_units, seals]
      properties:
        constituency_code:
          type: string
          x-eel-data-class: C
        ballot_papers_allocated:
          type: integer
          x-eel-data-class: C
        ballot_papers_received:
          type: integer
          x-eel-data-class: C
        ballot_papers_spoilt:
          type: integer
          x-eel-data-class: C
        ink_units:
          type: integer
          x-eel-data-class: C
        seals:
          type: integer
          x-eel-data-class: C
        snapshot_at:
          type: string
          format: date-time
          x-eel-data-class: C

    ShortfallReportRequest:
      type: object
      required: [constituency_code, material_type, shortfall_count, reported_by_role]
      properties:
        constituency_code:
          type: string
          x-eel-data-class: C
        material_type:
          type: string
          enum: [ballot_paper, ink, seal]
          x-eel-data-class: C
        shortfall_count:
          type: integer
          minimum: 1
          x-eel-data-class: C
        reported_by_role:
          type: string
          x-eel-data-class: C
        notes:
          type: string
          maxLength: 1000
          x-eel-data-class: C

    ShortfallReport:
      type: object
      required: [shortfall_id, constituency_code, material_type, shortfall_count, reported_by_role, status, created_at]
      properties:
        shortfall_id:
          type: string
          format: uuid
          description: UUIDv7 identifier
          x-eel-data-class: C
        constituency_code:
          type: string
          x-eel-data-class: C
        material_type:
          type: string
          enum: [ballot_paper, ink, seal]
          x-eel-data-class: C
        shortfall_count:
          type: integer
          x-eel-data-class: C
        reported_by_role:
          type: string
          x-eel-data-class: C
        status:
          type: string
          enum: [reported, dispatched, resolved]
          x-eel-data-class: C
        notes:
          type: string
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    ShortfallPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShortfallReport"
        meta:
          $ref: "#/components/schemas/PageMeta"

    AuditEvent:
      type: object
      required: [event_id, event_type, actor_role, created_at]
      properties:
        event_id:
          type: string
          format: uuid
          x-eel-data-class: C
        event_type:
          type: string
          x-eel-data-class: C
        constituency_code:
          type: string
          x-eel-data-class: C
        actor_role:
          type: string
          x-eel-data-class: D
        payload_summary:
          type: object
          additionalProperties: true
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C

    AuditTrailPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        meta:
          $ref: "#/components/schemas/PageMeta"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict (duplicate idempotency key with different payload)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
