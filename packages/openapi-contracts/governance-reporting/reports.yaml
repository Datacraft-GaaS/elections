openapi: 3.1.0
info:
  title: eel-governance-reporting
  version: 1.0.0
  description: >
    Modules M58 and M59: Parliamentary/Judiciary Reporting and OAG Interface.
    Covers generation of statutory reports and submissions to the Office of the Auditor General.
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: parliamentary-reports
    description: Parliamentary and judiciary statutory reports
  - name: oag-submissions
    description: Office of the Auditor General submissions

security:
  - bearerAuth: []
  - mtls: []

paths:
  /api/v1/governance/reporting/parliamentary-reports:
    get:
      operationId: listParliamentaryReports
      x-handler-bound: governance-svc.governance-reporting.list_parliamentary_reports
      tags: [parliamentary-reports]
      summary: List parliamentary reports
      description: Paginated list of parliamentary reports. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: report_type
          in: query
          schema:
            type: string
            enum: [interim, final, statutory]
            x-eel-data-class: C
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, generating, ready, delivered]
            x-eel-data-class: C
      responses:
        "200":
          description: Report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportJobPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: generateParliamentaryReport
      x-handler-bound: governance-svc.governance-reporting.generate_parliamentary_report
      tags: [parliamentary-reports]
      summary: Generate a parliamentary report
      description: >
        Initiates report generation for the specified period and type.
        Returns a job that can be polled for status. Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "201":
          description: Report job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/reporting/parliamentary-reports/{report_id}:
    get:
      operationId: getParliamentaryReport
      x-handler-bound: governance-svc.governance-reporting.get_parliamentary_report
      tags: [parliamentary-reports]
      summary: Get a parliamentary report
      description: Returns the report job status and download URL when ready. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: Report job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/reporting/oag-submissions:
    post:
      operationId: submitToOAG
      x-handler-bound: governance-svc.governance-reporting.submit_to_oag
      tags: [oag-submissions]
      summary: Submit a report to the OAG
      description: >
        Records submission of a generated report to the Office of the Auditor General.
        Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAGSubmissionRequest"
      responses:
        "201":
          description: OAG submission recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAGSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listOAGSubmissions
      x-handler-bound: governance-svc.governance-reporting.list_oag_submissions
      tags: [oag-submissions]
      summary: List OAG submissions
      description: Paginated list of OAG submissions. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, acknowledged, queried, accepted]
            x-eel-data-class: C
        - name: submission_type
          in: query
          schema:
            type: string
            enum: [financial, procurement, audit]
            x-eel-data-class: C
      responses:
        "200":
          description: OAG submission list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAGSubmissionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key
    ReportIdPath:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-eel-data-class: C
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          x-eel-data-class: D
        page_size:
          type: integer
          x-eel-data-class: D
        total:
          type: integer
          x-eel-data-class: D
        total_pages:
          type: integer
          x-eel-data-class: D

    ReportRequest:
      type: object
      required: [period_start, period_end, report_type, scope]
      properties:
        period_start:
          type: string
          format: date
          x-eel-data-class: C
        period_end:
          type: string
          format: date
          x-eel-data-class: C
        report_type:
          type: string
          enum: [interim, final, statutory]
          x-eel-data-class: C
        scope:
          type: string
          description: Scope descriptor (e.g. national, county code, election ID)
          x-eel-data-class: C

    ReportJob:
      type: object
      required: [job_id, period_start, period_end, report_type, scope, status, created_at]
      properties:
        job_id:
          type: string
          format: uuid
          description: UUIDv7 job identifier
          x-eel-data-class: C
        period_start:
          type: string
          format: date
          x-eel-data-class: C
        period_end:
          type: string
          format: date
          x-eel-data-class: C
        report_type:
          type: string
          enum: [interim, final, statutory]
          x-eel-data-class: C
        scope:
          type: string
          x-eel-data-class: C
        status:
          type: string
          enum: [queued, generating, ready, delivered]
          x-eel-data-class: C
        download_url:
          type: string
          format: uri
          description: Presigned MinIO URL to report (present when status is ready or delivered)
          nullable: true
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    ReportJobPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportJob"
        meta:
          $ref: "#/components/schemas/PageMeta"

    OAGSubmissionRequest:
      type: object
      required: [report_id, oag_ref, submission_type, submitted_at]
      properties:
        report_id:
          type: string
          format: uuid
          description: UUIDv7 reference to the generated report
          x-eel-data-class: C
        oag_ref:
          type: string
          description: OAG tracking reference number
          x-eel-data-class: C
        submission_type:
          type: string
          enum: [financial, procurement, audit]
          x-eel-data-class: C
        submitted_at:
          type: string
          format: date-time
          x-eel-data-class: C

    OAGSubmission:
      type: object
      required: [submission_id, report_id, oag_ref, submission_type, submitted_at, status, created_at]
      properties:
        submission_id:
          type: string
          format: uuid
          description: UUIDv7 submission identifier
          x-eel-data-class: C
        report_id:
          type: string
          format: uuid
          x-eel-data-class: C
        oag_ref:
          type: string
          x-eel-data-class: C
        submission_type:
          type: string
          enum: [financial, procurement, audit]
          x-eel-data-class: C
        submitted_at:
          type: string
          format: date-time
          x-eel-data-class: C
        status:
          type: string
          enum: [submitted, acknowledged, queried, accepted]
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    OAGSubmissionPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OAGSubmission"
        meta:
          $ref: "#/components/schemas/PageMeta"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
