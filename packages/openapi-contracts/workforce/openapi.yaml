openapi: "3.1.0"
info:
  title: "eel workforce API"
  version: "1.0.0"
  description: |
    Poll-worker lifecycle (design: docs/workforce-lifecycle.md). Covers worker
    registry & contacts, the recruitment state machine, interview records,
    postings & equipment claims, tasking, performance records, and worker
    notifications. Cross-service state leaves this service only via the
    transactional outbox (topics `eel.workforce.*`, design §8).

    ## Data classification
    - Payloads carry ids and SHA-256 hashes, never raw PII beyond appointment
      names (DPA 2019).
    - Document bytes never transit this service; they live in MinIO under the
      applicant tenant prefix (support-admin-svc `/v1/hr/documents/*`).

    ## Idempotency
    Mutations are idempotent where noted (task ack/done, contact upsert,
    notification delivery). Legal state-machine transitions are enforced by
    the server and return 409 with the allowed set otherwise.
  contact:
    name: eel platform team
    url: https://eel.local/support

servers:
  - url: https://api.eel.local
    description: production
  - url: https://staging.api.eel.local
    description: staging

security:
  - bearerAuth: []

tags:
  - name: workers
    description: Worker registry, contacts, and profile updates
  - name: recruitment
    description: Recruitment pipeline and interview records
  - name: postings
    description: Posting orders and equipment custody claims
  - name: tasking
    description: Task templates and assignments
  - name: performance
    description: Append-only performance records
  - name: notifications
    description: Worker notifications (posting, payment, appointment, training, message)
  - name: operations
    description: Operational readiness rollups

paths:
  /health:
    get:
      tags: [operations]
      operationId: health
      x-handler-bound: workforce-svc.workforce.health
      summary: Liveness probe
      responses:
        "200":
          description: Service is up

  /v1/workforce/workers:
    get:
      tags: [workers]
      operationId: listWorkers
      x-handler-bound: workforce-svc.workforce.list_workers
      summary: List workers (filter by home_county, role)
      parameters:
        - name: home_county
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Worker listing
          content:
            application/json:
              schema:
                type: object
                required: [workers]
                properties:
                  workers:
                    type: array
                    items: { $ref: "#/components/schemas/Worker" }
    post:
      tags: [workers]
      operationId: createWorker
      x-handler-bound: workforce-svc.workforce.create_worker
      summary: Register a worker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkerRequest" }
      responses:
        "201":
          description: Worker created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/workers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workers]
      operationId: getWorker
      x-handler-bound: workforce-svc.workforce.get_worker
      summary: Fetch a worker
      responses:
        "200":
          description: Worker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [workers]
      operationId: updateWorker
      x-handler-bound: workforce-svc.workforce.update_worker
      summary: Update a worker's information (county, roles, payroll ref, next-of-kin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkerRequest" }
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workforce/workers/{id}/contacts/{channel}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: channel
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Channel" }
    put:
      tags: [workers]
      operationId: upsertContact
      x-handler-bound: workforce-svc.workforce.upsert_contact
      summary: Insert-or-update a contact point (idempotent on value hash)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertContactRequest" }
      responses:
        "200":
          description: Updated contact point
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPoint" }
        "201":
          description: Created contact point
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPoint" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/workers/{id}/contacts/{channel}/verify:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: channel
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Channel" }
    post:
      tags: [workers]
      operationId: verifyContact
      x-handler-bound: workforce-svc.workforce.verify_contact
      summary: Mark a contact point verified
      responses:
        "200":
          description: Verified contact point
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPoint" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workforce/workers/{id}/contacts:
    get:
      tags: [workers]
      operationId: listContacts
      x-handler-bound: workforce-svc.workforce.list_contacts
      summary: List a worker's contact points
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Contact listing
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items: { $ref: "#/components/schemas/ContactPoint" }

  /v1/workforce/workers/{id}/contact-history:
    get:
      tags: [workers]
      operationId: contactHistory
      x-handler-bound: workforce-svc.workforce.contact_history
      summary: Append-only contact change log
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Change log
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/ContactLogEntry" }

  /v1/workforce/recruitment:
    get:
      tags: [recruitment]
      operationId: listRecruitmentCases
      x-handler-bound: workforce-svc.workforce.list_cases
      summary: List recruitment cases (filter by stage, county)
      parameters:
        - name: stage
          in: query
          schema: { type: string }
        - name: county
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Case listing
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases:
                    type: array
                    items: { $ref: "#/components/schemas/RecruitmentCase" }
    post:
      tags: [recruitment]
      operationId: createRecruitmentCase
      x-handler-bound: workforce-svc.workforce.create_case
      summary: Open a recruitment case at `applied`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCaseRequest" }
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecruitmentCase" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/recruitment/{id}:
    get:
      tags: [recruitment]
      operationId: getRecruitmentCase
      x-handler-bound: workforce-svc.workforce.get_case
      summary: Fetch a recruitment case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecruitmentCase" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workforce/recruitment/{id}/transition:
    post:
      tags: [recruitment]
      operationId: transitionCase
      x-handler-bound: workforce-svc.workforce.transition_case
      summary: Advance the recruitment state machine (legal transitions enforced)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionRequest" }
      responses:
        "200":
          description: Transitioned case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecruitmentCase" }
        "409":
          description: Illegal transition
          content:
            application/json:
              schema:
                type: object
                required: [error, from, to, allowed]
                properties:
                  error: { type: string }
                  from: { type: string }
                  to: { type: string }
                  allowed:
                    type: array
                    items: { type: string }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/recruitment/{id}/interviews:
    get:
      tags: [recruitment]
      operationId: listInterviews
      x-handler-bound: workforce-svc.workforce.list_interviews
      summary: List interview records for a case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Interview listing
          content:
            application/json:
              schema:
                type: object
                required: [interviews]
                properties:
                  interviews:
                    type: array
                    items: { $ref: "#/components/schemas/InterviewRecord" }
    post:
      tags: [recruitment]
      operationId: createInterview
      x-handler-bound: workforce-svc.workforce.create_interview
      summary: Record a structured interview
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInterviewRequest" }
      responses:
        "201":
          description: Interview recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewRecord" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/postings:
    get:
      tags: [postings]
      operationId: listPostings
      x-handler-bound: workforce-svc.workforce.list_postings
      summary: List postings (filter by worker_id, station, active)
      parameters:
        - name: worker_id
          in: query
          schema: { type: string, format: uuid }
        - name: station
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Posting listing
          content:
            application/json:
              schema:
                type: object
                required: [postings]
                properties:
                  postings:
                    type: array
                    items: { $ref: "#/components/schemas/PostingOrder" }
    post:
      tags: [postings]
      operationId: createPosting
      x-handler-bound: workforce-svc.workforce.create_posting
      summary: Activate a posting (supersedes the worker's prior active posting)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePostingRequest" }
      responses:
        "201":
          description: Posting created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostingOrder" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workforce/postings/{id}/supersede:
    post:
      tags: [postings]
      operationId: supersedePosting
      x-handler-bound: workforce-svc.workforce.supersede_posting
      summary: Redeploy a worker to a new station
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupersedeRequest" }
      responses:
        "201":
          description: Successor posting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostingOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/workforce/postings/{id}/equipment:
    post:
      tags: [postings]
      operationId: createEquipmentClaim
      x-handler-bound: workforce-svc.workforce.create_equipment_claim
      summary: Claim equipment against an active posting (one open claim at a time)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClaimRequest" }
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquipmentClaim" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/workforce/equipment/{claim_id}/acknowledge:
    post:
      tags: [postings]
      operationId: acknowledgeClaim
      x-handler-bound: workforce-svc.workforce.acknowledge_claim
      summary: Acknowledge receipt of issued equipment
      parameters:
        - name: claim_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Acknowledged claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquipmentClaim" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workforce/equipment/{claim_id}/return:
    post:
      tags: [postings]
      operationId: returnClaim
      x-handler-bound: workforce-svc.workforce.return_claim
      summary: Return equipment, closing the custody loop
      parameters:
        - name: claim_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Returned claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquipmentClaim" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workforce/equipment/{claim_id}/flag-loss:
    post:
      tags: [postings]
      operationId: flagLoss
      x-handler-bound: workforce-svc.workforce.flag_loss
      summary: Flag equipment loss/damage
      parameters:
        - name: claim_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagLossRequest" }
      responses:
        "200":
          description: Updated claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EquipmentClaim" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/task-templates:
    get:
      tags: [tasking]
      operationId: listTaskTemplates
      x-handler-bound: workforce-svc.workforce.list_templates
      summary: List task templates (filter by role, phase)
      parameters:
        - name: role
          in: query
          schema: { type: string }
        - name: phase
          in: query
          schema: { $ref: "#/components/schemas/Phase" }
      responses:
        "200":
          description: Template listing
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/TaskTemplate" }
    post:
      tags: [tasking]
      operationId: createTaskTemplate
      x-handler-bound: workforce-svc.workforce.create_template
      summary: Create a task template (optionally linked to just-in-time training)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskTemplate" }

  /v1/workforce/tasks:
    get:
      tags: [tasking]
      operationId: listTasks
      x-handler-bound: workforce-svc.workforce.list_tasks
      summary: List task assignments (filter by posting_id, status)
      parameters:
        - name: posting_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "200":
          description: Assignment listing
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items: { $ref: "#/components/schemas/TaskAssignment" }
    post:
      tags: [tasking]
      operationId: assignTask
      x-handler-bound: workforce-svc.workforce.assign_task
      summary: Assign a task to a posting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignTaskRequest" }
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAssignment" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workforce/tasks/{id}/ack:
    post:
      tags: [tasking]
      operationId: ackTask
      x-handler-bound: workforce-svc.workforce.ack_task
      summary: Acknowledge an assignment (idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Acknowledged assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAssignment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/workforce/tasks/{id}/done:
    post:
      tags: [tasking]
      operationId: doneTask
      x-handler-bound: workforce-svc.workforce.done_task
      summary: Complete an assignment (critical tasks require a 64-hex evidence hash)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DoneTaskRequest" }
      responses:
        "200":
          description: Completed assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAssignment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/tasks/{id}/blocked:
    post:
      tags: [tasking]
      operationId: blockTask
      x-handler-bound: workforce-svc.workforce.block_task
      summary: Block an assignment with a reason
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockTaskRequest" }
      responses:
        "200":
          description: Blocked assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAssignment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/performance:
    get:
      tags: [performance]
      operationId: getPerformance
      x-handler-bound: workforce-svc.workforce.get_performance
      summary: Fetch a worker's performance records and summary
      parameters:
        - name: worker_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Performance records and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerformanceResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [performance]
      operationId: addPerformanceRecord
      x-handler-bound: workforce-svc.workforce.add_record
      summary: Append a performance record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddRecordRequest" }
      responses:
        "201":
          description: Record appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerformanceRecord" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workforce/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      x-handler-bound: workforce-svc.workforce.list_notifications
      summary: List a worker's notifications
      parameters:
        - name: worker_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Notification listing
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [notifications]
      operationId: sendNotification
      x-handler-bound: workforce-svc.workforce.send_notification
      summary: Send a worker notification (resolves the preferred contact point)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendNotificationRequest" }
      responses:
        "201":
          description: Notification recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /v1/workforce/readiness:
    get:
      tags: [operations]
      operationId: readiness
      x-handler-bound: workforce-svc.workforce.readiness
      summary: Per-station operational readiness rollup
      parameters:
        - name: station
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Readiness rollup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Channel:
      type: string
      enum: [phone, whatsapp, email, sms]

    NotificationKind:
      type: string
      enum: [posting, payment, appointment, training, message]

    Phase:
      type: string
      enum: [pre_poll, polling_day, post_poll]

    TaskStatus:
      type: string
      enum: [pending, acked, done, blocked]

    PerfCategory:
      type: string
      enum: [attendance, punctuality, incident, evaluation]

    InterviewOutcome:
      type: string
      enum: [recommend, hold, reject]

    Stage:
      type: object
      discriminator:
        propertyName: state
      oneOf:
        - type: object
          required: [state]
          properties:
            state: { type: string, enum: [applied, screened, documents_complete, evaluated, selected, appointed] }
        - type: object
          required: [state, reason_code]
          properties:
            state: { type: string, enum: [rejected] }
            reason_code: { type: string }
        - type: object
          required: [state, rank]
          properties:
            state: { type: string, enum: [waitlist] }
