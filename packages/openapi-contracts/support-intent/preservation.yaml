openapi: "3.1.0"

info:
  title: eel-support-intent
  version: "1.0.0"
  description: |
    Module M27 intent preservation (WP-5.5).

    On-device opt-in pre-mark visual validation (image deleted within 1 second),
    spoilt ballot replacement (Elections Act s.54), standardised adjudication
    catalogue (A1-A8 rejection, V1-V3 acceptance) with photo evidence,
    rejection-rate outlier alerts to ECC, and disable-toggle audit trail.
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: "https://support-admin.eel.local"
    description: "Internal (mTLS for kit endpoints)"
  - url: "https://api.eel.local"
    description: "External API gateway"

security:
  - BearerJWT: []

tags:
  - name: premark
    description: "Pre-mark validation events (on-device only)"
  - name: spoilt
    description: "Spoilt ballot workflow"
  - name: adjudication
    description: "Ballot adjudication with standardised catalogue"
  - name: alerts
    description: "Rejection-rate outlier alerts to ECC"
  - name: catalogue
    description: "Adjudication reason-code catalogue"
  - name: toggle
    description: "Adjudication disable toggle audit"

paths:
  /v1/intent/premark:
    post:
      operationId: submitPreMarkValidation
      x-handler-bound: support-admin-svc.support-intent.submit_pre_mark_validation
      tags: [premark]
      summary: "Submit pre-mark validation event from kit"
      description: |
        Kit SVID mTLS only. Image must already be deleted before this call
        (image_delete_elapsed_ms <= 1000). Server enforces the invariant and
        rejects events where elapsed > 1000 ms.
      security:
        - KitMTLS: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreMarkValidationRequest"
      responses:
        "202":
          description: "Accepted"
        "422":
          description: "image_delete_elapsed_ms > 1000 or model version mismatch"

  /v1/intent/spoilt:
    post:
      operationId: submitSpoiltBallot
      x-handler-bound: support-admin-svc.support-intent.submit_spoilt_ballot
      tags: [spoilt]
      summary: "Record spoilt ballot and replacement (Elections Act s.54)"
      security:
        - KitMTLS: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpoiltBallotRequest"
      responses:
        "202":
          description: "Accepted"

  /v1/intent/adjudications:
    post:
      operationId: recordAdjudication
      x-handler-bound: support-admin-svc.support-intent.record_adjudication
      tags: [adjudication]
      summary: "Record ballot adjudication"
      description: |
        Presiding Officer submits adjudication decision with catalogue reason
        code and optional photo evidence reference. Idempotent on Idempotency-Key.
      security:
        - BearerJWT: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjudicationRequest"
      responses:
        "202":
          description: "Accepted"
        "422":
          description: "Unknown reason code or decision mismatch"
    get:
      operationId: listAdjudications
      x-handler-bound: support-admin-svc.support-intent.list_adjudications
      tags: [adjudication]
      summary: "List adjudication events (IAB audit panel)"
      security:
        - BearerJWT: []
      parameters:
        - name: station_code
          in: query
          schema:
            type: string
        - name: decision
          in: query
          schema:
            type: string
            enum: [REJECT, ACCEPT]
      responses:
        "200":
          description: "Adjudication list"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdjudicationRecord"

  /v1/intent/adjudications/{id}:
    get:
      operationId: getAdjudication
      x-handler-bound: support-admin-svc.support-intent.get_adjudication
      tags: [adjudication]
      summary: "Single adjudication record"
      security:
        - BearerJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Adjudication record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjudicationRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/intent/alerts:
    get:
      operationId: listRejectionRateAlerts
      x-handler-bound: support-admin-svc.support-intent.list_rejection_rate_alerts
      tags: [alerts]
      summary: "Rejection-rate outlier alerts to ECC"
      description: "COMMISSION_OPS or ECC_OFFICER JWT required."
      security:
        - BearerJWT: []
      parameters:
        - name: acknowledged
          in: query
          schema:
            type: boolean
        - name: contest_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "Alert list"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RejectionRateAlert"

  /v1/intent/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      x-handler-bound: support-admin-svc.support-intent.acknowledge_alert
      tags: [alerts]
      summary: "Acknowledge rejection-rate alert"
      security:
        - BearerJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledged_by]
              properties:
                acknowledged_by:
                  type: string
      responses:
        "200":
          description: "Acknowledged"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/intent/catalogue:
    get:
      operationId: listAdjudicationCatalogue
      x-handler-bound: support-admin-svc.support-intent.list_adjudication_catalogue
      tags: [catalogue]
      summary: "List adjudication reason-code catalogue (A1-A8, V1-V3)"
      security: []
      responses:
        "200":
          description: "Catalogue entries"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogueEntry"

  /v1/intent/toggle:
    post:
      operationId: toggleAdjudication
      x-handler-bound: support-admin-svc.support-intent.toggle_adjudication
      tags: [toggle]
      summary: "Enable or disable pre-mark validation at station"
      description: "COMMISSION_OPS JWT required. Audit-logged."
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleRequest"
      responses:
        "200":
          description: "Toggle applied"
    get:
      operationId: listToggleAudit
      x-handler-bound: support-admin-svc.support-intent.list_toggle_audit
      tags: [toggle]
      summary: "Audit log of toggle events"
      security:
        - BearerJWT: []
      parameters:
        - name: station_code
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "Toggle audit log"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToggleAuditRecord"

components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    KitMTLS:
      type: mutualTLS
      description: "SVID mTLS for kit certificate"

  responses:
    NotFound:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    PreMarkValidationRequest:
      type: object
      required:
        - station_code
        - contest_id
        - inference_outcome
        - model_version
        - device_id
        - image_delete_elapsed_ms
      properties:
        station_code:
          type: string
        contest_id:
          type: string
        inference_outcome:
          type: string
          enum: [LIKELY_VALID, LIKELY_SPOILT, AMBIGUOUS, MODEL_UNAVAILABLE]
        model_version:
          type: string
        device_id:
          type: string
        image_delete_elapsed_ms:
          type: integer
          maximum: 1000
          description: "Elapsed ms from capture to delete; must be <= 1000"

    SpoiltBallotRequest:
      type: object
      required: [station_code, contest_id, reason_code, officer_id, witness_ids]
      properties:
        station_code:
          type: string
        contest_id:
          type: string
        reason_code:
          type: string
        officer_id:
          type: string
        witness_ids:
          type: array
          items:
            type: string
        replacement_issued:
          type: boolean

    AdjudicationRequest:
      type: object
      required: [ballot_id, station_code, contest_id, adjudicator_id, reason_code, decision]
      properties:
        ballot_id:
          type: string
        station_code:
          type: string
        contest_id:
          type: string
        adjudicator_id:
          type: string
        reason_code:
          type: string
          description: "Must be a valid catalogue code: A1-A8 or V1-V3"
        decision:
          type: string
          enum: [REJECT, ACCEPT]
        photo_evidence_ref:
          type: string
          description: "MinIO object reference; required for rejection codes A2-A7"

    AdjudicationRecord:
      allOf:
        - $ref: "#/components/schemas/AdjudicationRequest"
        - type: object
          required: [id, adjudicated_at]
          properties:
            id:
              type: string
              format: uuid
            adjudicated_at:
              type: string
              format: date-time

    RejectionRateAlert:
      type: object
      required: [id, station_code, contest_id, rejection_rate, national_mean, z_score, alerted_at]
      properties:
        id:
          type: string
          format: uuid
        station_code:
          type: string
        contest_id:
          type: string
        rejection_rate:
          type: number
          description: "Station rejection rate (0.0 - 1.0)"
        national_mean:
          type: number
        z_score:
          type: number
        acknowledged:
          type: boolean
        acknowledged_by:
          type: string
          nullable: true
        alerted_at:
          type: string
          format: date-time

    CatalogueEntry:
      type: object
      required: [code, decision, description_en, description_sw]
      properties:
        code:
          type: string
          description: "A1-A8 (reject) or V1-V3 (accept)"
        decision:
          type: string
          enum: [REJECT, ACCEPT]
        description_en:
          type: string
        description_sw:
          type: string

    ToggleRequest:
      type: object
      required: [station_code, enabled, toggled_by, reason]
      properties:
        station_code:
          type: string
        enabled:
          type: boolean
        toggled_by:
          type: string
        reason:
          type: string

    ToggleAuditRecord:
      allOf:
        - $ref: "#/components/schemas/ToggleRequest"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            toggled_at:
              type: string
              format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
