openapi: 3.1.0
info:
  title: eel-governance-court
  version: 1.0.0
  description: >
    Module M40: Election Court IT Interface.
    Supports filing petitions, court evidence requests, and judgment recording.
    Petitioner identity is stored as a hash (class A PII).
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: petitions
    description: Election court petitions
  - name: evidence
    description: Court evidence requests
  - name: judgments
    description: Court judgments

security:
  - bearerAuth: []
  - mtls: []

paths:
  /api/v1/governance/court/petitions:
    post:
      operationId: filePetition
      x-handler-bound: governance-svc.governance-court.file_petition
      tags: [petitions]
      summary: File an election petition
      description: >
        Records an election petition in the system. Petitioner identity is stored
        as a hash. Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetitionRecordRequest"
      responses:
        "201":
          description: Petition filed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetitionRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listPetitions
      x-handler-bound: governance-svc.governance-court.list_petitions
      tags: [petitions]
      summary: List petitions
      description: Paginated list of election petitions. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [filed, served, hearing, judgment, closed]
            x-eel-data-class: C
        - name: contest_code
          in: query
          schema:
            type: string
            x-eel-data-class: C
      responses:
        "200":
          description: Petition list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetitionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/court/petitions/{petition_id}:
    get:
      operationId: getPetition
      x-handler-bound: governance-svc.governance-court.get_petition
      tags: [petitions]
      summary: Get petition detail
      description: Returns full detail for a specific petition. Tier 3 endpoint.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PetitionIdPath"
      responses:
        "200":
          description: Petition detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetitionRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/court/petitions/{petition_id}/evidence-requests:
    post:
      operationId: createEvidenceRequest
      x-handler-bound: governance-svc.governance-court.create_evidence_request
      tags: [evidence]
      summary: Court requests an evidence package
      description: >
        Records a court request for an evidence package. Returns a presigned MinIO URL
        to the evidence bundle when available. Tier 3 endpoint. Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PetitionIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceRequestInput"
      responses:
        "201":
          description: Evidence request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/court/petitions/{petition_id}/judgments:
    post:
      operationId: recordJudgment
      x-handler-bound: governance-svc.governance-court.record_judgment
      tags: [judgments]
      summary: Record a court judgment
      description: >
        Records the judgment for an election petition. Tier 3 endpoint.
        Idempotent via Idempotency-Key.
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PetitionIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtJudgment"
      responses:
        "201":
          description: Judgment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtJudgment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key
    PetitionIdPath:
      name: petition_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-eel-data-class: C
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          x-eel-data-class: D
        page_size:
          type: integer
          x-eel-data-class: D
        total:
          type: integer
          x-eel-data-class: D
        total_pages:
          type: integer
          x-eel-data-class: D

    PetitionRecordRequest:
      type: object
      required: [petition_ref, petitioner_id_hash, respondent_code, contest_code, grounds, filed_at]
      properties:
        petition_ref:
          type: string
          description: Official court petition reference number
          x-eel-data-class: C
        petitioner_id_hash:
          type: string
          description: SHA-256 hash of petitioner national ID
          x-eel-data-class: A
        respondent_code:
          type: string
          x-eel-data-class: C
        contest_code:
          type: string
          x-eel-data-class: C
        grounds:
          type: string
          maxLength: 5000
          x-eel-data-class: C
        filed_at:
          type: string
          format: date-time
          x-eel-data-class: C

    PetitionRecord:
      type: object
      required: [petition_id, petition_ref, petitioner_id_hash, respondent_code, contest_code, grounds, filed_at, status, created_at]
      properties:
        petition_id:
          type: string
          format: uuid
          description: UUIDv7 petition identifier
          x-eel-data-class: C
        petition_ref:
          type: string
          x-eel-data-class: C
        petitioner_id_hash:
          type: string
          x-eel-data-class: A
        respondent_code:
          type: string
          x-eel-data-class: C
        contest_code:
          type: string
          x-eel-data-class: C
        grounds:
          type: string
          x-eel-data-class: C
        filed_at:
          type: string
          format: date-time
          x-eel-data-class: C
        status:
          type: string
          enum: [filed, served, hearing, judgment, closed]
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    PetitionPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PetitionRecord"
        meta:
          $ref: "#/components/schemas/PageMeta"

    EvidenceRequestInput:
      type: object
      required: [evidence_types, deadline, court_ref]
      properties:
        evidence_types:
          type: array
          items:
            type: string
          x-eel-data-class: C
        deadline:
          type: string
          format: date-time
          x-eel-data-class: C
        court_ref:
          type: string
          x-eel-data-class: C

    EvidenceRequest:
      type: object
      required: [request_id, evidence_types, deadline, court_ref, created_at]
      properties:
        request_id:
          type: string
          format: uuid
          description: UUIDv7 request identifier
          x-eel-data-class: C
        evidence_types:
          type: array
          items:
            type: string
          x-eel-data-class: C
        deadline:
          type: string
          format: date-time
          x-eel-data-class: C
        court_ref:
          type: string
          x-eel-data-class: C
        package_url:
          type: string
          format: uri
          description: Presigned MinIO URL to evidence bundle (present when bundle is ready)
          nullable: true
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C

    CourtJudgment:
      type: object
      required: [outcome, judgment_ref, issued_at]
      properties:
        outcome:
          type: string
          enum: [dismissed, upheld, retally, by_election, null_election]
          x-eel-data-class: C
        judgment_ref:
          type: string
          x-eel-data-class: C
        issued_at:
          type: string
          format: date-time
          x-eel-data-class: C
        summary:
          type: string
          maxLength: 5000
          x-eel-data-class: C

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
