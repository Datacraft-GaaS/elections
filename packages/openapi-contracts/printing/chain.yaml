openapi: 3.1.0
info:
  title: eel-ballot-printing-chain
  version: 1.0.0
  description: >
    Module M39: Ballot Printing Chain APIs.
    Covers print order issuance, QC decisions, delivery recording, and public
    aggregate transparency. Serial number ranges are restricted to tier 3.
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: print-orders
    description: Ballot print orders
  - name: qc
    description: Quality control decisions
  - name: deliveries
    description: Ballot delivery records
  - name: audit
    description: Printing chain audit trail

security:
  - bearerAuth: []
  - mtls: []

paths:
  /api/v1/printing/print-orders:
    post:
      operationId: createPrintOrder
      tags: [print-orders]
      summary: Issue a print order to the government printer
      description: >
        Creates a new ballot print order. Requires JWT and SpiceDB authorisation.
        Idempotent via Idempotency-Key.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintOrderRequest"
      responses:
        "201":
          description: Print order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listPrintOrdersPublic
      tags: [print-orders]
      summary: Public aggregate print order counts
      description: >
        Returns aggregate ballot print counts only. No serial numbers or security
        feature details are exposed. Tier 1 public endpoint with Merkle proof.
      security: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [ordered, printing, qc, delivered]
            x-eel-data-class: C
      responses:
        "200":
          description: Public print order aggregates
          headers:
            X-Eel-Cosign-Sig:
              description: Ed25519 co-signature over response body
              schema:
                type: string
            X-Eel-Merkle-Proof:
              description: Merkle inclusion proof
              schema:
                type: string
            X-Eel-Snapshot-Id:
              description: Snapshot identifier (UUIDv7)
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintOrderPublicPage"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/printing/print-orders/{order_id}:
    get:
      operationId: getPrintOrder
      tags: [print-orders]
      summary: Get print order status
      description: Returns full print order detail including status. Tier 3 endpoint.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Print order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/printing/print-orders/{order_id}/qc:
    post:
      operationId: submitQCDecision
      tags: [qc]
      summary: Submit QC pass or fail for a print order
      description: >
        Records the QC outcome for a print batch. Tier 3 endpoint.
        Idempotent via Idempotency-Key. QC officer identity stored as hash.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QCDecision"
      responses:
        "201":
          description: QC decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QCDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/printing/deliveries:
    post:
      operationId: recordBallotDelivery
      tags: [deliveries]
      summary: Record ballot delivery to IEBC warehouse
      description: >
        Records arrival of a print order batch at the IEBC warehouse.
        Serial range data is stored but access is tier 3. Idempotent via Idempotency-Key.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRecordRequest"
      responses:
        "201":
          description: Delivery recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/printing/audit-trail:
    get:
      operationId: getPrintingAuditTrail
      tags: [audit]
      summary: Printing chain audit log
      description: >
        Paginated audit log of all printing chain events. Tier 3 endpoint
        requiring JWT and SpiceDB authorisation.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: order_id
          in: query
          schema:
            type: string
            format: uuid
            x-eel-data-class: C
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTrailPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key
    OrderIdPath:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-eel-data-class: C
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          x-eel-data-class: D
        page_size:
          type: integer
          x-eel-data-class: D
        total:
          type: integer
          x-eel-data-class: D
        total_pages:
          type: integer
          x-eel-data-class: D

    PrintOrderRequest:
      type: object
      required: [election_id, position_code, constituency_code, ballot_quantity, proof_id, security_features]
      properties:
        election_id:
          type: string
          format: uuid
          description: UUIDv7 election identifier
          x-eel-data-class: C
        position_code:
          type: string
          x-eel-data-class: C
        constituency_code:
          type: string
          x-eel-data-class: C
        ballot_quantity:
          type: integer
          minimum: 1
          x-eel-data-class: C
        proof_id:
          type: string
          format: uuid
          description: UUIDv7 reference to approved ballot proof
          x-eel-data-class: C
        security_features:
          type: array
          items:
            type: string
          minItems: 1
          x-eel-data-class: C

    PrintOrder:
      type: object
      required: [order_id, election_id, position_code, constituency_code, ballot_quantity, proof_id, security_features, status, printer_reference, created_at]
      properties:
        order_id:
          type: string
          format: uuid
          description: UUIDv7 order identifier
          x-eel-data-class: C
        election_id:
          type: string
          format: uuid
          x-eel-data-class: C
        position_code:
          type: string
          x-eel-data-class: C
        constituency_code:
          type: string
          x-eel-data-class: C
        ballot_quantity:
          type: integer
          x-eel-data-class: C
        proof_id:
          type: string
          format: uuid
          x-eel-data-class: C
        security_features:
          type: array
          items:
            type: string
          x-eel-data-class: C
        status:
          type: string
          enum: [ordered, printing, qc, delivered]
          x-eel-data-class: C
        printer_reference:
          type: string
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    PrintOrderPublicSummary:
      type: object
      description: Aggregate counts only; no serial numbers or security details
      required: [status, count]
      properties:
        status:
          type: string
          enum: [ordered, printing, qc, delivered]
          x-eel-data-class: C
        count:
          type: integer
          x-eel-data-class: C
        total_ballot_quantity:
          type: integer
          x-eel-data-class: C
        snapshot_at:
          type: string
          format: date-time
          x-eel-data-class: C

    PrintOrderPublicPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PrintOrderPublicSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"

    QCDecision:
      type: object
      required: [passed, defect_count, sample_size, qc_officer_hash, decided_at]
      properties:
        passed:
          type: boolean
          x-eel-data-class: C
        defect_count:
          type: integer
          minimum: 0
          x-eel-data-class: C
        sample_size:
          type: integer
          minimum: 1
          x-eel-data-class: C
        qc_officer_hash:
          type: string
          description: SHA-256 hash of officer identity
          x-eel-data-class: B
        decided_at:
          type: string
          format: date-time
          x-eel-data-class: C
        notes:
          type: string
          maxLength: 2000
          x-eel-data-class: C

    DeliveryRecordRequest:
      type: object
      required: [order_id, delivered_quantity, serial_range_start, serial_range_end, received_by_hash, received_at]
      properties:
        order_id:
          type: string
          format: uuid
          x-eel-data-class: C
        delivered_quantity:
          type: integer
          minimum: 0
          x-eel-data-class: C
        serial_range_start:
          type: string
          x-eel-data-class: C
        serial_range_end:
          type: string
          x-eel-data-class: C
        received_by_hash:
          type: string
          description: SHA-256 hash of receiver identity
          x-eel-data-class: B
        received_at:
          type: string
          format: date-time
          x-eel-data-class: C

    DeliveryRecord:
      type: object
      required: [delivery_id, order_id, delivered_quantity, serial_range_start, serial_range_end, received_by_hash, received_at, status, created_at]
      properties:
        delivery_id:
          type: string
          format: uuid
          description: UUIDv7 delivery identifier
          x-eel-data-class: C
        order_id:
          type: string
          format: uuid
          x-eel-data-class: C
        delivered_quantity:
          type: integer
          x-eel-data-class: C
        serial_range_start:
          type: string
          x-eel-data-class: C
        serial_range_end:
          type: string
          x-eel-data-class: C
        received_by_hash:
          type: string
          x-eel-data-class: B
        received_at:
          type: string
          format: date-time
          x-eel-data-class: C
        status:
          type: string
          enum: [received, verified, stored]
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C

    AuditEvent:
      type: object
      required: [event_id, event_type, created_at]
      properties:
        event_id:
          type: string
          format: uuid
          x-eel-data-class: C
        event_type:
          type: string
          x-eel-data-class: C
        order_id:
          type: string
          format: uuid
          x-eel-data-class: C
        actor_role:
          type: string
          x-eel-data-class: D
        payload_summary:
          type: object
          additionalProperties: true
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C

    AuditTrailPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        meta:
          $ref: "#/components/schemas/PageMeta"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
