openapi: "3.1.0"

info:
  title: "Eel Credential Issuance API"
  version: "1.0.0"
  description: |
    Credential issuance API for the election system. Issues HSM-signed verifiable
    credentials (election officer accreditations, voter cards, result certificates)
    and supports revocation with an immutable audit trail. Credentials reference
    transparency log entries for end-to-end verifiability.

    Module: P06 credential-issuance-events.

    Trust domain: eel.local.
    - Tier 3 write endpoints: JWT bearer + SpiceDB RBAC (role/resource-scoped).
    - Tier 2 read endpoints: JWT bearer, JSON+CBOR.
    - Tier 2 public proof endpoint: no auth, allows third-party verification.

    Data classification:
      A = Biometric, B = PII (holder identity data), C = Sensitive operational, D = Non-sensitive.

servers:
  - url: "https://credential.eel.local"
    description: "Credential issuance internal service"
  - url: "https://api.eel.local"
    description: "External API gateway"

security:
  - BearerJWT: []

tags:
  - name: issue
    description: "Credential issuance, JWT + SpiceDB"
  - name: revoke
    description: "Credential revocation, JWT + SpiceDB"
  - name: read
    description: "Credential retrieval, JWT"
  - name: proof
    description: "Credential proof, public, no auth"
  - name: batch
    description: "Batch status, JWT + SpiceDB"

paths:
  /api/v1/credentials/issue:
    post:
      operationId: issueCredential
      x-handler-bound: bvr-svc.credential.issue_credential
      summary: "Issue a new signed credential"
      description: |
        Issues an HSM-signed credential of the specified type to a holder.
        Requires JWT with a SpiceDB permission check against the credential_type
        and the issuer's organisational scope.

        The credential is appended to the transparency log before the response
        is returned. The response includes the full credential object with HSM
        signature. Idempotent via Idempotency-Key, replays return the original
        credential without re-signing.

        Data-class B: holder_id and holder_name are PII. claims may contain PII
        depending on credential_type.
      tags: [issue]
      x-eel-auth: JWT+SpiceDB
      x-eel-tier: 3
      x-eel-sla:
        p50: 500
        p95: 2000
        p99: 5000
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRequest"
            example:
              credential_type: "election_officer"
              holder_id: "01933b2a-0001-7000-8000-000000000002"
              claims:
                role: "presiding_officer"
                county: "001"
                constituency: "042"
                station: "003"
              valid_for_days: 30
              batch_id: "01933b2a-0000-7000-8000-000000000010"
      responses:
        "201":
          description: "Credential issued and signed"
          headers:
            X-Request-Id:
              $ref: "../_shared/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          description: "Malformed request body"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "401":
          description: "Missing or invalid JWT"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "403":
          description: "JWT subject not authorised by SpiceDB to issue this credential_type"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "409":
          description: "Idempotency key reused with a different payload"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "422":
          description: "Validation error, unknown credential_type, invalid holder_id, etc."
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "503":
          description: "HSM or transparency log temporarily unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"

  /api/v1/credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      x-handler-bound: bvr-svc.credential.revoke_credential
      summary: "Revoke a credential"
      description: |
        Marks a credential as revoked. Revocation is permanent and immutable.
        The revocation event is appended to the transparency log.
        Requires JWT with a SpiceDB permission check against the credential's
        issuer_id and the caller's organisational scope.

        Idempotent, revoking an already-revoked credential returns 200 with the
        original revocation details unchanged (reason and effective_at cannot be
        overwritten).

        Data-class B: reason and revoking_officer_id are PII-adjacent operational
        data that could identify individuals.
      tags: [revoke]
      x-eel-auth: JWT+SpiceDB
      x-eel-tier: 3
      x-eel-sla:
        p50: 500
        p95: 2000
        p99: 5000
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XRequestId"
        - name: id
          in: path
          required: true
          description: "UUID7 credential identifier."
          schema:
            type: string
            format: uuid
            x-eel-data-class: C
          example: "01933b2a-0001-7000-8000-000000000005"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevocationRequest"
            example:
              reason: "officer_misconduct"
              revoking_officer_id: "01933b2a-0001-7000-8000-000000000003"
              effective_at: "2026-08-21T12:00:00Z"
      responses:
        "200":
          description: "Credential revoked (or already was revoked, idempotent)"
          headers:
            X-Request-Id:
              $ref: "../_shared/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          description: "Malformed request body"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "401":
          description: "Missing or invalid JWT"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "403":
          description: "JWT subject not authorised by SpiceDB to revoke this credential"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "404":
          description: "Credential not found"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "409":
          description: "Idempotency key reused with a different payload"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "503":
          description: "Transparency log temporarily unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"

  /api/v1/credentials/{id}:
    get:
      operationId: getCredential
      x-handler-bound: bvr-svc.credential.get_credential
      summary: "Retrieve a credential by ID"
      description: |
        Returns the full credential object including current status and revocation
        details if applicable. JWT authentication required.
        Responses are available in both JSON and CBOR for compact field-device
        use cases.
        Data-class B: response contains PII fields (holder_id, holder_name, claims).
      tags: [read]
      x-eel-auth: JWT
      x-eel-tier: 2
      x-eel-sla:
        p50: 50
        p95: 200
        p99: 500
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: id
          in: path
          required: true
          description: "UUID7 credential identifier."
          schema:
            type: string
            format: uuid
            x-eel-data-class: C
          example: "01933b2a-0001-7000-8000-000000000005"
      responses:
        "200":
          description: "Credential record"
          headers:
            X-Request-Id:
              $ref: "../_shared/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
            application/cbor:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          description: "Missing or invalid JWT"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "403":
          description: "JWT subject not authorised to read this credential"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "404":
          description: "Credential not found"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "503":
          description: "Credential store unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"

  /api/v1/credentials/{id}/proof:
    get:
      operationId: getCredentialProof
      x-handler-bound: bvr-svc.credential.get_credential_proof
      summary: "Retrieve the cryptographic proof for a credential (public)"
      description: |
        Returns the cryptographic proof bundle for a credential, allowing any
        third party to verify the credential's authenticity without authentication.
        The proof contains the HSM signature and the verification method (public key
        reference). Does not return PII, only the proof metadata.

        No auth required. Tier 2 for rate-limiting purposes. Responses available
        in both JSON and CBOR.
      tags: [proof]
      x-eel-auth: public
      x-eel-tier: 2
      x-eel-sla:
        p50: 50
        p95: 200
        p99: 500
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: id
          in: path
          required: true
          description: "UUID7 credential identifier."
          schema:
            type: string
            format: uuid
            x-eel-data-class: C
          example: "01933b2a-0001-7000-8000-000000000005"
      responses:
        "200":
          description: "Credential proof bundle for third-party verification"
          headers:
            X-Request-Id:
              $ref: "../_shared/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialProof"
            application/cbor:
              schema:
                $ref: "#/components/schemas/CredentialProof"
        "404":
          description: "Credential not found or proof not yet generated"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "503":
          description: "Credential store unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"

  /api/v1/credentials/batch/{batch_id}:
    get:
      operationId: getBatchSummary
      x-handler-bound: bvr-svc.credential.get_batch_summary
      summary: "Retrieve the status summary for a credential issuance batch"
      description: |
        Returns aggregate status for a batch of credentials issued together
        (e.g., bulk officer accreditation before an election event). JWT + SpiceDB
        required, same scope as the issuing operation.
        Data-class C: no PII in the summary, only counts and status.
      tags: [batch]
      x-eel-auth: JWT+SpiceDB
      x-eel-tier: 3
      x-eel-sla:
        p50: 50
        p95: 200
        p99: 500
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: batch_id
          in: path
          required: true
          description: "UUID7 batch identifier assigned at issuance time."
          schema:
            type: string
            format: uuid
            x-eel-data-class: C
          example: "01933b2a-0000-7000-8000-000000000010"
      responses:
        "200":
          description: "Batch summary"
          headers:
            X-Request-Id:
              $ref: "../_shared/headers.yaml#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSummary"
        "401":
          description: "Missing or invalid JWT"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "403":
          description: "JWT subject not authorised by SpiceDB to view this batch"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "404":
          description: "Batch not found"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"
        "503":
          description: "Credential store unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "../_shared/common.yaml#/components/schemas/ProblemDetail"

components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC JWT issued by the Eel IAM service. Must carry sub, aud=credential-service,
        and the appropriate eel:credential scope. SpiceDB authorization check is
        performed server-side on every tier-3 request using the JWT sub as the
        SpiceDB subject.
    SVIDmTLS:
      type: mutualTLS
      description: "SPIFFE/SPIRE SVID mutual TLS for internal service-to-service communication."

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Client-generated UUID v4/v7. Same key + same payload replays original response; different payload returns 409."
      schema:
        type: string
        format: uuid
        x-eel-data-class: D
      example: "01933b2a-7d4c-7e5f-a1b2-3c4d5e6f7a8b"

    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: "Client-supplied correlation ID. Echoed in response headers."
      schema:
        type: string
        maxLength: 128
        x-eel-data-class: D
      example: "req-2026082109140001"

  schemas:
    Credential:
      type: object
      description: "A signed verifiable credential issued by the election authority."
      required:
        - credential_id
        - credential_type
        - holder_id
        - holder_name
        - issuer_id
        - issued_at
        - expires_at
        - status
        - claims
        - hsm_sig
      properties:
        credential_id:
          type: string
          format: uuid
          description: "UUID7 credential identifier. Stable across revocation."
          x-eel-data-class: C
          example: "01933b2a-0001-7000-8000-000000000005"
        credential_type:
          type: string
          enum:
            - election_officer
            - voter_card
            - result_certificate
            - accreditation_badge
            - observer_permit
          description: "Semantic type of the credential. Determines claims schema and issuance permissions."
          x-eel-data-class: B
          example: "election_officer"
        holder_id:
          type: string
          format: uuid
          description: "UUID7 of the credential holder (internal person record, not national ID)."
          x-eel-data-class: B
          example: "01933b2a-0001-7000-8000-000000000002"
        holder_name:
          type: string
          maxLength: 256
          description: "Full legal name of the holder at time of issuance."
          x-eel-data-class: B
          example: "Amina Ochieng"
        issuer_id:
          type: string
          description: "SPIFFE ID or UUID of the issuing service/officer."
          x-eel-data-class: C
          example: "spiffe://eel.local/credential-issuer"
        issued_at:
          type: string
          format: date-time
          description: "ISO 8601 UTC timestamp when the credential was signed."
          x-eel-data-class: D
          example: "2026-08-21T08:00:00Z"
        expires_at:
          type: string
          format: date-time
          description: "ISO 8601 UTC timestamp after which the credential is no longer valid."
          x-eel-data-class: D
          example: "2026-09-20T08:00:00Z"
        status:
          type: string
          enum: [active, revoked, expired]
          description: "Current lifecycle status of the credential."
          x-eel-data-class: C
          example: "active"
        claims:
          type: object
          description: "Credential-type-specific claims. Schema varies by credential_type."
          x-eel-data-class: B
          additionalProperties: true
          example:
            role: "presiding_officer"
            county: "001"
            constituency: "042"
            station: "003"
        hsm_sig:
          type: string
          contentEncoding: base64url
          description: |
            HSM ECDSA P-384 signature over the canonical JSON of
            {credential_id, credential_type, holder_id, issuer_id, issued_at, expires_at, claims},
            base64url encoded.
          x-eel-data-class: C
          example: "base64url:MEYCIQDX..."
        revoked_at:
          type: string
          format: date-time
          description: "ISO 8601 UTC timestamp of revocation. Present only when status=revoked."
          x-eel-data-class: D
          example: "2026-08-21T12:00:00Z"
        revocation_reason:
          type: string
          maxLength: 512
          description: "Human-readable reason for revocation. Present only when status=revoked."
          x-eel-data-class: B
          example: "officer_misconduct"
        transparency_leaf_hash:
          type: string
          description: "SHA-256 hash of this credential's transparency log leaf, hex encoded. Enables independent audit."
          x-eel-data-class: C
          example: "sha256:9f4a2b3c..."
      additionalProperties: false

    CredentialProof:
      type: object
      description: "Cryptographic proof bundle for third-party credential verification. Contains no PII."
      required:
        - credential_id
        - proof_type
        - proof_value
        - verification_method
        - created_at
      properties:
        credential_id:
          type: string
          format: uuid
          description: "UUID7 of the credential this proof covers."
          x-eel-data-class: C
          example: "01933b2a-0001-7000-8000-000000000005"
        proof_type:
          type: string
          enum: [EcdsaSecp384r1Signature2023, Ed25519Signature2020]
          description: "Linked Data Proof type identifier matching the HSM key type."
          x-eel-data-class: C
          example: "EcdsaSecp384r1Signature2023"
        proof_value:
          type: string
          contentEncoding: base64url
          description: "The detached signature value, base64url encoded. Same as Credential.hsm_sig."
          x-eel-data-class: C
          example: "base64url:MEYCIQDX..."
        verification_method:
          type: string
          format: uri
          description: "DID URL or well-known URL resolving to the HSM public key used to sign this credential."
          x-eel-data-class: C
          example: "https://keys.eel.local/credential-hsm#key-2026"
        created_at:
          type: string
          format: date-time
          description: "Timestamp when this proof was generated (matches credential issued_at)."
          x-eel-data-class: D
          example: "2026-08-21T08:00:00Z"
        transparency_leaf_hash:
          type: string
          description: "SHA-256 hash of the transparency log leaf for this credential. Allows independent log verification."
          x-eel-data-class: C
          example: "sha256:9f4a2b3c..."
      additionalProperties: false

    IssueRequest:
      type: object
      description: "Request to issue a new credential."
      required:
        - credential_type
        - holder_id
        - claims
        - valid_for_days
      properties:
        credential_type:
          type: string
          enum:
            - election_officer
            - voter_card
            - result_certificate
            - accreditation_badge
            - observer_permit
          description: "Type of credential to issue. The caller must have SpiceDB permission for this type."
          x-eel-data-class: B
          example: "election_officer"
        holder_id:
          type: string
          format: uuid
          description: "UUID7 of the person to whom the credential is issued."
          x-eel-data-class: B
          example: "01933b2a-0001-7000-8000-000000000002"
        claims:
          type: object
          description: "Credential-type-specific claims to embed. Validated against the schema for credential_type."
          x-eel-data-class: B
          additionalProperties: true
          example:
            role: "presiding_officer"
            county: "001"
            constituency: "042"
            station: "003"
        valid_for_days:
          type: integer
          minimum: 1
          maximum: 365
          description: "Number of days from issuance until expiry."
          x-eel-data-class: D
          example: 30
        batch_id:
          type: string
          format: uuid
          description: "Optional UUID7 batch identifier for grouping bulk issuance. Used to query batch status."
          x-eel-data-class: C
          example: "01933b2a-0000-7000-8000-000000000010"
      additionalProperties: false

    RevocationRequest:
      type: object
      description: "Request to revoke an existing credential."
      required:
        - reason
        - revoking_officer_id
        - effective_at
      properties:
        reason:
          type: string
          maxLength: 512
          description: "Machine-readable reason code or free-text explanation for revocation."
          x-eel-data-class: B
          example: "officer_misconduct"
        revoking_officer_id:
          type: string
          format: uuid
          description: "UUID7 of the officer authorising this revocation. Must match the JWT sub or a delegated identity."
          x-eel-data-class: B
          example: "01933b2a-0001-7000-8000-000000000003"
        effective_at:
          type: string
          format: date-time
          description: "ISO 8601 UTC timestamp when the revocation takes effect. May be in the past for backdated revocations."
          x-eel-data-class: D
          example: "2026-08-21T12:00:00Z"
      additionalProperties: false

    BatchSummary:
      type: object
      description: "Aggregate status summary for a credential issuance batch."
      required:
        - batch_id
        - credential_type
        - total_issued
        - status
        - created_at
      properties:
        batch_id:
          type: string
          format: uuid
          description: "UUID7 batch identifier."
          x-eel-data-class: C
          example: "01933b2a-0000-7000-8000-000000000010"
        credential_type:
          type: string
          enum:
            - election_officer
            - voter_card
            - result_certificate
            - accreditation_badge
            - observer_permit
          description: "Credential type for all credentials in this batch."
          x-eel-data-class: C
          example: "election_officer"
        total_issued:
          type: integer
          minimum: 0
          description: "Number of credentials successfully issued in this batch."
          x-eel-data-class: D
          example: 847
        total_failed:
          type: integer
          minimum: 0
          description: "Number of credentials that failed issuance in this batch."
          x-eel-data-class: D
          example: 3
        total_revoked:
          type: integer
          minimum: 0
          description: "Number of credentials from this batch that have since been revoked."
          x-eel-data-class: D
          example: 1
        status:
          type: string
          enum: [pending, processing, completed, partially_failed, failed]
          description: "Aggregate processing status of the batch job."
          x-eel-data-class: C
          example: "completed"
        created_at:
          type: string
          format: date-time
          description: "ISO 8601 UTC timestamp when the batch was initiated."
          x-eel-data-class: D
          example: "2026-08-20T22:00:00Z"
        completed_at:
          type: string
          format: date-time
          description: "ISO 8601 UTC timestamp when the batch finished processing. Absent while status is pending or processing."
          x-eel-data-class: D
          example: "2026-08-20T22:14:37Z"
      additionalProperties: false
