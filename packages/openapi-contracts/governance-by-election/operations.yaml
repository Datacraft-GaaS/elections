openapi: 3.1.0
info:
  title: eel-governance-by-election
  version: 1.0.0
  description: >
    Module M50: By-Election Operations.
    Covers declaration, status management, and public transparency for by-elections
    triggered by death, court order, recall, or result nullification.
  contact:
    name: EEL Platform Team
    email: platform@eel.local

servers:
  - url: https://api.eel.local
    description: Production

tags:
  - name: by-elections
    description: By-election lifecycle management

security:
  - bearerAuth: []

paths:
  /api/v1/governance/by-election/elections:
    post:
      operationId: declareByElection
      x-handler-bound: governance-svc.governance-by-election.declare_by_election
      tags: [by-elections]
      summary: Declare a by-election
      description: >
        Creates a by-election record for a constituency. Trigger reason and gazette
        reference are required. Tier 3 endpoint. Idempotent via Idempotency-Key.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ByElectionDeclaration"
      responses:
        "201":
          description: By-election declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByElection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listByElections
      x-handler-bound: governance-svc.governance-by-election.list_by_elections
      tags: [by-elections]
      summary: List by-elections
      description: >
        Returns all declared by-elections. Tier 1 public endpoint with Merkle proof.
      security: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [declared, nominated, campaigning, polling, tallying, declared_result]
            x-eel-data-class: C
        - name: constituency_code
          in: query
          schema:
            type: string
            x-eel-data-class: C
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: By-election list
          headers:
            X-Eel-Cosign-Sig:
              description: Ed25519 co-signature over response body
              schema:
                type: string
            X-Eel-Merkle-Proof:
              description: Merkle inclusion proof
              schema:
                type: string
            X-Eel-Snapshot-Id:
              description: Snapshot identifier (UUIDv7)
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByElectionPage"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/by-election/elections/{by_election_id}:
    get:
      operationId: getByElection
      x-handler-bound: governance-svc.governance-by-election.get_by_election
      tags: [by-elections]
      summary: Get by-election detail
      description: Returns full detail for a specific by-election. Tier 2 public endpoint.
      security: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/ByElectionIdPath"
      responses:
        "200":
          description: By-election detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByElection"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/governance/by-election/elections/{by_election_id}/status:
    patch:
      operationId: transitionByElectionStatus
      x-handler-bound: governance-svc.governance-by-election.transition_by_election_status
      tags: [by-elections]
      summary: Transition by-election status
      description: >
        Advances the by-election to a new lifecycle status with mandatory reason.
        Tier 3 endpoint. Idempotent via Idempotency-Key.
      security:
        - bearerAuth: []
        - mtls: []
      x-eel-sla:
        p95_ms: 300
        p99_ms: 800
        availability: "99.5%"
      parameters:
        - $ref: "#/components/parameters/ByElectionIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusTransition"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByElection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by eel.local identity provider
    mtls:
      type: mutualTLS
      description: Mutual TLS client certificate for tier 3 operations

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUIDv7 idempotency key
    ByElectionIdPath:
      name: by_election_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-eel-data-class: C
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          x-eel-data-class: D
        title:
          type: string
          x-eel-data-class: D
        status:
          type: integer
          x-eel-data-class: D
        detail:
          type: string
          x-eel-data-class: D
        instance:
          type: string
          format: uri
          x-eel-data-class: D
        trace_id:
          type: string
          x-eel-data-class: E

    PageMeta:
      type: object
      properties:
        page:
          type: integer
          x-eel-data-class: D
        page_size:
          type: integer
          x-eel-data-class: D
        total:
          type: integer
          x-eel-data-class: D
        total_pages:
          type: integer
          x-eel-data-class: D

    ByElectionDeclaration:
      type: object
      required: [trigger_reason, constituency_code, gazette_ref, election_date]
      properties:
        trigger_reason:
          type: string
          enum: [death, court, recall, nullification]
          x-eel-data-class: C
        constituency_code:
          type: string
          x-eel-data-class: C
        gazette_ref:
          type: string
          description: Kenya Gazette reference for the by-election notice
          x-eel-data-class: C
        election_date:
          type: string
          format: date
          x-eel-data-class: C

    ByElection:
      type: object
      required: [by_election_id, trigger_reason, constituency_code, gazette_ref, election_date, status, created_at]
      properties:
        by_election_id:
          type: string
          format: uuid
          description: UUIDv7 by-election identifier
          x-eel-data-class: C
        trigger_reason:
          type: string
          enum: [death, court, recall, nullification]
          x-eel-data-class: C
        constituency_code:
          type: string
          x-eel-data-class: C
        gazette_ref:
          type: string
          x-eel-data-class: C
        election_date:
          type: string
          format: date
          x-eel-data-class: C
        status:
          type: string
          enum: [declared, nominated, campaigning, polling, tallying, declared_result]
          x-eel-data-class: C
        created_at:
          type: string
          format: date-time
          x-eel-data-class: C
        updated_at:
          type: string
          format: date-time
          x-eel-data-class: C

    ByElectionPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ByElection"
        meta:
          $ref: "#/components/schemas/PageMeta"

    StatusTransition:
      type: object
      required: [new_status, reason]
      properties:
        new_status:
          type: string
          enum: [declared, nominated, campaigning, polling, tallying, declared_result]
          x-eel-data-class: C
        reason:
          type: string
          maxLength: 1000
          x-eel-data-class: C

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
