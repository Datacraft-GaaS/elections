    ReconcileReport:
      type: object
      description: "End-of-poll ballot reconciliation report for a polling station."
      required:
        - reconcile_id
        - station_code
        - election_id
        - assigned_count
        - received_count
        - issued_count
        - spoilt_count
        - returned_count
        - discrepancy
        - status
      properties:
        reconcile_id:
          $ref: "../_shared/common.yaml#/components/schemas/UUIDv7"
          description: "Unique reconciliation report identifier (UUIDv7)."
          x-eel-data-class: C
        station_code:
          type: string
          description: "Polling station this report covers."
          x-eel-data-class: C
          example: "PS-047-002"
        election_id:
          $ref: "../_shared/common.yaml#/components/schemas/UUIDv7"
          description: "Election this reconciliation covers."
          x-eel-data-class: C
        assigned_count:
          type: integer
          minimum: 0
          description: "Total ballot papers assigned to the station."
          x-eel-data-class: C
          example: 800
        received_count:
          type: integer
          minimum: 0
          description: "Total ballot papers confirmed received by station."
          x-eel-data-class: C
          example: 798
        issued_count:
          type: integer
          minimum: 0
          description: "Ballot papers issued to voters (counter foil count)."
          x-eel-data-class: C
          example: 610
        spoilt_count:
          type: integer
          minimum: 0
          description: "Ballot papers recorded as spoilt."
          x-eel-data-class: C
          example: 12
        returned_count:
          type: integer
          minimum: 0
          description: "Unused ballot papers returned to the returning officer."
          x-eel-data-class: C
          example: 176
        discrepancy:
          type: integer
          description: "Net unaccounted ballots (received - issued - spoilt - returned). Zero is balanced."
          x-eel-data-class: C
          example: 0
        status:
          type: string
          description: "Reconciliation status."
          x-eel-data-class: C
          enum:
            - PENDING
            - BALANCED
            - DISCREPANCY
            - RESOLVED
          example: "BALANCED"
        resolution_note:
          type: string
          description: "Explanation of how a discrepancy was resolved. Present only when status is RESOLVED."
          x-eel-data-class: C
          example: "Two ballots confirmed destroyed due to water damage. Affidavit AFFIDAVIT-20270809-007 on file."

    ReconcileReportRequest:
      type: object
      description: "Request body to submit an end-of-poll reconciliation report."
      required:
        - station_code
        - election_id
        - issued_count
        - spoilt_count
        - returned_count
      properties:
        station_code:
          type: string
          description: "Polling station code."
          x-eel-data-class: C
          example: "PS-047-002"
        election_id:
          $ref: "../_shared/common.yaml#/components/schemas/UUIDv7"
          description: "Election identifier."
          x-eel-data-class: C
        issued_count:
          type: integer
          minimum: 0
          description: "Ballot papers issued to voters."
          x-eel-data-class: C
          example: 610
        spoilt_count:
          type: integer
          minimum: 0
          description: "Spoilt ballot papers."
          x-eel-data-class: C
          example: 12
        returned_count:
          type: integer
          minimum: 0
          description: "Unused ballots returned."
          x-eel-data-class: C
          example: 176

    ReconcileResolveRequest:
      type: object
      description: "Request body to resolve a reconciliation discrepancy."
      required:
        - resolution_note
        - resolving_officer_id
        - supporting_refs
      properties:
        resolution_note:
          type: string
          description: "Explanation of the discrepancy resolution."
          x-eel-data-class: C
          example: "Two ballots confirmed destroyed due to water damage."
        resolving_officer_id:
          $ref: "../_shared/common.yaml#/components/schemas/UUIDv7"
          description: "Officer authorising the resolution."
          x-eel-data-class: C
        supporting_refs:
          type: array
          description: "Supporting document references (affidavits, incident reports)."
          x-eel-data-class: C
          minItems: 1
          items:
            type: string
          example: ["AFFIDAVIT-20270809-007"]
