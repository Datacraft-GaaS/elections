[package]
name = "eel-pii-rs-fuzz"
version = "0.1.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "pii_roundtrip"
path = "fuzz_targets/pii_roundtrip.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
eel-pii-rs    = { path = "..", default-features = false }
serde_json    = "1"

# Detached from the parent workspace on purpose: the root member globs do not
# include fuzz/, so without this cargo walks up, finds the root, and rejects
# the manifest for claiming a workspace it is not a member of. This is the
# arrangement the cargo-fuzz book prescribes.
[workspace]
