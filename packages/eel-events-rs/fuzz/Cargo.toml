[workspace]

[package]
name = "eel-events-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false

[[bin]]
name = "sig_verify_boundary"
path = "fuzz_targets/sig_verify_boundary.rs"
test = false
doc = false

[[bin]]
name = "hlc_parse"
path = "fuzz_targets/hlc_parse.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
eel-events-rs = { path = "..", features = ["test-utils"] }
eel-hlc-rs    = { path = "../../eel-hlc-rs" }
serde_json    = "1"
chrono        = "0.4"
arbitrary     = { version = "1", features = ["derive"] }
