# Generated by eel service-template-rs for {{project-name}}.
# Consumed by tools/appset-gen to produce an ArgoCD Application.
apiVersion: eel.internal/v1alpha1
kind: EelService
metadata:
  name: {{project-name}}
spec:
  tier: "{{tier}}"
  description: "{{description}}"
  image: gitea.internal/eel/{{project-name}}:latest
  port: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  env:
    - name: OTEL_SERVICE_NAME
      value: {{project-name}}
    - name: JWKS_URL
      valueFrom:
        secretKeyRef:
          name: eel-auth
          key: jwks-url
