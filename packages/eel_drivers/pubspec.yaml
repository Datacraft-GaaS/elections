name: eel_drivers
description: >-
  eel hardware drivers for Flutter: USB thermal printer (ESC/POS), SMS modem,
  document scanner slot, Camera2 capture, AntIris iris (USBControl), FAP60
  fingerprint slot. Bundled native code (AntIris jars + .so) ships inside
  consuming APKs. No third-party SDK calls happen without attached hardware.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.eel.drivers
        pluginClass: EelDriversPlugin