[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eel-auth-py"
version = "0.1.0"
description = "JWT/JWKS verification, SpiceDB authz, and audit for the eel platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "starlette>=0.40",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eel_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "pytest-httpserver>=1.0",
    "respx>=0.21",
    "fastapi>=0.110",
]
