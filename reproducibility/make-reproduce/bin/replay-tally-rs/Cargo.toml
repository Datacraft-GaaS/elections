[workspace]

[package]
name = "replay-tally-rs"
version = "0.1.0"
edition = "2021"
description = "Replay eel bundle events and derive Merkle root (BLAKE3 over canonical JSON per RFC 8785)"

[[bin]]
name = "replay-tally-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
