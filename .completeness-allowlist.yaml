# Completeness scanner allowlist.
# Schema: top-level `entries`, each with an exact finding id "file:line:kind",
# a reason, an optional adr/reference, and an expiry (YYYY-MM-DD). The scanner
# matches findings by id; CI blocks any entry past its expiry. See
# docs/plans/11-completeness-audit.md section 9.1 for the policy and
# tools/completeness/src/allowlist.rs for the parser contract.

entries:
